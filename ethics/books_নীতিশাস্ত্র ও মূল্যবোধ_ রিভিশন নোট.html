{n:"Groundwork for the Metaphysics of Morals (১৭৮৫)",a:"ইমানুয়েল কান্ট",s:1,
k:["<b>শুভ ইচ্ছা</b>: একমাত্র শুভ ইচ্ছাই বিনা শর্তে ভালো। ফলাফল নয়, উদ্দেশ্যই মাপকাঠি।","<b>কর্তব্য</b>: কর্তব্যের খাতিরে কাজই নৈতিক, ঝোঁক বা স্বার্থে নয়।","<b>নিরঙ্কুশ আদেশ</b> (৩ সূত্র): ১) <b>সার্বজনীন আইন</b>: এমনভাবে কাজ করো যেন তোমার নীতি সবার জন্য আইন হতে পারে। ২) <b>মানবতা</b>: মানুষকে কখনো শুধু উপায় হিসেবে ব্যবহার কোরো না, সবসময় লক্ষ্যও ভাবো। ৩) <b>স্বায়ত্তশাসন</b>: মানুষ নিজের যুক্তির দেওয়া আইন নিজেই মানে।","<b>সশর্ত আদেশ</b> বনাম নিরঙ্কুশ আদেশের পার্থক্য।"],

{n:"Critique of Pure Reason (১৭৮১)",a:"ইমানুয়েল কান্ট",
k:["জ্ঞানতত্ত্ব: মানুষ কী জানতে পারে, কী পারে না?","জ্ঞান = ইন্দ্রিয়ানুভূতি + বুদ্ধির কাঠামো।","বস্তুকে দেখি <b>প্রপঞ্চ (Phenomena)</b> রূপে, <b>স্বরূপ (Noumena)</b> রূপে নয়।","দেশ ও কাল মনের কাঠামো।","ঈশ্বর, আত্মা, স্বাধীন ইচ্ছা শুধু তাত্ত্বিক যুক্তিতে প্রমাণযোগ্য নয়।"],

k:["(ছবিতে বানান 'Gapes', সঠিক 'Grapes'।)","জোড পরিবার ওকলাহোমার জমি হারিয়ে ক্যালিফোর্নিয়ায় কাজের আশায় যায়। টম জোড জেল থেকে ফিরে দেখে ব্যাংক জমি নিয়েছে।","পুরনো ট্রাকে ৬৬ নম্বর হাইওয়ে ধরে পশ্চিমে। ক্যালিফোর্নিয়ায় ক্ষুধা, শোষণ, কম মজুরি, বৈষম্য।","শেষে <b>রোজ অফ শ্যারন</b> অনাহারী অপরিচিতকে বুকের দুধ খাওয়ায়: মানবিকতা ও সংহতির প্রতীক।","<b>মূল্যবোধ</b>: সামাজিক ন্যায়, সংহতি, মানবিক মর্যাদা, শোষণের প্রতিবাদ, 'আমি' থেকে 'আমরা'।"],

{n:"Philosophy for Life (২০১২)",a:"জুলস ইভান্স (UK)",
k:["পূর্ণ নাম: Philosophy for Life and Other Dangerous Situations।","৬টি প্রাচীন দর্শনের আধুনিক প্রয়োগ: <b>স্টোয়িকবাদ</b> (যা নিয়ন্ত্রণে নেই তা মেনে নেওয়া), <b>এপিকিউরীয়</b> (সহজ সুখ, বন্ধুত্ব), <b>সক্রেটিসীয় পদ্ধতি</b> (প্রশ্ন করে বিশ্বাস যাচাই), সংশয়বাদ, অ্যারিস্টটলীয় গুণনীতি, প্লেটোনিক ধ্যান।","CBT এবং সৈনিকদের মানসিক প্রশিক্ষণে স্টোয়িক দর্শনের ব্যবহার।"],
c:["ইভান্স তরুণ বয়সে সামাজিক উদ্বেগ ও বিষণ্নতায় ভুগেছেন; CBT-তে সেরে উঠে এর শিকড় প্রাচীন দর্শনে পান। মানসিক স্বাস্থ্য সংকট ও 'দর্শনকে জীবনের কাজে লাগানো' আন্দোলনের অংশ।"]},
{n:"The Metamorphosis (১৯১৫)",a:"ফ্রানৎস কাফকা (প্রাগ)",
k:["গ্রেগর সামসা ভ্রাম্যমাণ বিক্রয়কর্মী; একদিন বিশাল পোকায় পরিণত।","সে পরিবারের একমাত্র উপার্জনকারী। পরিবার প্রথমে সহানুভূতি দেখায়, পরে বোঝা ও লজ্জা ভাবে।","ঘরে বন্দি, অবহেলিত; একা মারা যায়, পরিবার স্বস্তি পায়।","<b>থিম</b>: বিচ্ছিন্নতা (Alienation), মানুষের মূল্য কি শুধু উপার্জনক্ষমতায়?, পারিবারিক নির্মমতা, অস্তিত্বের অর্থহীনতা।"],
c:["কাফকা প্রাগের জার্মানভাষী ইহুদি; কঠোর পিতা, একঘেয়ে সরকারি চাকরি, নিজেকে বহিরাগত ভাবা।","শিল্পায়ন ও আমলাতন্ত্রে মানুষ যন্ত্রের অংশ, মূল্যহীন ও বিচ্ছিন্ন। গল্প সেই আধুনিক বিচ্ছিন্নতার প্রতীক।"]},
{n:"Revolutionary Road (১৯৬১)",a:"রিচার্ড ইয়েটস (USA)",
k:["১৯৫০-এর আমেরিকা; ফ্র্যাঙ্ক ও এপ্রিল হুইলার নিজেদের 'আলাদা' ভাবেন, কিন্তু উপশহরে একঘেয়ে জীবন কাটান।","এপ্রিলের অভিনেত্রী হওয়ার স্বপ্ন; ফ্র্যাঙ্ক অফিসের চাকরিতে আটকে। প্যারিসে যাওয়ার পরিকল্পনা।","ভয়, আত্মপ্রতারণা, সুবিধাবাদে পরিকল্পনা ভেস্তে যায়; সম্পর্ক তিক্ত, পরিণতি মর্মান্তিক।","<b>থিম</b>: আত্মপ্রতারণা, সামঞ্জস্যের চাপ (conformity), আমেরিকান ড্রিমের শূন্যতা, স্বপ্ন বনাম বাস্তবতা।"],
c:["যুদ্ধ-পরবর্তী উপশহরের মধ্যবিত্ত জীবন সমৃদ্ধির প্রতীক; ইয়েটস পেছনের শূন্যতা-হতাশা তুলে ধরেন, নিজের অতৃপ্তি ও পারিবারিক সমস্যা থেকে।","প্রকাশের সময় কম বিক্রি, সমালোচকদের প্রশংসা, পরে ক্লাসিক। ২০০৮-এ সিনেমা (লিওনার্দো ডিক্যাপ্রিও, কেট উইন্সলেট)।"]},
{n:"Das Kapital (প্রথম খণ্ড ১৮৬৭)",a:"কার্ল মার্ক্স",
k:["পুঁজিবাদী অর্থনীতির সবচেয়ে প্রভাবশালী সমালোচনা।","<b>উদ্বৃত্ত মূল্য</b>: শ্রমিক পুরো মূল্য মজুরি পায় না, বাকিটা মালিকের মুনাফা = শোষণ।","<b>Commodity Fetishism</b>: মানুষের সম্পর্ক পণ্যের সম্পর্কে পরিণত; শ্রমিক ও শ্রমের বিচ্ছিন্নতা।","<b>শ্রেণিসংগ্রাম</b>: বুর্জোয়া বনাম প্রলেতারিয়েত।","অন্তর্গত দ্বন্দ্বে পুঁজিবাদের সংকট ও পতন অনিবার্য; তারপর সমাজতন্ত্র।"],
c:["১৯শ শতকে ইংল্যান্ডে শিল্পবিপ্লব: অমানবিক পরিবেশ, শিশুশ্রম, কম মজুরি।","মার্ক্স নির্বাসিত হয়ে লন্ডনে, ব্রিটিশ মিউজিয়াম লাইব্রেরিতে বছরের পর বছর গবেষণা; এঙ্গেলস আর্থিক ও বৌদ্ধিক সাহায্য দেন।","বৈজ্ঞানিক বিশ্লেষণ ও শ্রমিক আন্দোলনকে তাত্ত্বিক ভিত্তি দিতে চান। প্রথম খণ্ড নিজে প্রকাশ; বাকি দুই খণ্ড মৃত্যুর পর এঙ্গেলস সম্পাদনা করেন।"]}],
tb:[["বই","ধরন","মূল বিষয়"],["The Age of Absurdity","দর্শন/সেলফ-হেল্প সমালোচনা","আধুনিক জীবনে সুখের সংকট"],["Solitude","মনোবিজ্ঞান","নিঃসঙ্গতার মূল্য ও সৃজনশীলতা"],["Nazism and War [**]","ইতিহাস","মতাদর্শ, যুদ্ধ ও গণহত্যা"],["Philosophy for Life","ব্যবহারিক দর্শন","প্রাচীন প্রজ্ঞার আধুনিক প্রয়োগ"],["The Metamorphosis","উপন্যাস","বিচ্ছিন্নতা, মানুষের মূল্য"],["Revolutionary Road","উপন্যাস","আত্মপ্রতারণা, আমেরিকান ড্রিমের শূন্যতা"],["Das Kapital","অর্থনীতি/রাজনৈতিক তত্ত্ব","পুঁজিবাদের সমালোচনা, শোষণ"]],
tp:["Nazism and War [**] সবচেয়ে গুরুত্বপূর্ণ: যুদ্ধের কারণ (ভার্সাই চুক্তি, মহামন্দা), নাৎসি মতাদর্শ, হলোকাস্ট।","বিচ্ছিন্নতা থিমে Metamorphosis, Das Kapital, Revolutionary Road একসঙ্গে।","সুখ ও মানসিক শান্তি থিমে Age of Absurdity, Solitude, Philosophy for Life একসঙ্গে।"]}
];
const $=s=>document.querySelector(s);let cur=0,onlyStar=false,done={};
try{done=JSON.parse(localStorage.getItem("nd")||"{}")}catch(e){}
function save(){try{localStorage.setItem("nd",JSON.stringify(done))}catch(e){}}
function li(a){return a.map(x=>"<li>"+x+"</li>").join("")}
function render(){
const p=P[cur];$("#tabs").innerHTML=P.map((x,i)=>`<button role="tab" aria-selected="${i==cur}" data-i="${i}">${x.t.split(":")[0]}</button>`).join("");
let h=`<p class="intro">${p.i}</p>`;
p.b.forEach((b,j)=>{const id=cur+"-"+j;
h+=`<details class="bk" data-id="${id}" data-star="${b.s?1:0}" data-done="${done[id]?1:0}"><summary><span><span class="nm">${b.n}</span>${b.s?'<span class="star">'+(b.s==2?"[*]":"[**]")+"</span>":""}<span class="au">${b.a}</span></span></summary><div class="body"><h3>সামারি</h3><ul>${li(b.k)}</ul><h3>লেখার কারণ ও প্রেক্ষাপট</h3><ul>${li(b.c)}</ul><label class="chk"><input type="checkbox" ${done[id]?"checked":""}> পড়া হয়েছে</label></div></details>`});
h+=`<h3 style="font-family:'Noto Serif Bengali',serif">তুলনামূলক সারসংক্ষেপ</h3><div class="sc"><table><tr>${p.tb[0].map(x=>"<th>"+x+"</th>").join("")}</tr>${p.tb.slice(1).map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")}</table></div><div class="tip"><h3>পরীক্ষার জন্য টিপস</h3><ul>${li(p.tp)}</ul></div>`;
$("#m").innerHTML=h;filter();prog()}
function prog(){const t=P[cur].b.length,d=P[cur].b.filter((_,j)=>done[cur+"-"+j]).length;$("#pg").textContent=`পড়া হয়েছে: ${d}/${t}`}
function filter(){const q=$("#q").value.trim().toLowerCase();document.querySelectorAll("details.bk").forEach(d=>{const ok=(!q||d.textContent.toLowerCase().includes(q))&&(!onlyStar||d.dataset.star=="1");d.classList.toggle("hide",!ok)})}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){cur=+b.dataset.i;render();scrollTo(0,0)}};
$("#m").onchange=e=>{if(e.target.type=="checkbox"){const d=e.target.closest("details");done[d.dataset.id]=e.target.checked?1:0;d.dataset.done=done[d.dataset.id];save();prog()}};
$("#q").oninput=filter;
$("#ex").onclick=()=>document.querySelectorAll("details.bk:not(.hide)").forEach(d=>d.open=true);
$("#co").onclick=()=>document.querySelectorAll("details.bk").forEach(d=>d.open=false);
$("#st").onclick=e=>{onlyStar=!onlyStar;e.target.style.background=onlyStar?"var(--ac2)":"";filter()};
render();
</script>
</body>
</html>
