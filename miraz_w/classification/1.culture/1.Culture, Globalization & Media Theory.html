var main = document.getElementById("main");
var total = 0;
SECTIONS.forEach(function (s) {
  var sec = document.createElement("section");
  sec.id = s.id;
  var h = document.createElement("h2"); h.textContent = s.title; sec.appendChild(h);
  var p = document.createElement("p"); p.className = "intro"; p.textContent = s.intro; sec.appendChild(p);
  var list = document.createElement("div"); list.className = "list";
  s.items.forEach(function (it) {
    total++;
    var row = document.createElement("div");
    row.className = "row"; row.dataset.stance = it[4];
    row.dataset.text = (it[0] + " " + it[1] + " " + it[2] + " " + it[3]).toLowerCase();
    var left = document.createElement("div");
    var t = document.createElement("p"); t.className = "term"; t.textContent = it[0];
    var c = document.createElement("span"); c.className = "chip " + it[4]; c.textContent = it[5];
    left.appendChild(t); left.appendChild(c);
    var right = document.createElement("div");
    var d = document.createElement("p"); d.className = "def"; d.textContent = it[1];
    var dl = document.createElement("dl"); dl.className = "meta";
    var who = s.id === "s5" ? "পার্থক্য" : "প্রবক্তা / উৎস";
    [[who, it[2]], ["উদাহরণ", it[3]]].forEach(function (kv) {
      var dt = document.createElement("dt"); dt.textContent = kv[0];
      var dd = document.createElement("dd"); dd.textContent = kv[1];
      dl.appendChild(dt); dl.appendChild(dd);
    });
    right.appendChild(d); right.appendChild(dl);
    row.appendChild(left); row.appendChild(right);
    list.appendChild(row);
  });
  sec.appendChild(list);
  if (s.note) { var n = document.createElement("p"); n.className = "note"; n.innerHTML = s.note; sec.appendChild(n); }
  main.appendChild(sec);
});

var state = { f: "all", q: "" };
var countEl = document.getElementById("count");
var emptyEl = document.getElementById("empty");
function bn(n) { try { return n.toLocaleString("bn-BD"); } catch (e) { return String(n); } }
function apply() {
  var shown = 0;
  document.querySelectorAll("section").forEach(function (sec) {
    var any = 0;
    sec.querySelectorAll(".row").forEach(function (r) {
      var ok = (state.f === "all" || r.dataset.stance === state.f) &&
               (!state.q || r.dataset.text.indexOf(state.q) !== -1);
      r.hidden = !ok; if (ok) any++;
    });
    sec.hidden = any === 0;
    var note = sec.querySelector(".note");
    if (note) note.hidden = state.f !== "all" || !!state.q;
    shown += any;
  });
  countEl.textContent = bn(shown) + " / " + bn(total) + " টার্ম";
  emptyEl.hidden = shown !== 0;
}
document.getElementById("filters").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  state.f = b.dataset.f;
  this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  apply();
});
document.getElementById("q").addEventListener("input", function () {
  state.q = this.value.trim().toLowerCase(); apply();
});
apply();
</script>
