{en:"AI & Data Governance",bn:"এআই ও ডেটা গভর্ন্যান্স",def:"AI ও ডেটার নিরাপদ, ন্যায্য, স্বচ্ছ ও জবাবদিহিমূলক ব্যবহার নিশ্চিত করতে আইন, নীতি, প্রতিষ্ঠান ও মানদণ্ড।",ex:[
["EU AI Act","ইউরোপীয় ইউনিয়ন","ঝুঁকিভিত্তিক AI আইন; ধাপে ধাপে কার্যকর।"],
["EU Data Act","ইউরোপীয় ইউনিয়ন","২০২৫ সালের সেপ্টেম্বর থেকে প্রযোজ্য — যন্ত্র ও সেবার ডেটায় ব্যবহারকারীর অধিকার।"],
["জাতীয় AI নীতি ও উপাত্ত সুরক্ষা অধ্যাদেশ","বাংলাদেশ","২০২৫ সালে AI নীতি এবং ব্যক্তিগত উপাত্ত সুরক্ষা ও উপাত্ত ব্যবস্থাপনা আইনি কাঠামো তৈরির উদ্যোগ।"],
["DPDP Act ২০২৩","ভারত","ডিজিটাল ব্যক্তিগত উপাত্ত সুরক্ষা আইন ও বিধিমালা।"],
["GenAI নিয়ম ও AI কনটেন্ট লেবেলিং","চীন","২০২৩ সালের জেনারেটিভ AI বিধি; ২০২৫ সালে AI-তৈরি কনটেন্টে লেবেল বাধ্যতামূলক।"],
["AI Basic Act","দক্ষিণ কোরিয়া","২০২৬ সালের জানুয়ারি থেকে কার্যকর।"],
["AI Verify ও Model AI Governance Framework","সিঙ্গাপুর","AI ব্যবস্থার মান যাচাইয়ের টুল ও নির্দেশিকা।"],

["Council of Europe AI Convention","আন্তর্জাতিক","AI ও মানবাধিকার বিষয়ে প্রথম আইনত বাধ্যতামূলক আন্তর্জাতিক চুক্তি।"]]}
];

const out=document.getElementById('out'),toc=document.getElementById('toc'),jump=document.getElementById('jump'),q=document.getElementById('q'),cnt=document.getElementById('count');
const bnNum=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
D.forEach((t,i)=>{
  const id='t'+(i+1);
  toc.insertAdjacentHTML('beforeend',`<a href="#${id}">${bnNum(i+1)}. ${esc(t.bn)}</a>`);
  jump.insertAdjacentHTML('beforeend',`<option value="${id}">${bnNum(i+1)}. ${esc(t.bn)} (${esc(t.en)})</option>`);
});
function hl(s,term){s=esc(s);if(!term)return s;const r=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return s.replace(r,'<mark>$1</mark>')}
function render(){
  const term=q.value.trim();const lt=term.toLowerCase();let shown=0,rows=0;let html='';
  D.forEach((t,i)=>{
    const head=(t.en+' '+t.bn+' '+t.def).toLowerCase();
    let ex=t.ex;
    if(lt && !head.includes(lt)) ex=t.ex.filter(e=>e.join(' ').toLowerCase().includes(lt));
    if(!ex.length) return;
    shown++;rows+=ex.length;
    html+=`<section id="t${i+1}"><div class="sh"><span class="num">${bnNum(i+1)}</span><h2>${hl(t.bn,term)}</h2><span class="en">${hl(t.en,term)}</span><p>${hl(t.def,term)}</p></div><div class="tw"><table><thead><tr><th>ক্রম</th><th>উদাহরণ</th><th>দেশ / সংস্থা</th><th>ব্যাখ্যা</th></tr></thead><tbody>`+
      ex.map((e,k)=>`<tr><td>${bnNum(k+1)}</td><td>${hl(e[0],term)}</td><td>${hl(e[1],term)}</td><td>${hl(e[2],term)}</td></tr>`).join('')+`</tbody></table></div></section>`;
  });
  out.innerHTML=html||'<p style="text-align:center;color:var(--muted)">কিছু পাওয়া যায়নি।</p>';
  cnt.textContent=`${bnNum(shown)}টি টার্ম • ${bnNum(rows)}টি উদাহরণ`;
}
q.addEventListener('input',render);
jump.addEventListener('change',()=>{if(jump.value){q.value='';render();document.getElementById(jump.value).scrollIntoView({behavior:'smooth'});}});
render();
</script>
