:root{--bg:#f7f5f0;--card:#fff;--ink:#1d1f24;--muted:#5d6370;--line:#e4e0d6;--accent:#0f5c4d;--accent2:#b5482a;--soft:#e8f1ee;--th:#0f5c4d;}

*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
header{padding:32px 20px 20px;max-width:1200px;margin:0 auto}
h1{font-family:'Noto Serif Bengali',serif;font-size:clamp(24px,4vw,36px);margin:0 0 6px;line-height:1.3}
header p{margin:0;color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:0 20px 60px}
nav{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
nav input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px}
nav .grp{font-size:12px;font-weight:700;color:var(--accent2);margin:12px 0 4px;letter-spacing:.02em}
nav a{display:block;color:var(--ink);text-decoration:none;font-size:14px;padding:3px 6px;border-radius:6px;line-height:1.4}
nav a:hover{background:var(--soft);color:var(--accent)}
.grp-head{font-family:'Noto Serif Bengali',serif;font-size:22px;color:var(--accent2);margin:34px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.grp-head:first-child{margin-top:0}
section.term{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin-bottom:18px;scroll-margin-top:12px}
.term h2{margin:0;font-size:20px;line-height:1.35}
.term h2 .en{color:var(--accent)}
.term h2 .num{display:inline-block;min-width:30px;color:var(--muted);font-weight:500}
.def{margin:6px 0 12px;color:var(--muted);font-size:15px;background:var(--soft);padding:9px 12px;border-radius:8px;border-left:3px solid var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:10px}
th{background:var(--th);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
td:first-child{width:42px;text-align:center;color:var(--muted)}
td:nth-child(2){font-weight:600;min-width:180px}
td:nth-child(3){min-width:120px;color:var(--muted);font-size:14px}
.hide{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:300px}}
</style>

["অনলাইনে নারীর প্রতি হয়রানি ও সাইবার বুলিং","বাংলাদেশ ও বিশ্ব","মত প্রকাশকারী নারীদের লক্ষ্য করে হুমকি, ডিপফেক ছবি।"],
["ধর্ষণ ও যৌন সহিংসতার বিচারহীনতা","বাংলাদেশ (মাগুরার শিশু ধর্ষণ, ২০২৫), ভারত (কলকাতা আরজি কর, ২০২৪)","প্রতিবাদ সত্ত্বেও কাঠামোগত বিচারহীনতা।"],
["মার্কিন সুপ্রিম কোর্টের রো বনাম ওয়েড বাতিল","যুক্তরাষ্ট্র, ২০২২","নারীর শরীর নিয়ে সিদ্ধান্তে রাষ্ট্রের নিয়ন্ত্রণ — রাষ্ট্রীয় পিতৃতন্ত্রের উদাহরণ।"]]}
]}
];

const bnNum = n => String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const nav=document.getElementById('nav'), main=document.getElementById('main');
let k=0; const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
G.forEach(gr=>{
  const gh=document.createElement('div');gh.className='grp';gh.textContent=gr.g;nav.appendChild(gh);
  const h=document.createElement('h3');h.className='grp-head';h.textContent=gr.g;main.appendChild(h);
  gr.items.forEach(t=>{
    k++; const id='t'+k;
    const a=document.createElement('a');a.href='#'+id;a.textContent=bnNum(k)+'. '+t.en;a.dataset.id=id;nav.appendChild(a);
    const s=document.createElement('section');s.className='term';s.id=id;
    s.innerHTML=`<h2><span class="num">${bnNum(k)}.</span><span class="en">${esc(t.en)}</span> — ${esc(t.bn)}</h2>
<div class="def">${esc(t.d)}</div>
<div class="tbl"><table><thead><tr><th>ক্রম</th><th>উদাহরণ</th><th>কোথায় / কখন</th><th>কেন এটি উদাহরণ</th></tr></thead><tbody>
${t.x.map((r,i)=>`<tr><td>${bnNum(i+1)}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}
</tbody></table></div>`;
    main.appendChild(s);
  });
});
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('section.term').forEach(s=>{
    const hit=!q||s.textContent.toLowerCase().includes(q);
    s.classList.toggle('hide',!hit);
    const a=nav.querySelector(`a[data-id="${s.id}"]`); if(a)a.classList.toggle('hide',!hit);
  });
});
</script>
</body>
</html>
