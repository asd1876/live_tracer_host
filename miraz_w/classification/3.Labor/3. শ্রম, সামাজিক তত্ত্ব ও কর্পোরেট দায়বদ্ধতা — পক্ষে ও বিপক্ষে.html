const main=document.getElementById('main');
main.innerHTML = groups.map(g=>`
<section class="group" data-g="${g.id}">
  <div class="ghead"><span class="dot" style="background:${g.color}"></span>
    <div><h2 style="color:${g.color}">${g.title} <span style="font-size:.85rem;color:var(--muted);font-weight:500">(${g.en})</span></h2><p>${g.note}</p></div></div>
  ${g.items.map((it,i)=>`
  <details class="card" data-s="${(it.bn+' '+it.en).toLowerCase()}" ${i===0?'open':''} style="border-top:3px solid ${g.color}">
    <summary><div><h3>${it.bn}</h3><span class="en">${it.en}</span></div><span class="chev">▶</span></summary>
    <div class="body">
      <p class="def"><b>সংজ্ঞা:</b> ${it.def}</p>
      <div class="cols">
        <div class="col pro"><h4>✔ পক্ষে</h4><ul>${it.pro.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="col con"><h4>✘ বিপক্ষে</h4><ul>${it.con.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
      <div class="ex">🇧🇩 <b>বাংলাদেশ প্রেক্ষাপট:</b> ${it.ex}</div>
    </div>
  </details>`).join('')}
</section>`).join('');

document.getElementById('tbl').innerHTML =
 `<tr><th>ধারণা</th><th>গ্রুপ</th><th>মূল পক্ষে যুক্তি</th><th>মূল বিপক্ষে যুক্তি</th></tr>` +
 groups.flatMap(g=>g.items.map(it=>`<tr><td><b>${it.en}</b></td><td><span class="tag" style="background:${g.color}">${g.id==='g1'?'কর্পোরেট':g.id==='g2'?'পরিবেশ':'তত্ত্ব'}</span></td><td>${it.pro[0]}</td><td>${it.con[0]}</td></tr>`)).join('');

let filt='all';
function apply(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('section.group').forEach(s=>{
    const show = filt==='all'||s.dataset.g===filt;
    let any=false;
    s.querySelectorAll('.card').forEach(c=>{
      const m=!q||c.dataset.s.includes(q)||c.textContent.toLowerCase().includes(q);
      c.classList.toggle('hidden',!m); if(m) any=true; if(q&&m) c.open=true;
    });
    s.classList.toggle('hidden',!show||!any);
  });
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filt=b.dataset.f; apply();
});
document.getElementById('q').oninput=apply;
</script>
