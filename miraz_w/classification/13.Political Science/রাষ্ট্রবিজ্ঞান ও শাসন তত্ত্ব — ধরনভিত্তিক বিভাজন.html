<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রাষ্ট্রবিজ্ঞান ও শাসন তত্ত্ব — ধরনভিত্তিক বিভাজন</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f7f4;--card:#fff;--ink:#1d2a22;--muted:#5d6b62;--line:#e2e6df;
  --pro:#1f7a4d;--pro-bg:#eaf5ee;--con:#b0413e;--con-bg:#fbeeed;--accent:#1f4e79;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141815;--card:#1d221e;--ink:#e6ebe6;--muted:#9aa69d;--line:#2d342f;
  --pro:#6fcf97;--pro-bg:#1c2c22;--con:#f08a85;--con-bg:#2f1f1e;--accent:#8ab8e6;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.7rem;margin:0 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 20px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:.92rem}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search]{margin-left:auto;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;min-width:200px}
.group{margin-bottom:34px}
.ghead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.ghead h2{margin:0;font-size:1.3rem}
.ghead span{color:var(--muted);font-size:.92rem}
.gnote{color:var(--muted);font-size:.93rem;margin:-6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.ctop h3{margin:0;font-size:1.12rem}
.tag{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.desc{margin:6px 0 12px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.pc{grid-template-columns:1fr}}
.pro,.con{border-radius:8px;padding:10px 14px}
.pro{background:var(--pro-bg)}.con{background:var(--con-bg)}
.pro b{color:var(--pro)}.con b{color:var(--con)}
.pc ul{margin:6px 0 0;padding-left:20px}
.pc li{margin-bottom:3px}
.ex{margin-top:10px;font-size:.92rem;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center}
.summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:.95rem}
.summary table{width:100%;border-collapse:collapse}
.summary td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.summary td:first-child{font-weight:600;white-space:nowrap;width:1%}
</style>
</head>

const summary = document.getElementById('summary');
summary.innerHTML = '<table>' + GROUPS.map(g =>
  `<tr><td>${g.name.replace(/^\S+\s/,'')}</td><td>${g.items.map(i=>i.n.split(' (')[0]).join(' · ')}</td></tr>`).join('') + '</table>';

const controls = document.getElementById('controls');
const q = document.getElementById('q');
let active = 'all';
const tabs = [{id:'all',name:'সব'}].concat(GROUPS.map(g=>({id:g.id,name:g.name.replace(/^\S+\s/,'')})));
tabs.forEach(t=>{
  const b=document.createElement('button');b.className='tab'+(t.id==='all'?' on':'');b.textContent=t.name;b.dataset.id=t.id;
  b.onclick=()=>{active=t.id;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.id===active));render();};
  controls.insertBefore(b,q);
});
q.addEventListener('input',render);

function render(){
  const term=q.value.trim().toLowerCase();
  const list=document.getElementById('list');
  let html='';
  GROUPS.forEach(g=>{
    if(active!=='all'&&active!==g.id)return;
    const items=g.items.filter(i=>!term||(i.n+i.d+i.t).toLowerCase().includes(term));
    if(!items.length)return;
    html+=`<section class="group"><div class="ghead"><h2>${g.name}</h2><span>${g.en}</span></div><p class="gnote">${g.note}</p>`;
    items.forEach(i=>{
      html+=`<div class="card"><div class="ctop"><h3>${i.n}</h3><span class="tag">${i.t}</span></div>
      <p class="desc">${i.d}</p>
      <div class="pc"><div class="pro"><b>✔ ${i.pl||"পক্ষে"}</b><ul>${i.p.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="con"><b>✘ ${i.cl||"বিপক্ষে"}</b><ul>${i.c.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`;
    });
    html+='</section>';
  });
  list.innerHTML=html||'<div class="empty">কিছু পাওয়া যায়নি</div>';
}
render();
</script>
</body>
</html>
