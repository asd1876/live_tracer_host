<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রত্যয় চিট শিট</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--ink:#141414;--paper:#FFF8E7;--y:#FFD93D;--g:#6BCB77;--p:#FF8FAB;--b:#4D96FF;--o:#FF6B35;--m:#7A5BB0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}
header.top{background:var(--y);border-bottom:3px solid var(--ink);padding:18px 0 14px}
header.top h1{font-size:clamp(26px,5vw,40px);line-height:1.15;font-weight:700}
header.top p{font-weight:600;font-size:15px;margin-top:2px}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--ink)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px}
.search{flex:1 1 200px;min-width:160px;border:3px solid var(--ink);padding:5px 12px;font-weight:600;background:#fff}
.search:focus{outline:none;box-shadow:3px 3px 0 var(--b)}
.btn{border:3px solid var(--ink);background:#fff;padding:3px 12px;font-weight:700;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.on{background:var(--ink);color:var(--y)}
.btn.pri{background:var(--g)}
.btn.warn{background:var(--o);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.chipf{display:flex;gap:6px;flex-wrap:wrap}
.chipf .btn{padding:2px 10px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.banner{background:#E3F0FF;border:3px solid var(--ink);margin:12px 0 0;padding:8px 12px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
section.ch{padding:22px 0 6px}
.chh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chh h2{font-size:clamp(22px,4vw,30px);line-height:1.2;background:var(--c);border:3px solid var(--ink);padding:2px 14px;box-shadow:5px 5px 0 var(--ink)}
.chh span{font-weight:600;font-size:15px;opacity:.8}
.chh .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--c);padding:10px 12px 12px;position:relative;display:flex;flex-direction:column;gap:7px}
.ct{display:flex;align-items:center;gap:8px}
.no{font-weight:700;font-size:13px;background:var(--c);border:2px solid var(--ink);padding:0 6px;line-height:1.5}
.p{font-size:22px;font-weight:700;line-height:1.25;flex:1}
.pos{font-size:12.5px;font-weight:700;color:#fff;padding:0 8px;border:2px solid var(--ink);line-height:1.6;white-space:nowrap}
.pn{background:var(--b)}.pa{background:var(--o)}.pm{background:var(--m)}
.ib{border:2px solid var(--ink);background:#fff;width:30px;height:30px;font-size:14px;line-height:1;flex:none}
.ib:hover{background:var(--y)}
.end{font-size:15px;font-weight:600}
.end b{background:#FFF1B8;padding:0 6px;border:2px solid var(--ink);font-size:16px}
.note{font-size:14px;background:#F4F4F4;border-left:4px solid var(--ink);padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--ink);padding:1px 8px;line-height:1.35;background:#fff}
.chip b{font-size:17px;display:block}
.chip i{font-style:normal;font-size:13px;opacity:.8}
.trick{background:var(--ink);color:var(--y);font-weight:700;font-size:14.5px;padding:4px 10px;margin-top:auto}
/* revision mode */
.rev .ans{filter:blur(7px);transition:filter .15s;user-select:none}
.rev .card{cursor:pointer}
.rev .card.shown .ans{filter:none;user-select:auto}
.rev .card:not(.shown)::after{content:"👆 ট্যাপ করে উত্তর দেখুন";position:absolute;right:10px;bottom:-12px;font-size:12px;font-weight:700;background:var(--y);border:2px solid var(--ink);padding:0 6px}
/* editor */
.card.edit{box-shadow:5px 5px 0 var(--y);outline:3px dashed var(--ink);outline-offset:3px;cursor:auto}
.card.edit label{display:block;font-size:13px;font-weight:700}
.card.edit input,.card.edit select,.card.edit textarea{display:block;width:100%;border:2px solid var(--ink);padding:3px 8px;font-size:15px;font-weight:500;background:#FFFDF5;margin-top:2px}
.card.edit textarea{min-height:52px;resize:vertical}
.exrow{display:grid;grid-template-columns:1fr 1.3fr 30px;gap:5px;margin-top:5px}
.exrow input{margin-top:0!important}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.row .btn{font-size:14px;padding:1px 10px;box-shadow:2px 2px 0 var(--ink)}
.row .sp{flex:1}
/* confusion table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-size:15px}
th,td{border:2px solid var(--ink);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--y)}
td b{font-size:16px}
.empty{padding:20px;border:3px dashed var(--ink);text-align:center;font-weight:600;background:#fff}
footer{margin-top:34px;background:var(--ink);color:#fff;padding:22px 0;text-align:center;font-weight:600;font-size:15px}
footer b{color:var(--y);display:block;font-size:19px}
/* save bar */
.savebar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--y);padding:7px 10px 7px 14px;display:none;gap:10px;align-items:center;font-weight:700;max-width:calc(100% - 20px);flex-wrap:wrap}
.savebar.show{display:flex}
.savebar .btn{box-shadow:none;border-color:#fff}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--g);border:3px solid var(--ink);padding:5px 14px;font-weight:700;box-shadow:4px 4px 0 var(--ink);display:none}
.toast.show{display:block}
.toast.bad{background:var(--o);color:#fff}
/* modal */
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.mbox{background:var(--paper);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--y);width:min(680px,100%);max-height:90vh;overflow:auto;padding:16px}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox p{font-size:14px;font-weight:500;margin-bottom:8px}
.mbox textarea{width:100%;min-height:220px;border:3px solid var(--ink);font-family:ui-monospace,monospace;font-size:12.5px;padding:8px;background:#fff}
.mbox .row{margin-top:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}body{font-size:15.5px}}
@media print{.bar,.savebar,.ib,.chh .btn,.banner,footer{display:none!important}.rev .ans{filter:none}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}

function buildDoc(data){

  return '<!DOCTYPE html>\n<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রত্যয় চিট শিট</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">'+css+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+json+'<\/script><script id="app">'+app+'<\/script></body></html>';

async function save(){
  ui.editing.forEach(id=>{const r=rule(id);if(r)r.ex=r.ex.filter(x=>x[0].trim()||x[1].trim())});
  const btn=$("save");btn.disabled=true;btn.textContent="সেভ হচ্ছে…";
  try{
    const art=await getArt();
    if(!art){ls.set(DRAFT,JSON.stringify(state));toast("অনলাইন সেভ এখানে চালু নেই — এই ব্রাউজারে রাখা হলো",true);return}
    await art.publish(buildDoc(state));
    ls.del(DRAFT);saved=clone(state);fromDraft=false;ui.editing.clear();render();toast("সেভ হয়েছে ✓ সব ডিভাইসে আপডেট");
  }catch(err){
    const c=err&&(err.code||err.name||err.message)||"";
    if(/conflict/i.test(c))toast("অন্য কোথাও থেকে নতুন ভার্সন সেভ হয়েছে — পেজ রিলোড হচ্ছে",true);
    else if(/not_writer|not_granted/i.test(c))toast("এই পেজ এডিট করার অনুমতি নেই — পরিবর্তন এই ব্রাউজারে রাখা হলো",true);
    else toast("সেভ হয়নি — পরিবর্তন এই ব্রাউজারে রাখা আছে, আবার চেষ্টা করুন",true);
  }finally{btn.disabled=false;btn.textContent="💾 সেভ"}
}
$("save").onclick=save;
$("undo").onclick=()=>{state=clone(saved);fromDraft=false;ui.editing.clear();ls.del(DRAFT);render();toast("পরিবর্তন বাতিল হলো")};

/* data modal */
const modal=$("modal");
$("dat").onclick=()=>{$("json").value=JSON.stringify(state,null,1);modal.classList.add("show")};
$("close").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
$("copy").onclick=async()=>{const t=$("json");try{await navigator.clipboard.writeText(t.value);toast("কপি হয়েছে ✓")}catch(e){t.focus();t.select();toast("টেক্সট সিলেক্ট করা হলো — Ctrl+C / কপি চাপুন",true)}};
function applyText(txt){try{const d=JSON.parse(txt);if(!valid(d))throw 0;state=d;ui.editing.clear();modal.classList.remove("show");render();toast("প্রয়োগ হয়েছে — রাখতে 💾 সেভ চাপুন")}catch(e){toast("JSON ঠিক নেই",true)}}
$("apply").onclick=()=>applyText($("json").value);
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(applyText);e.target.value=""};
$("reset").onclick=e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="নিশ্চিত? আবার চাপুন";setTimeout(()=>{delete b.dataset.armed;b.textContent="↺ মূল নোটে রিসেট"},3000);return}delete b.dataset.armed;b.textContent="↺ মূল নোটে রিসেট";state=clone(DEFAULT);ui.editing.clear();modal.classList.remove("show");render();toast("মূল নোট ফেরানো হলো — রাখতে 💾 সেভ চাপুন")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("show")});

render();
})();
</script></body></html>
