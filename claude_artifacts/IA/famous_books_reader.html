<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিখ্যাত বইয়ের সামারি — পড়ার খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..100,300..800&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0EC;--sheet:#F8FAF7;--ink:#18202E;--muted:#596273;--line:#D2D8D1;--accent:#0A6A73;--accent-ink:#fff;--tint:#CBE6E2;--gold:#9A6410;--ui:'Anek Bangla','Hind Siliguri','Noto Sans Bengali','Nirmala UI',system-ui,sans-serif;--read:'Noto Serif Bengali','Kalpurush','Nirmala UI',serif;--fs:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#10151C;--sheet:#171E27;--ink:#E5E9EF;--muted:#98A2B3;--line:#2B3441;--accent:#3DB2B4;--accent-ink:#06181A;--tint:#1D3F42;--gold:#E0A84A}}
:root[data-theme=dark]{--paper:#10151C;--sheet:#171E27;--ink:#E5E9EF;--muted:#98A2B3;--line:#2B3441;--accent:#3DB2B4;--accent-ink:#06181A;--tint:#1D3F42;--gold:#E0A84A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.55;overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:clamp(330px,34%,430px) 1fr;height:100vh;height:100dvh}
/* rail: auto-hide */
.rail{position:fixed;left:0;top:0;height:100%;width:236px;z-index:40;background:var(--sheet);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;transform:translateX(-100%);transition:transform .18s ease}
.rail.open{transform:none;box-shadow:8px 0 28px rgba(0,0,0,.3)}
@media (min-width:900px) and (hover:hover){.rail{transform:translateX(-226px);border-right:3px solid var(--accent)}.rail:hover,.rail:focus-within{transform:none;box-shadow:8px 0 28px rgba(0,0,0,.3);border-right:1px solid var(--line)}}
.brand{padding:2px 10px 12px}.brand b{display:block;font-size:20px;line-height:1.2}.brand span{font-size:13px;color:var(--muted)}
.rh{font-size:13px;color:var(--muted);font-weight:700;padding:16px 12px 4px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:16px}
.nv:hover{background:var(--paper)}.nv[aria-pressed=true]{background:var(--ink);color:var(--paper)}.nv small{opacity:.7;font-size:13px}
.foot{margin-top:auto;display:flex;gap:6px;padding:14px 6px 0}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:9px;min-width:38px;height:38px;padding:0 10px;cursor:pointer}
.iconbtn:hover{border-color:var(--muted)}
/* list */
.pane-l{overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);padding:14px 14px 40px;min-width:0}
.lp-row{display:flex;align-items:center;gap:10px}.lp-row h1{font-size:23px;margin:0;flex:1}
.searchbar{position:sticky;top:0;background:var(--paper);padding:10px 0 12px;z-index:5}
.search{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 14px;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
select{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 10px;font-size:15px}
label.opt{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:15px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.item{display:block;position:relative;padding:10px 40px 10px 10px;border-bottom:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.item:hover{background:var(--sheet)}
.item.active{background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
.item .tt{font-weight:600;font-size:16px;line-height:1.3}.item .mm{font-size:13.5px;color:var(--muted);margin-top:1px}
.item.rd .tt{opacity:.6}.item .ind{position:absolute;right:10px;top:10px;font-size:13px;color:var(--gold);white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
/* detail */
.pane-r{overflow-y:auto;overscroll-behavior:contain;padding:0 36px 90px;min-width:0;scroll-padding-top:74px}
.pbar{position:sticky;top:0;height:3px;z-index:30;margin:0 -36px}.pbar i{display:block;height:100%;width:0;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:20px}
.row{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);min-height:42px}
.btn:hover{border-color:var(--muted)}.btn.ghost{background:transparent}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h1.title{font-size:clamp(28px,3.8vw,44px);line-height:1.15;margin:24px 0 6px;font-weight:700}
.author{font-size:20px;color:var(--accent);font-weight:600;margin:0}
.facts{margin:20px 0 0;border-top:1.5px solid var(--ink)}
.facts div{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:15px}.facts dd{margin:0;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.note{background:var(--sheet);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:15px;margin:18px 0 0}
.explain{font-family:var(--read);font-size:calc(18px*var(--fs));line-height:1.95;margin:22px 0 0}
.explain p{margin:0 0 1em}
.related{margin:26px 0 6px;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:15px;color:var(--ink);text-decoration:none}.chip:hover{border-color:var(--ink)}
.endread{margin-top:34px;border-top:1.5px solid var(--ink);padding-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.ph{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}.ph p{margin:0 0 8px}.ph .t{font-size:22px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media (min-width:900px){.crumbs .m{display:none}}
@media (max-width:899px){
  .app{display:block}.pane-l,.pane-r{height:100vh;height:100dvh}.pane-l{border-right:0}
  .app.has-sel .pane-l{display:none}.app:not(.has-sel) .pane-r{display:none}
  .pane-r{padding:0 18px 80px}.pbar{margin:0 -18px}.crumbs .d{display:none}
}
</style></head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="মেনু">
    <div class="brand"><b>বিখ্যাত বই</b><span>সামারি পড়ার খাতা</span></div>
    <nav id="nav">
      <button class="nv" data-f="all">সব বই <small></small></button>
      <button class="nv" data-f="bm">★ বুকমার্ক <small></small></button>
      <button class="nv" data-f="unread">পড়া হয়নি <small></small></button>
      <button class="nv" data-f="read">✓ পড়া হয়েছে <small></small></button>
    </nav>
    <div class="rh">ধরন</div><div id="cats"></div>
    <div class="foot"><button class="iconbtn" id="themeBtn" title="থিম বদলাও">◐</button></div>
  </aside>
  <section class="pane-l" id="paneL" aria-label="বইয়ের তালিকা">

    <div class="searchbar">
      <input class="search" id="q" type="search" placeholder="বই, লেখক বা সাল লিখে খোঁজো ( / চাপো )" autocomplete="off">
      <div class="tools">
        <select id="sort" aria-label="ক্রম"><option value="orig">সংকলনের ক্রম</option><option value="title">বইয়ের নাম (A–Z)</option><option value="author">লেখকের নাম</option><option value="year">প্রকাশের সাল</option></select>
        <label class="opt"><input type="checkbox" id="deep"> সামারির ভেতরেও খোঁজো</label>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>
  <section class="pane-r" id="paneR" aria-label="সামারি"><div class="pbar"><i id="pb"></i></div><div id="detail"></div></section>
</div>

্টিভঙ্গির দলিল হিসেবে পড়তে বলেন।","i":3,"c":3},{"t":"An Essay Concerning Human Understanding","a":"জন লক","y":"১৬৯০","yr":1690,"n":"","s":"মানুষ কীভাবে জ্ঞান অর্জন করে, লক এই বইয়ে সেই প্রশ্নের উত্তর খুঁজেছেন। তাঁর মূল বক্তব্য হলো, জন্মের সময় মানুষের মন একটি \"ট্যাবুলা রাসা\" বা সাদা পাতার মতো, তাতে আগে থেকে কোনো জন্মগত ধারণা লেখা থাকে না। সব ধারণাই আসে অভিজ্ঞতা থেকে, হয় ইন্দ্রিয়ের মাধ্যমে বাইরের জগৎ দেখে-শুনে, নয়তো নিজের মনের ভেতরের কাজকর্ম নিয়ে ভেবে। এই ভিত্তিতে তিনি ভাষা, পরিচয়, বস্তুর গুণাগুণ এবং মানুষের জ্ঞানের সীমা নিয়ে আলোচনা করেছেন। বইটি অভিজ্ঞতাবাদী দর্শনের একটি মৌলিক গ্রন্থ।","i":4,"c":2},{"t":"Brick Lane","a":"মনিকা আলী","y":"২০০৩","yr":2003,"n":"","s":"উপন্যাসের কেন্দ্রে নাজনীন, বাংলাদেশের গ্রাম থেকে অল্প বয়সে বিয়ে হয়ে লন্ডনের টাওয়ার হ্যামলেটসে আসা এক নারী। তাঁর স্বামী চানু তাঁর চেয়ে অনেক বড়, আর ভাষা না জানা এবং নতুন দেশে একাকিত্ব নাজনীনের দিনযাপনকে কঠিন করে তোলে। সংসার, মেয়েদের বড় করা এবং তরুণ রাজনৈতিক কর্মী করিমের সঙ্গে সম্পর্কের ভেতর দিয়ে তিনি ধীরে ধীরে নিজের সিদ্ধান্ত নিজে নিতে শেখেন। বইয়ে অভিবাসী জীবন, পরিচয়ের সংকট, ধর্ম, প্রজন্মের ব্যবধান আর ৯/১১-পরবর্তী উত্তেজনার প্রসঙ্গও এসেছে। সিলেটে থেকে যাওয়া তাঁর বোন হাসিনার চিঠিগুলোর মাধ্যমে বাংলাদেশের জীবনের একটি সমান্তরাল ছবিও পাওয়া যায়। উপন্যাসটি বুকার পুরস্কারের শর্টলিস্টে ছিল।","i":5,"c":0},{"t":"The Prince","a":"নিকোলো ম্যাকিয়াভেলি","y":"১৫৩২ সালে প্রকাশিত","yr":1532,"n":"","s":"ম্যাকিয়াভেলি বইটি লিখেছিলেন ফ্লোরেন্সের শাসক পরিবার মেডিচিদের উদ্দেশে। এখানে তিনি একজন শাসক কীভাবে ক্ষমতা অর্জন, ধরে রাখা ও সম্প্রসারণ করবেন, সেই ব্যবহারিক পরামর্শ দিয়েছেন। তাঁর যুক্তি, রাজনীতিতে সাফল্যের জন্য শুধু নৈতিকতা যথেষ্ট নয়। প্রয়োজনে কঠোর হওয়া, ভালোবাসার চেয়ে ভয়ের ওপর নির্ভর করতে হতে পারা, আর সুযোগ ও ভাগ্য (\"ফর্তুনা\") সামলানোর দক্ষতা শাসকের জন্য জরুরি। ফলে \"ম্যাকিয়াভেলিয়ান\" শব্দটি এখন কূটকৌশলী ও নীতিহীন রাজনীতির প্রতীক। তবে অনেক পণ্ডিত মনে করেন, বইটি নৈতিকতাকে অস্বীকার করেনি, বরং রাজনীতি আসলে কেমন চলে সেটাই খোলাখুলি বলেছে। এই বিষয়ে এখনো বিতর্ক আছে।","i":6,"c":2},{"t":"The Good Earth","a":"পার্ল এস. বাক","y":"১৯৩১","yr":1931,"n":"","s":"উপন্যাসটি চীনের এক দরিদ্র কৃষক ওয়াং লুং-এর গল্প। সে ধনী হুয়াং পরিবারের এক দাসী ও-লানকে বিয়ে করে। দুজনের কঠোর পরিশ্রমে জমি কেনা হয়, ধীরে ধীরে তারা সচ্ছল হয়ে ওঠে। দুর্ভিক্ষের সময় তাদের শহরে গিয়ে কষ্টে দিন কাটাতে হয়, পরে ফিরে এসে জমি আরও বাড়ায়। কিন্তু ধনী হওয়ার পর ওয়াং লুং-এর আচরণ বদলায়, সে ও-লানকে অবহেলা করে এবং উপপত্নী ঘরে আনে। তার ছেলেরা জমির প্রতি টান হারিয়ে শহুরে জীবনের দিকে ঝোঁকে। বইটির মূল বিষয় মাটির সঙ্গে মানুষের সম্পর্ক, সম্পদের প্রভাব এবং প্রজন্মের পরিবর্তন। এটি ১৯৩২ সালে পুলিৎজার পুরস্কার পায়, আর লেখক ১৯৩৮ সালে সাহিত্যে নোবেল পান।","i":7,"c":0},{"t":"A Brief History of Time","a":"স্টিফেন হকিং","y":"১৯৮৮","yr":1988,"n":"আপনার তালিকায় নামের শুরুতে \"The\" আছে, বইটির প্রকৃত নাম \"A Brief History of Time\"।","s":"হকিং এখানে সাধারণ পাঠকের জন্য মহাবিশ্বের গঠন ও উৎপত্তির ধারণাগুলো সহজ ভাষায় ব্যাখ্যা করেছেন। বইয়ে আছে স্থান ও কালের প্রকৃতি, আলোর গতি, আপেক্ষিকতা, কোয়ান্টাম বলবিদ্যা, বিগ ব্যাং, কৃষ্ণগহ্বর এবং সব প্রাকৃতিক নিয়মকে একটি একীভূত তত্ত্বে আনার চেষ্টা। কৃষ্ণগহ্বর থেকেও বিকিরণ বের হতে পারে, তাঁর এই আবিষ্কারের কথাও এসেছে। বইটি প্রকাশের পর বিপুল জনপ্রিয় হয় এবং বিজ্ঞানকে সাধারণ মানুষের কাছে পৌঁছে দিতে বড় ভূমিকা রাখে।","i":8,"c":4},{"t":"The Tin Drum","a":"গুন্টার গ্রাস","y":"১৯৫৯","yr":1959,"n":"","s":"উপন্যাসের কথক অস্কার ম্যাটসেরাথ, যে তিন বছর বয়সে সিদ্ধান্ত নেয় আর বড় হবে না এবং শরীরের বৃদ্ধি থামিয়ে দেয়। তার সঙ্গী একটি টিনের ঢোল, আর তার তীক্ষ্ণ চিৎকারে কাচ ভেঙে যায়। গল্পটি ডানজিগ (বর্তমান পোল্যান্ডের গদান্স্ক) শহরের পটভূমিতে নাৎসি উত্থান, দ্বিতীয় বিশ্বযুদ্ধ এবং যুদ্ধোত্তর জার্মানির সময়কে অস্কারের চোখে দেখায়। জাদুবাস্তবতা, ব্যঙ্গ ও অস্বস্তিকর রসিকতার মাধ্যমে লেখক সাধারণ জার্মানদের নীরবতা ও দায় নিয়ে প্রশ্ন তোলেন। গ্রাস ১৯৯৯ সালে সাহিত্যে নোবেল পান।","i":9,"c":0},{"t":"Leviathan","a":"টমাস হবস","y":"১৬৫১","yr":1651,"n":"","s":"ইংল্যান্ডের গৃহযুদ্ধের অভিজ্ঞতা থেকে হবস এই বইয়ে রাষ্ট্রের প্রয়োজনীয়তা ব্যাখ্যা করেছেন। তাঁর মতে, রাষ্ট্র বা কোনো সর্বোচ্চ কর্তৃপক্ষ না থাকলে মানুষ \"প্রাকৃতিক অবস্থায়\" থাকে, যেখানে সবাই সবার বিরুদ্ধে লড়ে এবং জীবন হয়ে ওঠে নিঃসঙ্গ, দরিদ্র, কদর্য ও স্বল্পস্থায়ী। এই ভয় ও নিরাপত্তাহীনতা থেকে বাঁচতে মানুষ নিজেদের অধিকারের একটি অংশ ছেড়ে দিয়ে চুক্তির মাধ্যমে একজন শক্তিশালী সার্বভৌম শাসকের হাতে ক্ষমতা তুলে দেয়। এই সার্বভৌমকে বইয়ে \"লেভিয়াথান\" নামের বিশাল প্রাণীর রূপকে দেখানো হয়েছে। হবস শক্তিশালী কেন্দ্রীয় শাসনের পক্ষে যুক্তি দিয়েছেন, আর ধর্ম ও রাষ্ট্রের সম্পর্ক নিয়েও বিস্তারিত লিখেছেন। সামাজিক চুক্তি তত্ত্বের ইতিহাসে বইটি একটি ভিত্তিমূলক গ্রন্থ।","i":10,"c":2},{"t":"The Wealth of Nations","a":"অ্যাডাম স্মিথ","y":"১৭৭৬","yr":1776,"n":"পুরো নাম \"An Inquiry into the Nature and Causes of the Wealth of Nations\"।","s":"স্মিথ এখানে দেখিয়েছেন, একটি দেশের সম্পদ আসে তার উৎপাদনশীলতা থেকে, শুধু সোনা-রুপার মজুত থেকে নয়। শ্রম বিভাজনের ফলে উৎপাদন বহুগুণ বাড়ে, তিনি এর উদাহরণ দিয়েছেন পিন তৈরির কারখানা দিয়ে। বাজারে মানুষ নিজের স্বার্থে কাজ করলেও প্রতিযোগিতার ফলে সমাজের উপকার হয়, তাঁর এই ধারণা \"অদৃশ্য হাত\" নামে পরিচিত। তিনি তৎকালীন বাণিজ্যবাদী নীতি, অতিরিক্ত শুল্ক ও একচেটিয়া ব্যবসার সমালোচনা করে মুক্ত বাণিজ্যের পক্ষে যুক্তি দিয়েছেন। তবে তিনি রাষ্ট্রের ভূমিকাকে পুরোপুরি অস্বীকার করেননি, প্রতিরক্ষা, ন্যায়বিচার ও কিছু জনকল্যাণমূলক কাজ সরকারের দায়িত্ব বলে মনে করতেন। বইটিকে আধুনিক অর্থনীতির সূচনাগ্রন্থ হিসেবে ধরা হয়।","i":11,"c":4},{"t":"The Social Contract","a":"জাঁ-জাক রুশো","y":"১৭৬২","yr":1762,"n":"","s":"বইয়ের শুরুর বিখ্যাত বক্তব্য হলো, মানুষ স্বাধীন হয়ে জন্মায়, কিন্তু সর্বত্র শৃঙ্খলে বাঁধা। রুশো প্রশ্ন তুলেছেন, কোন শর্তে রাষ্ট্রের শাসন বৈধ হতে পারে। তাঁর উত্তর, জনগণ সম্মিলিতভাবে একটি চুক্তিতে আসবে এবং সবাই \"সাধারণ ইচ্ছা\" (general will) মেনে চলবে, যা সমাজের সবার সাধারণ কল্যাণকে প্রকাশ করে। এভাবে মানুষ আসলে নিজেরই তৈরি আইন মানে, ফলে স্বাধীনতাও টিকে থাকে। সার্বভৌম ক্ষমতা শাসকের নয়, জনগণের হাতে থাকে। বইটি ফরাসি বিপ্লব ও আধুনিক গণতান্ত্রিক চিন্তাকে গভীরভাবে প্রভাবিত করেছে, যদিও সাধারণ ইচ্ছার ধারণাটি কর্তৃত্ববাদে রূপ নিতে পারে বলে সমালোচনাও আছে।","i":12,"c":2},{"t":"Candide","a":"ভলতেয়ার","y":"১৭৫৯","yr":1759,"n":"পুরো নাম \"Candide, ou l'Optimisme\"।","s":"সরল তরুণ ক্যান্ডিড তার শিক্ষক পাঙ্গলসের শেখানো দর্শনে বিশ্বাস করে যে \"এটাই সম্ভাব্য সব জগতের মধ্যে সেরা জগৎ\"। কিন্তু ব্যারনের প্রাসাদ থেকে বিতাড়িত হওয়ার পর সে একের পর এক ভয়াবহ ঘটনার মুখোমুখি হয়: যুদ্ধ, ভূমিকম্প, ধর্মীয় নির্যাতন, দাসপ্রথা আর বিশ্বাসঘাতকতা। ইউরোপ থেকে দক্ষিণ আমেরিকা, সুরিনাম ও কনস্টান্টিনোপল হয়ে তার যাত্রা চলে, আর প্রিয় কুনেগুন্ডের খোঁজও থামে না। ভলতেয়ার ব্যঙ্গের মাধ্যমে অন্ধ আশাবাদী দর্শন, ধর্মীয় ভণ্ডামি ও ক্ষমতাবানদের নিষ্ঠুরতাকে আক্রমণ করেছেন। শেষে ক্যান্ডিড সিদ্ধান্তে আসে, তত্ত্ব নিয়ে তর্ক না করে নিজের বাগান চাষ করাই ভালো, অর্থাৎ হাতের কাজ ও বাস্তব জীবনে মন দেওয়াই শ্রেয়।","i":13,"c":0},{"t":"Mother","a":"ম্যাক্সিম গোর্কি","y":"১৯০৬-০৭","yr":1906,"n":"","s":"রুশ বিপ্লব-পূর্ব সময়ের এক কারখানা-শ্রমিক শহরে গল্পটি ঘটে। পাভেল ভ্লাসভ সমাজতান্ত্রিক আন্দোলনে যুক্ত হয়ে পড়লে তার নিরক্ষর, ভীরু ও নির্যাতিত মা পেলাগেইয়া নিলভনা প্রথমে ভয় পান। ছেলে ও তার বন্ধুদের আদর্শ ও সাহস দেখে ধীরে ধীরে তিনি নিজেই আন্দোলনের সক্রিয় সদস্য হয়ে ওঠেন। পাভেল গ্রেপ্তার হলে তিনি নিষিদ্ধ ইশতেহার ছড়িয়ে দেওয়ার দায়িত্ব নেন। এক মায়ের রূপান্তরের মধ্য দিয়ে বইটি শ্রমিক শ্রেণির জাগরণ দেখায়। এটিকে সমাজতান্ত্রিক বাস্তববাদী সাহিত্যের অন্যতম প্রথম ও প্রভাবশালী উপন্যাস ধরা হয়।","i":14,"c":0},{"t":"On Liberty","a":"জন স্টুয়ার্ট মিল","y":"১৮৫৯","yr":1859,"n":"","s":"মিল এখানে ব্যক্তির স্বাধীনতার ওপর সমাজ বা রাষ্ট্র কতটা কর্তৃত্ব করতে পারে, সেই প্রশ্ন তুলেছেন। তাঁর মূল নীতি \"ক্ষতি নীতি\" (harm principle): অন্যের ক্ষতি ঠেকানো ছাড়া অন্য কোনো কারণে কারও স্বাধীনতায় হস্তক্ষেপ করা যায় না। তিনি মতপ্রকাশের স্বাধীনতার পক্ষে জোরালো যুক্তি দিয়েছেন, কারণ ভুল মতও সত্যকে আরও স্পষ্ট করে, আর প্রচলিত মত চ্যালেঞ্জ না পেলে প্রাণহীন সংস্কারে পরিণত হয়। ব্যক্তিত্বের বিকাশ ও জীবনযাপনের ভিন্ন ধরনকে তিনি সমাজের জন্য কল্যাণকর বলে মনে করেছেন। রাষ্ট্রের পাশাপাশি \"সংখ্যাগরিষ্ঠের স্বৈরতন্ত্র\" ও সামাজিক চাপের বিপদের কথাও বইয়ে বিশেষ গুরুত্ব পেয়েছে। উদার গণতান্ত্রিক চিন্তায় বইটি একটি মৌলিক গ্রন্থ।","i":15,"c":2},{"t":"The Discovery of India","a":"জওহরলাল নেহরু","y":"১৯৪৬","yr":1946,"n":"","s":"নেহরু বইটি লেখেন ১৯৪২-৪৫ সালে আহমেদনগর দুর্গের কারাগারে বন্দী থাকা অবস্থায়। এখানে তিনি ভারতের সুদীর্ঘ ইতিহাস, দর্শন, ধর্ম, সংস্কৃতি ও সভ্যতার ধারাবাহিকতা খুঁজেছেন, সিন্ধু সভ্যতা ও বেদ-উপনিষদ থেকে শুরু করে মুঘল যুগ, ব্রিটিশ শাসন এবং স্বাধীনতা আন্দোলন পর্যন্ত। ভারতের বৈচিত্র্যের ভেতরে ঐক্যের যে সুর আছে, সেটাই তাঁর কেন্দ্রীয় বক্তব্য। বইয়ে ব্যক্তিগত অনুভূতি ও ইতিহাসের বিশ্লেষণ মিশে আছে।","i":16,"c":3},{"t":"Glimpses of World History","a":"জওহরলাল নেহরু","y":"১৯৩৪-৩৫","yr":1934,"n":"","s":"এটি নেহরুর কারাবন্দী অবস্থায় মেয়ে ইন্দিরাকে লেখা প্রায় ২০০টি চিঠির সংকলন। প্রাচীন সভ্যতা থেকে শুরু করে বিশ শতকের গোড়া পর্যন্ত বিশ্বের ইতিহাস তিনি সহজ ভাষায় ও গল্পের ঢঙে বলেছেন। শুধু ইউরোপ নয়, এশিয়া ও অন্যান্য অঞ্চলের ইতিহাসকে সমান গুরুত্ব দেওয়া এর একটি বৈশিষ্ট্য। বইটিতে তাঁর উদার ও মানবতাবাদী দৃষ্টিভঙ্গি স্পষ্ট।","i":17,"c":3},{"t":"War and Peace","a":"লিও টলস্টয়","y":"১৮৬৯","yr":1869,"n":"","s":"নেপোলিয়নের রাশিয়া আক্রমণের সময়কে (১৮০৫-১৮২০) পটভূমি করে রুশ অভিজাত পরিবারগুলোর জীবন এখানে ফুটে উঠেছে। কেন্দ্রীয় চরিত্র পিয়ের বেজুখভ, আন্দ্রেই বলকনস্কি ও নাতাশা রস্তোভা। যুদ্ধ, প্রেম, মৃত্যু ও জীবনের অর্থ খোঁজা পাশাপাশি চলে। টলস্টয় ইতিহাস কেবল বড় নেতাদের কাজে গড়ে ওঠে, এই ধারণা নাকচ করে দেখিয়েছেন যে অসংখ্য সাধারণ মানুষের কর্মই ইতিহাসের গতি ঠিক করে। বইটি বিশ্বসাহিত্যের অন্যতম শ্রেষ্ঠ উপন্যাস হিসেবে স্বীকৃত।","i":18,"c":0},{"t":"Anna Karenina","a":"লিও টলস্টয়","y":"১৮৭৮","yr":1878,"n":"","s":"উচ্চপদস্থ কর্মকর্তার স্ত্রী আন্না তরুণ সৈনিক ভ্রনস্কির প্রেমে পড়লে সমাজ তাঁকে বর্জন করে, আর স্বামী ও সন্তানের সঙ্গে সম্পর্ক ভেঙে যায়। ক্রমে ঈর্ষা, একাকিত্ব ও সন্দেহে তাঁর জীবন বিপর্যস্ত হয়ে ওঠে এবং পরিণতি ট্র্যাজিক। সমান্তরালে জমিদার লেভিনের গল্প চলে, যিনি প্রেম, বিয়ে, কৃষিজীবন ও বিশ্বাসের অর্থ খোঁজেন। উপন্যাসটি সমাজের নৈতিক দ্বিচারিতা, দাম্পত্য ও আবেগের জটিলতা নিয়ে গভীর প্রশ্ন তোলে।","i":19,"c":0},{"t":"The Audacity of Hope","a":"বারাক ওবামা","y":"২০০৬","yr":2006,"n":"","s":"তখন ইলিনয়ের সিনেটর ওবামা এই বইয়ে মার্কিন রাজনীতির মেরুকরণ, বিভিন্ন গোষ্ঠীর পারস্পরিক অবিশ্বাস এবং তা কাটিয়ে ওঠার পথ নিয়ে লিখেছেন। অর্থনীতি, স্বাস্থ্য, ধর্ম, বিদেশনীতি ও পরিবারজীবনের মতো বিষয়ে তাঁর ভাবনা এসেছে। তিনি সংলাপ, সমঝোতা ও সাধারণ মূল্যবোধের ওপর ভিত্তি করে একটি আশাবাদী রাজনীতির কথা বলেছেন। বইটি তাঁর ২০০৮ সালের প্রেসিডেন্ট নির্বাচনী প্রচারের আগে প্রকাশিত হয়।","i":20,"c":1},{"t":"Dreams from My Father","a":"বারাক ওবামা","y":"১৯৯৫","yr":1995,"n":"","s":"এটি ওবামার স্মৃতিকথা। কেনিয়ান বাবা ও আমেরিকান মায়ের সন্তান হিসেবে হাওয়াই ও ইন্দোনেশিয়ায় বেড়ে ওঠা, বাবাকে প্রায় না চেনা, শিকাগোতে কমিউনিটি অর্গানাইজার হিসেবে কাজ করা এবং কেনিয়ায় বাবার পরিবারের খোঁজে যাওয়ার কথা এতে আছে। মিশ্র জাতিগত পরিচয় ও নিজের শিকড় খুঁজে পাওয়ার যাত্রাই বইটির মূল সুর।","i":21,"c":1},{"t":"Living History","a":"হিলারি রডহ্যাম ক্লিনটন","y":"২০০৩","yr":2003,"n":"","s":"এটি হিলারি ক্লিনটনের স্মৃতিকথা। শিকাগোর শহরতলিতে তাঁর বেড়ে ওঠা, ইয়েল ল স্কুলে বিল ক্লিনটনের সঙ্গে পরিচয় ও বিয়ে, আরকানসাসে আইন পেশা এবং শিশু-অধিকার নিয়ে কাজের কথা বইয়ে আছে। মূল অংশ জুড়ে আছে হোয়াইট হাউসে ফার্স্ট লেডি হিসেবে আটটি বছর (১৯৯৩-২০০১): স্বাস্থ্যসেবা সংস্কারের উদ্যোগ, ওয়াটারগেট-পরবর্তী নানা তদন্ত, মনিকা লিউনস্কি কেলেঙ্কারি এবং তার ব্যক্তিগত ও রাজনৈতিক প্রভাব। বিশ্বজুড়ে নারী ও শিশুদের অধিকার নিয়ে তাঁর সফর ও বক্তব্যও এসেছে। বইটি প্রকাশের পর বিপুল বিক্রি হয়, তবে এটি লেখকের নিজের দৃষ্টিভঙ্গিতে লেখা বলে সমালোচকরা একে সম্পূর্ণ নিরপেক্ষ বিবরণ হিসেবে দেখেন না।","i":22,"c":1},{"t":"My Life","a":"বিল ক্লিনটন","y":"২০০৪","yr":2004,"n":"","s":"যুক্তরাষ্ট্রের ৪২তম প্রেসিডেন্টের এই আত্মজীবনীতে আরকানসাসের হোপ শহরে জন্ম, বাবাকে না দেখা, সৎবাবার সঙ্গে কঠিন শৈশব, রোডস স্কলারশিপ নিয়ে অক্সফোর্ডে পড়াশোনা এবং আরকানসাসের গভর্নর হওয়ার পথ বর্ণিত হয়েছে। বড় অংশ জুড়ে আছে প্রেসিডেন্ট হিসেবে আট বছর: অর্থনৈতিক উন্নতি, বলকান সংকট, মধ্যপ্রাচ্য শান্তি প্রচেষ্টা, ইমপিচমেন্টের মুখোমুখি হওয়া এবং লিউনস্কি বিতর্ক। বইটি বেশ দীর্ঘ এবং বিস্তারিত, আর তাতে তাঁর নিজের সিদ্ধান্ত ও কাজের পক্ষে ব্যাখ্যা বেশি দেখা যায়।","i":23,"c":1},{"t":"White House Years","a":"হেনরি কিসিঞ্জার","y":"১৯৭৯","yr":1979,"n":"","s":"কিসিঞ্জারের স্মৃতিকথার ধারার প্রথম খণ্ড। প্রেসিডেন্ট নিক্সনের জাতীয় নিরাপত্তা উপদেষ্টা হিসেবে ১৯৬৯ থেকে ১৯৭৩ সাল পর্যন্ত সময়ের কূটনৈতিক ঘটনাবলি এতে আছে। ভিয়েতনাম যুদ্ধ থেকে বেরিয়ে আসার আলোচনা, সোভিয়েত ইউনিয়নের সঙ্গে উত্তেজনা প্রশমন (দেতাঁত), চীনে গোপন সফর ও নিক্সনের ঐতিহাসিক বেইজিং যাত্রা, এবং ১৯৭১ সালের ভারত-পাকিস্তান যুদ্ধ ও বাংলাদেশের জন্মের সময় যুক্তরাষ্ট্রের অবস্থান বইয়ে বিস্তারিত এসেছে। বাংলাদেশের পাঠকের কাছে শেষোক্ত অংশটি বিশেষ আগ্রহের, তবে সেখানে যুক্তরাষ্ট্রের পাকিস্তানঘেঁষা ভূমিকা নিয়ে কিসিঞ্জারের ব্যাখ্যা নিজের পক্ষে সাফাই হিসেবেও সমালোচিত হয়েছে। বইটি মার্কিন পররাষ্ট্রনীতির ইতিহাস বোঝার জন্য একটি গুরুত্বপূর্ণ প্রাথমিক উৎস।","i":24,"c":1},{"t":"White House Diary","a":"জিমি কার্টার","y":"২০১০","yr":2010,"n":"","s":"কার্টার প্রেসিডেন্ট থাকাকালীন (১৯৭৭-৮১) প্রতিদিনের যে ডায়েরি রেখেছিলেন, এটি তার সম্পাদিত রূপ। এতে মিসর-ইসরায়েল শান্তি আলোচনা (ক্যাম্প ডেভিড চুক্তি), পানামা খাল চুক্তি, তেল সংকট ও জ্বালানি নীতি, ইরানে মার্কিন জিম্মি সংকট এবং সোভিয়েত ইউনিয়নের আফগানিস্তান আক্রমণের মতো ঘটনা তাঁর সমকালীন ভাবনায় উঠে এসেছে। ডায়েরির ধরন হওয়ায় সিদ্ধান্ত নেওয়ার চাপ, সহকর্মীদের সঙ্গে সম্পর্ক এবং ব্যক্তিগত অনুভূতিও খোলামেলাভাবে লেখা। পরবর্তী কালের ব্যাখ্যার চেয়ে ঘটনার সময়কার প্রতিক্রিয়া পাওয়া যায় বলে বইটি প্রেসিডেন্টের দৈনন্দিন কাজ বোঝার জন্য মূল্যবান।","i":25,"c":1},{"t":"I Have a Dream","a":"মার্টিন লুথার কিং জুনিয়র","y":"১৯৬৩","yr":1963,"n":"এটি আসলে একটি বক্তৃতা, কোনো পূর্ণাঙ্গ বই নয়; ১৯৬৩ সালের ২৮ আগস্ট ওয়াশিংটনে লিঙ্কন মেমোরিয়ালের সামনে \"মার্চ অন ওয়াশিংটন\" সমাবেশে এটি দেওয়া হয়। বইয়ের আকারে এটি প্রায়ই অন্যান্য লেখা বা বক্তৃতার সঙ্গে একত্রে ছাপা হয়।","s":"কিং এখানে কৃষ্ণাঙ্গ আমেরিকানদের প্রতি অঙ্গীকার করা স্বাধীনতা ও সমতার প্রতিশ্রুতি এখনো পূরণ হয়নি বলে তুলে ধরেন। তিনি এমন এক ভবিষ্যতের স্বপ্ন দেখান যেখানে মানুষ গায়ের রঙ দিয়ে নয়, চরিত্র দিয়ে বিবেচিত হবে এবং শ্বেতাঙ্গ-কৃষ্ণাঙ্গ শিশুরা হাত ধরে চলবে। অহিংস পথে আন্দোলনের ওপর জোর দিয়েছেন তিনি। বক্তৃতাটি নাগরিক অধিকার আন্দোলনের প্রতীক হয়ে আছে এবং ১৯৬৪ সালের নাগরিক অধিকার আইনের পথ তৈরিতে ভূমিকা রেখেছে।","i":26,"c":2},{"t":"The Story of My Experiments with Truth","a":"মহাত্মা গান্ধী","y":"গুজরাটিতে ১৯২৫-২৯","yr":1925,"n":"আপনার তালিকার নামে \"Experiment\" একবচনে আছে, বইটির প্রকৃত নাম \"Experiments\" বহুবচনে।","s":"গান্ধীর আত্মজীবনীতে তাঁর গুজরাটের পোরবন্দরে শৈশব, লন্ডনে আইন পড়া, দক্ষিণ আফ্রিকায় বর্ণবৈষম্যের অভিজ্ঞতা এবং সেখানে সত্যাগ্রহ আন্দোলনের সূচনার কথা আছে। ভারতে ফিরে স্বাধীনতা আন্দোলনে যুক্ত হওয়ার প্রাথমিক পর্যায়ও এসেছে, যদিও বইটি ১৯২১ সালের কাছাকাছি সময়ে এসে শেষ হয়। তিনি এখানে নিজের ভুল, দুর্বলতা ও আত্মসংযমের চেষ্টা খোলাখুলি স্বীকার করেছেন। খাদ্যাভ্যাস, ব্রহ্মচর্য, ধর্মচিন্তা ও অহিংসার মতো বিষয়ে তাঁর পরীক্ষানিরীক্ষাই বইটির মূল কথা। নিজের জীবনকে সত্য অনুসন্ধানের একটি গবেষণাগার হিসেবে দেখার এই দৃষ্টিভঙ্গিই বইটিকে বিশিষ্ট করেছে।","i":27,"c":1},{"t":"Wings of Fire","a":"এ. পি. জে. আবদুল কালাম","y":"১৯৯৯","yr":1999,"n":"","s":"কালামের এই আত্মজীবনী অরুণ তিওয়ারির সহযোগিতায় লেখা। তামিলনাড়ুর রামেশ্বরমে এক সাধারণ মুসলিম পরিবারে তাঁর জন্ম। শৈশবে খবরের কাগজ বিলি করে পরিবারকে সাহায্য করেছেন, শিক্ষক ও পরিবারের উৎসাহে পড়াশোনা চালিয়ে গেছেন। পরে ইসরো (ISRO) ও ডিআরডিও (DRDO)-তে কাজ করে ভারতের উপগ্রহ উৎক্ষেপণ যান (SLV-3) এবং ক্ষেপণাস্ত্র কর্মসূচির নেতৃত্ব দিয়েছেন। বইয়ে সাফল্যের পাশাপাশি ব্যর্থতা, দলগত কাজ এবং তরুণদের স্বপ্ন দেখার প্রেরণার কথা বারবার এসেছে। বিজ্ঞান, নম্রতা ও আত্মনির্ভরতার বার্তার জন্য বইটি তরুণ পাঠকদের মধ্যে খুব জনপ্রিয়।","i":28,"c":1},{"t":"India Wins Freedom","a":"মৌলানা আবুল কালাম আজাদ","y":"১৯৫৯","yr":1959,"n":"","s":"আজাদ ছিলেন কংগ্রেসের দীর্ঘদিনের সভাপতি ও স্বাধীনতা আন্দোলনের শীর্ষ নেতা। বইটিতে তিনি ক্রিপস মিশন, ভারত ছাড়ো আন্দোলন, ক্যাবিনেট মিশন এবং দেশভাগের আগের আলোচনাগুলোর ভেতরের বিবরণ দিয়েছেন। তাঁর মতে, ক্যাবিনেট মিশন পরিকল্পনা প্রত্যাখ্যান করা এবং দেশভাগ এড়ানো যেত, আর এ ক্ষেত্রে নেহরু ও প্যাটেলের কিছু সিদ্ধান্তকে তিনি দায়ী করেছেন। আজাদের ইচ্ছা অনুযায়ী তাঁর মৃত্যুর পর বইয়ের কিছু অংশ প্রকাশ করা হয়নি, পরে সেগুলো ছাপা হয়। বইটি গুরুত্বপূর্ণ প্রত্যক্ষদর্শীর ভাষ্য হলেও এটি লেখকের নিজস্ব দৃষ্টিকোণ, তাই অন্য উৎসের সঙ্গে মিলিয়ে পড়াই ভালো।","i":29,"c":1},{"t":"A Tale of Two Cities","a":"চার্লস ডিকেন্স","y":"১৮৫৯","yr":1859,"n":"","s":"ফরাসি বিপ্লবের সময় লন্ডন ও প্যারিসের পটভূমিতে লেখা উপন্যাস। বহু বছর বাস্তিলে বন্দী থাকার পর মুক্ত হওয়া ডাক্তার ম্যানেটের মেয়ে লুসি, ফরাসি অভিজাত চার্লস ডার্নে এবং হতাশ, অলস আইনজীবী সিডনি কার্টনের জীবন একসূত্রে জড়িয়ে যায়। বিপ্লবের সহিংসতার মধ্যে ডার্নে মৃত্যুদণ্ডের মুখোমুখি হলে কার্টন লুসির প্রতি ভালোবাসা থেকে চরম আত্মত্যাগের সিদ্ধান্ত নেন। বইটির শুরুর বিখ্যাত বাক্য \"সেটা ছিল সেরা সময়, সেটা ছিল নিকৃষ্টতম সময়\"। অত্যাচার, প্রতিশোধ, ত্যাগ ও পুনর্জন্ম এর প্রধান বিষয়।","i":30,"c":0},{"t":"The Guerrilla of Time","a":"ফিদেল কাস্ত্রো সম্পর্কিত","y":"","yr":0,"n":"এই নামে ফিদেল কাস্ত্রোর নিজের লেখা কোনো বই আমি নিশ্চিতভাবে চিনতে পারছি না। স্প্যানিশ \"Guerrillero del Tiempo\" নামে কাস্ত্রোর জীবন নিয়ে কিউবান লেখক কাতিউস্কা ব্লাঙ্কোর একটি জীবনীগ্রন্থ আছে বলে আমার মনে পড়ে, যা কাস্ত্রোর ঘনিষ্ঠদের সঙ্গে কথাবার্তার ভিত্তিতে লেখা। তবে নিশ্চিত না হয়ে এর বিষয়বস্তু নিয়ে বিস্তারিত লিখছি না।","s":"বইটি আপনার হাতে থাকলে প্রচ্ছদের তথ্য জানালে বা কিছু অংশ দিলে আমি সঠিকভাবে সামারি করে দিতে পারব।","i":31,"c":1},{"t":"Mein Kampf","a":"অ্যাডলফ হিটলার","y":"১৯২৫-২৬","yr":1925,"n":"","s":"হিটলার বইটির প্রথম খণ্ড লেখেন ১৯২৩ সালের ব্যর্থ \"বিয়ার হল পুচ\"-এর পর কারাগারে থাকাকালীন। এতে আত্মজীবনীর অংশের সঙ্গে তাঁর রাজনৈতিক মতাদর্শ মিশে আছে: অস্ট্রিয়ায় তাঁর কঠিন তরুণ বয়স, প্রথম বিশ্বযুদ্ধে সৈনিকজীবন এবং জার্মানির পরাজয়ের জন্য ইহুদি ও বামপন্থীদের মিথ্যাভাবে দায়ী করা। বইয়ে চরম ইহুদিবিদ্বেষ, জাতিগত শ্রেষ্ঠত্বের তত্ত্ব, গণতন্ত্রবিরোধিতা এবং পূর্ব ইউরোপে \"লেবেনসরাউম\" (জার্মানদের জন্য বাড়তি ভূমি) দখলের পরিকল্পনা আছে। প্রচারণার কৌশল নিয়েও তিনি লিখেছেন। বইটি অগোছালো, দীর্ঘ ও পুনরাবৃত্তিমূলক। ইতিহাসবিদদের কাছে এর গুরুত্ব হলো, নাৎসি আদর্শ এবং পরবর্তী যুদ্ধ ও হলোকস্টের পেছনের চিন্তাধারা বোঝার জন্য এটি একটি প্রাথমিক দলিল। তাই একে সমালোচনামূলক ঐতিহাসিক ভূমিকাসহ (যেমন ২০১৬ সালে জার্মানিতে প্রকাশিত টীকাযুক্ত সংস্করণ) পড়ার পরামর্শ দেওয়া হয়।","i":32,"c":2},{"t":"Guerrilla Warfare","a":"চে গেভারা","y":"১৯৬০","yr":1960,"n":"","s":"কিউবান বিপ্লবের অভিজ্ঞতা থেকে লেখা এই বইয়ে গেভারা গেরিলা যুদ্ধের কৌশল ও রাজনৈতিক ভিত্তি নিয়ে নিজের ধারণা তুলে ধরেছেন। তাঁর তিনটি প্রধান বক্তব্য হলো, জনগণের শক্তি নিয়মিত সেনাবাহিনীকে হারাতে পারে, বিপ্লবের পরিস্থিতি তৈরির জন্য সবসময় অপেক্ষা করতে হয় না, গেরিলা কেন্দ্র নিজেই তা তৈরি করতে পারে, আর লাতিন আমেরিকার গ্রামাঞ্চল সশস্ত্র সংগ্রামের মূল ক্ষেত্র। বইয়ে গেরিলাদলের সংগঠন, গ্রামীণ জনগণের সমর্থন, নৈতিক শৃঙ্খলা এবং বিপ্লবী যোদ্ধার আদর্শ গুণাবলির কথা আছে। পরবর্তী সময়ে বলিভিয়ায় গেভারার নিজের অভিযান ব্যর্থ হয় এবং ১৯৬৭ সালে তিনি নিহত হন। এই ঘটনা নিয়ে সমালোচকরা বইয়ের তত্ত্বকে অতি-সরলীকৃত বলে মনে করেন।","i":33,"c":2},{"t":"Asian Drama: An Inquiry into the Poverty of Nations","a":"গুন্নার মীর্ডাল","y":"১৯৬৮","yr":1968,"n":"আপনার তালিকায় নামের শুরুতে \"The\" আছে, বইটির প্রকৃত নাম \"Asian Drama\"।","s":"তিন খণ্ডে প্রায় দুই হাজার পৃষ্ঠার এই বিশাল গবেষণায় সুইডিশ অর্থনীতিবিদ মীর্ডাল দক্ষিণ ও দক্ষিণ-পূর্ব এশিয়ার দেশগুলোর দারিদ্র্য ও উন্নয়নের সমস্যা বিশ্লেষণ করেছেন। তাঁর মূল যুক্তি হলো, পশ্চিমা অর্থনৈতিক তত্ত্ব এই অঞ্চলের বাস্তবতায় সরাসরি খাটে না, কারণ এখানে শুধু মূলধনের অভাব নয়, সামাজিক কাঠামো, ভূমিমালিকানা, শিক্ষা, স্বাস্থ্য ও দৃষ্টিভঙ্গির মতো প্রাতিষ্ঠানিক বিষয়গুলোও উন্নয়নে বাধা তৈরি করে। তিনি \"নরম রাষ্ট্র\" (soft state) ধারণাটি দেন, যেখানে আইন থাকলেও তা কার্যকর করার সামর্থ্য ও ইচ্ছা দুর্বল, ফলে দুর্নীতি ও অদক্ষতা বাড়ে। ভূমি সংস্কার, সমতা ও পরিকল্পনার ওপর তিনি জোর দিয়েছেন। মীর্ডাল ১৯৭৪ সালে অর্থনীতিতে নোবেল পান। বইটি উন্নয়ন অর্থনীতির একটি প্রভাবশালী গ্রন্থ।","i":34,"c":4},{"t":"The Interpretation of Dreams","a":"সিগমুন্ড ফ্রয়েড","y":"১৮৯৯","yr":1899,"n":"তালিকায় \"Dream\" একবচনে আছে, বইটির নাম \"Dreams\" বহুবচনে। জার্মান নাম \"Die Traumdeutung\"; ১৮৯৯ সালের শেষে প্রকাশিত হলেও মুদ্রিত তারিখ ১৯০০।","s":"ফ্রয়েডের মূল বক্তব্য, স্বপ্ন অর্থহীন নয়, বরং এটি মনের অবদমিত ইচ্ছার ছদ্মবেশী পূর্ণতা। তিনি স্বপ্নের দুটি স্তর আলাদা করেন: যা আমরা মনে রাখি (প্রকাশিত বিষয়) এবং তার আড়ালে লুকানো আসল অর্থ (সুপ্ত বিষয়)। মন এই সুপ্ত অর্থকে সংকোচন, স্থানান্তর ও প্রতীকের মতো কৌশলে বদলে ফেলে। নিজের এবং রোগীদের স্বপ্ন বিশ্লেষণ করে তিনি দেখান, স্বপ্নের ব্যাখ্যা অচেতন মনে পৌঁছানোর \"রাজপথ\"। বইয়ে ইডিপাস কমপ্লেক্সের ধারণারও প্রথম উল্লেখ আছে। মনোবিশ্লেষণের ভিত্তিগ্রন্থ হিসেবে বইটি গণ্য হয়, যদিও আধুনিক বিজ্ঞানীরা এর অনেক তত্ত্বকে অপ্রমাণিত বা অতি-ব্যাখ্যামূলক বলে সমালোচনা করেন।","i":35,"c":4},{"t":"The Road to Mecca","a":"মুহাম্মদ আসাদ","y":"১৯৫৪","yr":1954,"n":"লেখকের নামের প্রচলিত বানান \"Muhammad Asad\"।","s":"এটি লেওপোল্ড ভাইস নামে জন্ম নেওয়া অস্ট্রীয় ইহুদি পরিবারের সন্তান আসাদের আত্মজীবনী। তরুণ বয়সে সাংবাদিক হিসেবে তিনি মধ্যপ্রাচ্য ভ্রমণ করেন। আরব বিশ্বের মানুষের জীবনযাত্রা ও ইসলামের সঙ্গে পরিচয়ের পর ১৯২৬ সালে তিনি ইসলাম গ্রহণ করেন। বইয়ে আছে আরব মরুভূমিতে তাঁর বছরগুলো, সৌদি বাদশাহ আবদুল আজিজের সঙ্গে ঘনিষ্ঠতা এবং আধ্যাত্মিক অনুসন্ধানের কথা। বর্ণনাটি ১৯৩২ সালের কাছাকাছি সময়ে শেষ হয়। পরে আসাদ ভারতীয় উপমহাদেশে আসেন, পাকিস্তানের রাষ্ট্রগঠনের সঙ্গে যুক্ত থাকেন এবং কুরআনের ইংরেজি অনুবাদ ও ভাষ্য \"The Message of the Qur'an\" রচনা করেন। ভ্রমণ ও আত্মজীবনীর মিশ্রণে বইটি ইসলামে ধর্মান্তরিত এক পশ্চিমা বুদ্ধিজীবীর বিখ্যাত বিবরণ।","i":36,"c":1},{"t":"Harry Potter","a":"জে. কে. রাউলিং","y":"১৯৯৭-২০০৭","yr":1997,"n":"এটি একটি বই নয়, সাত খণ্ডের ধারাবাহিক। প্রথম খণ্ড \"Harry Potter and the Philosopher's Stone\", যুক্তরাষ্ট্রে \"Sorcerer's Stone\" নামে প্রকাশিত।","s":"এতিম হ্যারি পটার তার নিষ্ঠুর মাসি-মেসোর কাছে বড় হচ্ছিল। এগারো বছর বয়সে সে জানতে পারে সে একজন জাদুকর, এবং তার বাবা-মাকে হত্যা করেছিল অন্ধকার জাদুকর লর্ড ভোল্ডেমর্ট। হগওয়ার্টস জাদুবিদ্যালয়ে ভর্তি হয়ে সে রন ও হারমায়োনির সঙ্গে বন্ধুত্ব করে। সাত বছরের গল্পে তিনজন মিলে নানা রহস্য সমাধান করে এবং শেষ পর্যন্ত ভোল্ডেমর্টের মুখোমুখি হয়। সিরিজের মূল বিষয় বন্ধুত্ব, ভালোবাসা, সাহস, মৃত্যুকে মেনে নেওয়া এবং জাতিগত গোঁড়ামির বিরোধিতা। বইগুলো বিশ্বজুড়ে অসংখ্য ভাষায় অনূদিত হয়েছে এবং পাঠকদের একটি পুরো প্রজন্মকে প্রভাবিত করেছে।","i":37,"c":0},{"t":"From Third World to First","a":"লি কুয়ান ইউ","y":"২০০০","yr":2000,"n":"পুরো নাম \"From Third World to First: The Singapore Story 1965-2000\", যা তাঁর স্মৃতিকথার দ্বিতীয় খণ্ড।","s":"সিঙ্গাপুরের প্রথম প্রধানমন্ত্রী লি ১৯৬৫ সালে মালয়েশিয়া থেকে বেরিয়ে আসা একটি ছোট, প্রাকৃতিক সম্পদহীন দ্বীপরাষ্ট্রকে কীভাবে উন্নত অর্থনীতিতে পরিণত করলেন, তার বিবরণ দিয়েছেন। বইয়ে আছে কঠোর দুর্নীতি দমন, বহুজাতিক কোম্পানিকে বিনিয়োগে টানা, সরকারি আবাসন কর্মসূচি, ইংরেজিকে কাজের ভাষা করা, যোগ্যতাভিত্তিক প্রশাসন এবং প্রতিরক্ষা ও কূটনীতির কৌশল। তিনি মার্কিন, চীনা ও অন্যান্য নেতাদের সঙ্গে আলোচনার কথাও লিখেছেন। বইটি লেখকের নিজের ভাষ্য। সমালোচকরা মনে করেন, সিঙ্গাপুরের সাফল্যের পাশাপাশি সংবাদমাধ্যম, বিরোধী রাজনীতি ও নাগরিক স্বাধীনতার ওপর সীমাবদ্ধতার প্রসঙ্গ এখানে যথেষ্ট গুরুত্ব পায়নি।","i":38,"c":1},{"t":"Long Walk to Freedom","a":"নেলসন ম্যান্ডেলা","y":"১৯৯৪","yr":1994,"n":"","s":"ম্যান্ডেলার আত্মজীবনী শুরু হয় ট্রান্সকাইয়ের গ্রামে তাঁর শৈশব দিয়ে। এরপর আছে জোহানেসবার্গে আইন পড়া ও পেশা, আফ্রিকান ন্যাশনাল কংগ্রেসে (ANC) যোগ দেওয়া এবং বর্ণবৈষম্যবিরোধী আন্দোলনের পথে সশস্ত্র সংগ্রামের সিদ্ধান্ত। ১৯৬৪ সালের রিভোনিয়া বিচারে যাবজ্জীবন কারাদণ্ড পেয়ে তিনি প্রায় ২৭ বছর জেলে কাটান, বেশিরভাগ রবেন দ্বীপে। বইয়ের বড় অংশে জেলজীবনের কষ্ট, তাঁর ধৈর্য এবং ১৯৯০ সালে মুক্তির পর আলোচনার মাধ্যমে বর্ণবাদী শাসনের অবসান ও ১৯৯৪ সালের নির্বাচনে প্রেসিডেন্ট হওয়ার কথা এসেছে। পাণ্ডুলিপির প্রথম খসড়া তিনি গোপনে জেলে লিখেছিলেন, পরে মুক্তির পর সম্পূর্ণ করেন। বইটি অন্যায়ের বিরুদ্ধে দৃঢ়তা এবং প্রতিশোধের বদলে সমঝোতার বার্তার জন্য বিখ্যাত।","i":39,"c":1},{"t":"Conversations with Myself","a":"নেলসন ম্যান্ডেলা","y":"২০১০","yr":2010,"n":"তালিকায় \"Conversation\" একবচনে আছে, বইটির নাম \"Conversations\" বহুবচনে।","s":"এটি ম্যান্ডেলার ব্যক্তিগত লেখা ও রেকর্ডিংয়ের সংকলন। এতে আছে জেল থেকে পরিবারকে লেখা চিঠি, ডায়েরি, নোট এবং পরবর্তী সময়ের রেকর্ড করা আলাপ। এসব লেখা সরকারি নেতা ম্যান্ডেলার আড়ালের মানুষটিকে দেখায়: নিজের সন্দেহ, একাকিত্ব, পরিবার থেকে দূরে থাকার কষ্ট এবং আত্মসংযমের চেষ্টা। আত্মজীবনীর চেয়ে এটি বেশি ব্যক্তিগত ও অনানুষ্ঠানিক। তাই Long Walk to Freedom-এর সঙ্গে মিলিয়ে পড়লে তাঁর জীবন আরও পূর্ণাঙ্গভাবে বোঝা যায়।","i":40,"c":1},{"t":"Prison Notebooks","a":"আন্তনিও গ্রামসি","y":"লেখা ১৯২৯-৩৫, ইতালীয় ভাষায় প্রকাশ ১৯৪৮-৫১","yr":1929,"n":"তালিকার \"Note books\" আসলে \"Notebooks\"; ইতালীয় নাম \"Quaderni del carcere\"।","s":"ইতালির ফ্যাসিস্ট শাসনে গ্রেপ্তার হওয়া কমিউনিস্ট নেতা গ্রামসি জেলে বসে প্রায় ৩০টির বেশি খাতায় এই লেখা লেখেন। এটি একটি গোছানো বই নয়, বরং বিচ্ছিন্ন নোট ও প্রবন্ধের সংকলন, যা মৃত্যুর পর প্রকাশিত হয়। তাঁর সবচেয়ে প্রভাবশালী ধারণা \"আধিপত্য\" (hegemony)। এর মতে, শাসক শ্রেণি শুধু বলপ্রয়োগে নয়, স্কুল, গণমাধ্যম, ধর্ম ও সংস্কৃতির মাধ্যমে নিজেদের মূল্যবোধকে \"সাধারণ জ্ঞান\" বানিয়ে সম্মতি আদায় করে ক্ষমতা ধরে রাখে। তাই পরিবর্তনের জন্য সাংস্কৃতিক ও মতাদর্শিক লড়াইও জরুরি। এ ছাড়া \"জৈব বুদ্ধিজীবী\" (organic intellectuals), \"নাগরিক সমাজ\" এবং রাষ্ট্রক্ষমতার বিরুদ্ধে \"অবস্থানের যুদ্ধ\" ও \"চলমান যুদ্ধ\"-এর পার্থক্য নিয়েও তিনি লিখেছেন। বইটি রাজনৈতিক তত্ত্ব, সংস্কৃতি অধ্যয়ন ও সমাজবিজ্ঞানে গভীর প্রভাব ফেলেছে।","i":41,"c":2},{"t":"Promises to Keep: On Life and Politics","a":"জো বাইডেন","y":"২০০৭","yr":2007,"n":"","s":"বাইডেনের এই স্মৃতিকথায় পেনসিলভানিয়ার স্ক্র্যান্টনে তাঁর শৈশব, পরিবারের আর্থিক টানাপোড়েন এবং শৈশবের তোতলামি কাটিয়ে ওঠার চেষ্টা আছে। ১৯৭২ সালে মাত্র ২৯ বছর বয়সে তিনি ডেলাওয়ার থেকে সিনেটে নির্বাচিত হন। কিন্তু নির্বাচনের কিছুদিন পরেই এক গাড়ি দুর্ঘটনায় তাঁর প্রথম স্ত্রী নেইলিয়া ও শিশুকন্যা নাওমি মারা যান, আর দুই ছেলে বো ও হান্টার গুরুতর আহত হয়। হাসপাতালে ছেলেদের পাশে থেকেই তিনি শপথ নেন এবং প্রতিদিন ট্রেনে ডেলাওয়ার থেকে ওয়াশিংটনে যাতায়াত করতে থাকেন। বইয়ে সিনেটের বিচার কমিটি ও পররাষ্ট্র সম্পর্ক কমিটির কাজ, ১৯৮৮ সালের মস্তিষ্কের অ্যানিউরিজম ও অস্ত্রোপচার, বলকান সংকট এবং ইরাক যুদ্ধ নিয়ে তাঁর অবস্থানের কথা এসেছে। এটি তাঁর ২০০৮ সালের নির্বাচনী প্রচারের আগে প্রকাশিত, তাই স্বভাবতই এতে নিজের ভাবমূর্তি তুলে ধরার দিকটিও আছে।","i":42,"c":1},{"t":"The Truths We Hold: An American Journey","a":"কমলা হ্যারিস","y":"২০১৯","yr":2019,"n":"তালিকায় \"Truth\" একবচনে আছে, বইটির নাম \"Truths\" বহুবচনে।","s":"এটি হ্যারিসের স্মৃতিকথা ও রাজনৈতিক ভাবনার মিশ্রণ। তাঁর মা শ্যামলা গোপালন ভারতের তামিলনাড়ু থেকে আসা ক্যানসার গবেষক, বাবা ডোনাল্ড হ্যারিস জ্যামাইকান অর্থনীতিবিদ। শৈশবে মায়ের নাগরিক অধিকার আন্দোলনে যুক্ততার প্রভাব, ক্যালিফোর্নিয়ার ওকল্যান্ডে বেড়ে ওঠা, হাওয়ার্ড বিশ্ববিদ্যালয়ে পড়া এবং আইনজীবী হওয়ার কথা আছে। পরে তিনি সান ফ্রান্সিসকোর জেলা অ্যাটর্নি, ক্যালিফোর্নিয়ার অ্যাটর্নি জেনারেল এবং মার্কিন সিনেটর হন। বইয়ে অপরাধ-বিচার ব্যবস্থার সংস্কার, গৃহঋণ সংকটের সময় ব্যাংকের বিরুদ্ধে অবস্থান, স্বাস্থ্যসেবা, অভিবাসন ও জলবায়ু পরিবর্তনের মতো বিষয়ে তাঁর মত আছে। বইটি ২০২০ সালের প্রেসিডেন্ট প্রার্থিতার প্রচারের আগে প্রকাশিত। অ্যাটর্নি হিসেবে তাঁর কিছু সিদ্ধান্ত নিয়ে সমালোচকদের আপত্তিও আছে, যা বইয়ে ভিন্নভাবে উপস্থাপিত হয়েছে।","i":43,"c":1},{"t":"The Indian Musalmans","a":"উইলিয়াম উইলসন হান্টার","y":"১৮৭১","yr":1871,"n":"সম্পূর্ণ নাম \"The Indian Musalmans: Are They Bound in Conscience to Rebel Against the Queen?\"।","s":"ব্রিটিশ ভারতীয় সিভিল সার্ভিসের কর্মকর্তা হান্টার সরকারের অনুরোধে বইটি লেখেন। সে সময় ওয়াহাবি আন্দোলনের সঙ্গে জড়িত মুসলমানদের বিরুদ্ধে একের পর এক মামলা চলছিল, এবং প্রশ্ন উঠছিল ভারতীয় মুসলমানরা ব্রিটিশ শাসনের বিরুদ্ধে ধর্মীয়ভাবে বিদ্রোহে বাধ্য কি না। হান্টার বাংলার মুসলমানদের অবস্থা বিশ্লেষণ করে বলেন, ব্রিটিশ শাসনে তারা সরকারি চাকরি, ভূমি ও শিক্ষায় পিছিয়ে পড়েছে এবং এই হতাশাই অসন্তোষের বড় কারণ। তাঁর সুপারিশ ছিল, মুসলমানদের জন্য উপযুক্ত শিক্ষার সুযোগ ও সরকারি চাকরিতে অংশগ্রহণ বাড়ানো। বইটি পরে মুসলিম শিক্ষা ও সামাজিক উন্নয়ন নিয়ে আলোচনায় প্রভাব ফেলে। বাংলাদেশ ও ভারতের ইতিহাসের পাঠকের কাছে এটি একটি গুরুত্বপূর্ণ উৎস। তবে এটি ঔপনিবেশিক প্রশাসকের দৃষ্টিতে লেখা, তাই ইতিহাসবিদরা একে সতর্কভাবে এবং অন্য উৎসের সঙ্গে মিলিয়ে পড়ার পরামর্শ দেন।","i":44,"c":3}],"cats":["উপন্যাস ও সাহিত্য","আত্মজীবনী ও স্মৃতিকথা","রাজনীতি ও দর্শন","ইতিহাস ও আন্তর্জাতিক রাজনীতি","অর্থনীতি, বিজ্ঞান ও মনোবিজ্ঞান"]}</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent), B=D.books, CATS=D.cats;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BN='০১২৩৪৫৬৭৮৯', bn=s=>String(s).replace(/\d/g,d=>BN[d]);
const KEY='famous-books-reader-v1';
let S={bm:{},rd:{},theme:'auto',fs:1,filter:'all',cat:-1,sort:'orig',deep:false,last:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sel=null, ls=0, tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
function apply(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);r.style.setProperty('--fs',S.fs)}
function visible(){
  const q=($('#q').value||'').trim().toLowerCase();
  const L=B.filter(b=>{
    if(S.filter==='bm'&&!S.bm[b.i])return false;
    if(S.filter==='read'&&!S.rd[b.i])return false;
    if(S.filter==='unread'&&S.rd[b.i])return false;
    if(S.cat>=0&&b.c!==S.cat)return false;
    if(q&&!(b.t+' '+b.a+' '+b.y+(S.deep?' '+b.s+' '+b.n:'')).toLowerCase().includes(q))return false;
    return true});
  if(S.sort==='title')L.sort((x,y)=>x.t.localeCompare(y.t));
  else if(S.sort==='author')L.sort((x,y)=>x.a.localeCompare(y.a,'bn')||x.i-y.i);
  else if(S.sort==='year')L.sort((x,y)=>(x.yr||9999)-(y.yr||9999)||x.i-y.i);
  return L}
function renderRail(){
  const n={all:B.length,bm:0,read:0};B.forEach(b=>{if(S.bm[b.i])n.bm++;if(S.rd[b.i])n.read++});n.unread=B.length-n.read;
  document.querySelectorAll('#nav [data-f]').forEach(x=>{x.setAttribute('aria-pressed',S.filter===x.dataset.f);x.querySelector('small').textContent=bn(n[x.dataset.f])});
  $('#cats').innerHTML=`<button class="nv" data-c="-1" aria-pressed="${S.cat<0}">সব ধরন</button>`+CATS.map((c,k)=>`<button class="nv" data-c="${k}" aria-pressed="${S.cat===k}">${esc(c)}<small>${bn(B.filter(b=>b.c===k).length)}</small></button>`).join('')}
function renderList(){
  const L=visible();$('#cnt').textContent=bn(L.length)+'/'+bn(B.length);
  $('#list').innerHTML=L.length?L.map(b=>`<li><a class="item${sel===b.i?' active':''}${S.rd[b.i]?' rd':''}" href="#/b/${b.i}"><div class="tt">${esc(b.t)}</div><div class="mm">${esc(b.a)}${b.y?' · '+esc(b.y):''}</div><span class="ind">${S.bm[b.i]?'★':''}${S.rd[b.i]?' ✓':''}</span></a></li>`).join(''):'<li class="empty">কিছু পাওয়া যায়নি</li>'}
function placeholder(){
  const l=S.last!=null?B[S.last]:null;
  $('#detail').innerHTML=`<div class="ph"><div><p class="t">বাম পাশের তালিকা থেকে একটি বইয়ে ক্লিক করো</p><p class="muted">সামারি এখানেই খুলবে, পাতা বদলাবে না।</p>${l?`<a class="btn" href="#/b/${l.i}">আগের পড়া: ${esc(l.t)}</a>`:''}</div></div>`;
  $('#pb').style.width='0';$('#paneR').scrollTop=0}
function renderDetail(i){
  const b=B[i],L=visible(),p=L.findIndex(x=>x.i===i);
  const prev=p>0?L[p-1]:null,next=p>=0&&p<L.length-1?L[p+1]:null;
  const ss=b.s.replace(/।\s+/g,'।\n').split('\n'),paras=[];for(let k=0;k<ss.length;k+=3)paras.push(ss.slice(k,k+3).join(' '));
  const same=B.filter(x=>x.a===b.a&&x.i!==i);
  $('#detail').innerHTML=`<div class="wrap">
    <div class="crumbs"><a class="btn ghost" href="#/"><span class="d">✕ বন্ধ করো</span><span class="m">← তালিকা</span></a>
      <span class="row"><button class="btn ghost" id="fsM" title="লেখা ছোট">অ−</button><button class="btn ghost" id="fsP" title="লেখা বড়">অ+</button>${prev?`<a class="btn ghost" href="#/b/${prev.i}" title="আগের বই">←</a>`:''}${next?`<a class="btn ghost" href="#/b/${next.i}" title="পরের বই">→</a>`:''}</span></div>
    <h1 class="title">${esc(b.t)}</h1><p class="author">${esc(b.a)}</p>
    <dl class="facts"><div><dt>প্রকাশ</dt><dd>${esc(b.y||'—')}</dd></div><div><dt>ধরন</dt><dd>${esc(CATS[b.c])}</dd></div></dl>
    <div class="actions"><button class="btn toggle" id="bmBtn" aria-pressed="${!!S.bm[i]}">★ বুকমার্ক</button><button class="btn toggle" id="rdBtn" aria-pressed="${!!S.rd[i]}">✓ পড়া হয়েছে</button></div>
    ${b.n?`<p class="note">${esc(b.n)}</p>`:''}
    <article class="explain">${paras.map(x=>`<p>${esc(x)}</p>`).join('')}</article>
    ${same.length?`<p class="related">একই লেখকের আরও বই:</p><div class="chips">${same.map(x=>`<a class="chip" href="#/b/${x.i}">${esc(x.t)}</a>`).join('')}</div>`:''}
    <div class="endread">${prev?`<a class="btn" href="#/b/${prev.i}">← ${esc(prev.t)}</a>`:'<span></span>'}${next?`<a class="btn primary" href="#/b/${next.i}">${esc(next.t)} →</a>`:'<span></span>'}</div></div>`;
  const tg=(id,map)=>{const bt=$(id);bt.onclick=()=>{if(map[i])delete map[i];else map[i]=1;bt.setAttribute('aria-pressed',!!map[i]);save();renderList();renderRail()}};
  tg('#bmBtn',S.bm);tg('#rdBtn',S.rd);
  const fs=d=>{S.fs=Math.min(1.7,Math.max(.8,+(S.fs+d).toFixed(2)));apply();save()};
  $('#fsM').onclick=()=>fs(-.1);$('#fsP').onclick=()=>fs(.1);
  $('#paneR').scrollTop=0;$('#pb').style.width='0'}
function route(){
  const m=location.hash.match(/^#\/b\/(\d+)/),app=$('#app');
  sel=m&&B[+m[1]]?+m[1]:null;
  if(sel!==null&&!app.classList.contains('has-sel'))ls=$('#paneL').scrollTop;
  app.classList.toggle('has-sel',sel!==null);
  renderList();
  if(sel===null){placeholder();$('#paneL').scrollTop=ls}
  else{renderDetail(sel);S.last=sel;save();const a=document.querySelector('#list .item.active');if(a)a.scrollIntoView({block:'nearest'})}}
const rail=$('#rail');
$('#railBtn').onclick=e=>{e.stopPropagation();rail.classList.toggle('open')};
document.addEventListener('click',e=>{if(rail.classList.contains('open')&&!e.target.closest('#rail'))rail.classList.remove('open')});
rail.addEventListener('click',e=>{
  const b=e.target.closest('.nv');if(!b)return;
  if(b.dataset.f)S.filter=b.dataset.f;else S.cat=+b.dataset.c;
  save();renderRail();renderList();rail.classList.remove('open');if(b.blur)b.blur()});
$('#q').addEventListener('input',renderList);
$('#sort').onchange=e=>{S.sort=e.target.value;save();renderList()};
$('#deep').onchange=e=>{S.deep=e.target.checked;save();renderList()};
$('#themeBtn').onclick=()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]||'auto';apply();save();toast({auto:'থিম: ডিভাইস অনুযায়ী',light:'থিম: আলো',dark:'থিম: অন্ধকার'}[S.theme])};
$('#paneR').addEventListener('scroll',()=>{const r=$('#paneR'),mx=r.scrollHeight-r.clientHeight;$('#pb').style.width=(mx>0?r.scrollTop/mx*100:0)+'%'},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.matches('input,select,textarea')){if(e.key==='Escape'&&e.target.id==='q')e.target.blur();return}
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='Escape'){if(rail.classList.contains('open'))rail.classList.remove('open');else if(sel!==null)location.hash='#/';return}
  if(sel===null)return;
  const L=visible(),p=L.findIndex(x=>x.i===sel);let t=null;
  if(e.key==='ArrowRight'||e.key==='j')t=L[p+1];else if(e.key==='ArrowLeft'||e.key==='k')t=L[p-1];
  if(t)location.hash='#/b/'+t.i});
window.addEventListener('hashchange',route);
apply();$('#sort').value=S.sort;$('#deep').checked=S.deep;renderRail();route();
})();
</script>
</body></html>
