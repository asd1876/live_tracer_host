াহাড়ের পাদদেশে\"।\n* অন্যান্য মত: কেউ কেউ মনে করেন এটি একটি প্রাচীন ব্যক্তিগত নাম থেকে উদ্ভূত হয়েছে।", "id": "n3-1-2"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (২. ঐতিহাসিক গুরুত্ব (পটসডাম সম্মেলন))", "b": "২. ঐতিহাসিক গুরুত্ব (পটসডাম সম্মেলন)\nইয়াল্টা সম্মেলনের মতো পটসডাম শব্দটিও বিশ্ব ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ। ১৯৪৫ সালের জুলাই-আগস্ট মাসে দ্বিতীয় বিশ্বযুদ্ধের শেষের দিকে এখানে 'Potsdam Conference' অনুষ্ঠিত হয়।\n* অংশগ্রহণকারী: জোসেফ স্টালিন (সোভিয়েত ইউনিয়ন), হ্যারি এস. ট্রুম্যান (যুক্তরাষ্ট্র) এবং উইনস্টন চার্চিল/ক্লিমেন্ট এটলি (যুক্তরাজ্য)।\n* ফলাফল: এখানে জার্মানিকে চারটি সামরিক অঞ্চলে ভাগ করার সিদ্ধান্ত নেওয়া হয় এবং জাপানকে বিনাশর্তে আত্মসমর্পণের জন্য 'পটসডাম ঘোষণা' (Potsdam Declaration) দেওয়া হয়।", "id": "n3-1-3"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (৩. সাংস্কৃতিক পরিচয়)", "b": "৩. সাংস্কৃতিক পরিচয়\nপটসডাম শহরটি তার রাজকীয় প্রাসাদ এবং উদ্যানের জন্য বিখ্যাত, বিশেষ করে 'সাঁসুসি প্রাসাদ' (Sanssouci Palace), যা ইউনেস্কো ওয়ার্ল্ড হেরিটেজ সাইটের অন্তর্ভুক্ত। এক সময় এটি প্রুশীয় রাজাদের আবাসস্থল ছিল।\n\nসহজ কথায়, Potsdam হলো জার্মানির একটি ঐতিহাসিক শহর যা দ্বিতীয় বিশ্বযুদ্ধ পরবর্তী বিশ্ব ব্যবস্থা নির্ধারণের জন্য স্মরণীয়।\n\nYalta (ইয়াল্টা) শব্দটি মূলত একটি ভৌগোলিক নাম। এর অর্থ ও গুরুত্ব নিচে দেওয়া হলো:", "id": "n3-1-4"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (২. ঐতিহাসিক গুরুত্ব (ইয়াল্টা সম্মেলন))", "b": "১. শাব্দিক অর্থ ও পরিচয়\nYalta হলো ইউক্রেনের ক্রিমিয়া উপদ্বীপের কৃষ্ণসাগর উপকূলে অবস্থিত একটি বিখ্যাত শহর এবং অবকাশযাপন কেন্দ্র। 'ইয়াল্টা' নামটি গ্রিক শব্দ 'Gyalos' (ইয়ালোস) থেকে এসেছে বলে ধারণা করা হয়, যার অর্থ 'উপকূল' বা 'তীর'।\n২. ঐতিহাসিক গুরুত্ব (ইয়াল্টা সম্মেলন)\nইতিহাসে এই শব্দটি অত্যন্ত গুরুত্বপূর্ণ কারণ ১৯৪৫ সালের ফেব্রুয়ারিতে দ্বিতীয় বিশ্বযুদ্ধ চলাকালীন এখানে একটি ঐতিহাসিক বৈঠক হয়েছিল, যা 'Yalta Conference' নামে পরিচিত।\n* অংশগ্রহণকারী: জোসেফ স্টালিন (সোভিয়েত ইউনিয়ন), ফ্রাঙ্কলিন ডি. রুজভেল্ট (যুক্তরাষ্ট্র) এবং উইনস্টন চার্চিল (যুক্তরাজ্য)।\n* উদ্দেশ্য: যুদ্ধের পর জার্মানি এবং ইউরোপের পুনর্গঠন কীভাবে হবে, তা নির্ধারণ করা।", "id": "n3-1-5"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (৩. সাধারণ ব্যবহার)", "b": "৩. সাধারণ ব্যবহার\nবর্তমানে এটি পর্যটন এবং আন্তর্জাতিক কূটনীতির ইতিহাসে একটি মাইলফলক হিসেবে পরিচিত। অনেক সময় \"ইয়াল্টা ব্যবস্থা\" বলতে যুদ্ধ পরবর্তী বিশ্ব রাজনীতির মেরুকরণকেও বোঝানো হয়।\n\n৬টি প্রধান কমিটি\n\nআপনার আপলোড করা ছবিতে জাতিসংঘের সাধারণ পরিষদের (UN General Assembly) ৬টি প্রধান কমিটি এবং কিছু গুরুত্বপূর্ণ কমিশনের তালিকা দেওয়া হয়েছে। এই কমিটি এবং কমিশনগুলো মূলত বিশ্বশান্তি রক্ষা এবং দ্বিতীয় বিশ্বযুদ্ধ পরবর্তী বিশ্ব ব্যবস্থাকে সুসংগঠিত করার প্রয়োজনে গঠিত হয়েছিল।\nনিচে প্রতিটি কমিটি ও কমিশনের প্রেক্ষাপট ও গঠনের কারণ আলাদাভাবে আলোচনা করা হলো:", "id": "n3-1-6"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (১. সাধারণ পরিষদের প্রধান ৬টি কমিটি)", "b": "১. সাধারণ পরিষদের প্রধান ৬টি কমিটি\nএই কমিটিগুলো মূলত সাধারণ পরিষদের কাজের চাপ কমাতে এবং নির্দিষ্ট বিষয়ে বিশেষজ্ঞ আলোচনা করার জন্য তৈরি করা হয়েছে।\n* প্রথম কমিটি (নিরস্ত্রীকরণ ও আন্তর্জাতিক নিরাপত্তা): এর মূল প্রেক্ষাপট ছিল স্নায়ুযুদ্ধ বা Cold War। পারমাণবিক অস্ত্রের বিস্তার রোধ এবং বিশ্বজুড়ে অস্ত্রের প্রতিযোগিতা কমিয়ে শান্তি বজায় রাখার প্রয়োজনে এটি কাজ করে।\n* দ্বিতীয় কমিটি (অর্থনীতি ও আর্থিক বিষয়ক): বিশ্বব্যাপী দারিদ্র্য বিমোচন, টেকসই উন্নয়ন এবং আর্থিক স্থিতিশীলতা নিশ্চিত করার জন্য এই কমিটি কাজ করে। বিশেষ করে স্বল্পোন্নত দেশগুলোর অর্থনৈতিক উন্নয়নের পথ তৈরি করা এর মূল কারণ।\n* তৃতীয় কমিটি (সামাজিক, মানবকল্যাণ ও সাংস্কৃতিক): মানবাধিকার রক্ষা, নারী অধিকার, শিশু অধিকার এবং বর্ণবৈষম্য দূর করার প্রেক্ষাপটে এটি অত্যন্ত গুরুত্বপূর্ণ। বিশ্বব্যাপী মানুষের মৌলিক অধিকার নিশ্চিত করাই এর প্রধান লক্ষ্য।\n* চতুর্থ কমিটি (বিশেষ রাজনৈতিক ও উপনিবেশ বিলোপ): বিংশ শতাব্দীতে বিশ্বের অনেক দেশই পরাধীন ছিল। এই কমিটির মূল দায়িত্ব ছিল উপনিবেশবাদ (Colonialism) দূর করা এবং পরাধীন দেশগুলোকে স্বাধীনতা লাভে সহায়তা করা।\n* পঞ্চম কমিটি (প্রশাসনিক ও বাজেট): জাতিসংঘের বিশাল কর্মকাণ্ড পরিচালনার জন্য বিপুল অর্থের প্রয়োজন। জাতিসংঘের বাজেট অনুমোদন, সদস্য দেশগুলোর চাঁদা নির্ধারণ এবং প্রশাসনিক শৃঙ্খলা রক্ষার জন্য এটি গঠিত।\n* ষষ্ঠ কমিটি (আইন বিষয়ক): আন্তর্জাতিক আইনের ব্যাখ্যা, নতুন আইন প্রণয়ন এবং বিভিন্ন দেশের মধ্যে আইনি বিরোধ মীমাংসার প্রেক্ষাপটে এটি কাজ করে।", "id": "n3-1-7"}, {"t": "কিছু অতিরিক্ত তথ্য যা আপনার কাজে লাগতে পারে (২. কমিশনের নাম ও তাদের প্রেক্ষাপট)", "b": "২. কমিশনের নাম ও তাদের প্রেক্ষাপট\nছবিতে থাকা কমিশনগুলো নির্দিষ্ট কিছু বৈশ্বিক সংকট বা প্রয়োজন থেকে তৈরি হয়েছে:\nUN Disarmament Commission (UNDC) - ১৯৫২\n* প্রেক্ষাপট: দ্বিতীয় বিশ্বযুদ্ধের পর এবং স্নায়ুযুদ্ধ শুরু হওয়ার পর যখন পারমাণবিক বোমার ভয়াবহতা বিশ্ববাসী দেখল, তখন বিশ্বকে পারমাণবিক অস্ত্রমুক্ত করার লক্ষ্যে এটি গঠন করা হয়।\n* কারণ: গণবিধ্বংসী অস্ত্র নিয়ন্ত্রণ এবং সামরিক ব্যয় কমিয়ে উন্নয়নমূলক কাজে ব্যয় করা।\nInternational Civil Service Commission (ICSC) - ১৯৭৪\n* প্রেক্ষাপট: জাতিসংঘের বিভিন্ন সংস্থায় হাজার হাজার মানুষ কাজ করে। তাদের বেতন, সুযোগ-সুবিধা এবং নিয়োগের ক্ষেত্রে একটি অভিন্ন মানদণ্ড থাকা জরুরি হয়ে পড়ে।\n* কারণ: জাতিসংঘের কর্মী বাহিনীর মধ্যে পেশাদারিত্ব বজায় রাখা এবং বৈশ্বিক মান অনুযায়ী সুযোগ-সুবিধা নিশ্চিত করা।\nInternational Law Commission (ILC) - ১৯৪৭\n* প্রেক্ষাপট: আন্তর্জাতিক সম্পর্কের ক্ষেত্রে নির্দিষ্ট কোনো লিখিত নিয়ম না থাকলে বিশৃঙ্খলা সৃষ্টি হয়।\n* কারণ: আন্তর্জাতিক আইনগুলোকে সংকলিত (Codify) করা এবং যুগের প্রয়োজনে নতুন আন্তর্জাতিক আইনের খসড়া তৈরি করা।\nUNCITRAL (International Trade Law) - ১৯৬৬\n* প্রেক্ষাপট: ষাটের দশকে বিশ্ববাণিজ্য দ্রুত বাড়তে থাকে। কিন্তু বিভিন্ন দেশের ভিন্ন ভিন্ন বাণিজ্যিক আইনের কারণে ব্যবসা-বাণিজ্যে জটিলতা তৈরি হতো।\n* কারণ: আন্তর্জাতিক বাণিজ্যে আইনি বাধা দূর করা এবং সারা বিশ্বে বাণিজ্যের জন্য একটি অভিন্ন আইনি কাঠামো তৈরি করা।\nUNCCP (Conciliation Commission for Palestine) - ১৯৪৮\n* প্রেক্ষাপট: ১৯৪৮ সালে আরব-ইসরায়েল যুদ্ধের ফলে উদ্ভূত পরিস্থিতি এবং ফিলিস্তিনি উদ্বাস্তুদের সংকট।\n* কারণ: ইসরায়েল ও আরব দেশগুলোর মধ্যে শান্তি স্থাপন এবং ফিলিস্তিনিদের অধিকার ও শরণার্থী সমস্যার সমাধান খুঁজে বের করা।\nUN Peacebuilding Commission - ২০০৫\n* প্রেক্ষাপট: দেখা যাচ্ছিল যে অনেক দেশে যুদ্ধ শেষ হলেও কিছুকাল পর আবার সংঘাত শুরু হচ্ছে (যেমন: রুয়ান্ডা বা সিয়েরা লিওন)। শুধু যুদ্ধ থামানোই যথেষ্ট নয়, দেশটিকে পুনর্গঠন করাও জরুরি।\n* কারণ: সংঘাত-পরবর্তী দেশগুলোতে টেকসই শান্তি বজায় রাখা এবং রাস্তাঘাট, অবকাঠামো ও শাসনব্যবস্থা পুনর্গঠনে সহায়তা করা।\n\nএই তথ্যগুলো কি আপনার পড়াশোনার জন্য পর্যাপ্ত, নাকি কোনো নির্দিষ্ট সাল বা ঘটনা সম্পর্কে আরও বিস্তারিত জানতে চান?", "id": "n3-1-8"}, {"t": "Secretary-General of the United Nations", "b": "Former Secretaries-General | Secretary-General\nSecretary-General of the United Nations - Wikipedia\nSecretaries-General | Archives and Records Management Section | New York", "id": "n3-1-9"}, {"t": "United Nations missions list", "b": "Based on the image provided, here are the full names of the United Nations missions listed in the table:\nMission\n\tFull Form\n\tCountry/Region\n\tUNMISS\n\tUnited Nations Mission in South Sudan\n\tSouth Sudan\n\tUNIFIL\n\tUnited Nations Interim Force in Lebanon\n\tLebanon\n\tMINURSO\n\tUnited Nations Mission for the Referendum in Western Sahara\n\tWestern Sahara\n\tUNISFA\n\tUnited Nations Interim Security Force for Abyei\n\tAbyei\n\tMINUSCA\n\tMultidimensional Integrated Stabilization Mission in the Central African Republic\n\tCentral African Republic\n\tUNAMI\n\tUnited Nations Assistance Mission for Iraq\n\tIraq\n\tMONUSCO\n\tUnited Nations Organization Stabilization Mission in the Democratic Republic of the Congo\n\tCongo\n\tUNDOF\n\tUnited Nations Disengagement Observer Force\n\tGolan (Syria)\n\tUNFICYP\n\tUnited Nations Peacekeeping Force in Cyprus\n\tCyprus\n\tUNMOGIP\n\tUnited Nations Military Observer Group in India and Pakistan\n\tJammu and Kashmir\n\tUNTSO\n\tUnited Nations Truce Supervision Organization\n\tMiddle East\n\tUNMIK\n\tUnited Nations Interim Administration Mission in Kosovo\n\tKosovo", "id": "n3-1-10"}, {"t": "United Nations missions list: Quick Tips for Memorization", "b": "* MINU... usually stands for Mission des Nations Unies (French influence, often used for African missions).\n* ...CA in MINUSCA stands for Central Africa.\n* ...S at the end of UNMISS stands for South Sudan.\n* ...I at the end of UNAMI stands for Iraq.", "id": "n3-1-11"}, {"t": "Sustainable Development Goals (SDGs)", "b": "Sustainable Development Goals (SDGs) বা টেকসই উন্নয়ন লক্ষ্যমাত্রা-র ১৭টি গোল মনে রাখা বেশ কঠিন হতে পারে। তবে এগুলোকে ছোট ছোট গ্রুপে ভাগ করে এবং একটি ছন্দ বা গল্পের মাধ্যমে মনে রাখলে অনেক সহজ হয়।\nনিচে ১৭টি গোল মনে রাখার একটি সহজ টেকনিক ও ছন্দ দেওয়া হলো:\n১. গল্পের মাধ্যমে মনে রাখার টেকনিক (The \"Story\" Method)\nএই ১৭টি গোলকে একটি কাল্পনিক সমাজের অগ্রগতির ধাপ হিসেবে ভাবুন:\n* প্রাথমিক অভাব দূর করা (১-২-৩): প্রথমে মানুষের দারিদ্র্য (১) দূর করতে হবে, যাতে সে ক্ষুধা (২) মুক্ত হয় এবং তার স্বাস্থ্য (৩) ভালো থাকে।\n* ব্যক্তিগত দক্ষতা (৪-৫): স্বাস্থ্য ভালো থাকলে সে শিক্ষা (৪) গ্রহণ করবে এবং সমাজে নারী-পুরুষের সমান অধিকার (৫) নিশ্চিত হবে।\n* পরিবেশ ও শক্তি (৬-৭): শিক্ষিত মানুষ পরিষ্কার পানি (৬) ব্যবহার করবে এবং সাশ্রয়ী বিদ্যুৎ বা শক্তি (৭) উৎপাদন করবে।\n* অর্থনীতি ও অবকাঠামো (৮-৯-১০): এরপর তারা ভালো কাজ ও অর্থনৈতিক প্রবৃদ্ধি (৮) অর্জন করবে, নতুন শিল্প ও উদ্ভাবন (৯) আনবে এবং সমাজের বৈষম্য (১০) কমিয়ে ফেলবে।\n* বসবাস ও ভোগ (১১-১২): এতে আমাদের শহরগুলো টেকসই (১১) হবে এবং আমরা পরিমিত ভোগ (১২) করতে শিখব।\n* প্রকৃতি রক্ষা (১৩-১৪-১৫): জলবায়ু পরিবর্তনের বিরুদ্ধে পদক্ষেপ (১৩) নিতে হবে, পানির নিচের জীবন (১৪) এবং স্থলের জীবন (১৫) রক্ষা করতে হবে।\n* শান্তি ও ঐক্য (১৬-১৭): সবশেষে দরকার সমাজে শান্তি ও ন্যায়বিচার (১৬) এবং এই সব লক্ষ্য অর্জনে সবার অংশীদারিত্ব বা বন্ধুত্ব (১৭)।\n\n২. মনে রাখার ছন্দ (The Mnemonic Poem)\nআপনি যদি ছন্দে মনে রাখতে পছন্দ করেন, তবে এই কবিতাটি মুখস্থ করতে পারেন:\n\"দারিদ্র্য ও ক্ষুধা নাই, সুস্বাস্থ্য ও শিক্ষা চাই। (১, ২, ৩, ৪)\nলিঙ্গ সাম্য, বিশুদ্ধ পানি, আধুনিক শক্তি দিতে জানি। (৫, ৬, ৭)\nকাজ, শিল্প ও বৈষম্য হ্রাস, টেকসই নগরীর সুন্দর বসবাস। (৮, ৯, ১০, ১১)\nপরিমিত ভোগ ও জলবায়ু জয়, জল ও স্থলের জীব হবে না ক্ষয়। (১২, ১৩, ১৪, ১৫)\nশান্তি-ন্যায়বিচারে আসবে মুক্তি, লক্ষ্য অর্জনে চাই সবার শক্তি।\" (১৬, ১৭)", "id": "n3-1-12"}, {"t": "Sustainable Development Goals (SDGs): জাতিসংঘ সাধারণ পরিষদের (UN General Assembly) অধিবেশন শুরুর সময়সূচী", "b": "সেপ্টেম্বর মাসকে বেছে নেওয়ার পেছনে কোনো একটি নির্দিষ্ট ঐতিহাসিক ঘটনার চেয়ে বেশি কাজ করেছে ব্যবহারিক এবং প্রশাসনিক সুবিধা। ১৯৪৫ সালে জাতিসংঘ প্রতিষ্ঠিত হওয়ার পর থেকে এই সময়টিকেই সবচেয়ে উপযুক্ত মনে করা হয়েছে। এর প্রধান কারণগুলো হলো:\n১. ঋতু এবং আবহাওয়া (নিউ ইয়র্কের আবহাওয়া)\nজাতিসংঘের সদর দপ্তর আমেরিকার নিউ ইয়র্কে অবস্থিত। উত্তর গোলার্ধে সেপ্টেম্বর মাস হলো শরৎকাল (Autumn)।\n* এই সময়ে নিউ ইয়র্কের আবহাওয়া বেশ মনোরম থাকে—খুব বেশি গরম বা খুব বেশি ঠান্ডা নয়।\n* বিশ্বজুড়ে শত শত রাষ্ট্রপ্রধান এবং তাদের প্রতিনিধিরা যখন নিউ ইয়র্কে সমবেত হন, তখন যাতায়াত এবং চলাচলের জন্য এই আবহাওয়াটি সবচেয়ে অনুকূল।\n২. কৃষি ও ছুটির মৌসুমের সমাপ্তি\nঐতিহাসিকভাবে, উত্তর গোলার্ধের দেশগুলোতে (বিশেষ করে ইউরোপ ও আমেরিকায়) অগাস্ট মাস পর্যন্ত গ্রীষ্মকালীন ছুটি এবং ফসল কাটার মৌসুম চলে।\n* সেপ্টেম্বর মাসে স্কুল, কলেজ এবং সরকারি অফিসগুলো পুরোদমে কাজ শুরু করে।\n* তাই বিশ্বনেতাদের জন্য নিজ দেশের কাজ গুছিয়ে আন্তর্জাতিক সম্মেলনে যোগ দেওয়ার জন্য সেপ্টেম্বর মাসটি সবচেয়ে নিরবচ্ছিন্ন সময় হিসেবে বিবেচিত হয়।\n৩. নতুন বছর বনাম বাজেটের সমন্বয়\nজাতিসংঘের অনেক কার্যক্রম এবং আর্থিক পরিকল্পনা বছরের শেষ নাগাদ চূড়ান্ত করতে হয়। সেপ্টেম্বর থেকে অধিবেশন শুরু হলে সেপ্টেম্বর-ডিসেম্বর এই তিন মাস সময় পাওয়া যায় গুরুত্বপূর্ণ রেজোলিউশন পাস করা এবং আগামী বছরের বাজেট ও পরিকল্পনা নির্ধারণ করার জন্য।", "id": "n3-1-13"}, {"t": "Sustainable Development Goals (SDGs): সহজে মনে রাখার জন্য ছন্দ", "b": "\"গরম শেষে নরম রোদে সেপ্টেম্বর মাস এলো,\nছুটি কাটিয়ে বিশ্বনেতা নিউ ইয়র্কেতে গেল।\nশীত আসারই আগে আগে কাজ সেরে নেয় সব,\nশান্তি প্রতিষ্ঠায় ওঠে ঐক্যের কলরব।\"\n\n১৯৬৫ সালে ত্যাগ করে পুনরায় ১৯৬৬ সালে যোগ দেয় ইন্দোনেশিয়া।\n\nআপনার আপলোড করা ছবিতে লেখা আছে: \"১৯৬৫ সালে ত্যাগ করে পুনরায় ১৯৬৬ সালে যোগ দেয় ইন্দোনেশিয়া।\"\nইন্দোনেশিয়া কেন জাতিসংঘ (UN) ত্যাগ করেছিল এবং আবার ফিরে এসেছিল, তার মূল কারণগুলো নিচে সহজভাবে দেওয়া হলো:", "id": "n3-1-14"}, {"t": "Sustainable Development Goals (SDGs): সহজে মনে রাখার জন্য ছন্দ (১. ত্যাগের কারণ (জানুয়ারি ১৯৬৫))", "b": "১. ত্যাগের কারণ (জানুয়ারি ১৯৬৫)\nমূলত মালয়েশিয়ার সঙ্গে বিরোধের (Konfrontasi) কারণে ইন্দোনেশিয়া এই সিদ্ধান্ত নিয়েছিল।\n* তখনকার ইন্দোনেশীয় প্রেসিডেন্ট সুকর্ন মালয়েশিয়া গঠনকে ব্রিটিশ সাম্রাজ্যবাদের একটি চাল হিসেবে মনে করতেন।\n* যখন মালয়েশিয়াকে জাতিসংঘের নিরাপত্তা পরিষদের (Security Council) অস্থায়ী সদস্য হিসেবে নির্বাচিত করা হয়, তখন সুকর্ন ক্ষুব্ধ হয়ে জাতিসংঘ থেকে পদত্যাগ করেন। এটি ছিল জাতিসংঘের ইতিহাসে কোনো রাষ্ট্রের সদস্যপদ ত্যাগের প্রথম (এবং একমাত্র) ঘটনা।", "id": "n3-1-15"}, {"t": "Sustainable Development Goals (SDGs): সহজে মনে রাখার জন্য ছন্দ (২. পুনরায় যোগদানের কারণ (সেপ্টেম্বর ১৯৬৬)", "b": "২. পুনরায় যোগদানের কারণ (সেপ্টেম্বর ১৯৬৬)\nইন্দোনেশিয়ার অভ্যন্তরীণ রাজনীতিতে বড় পরিবর্তনের ফলে তারা আবার ফিরে আসে।\n* ক্ষমতার পরিবর্তন: ১৯৬৬ সালে সুকর্নর ক্ষমতা হ্রাস পায় এবং জেনারেল সুহার্তো ক্ষমতায় আসেন।\n* অর্থনৈতিক ও কূটনৈতিক প্রয়োজন: সুহার্তো সরকার বুঝতে পেরেছিলেন যে আন্তর্জাতিকভাবে বিচ্ছিন্ন থাকলে দেশের চরম অর্থনৈতিক বিপর্যয় কাটিয়ে ওঠা সম্ভব নয়। বিদেশি সাহায্য এবং উন্নয়ন তহবিলের জন্য জাতিসংঘের সদস্যপদ পুনরুদ্ধার করা জরুরি ছিল।\n\n \n\"সর্বশেষ ১৯৯৪ সালে পালাউয়ের স্বাধীনতার মাধ্যমে অছি পরিষদের কার্যক্রম স্থগিত হয়।\"\nএটি কেন হয়েছিল, তার প্রেক্ষাপট নিচে তুলে ধরা হলো:", "id": "n3-1-16"}, {"t": "Sustainable Development Goals (SDGs): সহজে মনে রাখার জন্য ছন্দ (২. পালাউ এবং কার্যক্রম স্থগিত হওয়া)", "b": "১. অছি পরিষদের (Trusteeship Council) কাজ কী ছিল?\nজাতিসংঘের এই পরিষদের মূল দায়িত্ব ছিল এমন কিছু অঞ্চল বা দেশকে দেখাশোনা করা, যারা তখনো স্বাধীন হতে পারেনি বা নিজেদের শাসন নিজেরা চালানোর মতো অবস্থায় ছিল না। এদের লক্ষ্য ছিল এই দেশগুলোকে পর্যায়ক্রমে স্বায়ত্তশাসন বা স্বাধীনতার দিকে এগিয়ে দেওয়া।\n২. পালাউ এবং কার্যক্রম স্থগিত হওয়া\n* শেষ দায়িত্ব: ১৯৪৫ সালে জাতিসংঘের অধীনে মোট ১১টি 'Trust Territory' বা অছিভুক্ত এলাকা ছিল। পালাউ ছিল এই তালিকার সর্বশেষ এলাকা (যা আমেরিকার অধীনে ছিল)।\n* স্বাধীনতা লাভ: ১৯৯৪ সালের ১ অক্টোবর পালাউ একটি স্বাধীন রাষ্ট্র হিসেবে আত্মপ্রকাশ করে।\n* উদ্দেশ্য পূরণ: যেহেতু হাতে থাকা ১১টি দেশের প্রতিটিই স্বাধীনতা পেয়ে গেছে বা অন্য কোনো দেশের সাথে যুক্ত হয়ে স্বায়ত্তশাসন পেয়েছে, তাই অছি পরিষদের হাতে আর কোনো নতুন দেশ দেখাশোনা করার দায়িত্ব বাকি ছিল না।\nএই কারণেই ১৯৯৪ সালের ১ নভেম্বর থেকে অছি পরিষদ তাদের নিয়মিত কার্যক্রম আনুষ্ঠানিকভাবে স্থগিত (Suspend) করে দেয়। এটি বিলুপ্ত করা হয়নি, তবে বর্তমানে এর কোনো নিয়মিত কাজ নেই।\n\n \n\"UNESCO এর সদস্যপদ ত্যাগ করে যুক্তরাষ্ট্র ও ইসরায়েল।\"\nএই দুই দেশ কেন ইউনেস্কো ত্যাগ করেছিল, তার মূল কারণগুলো নিচে দেওয়া হলো:\nত্যাগের মূল কারণ (জানুয়ারি ২০১৯)\nযুক্তরাষ্ট্র এবং ইসরায়েল আনুষ্ঠানিকভাবে ১ জানুয়ারি ২০১৯ তারিখে ইউনেস্কো (UNESCO) ত্যাগ করে। এর পেছনে প্রধানত তিনটি কারণ ছিল:\n* ফিলিস্তিন ইস্যু: ২০১১ সালে ইউনেস্কো ফিলিস্তিনকে পূর্ণ সদস্যপদ প্রদান করে। যুক্তরাষ্ট্র ও ইসরায়েল এর তীব্র বিরোধিতা করেছিল।\n* ইসরায়েল-বিরোধী পক্ষপাতিত্ব: যুক্তরাষ্ট্র ও ইসরায়েলের অভিযোগ ছিল যে ইউনেস্কো ক্রমাগত ইসরায়েল-বিরোধী সিদ্ধান্ত নিচ্ছে এবং তাদের সাংস্কৃতিক ও ঐতিহাসিক ঐতিহ্যের প্রতি বৈষম্যমূলক আচরণ করছে (যেমন—হেব্রন শহরকে ফিলিস্তিনি ঐতিহ্যের অংশ হিসেবে ঘোষণা করা)।\n* সংস্কারের অভাব: যুক্তরাষ্ট্রের মতে, ইউনেস্কোতে প্রচুর প্রশাসনিক অব্যবস্থাপনা রয়েছে এবং সংস্থাটি তার মূল লক্ষ্য থেকে বিচ্যুত হয়ে রাজনৈতিক উদ্দেশ্যে বেশি ব্যবহৃত হচ্ছে।", "id": "n3-1-17"}, {"t": "Sustainable Development Goals (SDGs): বর্তমান অবস্থা (একটি গুরুত্বপূর্ণ তথ্য)", "b": "আপনি জেনে খুশি হবেন যে, যুক্তরাষ্ট্র আবার ইউনেস্কোতে ফিরে এসেছে। জুলাই ২০২৩ সালে যুক্তরাষ্ট্র আনুষ্ঠানিকভাবে ইউনেস্কোর সদস্যপদ পুনরুদ্ধার করে। তবে ইসরায়েল এখন পর্যন্ত ফিরে আসেনি।", "id": "n3-1-18"}, {"t": "Women", "b": "আপনার আপলোড করা ছবিগুলোতে পরিবেশের পাশাপাশি নারীর অধিকার এবং বিশ্ব খাদ্য নিরাপত্তা বিষয়ক অত্যন্ত গুরুত্বপূর্ণ কিছু সংস্থা ও চুক্তির তালিকা রয়েছে। কেন এই পদক্ষেপগুলো নেওয়া হয়েছিল এবং এদের ঐতিহাসিক প্রেক্ষাপট কী ছিল, তা নিচে আলাদাভাবে আলোচনা করা হলো:\n\n১. সিডও (CEDAW - 1979)\n* বিস্তারিত প্রেক্ষাপট: বিংশ শতাব্দীর মাঝামাঝি পর্যন্ত বিশ্বের অধিকাংশ দেশে নারীরা ভোটাধিকার, সম্পত্তির অধিকার বা সমান মজুরির ক্ষেত্রে চরম বৈষম্যের শিকার ছিলেন। জাতিসংঘ অনুভব করে যে, কেবল সাধারণ মানবাধিকার দিয়ে নারীর সুনির্দিষ্ট সমস্যাগুলো সমাধান করা সম্ভব নয়। এই প্রেক্ষাপটে ১৯৭৯ সালে জাতিসংঘ সাধারণ পরিষদে এটি গৃহীত হয়।\n* মূল কারণ: একে 'নারীর অধিকারের আন্তর্জাতিক বিল' বলা হয়। এর মূল কারণ ছিল রাজনৈতিক, অর্থনৈতিক, সামাজিক ও সাংস্কৃতিক ক্ষেত্রে নারীর প্রতি সব ধরনের বৈষম্য আইনত নিষিদ্ধ করা এবং পরিবার ও সমাজে নারীর সমান মর্যাদা নিশ্চিত করা।\n২. ইউএন উইমেন (UN Women - 2010)\n* বিস্তারিত প্রেক্ষাপট: আগে জাতিসংঘের অধীনে নারীর জন্য আলাদা চারটি ছোট সংস্থা কাজ করত (যেমন- UNIFEM, INSTRAW ইত্যাদি)। কিন্তু এতে কাজের সমন্বয় কম হতো এবং বাজেটও ছিল সীমিত। তাই ২০১০ সালে এই সবগুলোকে একীভূত করে একটি শক্তিশালী সংস্থা 'UN Women' গঠন করা হয়।\n* মূল কারণ: বিশ্বজুড়ে লিঙ্গ সমতা (Gender Equality) ত্বরান্বিত করা এবং নারীর ক্ষমতায়নে একটি একক ও শক্তিশালী কণ্ঠস্বর হিসেবে কাজ করা।\n৩. বিশ্ব নারী সম্মেলন (World Conference on Women)\n* বিস্তারিত প্রেক্ষাপট: ১৯৭৫ সালে মেক্সিকো সিটি থেকে শুরু করে ১৯৯৫ সালের বেইজিং সম্মেলন পর্যন্ত মোট চারটি বড় সম্মেলন অনুষ্ঠিত হয়। বিশেষ করে বেইজিং সম্মেলন (চতুর্থ) ছিল নারী আন্দোলনের ইতিহাসে সবচেয়ে বড় মোড়।\n* মূল কারণ: নারীদের শিক্ষা, স্বাস্থ্য, সহিংসতা থেকে মুক্তি এবং সিদ্ধান্ত গ্রহণের প্রক্রিয়ায় অংশগ্রহণ নিশ্চিত করার জন্য বৈশ্বিক কর্মপরিকল্পনা তৈরি করা। বেইজিং সম্মেলনের স্লোগান ছিল— \"নারীর চোখে বিশ্ব দেখো\"।\n৪. ডাব্লিউএফপি (WFP - World Food Program)\n* বিস্তারিত প্রেক্ষাপট: ১৯৬০-এর দশকে আফ্রিকা ও এশিয়ার বিভিন্ন দেশে দুর্ভিক্ষ ও চরম খাদ্য সংকট দেখা দেয়। তৎকালীন মার্কিন প্রেসিডেন্ট আইজেনহাওয়ারের প্রস্তাব অনুযায়ী একটি পরীক্ষামূলক খাদ্য সহায়তা সংস্থা হিসেবে এটি ১৯৬১ সালে যাত্রা শুরু করে।\n* মূল কারণ: যুদ্ধ, সংঘাত বা প্রাকৃতিক দুর্যোগে ক্ষতিগ্রস্ত মানুষের কাছে দ্রুত খাদ্য পৌঁছে দেওয়া এবং দীর্ঘমেয়াদে অপুষ্টি দূর করা। ২০২০ সালে সংস্থাটি শান্তির জন্য নোবেল পুরস্কার পায়।\n\n৬. বিশ্ব টেকসই উন্নয়ন সম্মেলন (WSSD - 2002)\n* বিস্তারিত প্রেক্ষাপট: এটি ১৯৯২ সালের রিও সম্মেলনের ১০ বছর পর দক্ষিণ আফ্রিকার জোহানেসবার্গে অনুষ্ঠিত হয় (Rio+10)। দেখা গিয়েছিল যে, উন্নয়নের নামে প্রকৃতি ধ্বংস করার প্রবণতা থামছে না এবং ধনী-দরিদ্রের বৈষম্য বাড়ছে।\n* মূল কারণ: উন্নয়নকে কেবল টাকার অঙ্কে না মেপে মানুষের জীবনযাত্রা এবং পরিবেশের সাথে সমন্বয় করা। এখান থেকেই পানি, জ্বালানি, স্বাস্থ্য, কৃষি ও জীববৈচিত্র্য—এই পাঁচটি ক্ষেত্রে বিশেষ গুরুত্ব দেওয়া শুরু হয়।", "id": "n3-1-19"}, {"t": "Women: সারসংক্ষেপ", "b": "এই প্রতিটি সংস্থা বা সম্মেলন মূলত বৈষম্য (নারীর ক্ষেত্রে), অভাব (খাদ্যের ক্ষেত্রে) এবং অদূরদর্শিতা (পরিবেশের ক্ষেত্রে)—এই তিনটি সংকট থেকে উত্তরণের জন্য তৈরি হয়েছে।\nআপনার সংগৃহীত এই তথ্যগুলো মূলত বিসিএস বা আন্তর্জাতিক বিষয়ক সাধারণ জ্ঞানের জন্য অত্যন্ত সহায়ক। এর মধ্যে কোনো বিশেষ ধারা বা সদর দপ্তর নিয়ে কি আপনার আরও তথ্য প্রয়োজন?\n\n১৯৭৫ সালের আন্তর্জাতিক নারী বর্ষ এবং মেক্সিকো সিটিতে অনুষ্ঠিত প্রথম বিশ্ব নারী সম্মেলন নারী অধিকার আন্দোলনের ইতিহাসে একটি যুগান্তকারী অধ্যায়। এটি ছিল বিশ্বমঞ্চে নারীদের অধিকার নিয়ে আয়োজিত প্রথম আনুষ্ঠানিক মহাসমাবেশ।\nনিচে এই সম্মেলনের কারণ, প্রেক্ষাপট এবং গুরুত্ব বিস্তারিতভাবে আলোচনা করা হলো:", "id": "n3-1-20"}, {"t": "Women: সারসংক্ষেপ (১. সম্মেলনের প্রেক্ষাপট (Background))", "b": "১. সম্মেলনের প্রেক্ষাপট (Background)\nবিংশ শতাব্দীর ষাটের ও সত্তরের দশকে বিশ্বজুড়ে নারী মুক্তি আন্দোলনের (Feminist Movement) একটি নতুন জোয়ার সৃষ্টি হয়। উন্নত দেশগুলোতে কর্মক্ষেত্রে সমান মজুরি এবং উন্নয়নশীল দেশগুলোতে শিক্ষা ও স্বাস্থ্যের অধিকার নিয়ে দাবি জোরালো হতে থাকে।\nজাতিসংঘ এই ক্রমবর্ধমান প্রয়োজনীয়তা অনুভব করে এবং ১৯৭২ সালে এক ঘোষণার মাধ্যমে ১৯৭৫ সালকে 'আন্তর্জাতিক নারী বর্ষ' হিসেবে পালনের সিদ্ধান্ত নেয়। এই বর্ষের মূল কর্মসূচি হিসেবেই মেক্সিকো সিটিতে এই সম্মেলনের আয়োজন করা হয়।", "id": "n3-1-21"}, {"t": "Women: সারসংক্ষেপ (২. কেন অনুষ্ঠিত হয়েছিল? (Objectives))", "b": "২. কেন অনুষ্ঠিত হয়েছিল? (Objectives)\nএই সম্মেলনের প্রধান কারণগুলো ছিল মূলত তিনটি স্তম্ভের ওপর ভিত্তি করে:\n* সমতা (Equality): লিঙ্গ বৈষম্য দূর করে নারী ও পুরুষের সমান অধিকার নিশ্চিত করা।\n* উন্নয়ন (Development): দেশের অর্থনৈতিক ও সামাজিক উন্নয়নে নারীদের সক্রিয় অংশগ্রহণ নিশ্চিত করা।\n* শান্তি (Peace): বিশ্বশান্তি প্রতিষ্ঠায় নারীদের ভূমিকা বৃদ্ধি করা।", "id": "n3-1-22"}, {"t": "Women: সারসংক্ষেপ (৩. সম্মেলনের গুরুত্ব (Significance))", "b": "৩. সম্মেলনের গুরুত্ব (Significance)\nএই সম্মেলনটি কেবল একটি আলোচনা সভা ছিল না, বরং এটি বিশ্বরাজনীতিতে নারীর অবস্থান পরিবর্তনের ভিত্তিপ্রস্তর স্থাপন করেছিল:\nক. বিশ্ব কর্মপরিকল্পনা (World Plan of Action)\nসম্মেলন থেকে একটি ১০ বছর মেয়াদী কর্মপরিকল্পনা গ্রহণ করা হয়। এর মাধ্যমে সদস্য দেশগুলোকে নারীর শিক্ষা, কর্মসংস্থান এবং রাজনৈতিক অংশগ্রহণের জন্য নির্দিষ্ট আইন প্রণয়নের তাগিদ দেওয়া হয়।\nখ. বৈশ্বিক সচেতনতা\nপ্রথমবারের মতো বিশ্বনেতারা স্বীকার করেন যে, নারীদের বাদ দিয়ে কোনো দেশের টেকসই উন্নয়ন সম্ভব নয়। এটি \"নারী সমস্যা\"কে একটি ঘরোয়া বিষয় থেকে আন্তর্জাতিক রাজনৈতিক বিষয়ে পরিণত করে।\nগ. জাতিসংঘের নারী দশক (UN Decade for Women)\nএই সম্মেলনের সাফল্যের ওপর ভিত্তি করে জাতিসংঘ ১৯৭৬-১৯৮৫ সময়কালকে 'নারী দশক' হিসেবে ঘোষণা করে। এর ফলে পরবর্তী দশ বছর বিশ্বজুড়ে নারী উন্নয়ন নিয়ে ব্যাপক গবেষণা ও বিনিয়োগ শুরু হয়।\nঘ. সিডও (CEDAW) সনদের ভিত্তি\n১৯৭৫ সালের এই সম্মেলনের আলোচনার পথ ধরেই পরবর্তীতে ১৯৭৯ সালে ঐতিহাসিক CEDAW (নারীর প্রতি সকল প্রকার বৈষম্য বিলোপ সনদ) গৃহীত হয়, যাকে বলা হয় 'নারীদের অধিকারের বিল অব রাইটস'।\n\nসংক্ষেপে: ১৯৭৫ সালের নারী সম্মেলন ছিল নারীদের অদৃশ্য দেয়াল ভেঙে বেরিয়ে আসার প্রথম বৈশ্বিক পদক্ষেপ। এটি প্রমাণ করেছিল যে নারীর অধিকার কোনো দয়া নয়, বরং এটি মানবাধিকারের অবিচ্ছেদ্য অংশ।\nএই সম্মেলনের ধারাবাহিকতায় পরবর্তী সম্মেলনগুলো (যেমন ১৯৯৫ সালের বেইজিং সম্মেলন) সম্পর্কে কি আপনার কোনো কৌতূহল আছে?\n\n১৯৬০-এর দশক ছিল এশিয়া ও আফ্রিকার জন্য এক চরম সংকটময় সময়। ঔপনিবেশিক শাসন থেকে সদ্য মুক্তি পাওয়া দেশগুলো যখন নিজেদের গুছিয়ে নেওয়ার চেষ্টা করছিল, ঠিক তখনই প্রকৃতি এবং রাজনীতি মিলে এক ভয়াবহ খাদ্যসংকট তৈরি করেছিল।\nএই সংকটের মূল কারণ এবং বিস্তারিত তথ্য নিচে আলোচনা করা হলো:", "id": "n3-1-23"}, {"t": "Women: সারসংক্ষেপ (১. এশিয়ার প্রেক্ষাপট: ভারত ও চীনের সংকট)", "b": "১. এশিয়ার প্রেক্ষাপট: ভারত ও চীনের সংকট\nএশিয়ায় বিশেষ করে ভারত ও চীনে এই দশকে লাখ লাখ মানুষ খাদ্যাভাবের শিকার হয়।\n* চীনের ভয়াবহ দুর্ভিক্ষ (১৯৫৯-১৯৬১): এটি ইতিহাসের অন্যতম বড় মানবসৃষ্ট দুর্ভিক্ষ হিসেবে পরিচিত। মাও সে তুং-এর 'গ্রেট লিপ ফরওয়ার্ড' (Great Leap Forward) নীতির কারণে কৃষি ব্যবস্থায় বিপর্যয় ঘটে। এর সাথে যোগ হয় টানা তিন বছরের খরা। ধারণা করা হয়, এই সময়ে প্রায় ১.৫ থেকে ৪.৫ কোটি মানুষ মারা যায়।\n* ভারতের খাদ্য সংকট (১৯৬৫-১৯৬৬): এই সময়ে ভারতে পরপর দুই বছর মৌসুমি বায়ুর অভাবে চরম খরা দেখা দেয়। বিশেষ করে বিহার এবং উত্তরপ্রদেশে খাদ্য উৎপাদন মারাত্মকভাবে হ্রাস পায়। এই সংকট থেকেই ভারত সরকার কৃষিতে আমূল পরিবর্তনের সিদ্ধান্ত নেয়, যা পরবর্তীতে 'সবুজ বিপ্লব' (Green Revolution) নামে পরিচিতি পায়।", "id": "n3-1-24"}, {"t": "Women: সারসংক্ষেপ (২. আফ্রিকার প্রেক্ষাপট: যুদ্ধ ও রাজনৈতিক)", "b": "২. আফ্রিকার প্রেক্ষাপট: যুদ্ধ ও রাজনৈতিক অস্থিরতা\nআফ্রিকায় দুর্ভিক্ষের প্রধান কারণ ছিল গৃহযুদ্ধ এবং সদ্য স্বাধীন হওয়া দেশগুলোর ভঙ্গুর অর্থনীতি।\n* বিয়াফ্রা দুর্ভিক্ষ (নাইজেরিয়া, ১৯৬৭-১৯৭০): নাইজেরিয়ার গৃহযুদ্ধের সময় বিয়াফ্রা অঞ্চলটি অবরুদ্ধ হয়ে পড়ে। সেখানে খাদ্য ও ওষুধের সরবরাহ বন্ধ হয়ে যাওয়ায় প্রায় ২০ লাখ মানুষ অনাহারে মারা যায়। এটি ছিল ইতিহাসের অন্যতম আলোচিত এবং হৃদয়বিদারক দুর্ভিক্ষ।\n* সাহেল অঞ্চলের খরা: ১৯৬০-এর দশকের শেষের দিকে সাহেল অঞ্চলে (সাহারা মরুভূমির দক্ষিণ অংশ) দীর্ঘমেয়াদী খরা শুরু হয়, যা সত্তর দশকের শুরু পর্যন্ত স্থায়ী ছিল। এর ফলে ইথিওপিয়া, চাদ এবং মালির মতো দেশগুলোতে গবাদি পশু মারা যায় এবং ব্যাপক খাদ্য সংকট দেখা দেয়।", "id": "n3-1-25"}, {"t": "Women: সারসংক্ষেপ (৩. খাদ্য সংকটের মূল কারণসমূহ)", "b": "৩. খাদ্য সংকটের মূল কারণসমূহ\nএই সংকটগুলো কেবল প্রাকৃতিক ছিল না, বরং এর পেছনে গভীর কিছু কারণ ছিল:\n* জনসংখ্যা বিস্ফোরণ: এশিয়া ও আফ্রিকায় এই সময়ে জনসংখ্যা যে হারে বাড়ছিল, খাদ্য উৎপাদন সেভাবে বাড়েনি।\n* প্রযুক্তিগত অনগ্রসরতা: অধিকাংশ দেশের কৃষকরা তখনও পুরনো পদ্ধতির ওপর নির্ভরশীল ছিলেন। উচ্চফলনশীল বীজ বা সারের অভাব ছিল প্রকট।\n* ঠান্ডা যুদ্ধ (Cold War): বিশ্ব রাজনীতির মেরুকরণের ফলে অনেক উন্নয়নশীল দেশ পর্যাপ্ত আন্তর্জাতিক সাহায্য পাওয়া থেকে বঞ্চিত হয়েছিল।\n* প্রাকৃতিক বিপর্যয়: এল নিনো (El Niño)-র প্রভাবে দক্ষিণ গোলার্ধে অস্বাভাবিক আবহাওয়ার কারণে বারবার খরা ও বন্যা দেখা দেয়।", "id": "n3-1-26"}, {"t": "Women: সারসংক্ষেপ (৪. সংকট পরবর্তী সমাধান: সবুজ বিপ্লব)", "b": "৪. সংকট পরবর্তী সমাধান: সবুজ বিপ্লব\nএই ভয়াবহ খাদ্য সংকট বিশ্বনেতাদের টনক নাড়িয়ে দেয়। ফলে ১৯৬০-এর দশকের মাঝামাঝি সময়ে কৃষি প্রযুক্তিতে বিপ্লব ঘটে:\n* উচ্চফলনশীল বীজ (HYV): ড. নরম্যান বোরল্যাগ মেক্সিকোতে গমের এমন এক বীজ উদ্ভাবন করেন যা ফলন বহুগুণ বাড়িয়ে দেয়।\n* সেচ ও সার: আধুনিক সেচ ব্যবস্থা এবং রাসায়নিক সারের ব্যবহার বাধ্যতামূলক করা হয়।\n* ফলাফল: এই উদ্যোগের ফলে ভারত, পাকিস্তান ও ফিলিপাইনের const BN='০১২৩৪৫৬৭৮৯',bn=n=>String(n).replace(/\d/g,d=>BN[d]);
const KEY='revision-khata-v1',GAP=[0,1,3,7,14,30,60];
let S={cards:{},newPerDay:10,log:{},intro:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}

const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const all=D.flatMap(t=>t.chunks.map(c=>({...c,topic:t.title})));
let ln=0;const gh=t=>t.n!=ln?(ln=t.n,`<p class="grp">নোট ${bn(t.n)}</p>`):'';
const byId=Object.fromEntries(all.map(c=>[c.id,c]));
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const lv=id=>S.cards[id]?S.cards[id].box+1:0;
const gapTxt=g=>g==0?'আজই':g<30?bn(g)+' দিন':bn(Math.round(g/30))+' মাস';
function fmt(b){return b.split('\n').map(l=>{l=l.trim();if(!l)return'';const m=l.match(/^[*•-]\s+(.*)/);let h=esc(m?m[1]:l);
 if(m)h=h.replace(/^([^:：]{2,45})[:：]/,'<b>$1:</b>');return `<p${m?' class="li"':''}>${h}</p>`}).join('')}
function step(cd,r){let b=cd?cd.box:0;if(r==0)b=0;else if(r==2)b=Math.min(6,b+1);else if(r==3)b=Math.min(6,b+2);return{b,g:r==0?0:Math.max(1,GAP[b])}}
function queue(){const t=today();
 const due=Object.keys(S.cards).filter(id=>byId[id]&&S.cards[id].due<=t).sort((a,b)=>S.cards[a].due-S.cards[b].due);
 const left=Math.max(0,S.newPerDay-(S.intro[t]||0));
 return due.concat(all.filter(c=>!S.cards[c.id]).slice(0,left).map(c=>c.id))}
const dueCount=()=>queue().length;

 const id=Q[qi],c=byId[id],cd=S.cards[id];
 let h=`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><p class="mu">${bn(qi+1)} / ${bn(Q.length)}${cd?'':'<span class="tag">নতুন</span>'}</p>
 <article class="card"><p class="mu">${esc(c.topic)}</p><h2>${esc(c.t=='মূল নোট'?c.topic:c.t)}</h2>`;
 if(!show)return h+`<p class="mu">যা যা মনে আছে নিজে বলো বা লেখো, তারপর মিলিয়ে নাও।</p><button class="b pri" data-a="show">উত্তর দেখাও</button></article>`;
 h+=`<div class="body serif">${fmt(c.b)}</div></article><p class="mu">কতটা মনে ছিল?</p><div class="rate">`;
 ['আবার','কঠিন','ঠিক আছে','সহজ'].forEach((n,r)=>h+=`<button class="b" data-a="rate" data-r="${r}">${n}<small>${gapTxt(step(cd,r).g)}</small></button>`);
 return h+'</div>'}

function listHtml(){const q=filt.trim().toLowerCase();ln=0;
 return D.map(t=>{const cs=t.chunks.filter(c=>!q||(c.t+c.b).toLowerCase().includes(q));if(!cs.length)return'';
  return gh(t)+`<details data-t="${t.id}" ${q||O.has(String(t.id))?'open':''}><summary>${esc(t.title)} <span class="mu">${bn(cs.length)}</span></summary>${cs.map(c=>`<button class="row${wide()&&c.id==rid?' act':''}" data-a="open" data-id="${c.id}"><i class="dot l${lv(c.id)}"></i>${esc(c.t)}</button>`).join('')}</details>`}).join('')||'<p class="mu">কিছু পাওয়া যায়নি।</p>'}
const vLib=()=>`<div class="split"><div class="left" id="left"><input id="q" type="search" placeholder="নোটের ভেতরে খোঁজো" value="${esc(filt)}"><div id="list">${listHtml()}</div></div>${wide()?`<div class="pane" id="pane">${paneHtml()}</div>`:''}</div>`;

function vRead(back=true){const c=byId[rid],cd=S.cards[rid],i=all.indexOf(c);
 return `${back?'<button class="b" data-a="back">ফিরে যাও</button>':''}<p class="mu" style="margin-top:14px">${esc(c.topic)}</p><h2>${esc(c.t)}</h2>
 <div class="body serif">${fmt(c.b)}</div><p class="mu">এই অংশ পড়া হয়েছে ${bn(cd?cd.reads||0:0)} বার${msg?`। ${msg}`:''}</p>
 <button class="b pri" data-a="readdone">পড়া হলো, রিভিশনে রাখো</button><div class="nav2">${i>0?'<button class="b" data-a="prev">আগের অংশ</button>':''}${all[i+1]?'<button class="b" data-a="next">পরের অংশ</button>':''}</div>`}
const wide=()=>matchMedia('(min-width:760px)').matches;
const tOf=Object.fromEntries(D.flatMap(t=>t.chunks.map(c=>[c.id,String(t.id)])));
const paneHtml=()=>rid?vRead(false):'<p class="mu">বাঁ দিক থেকে একটা অংশ বেছে নাও।</p>';
function refreshList(){const L=document.getElementById('left'),st=L?L.scrollTop:0;document.getElementById('list').innerHTML=listHtml();if(L)L.scrollTop=st}
function pick(id){rid=id;msg='';O.add(tOf[id]);const p=document.getElementById('pane');
 if(V=='lib'&&wide()&&p){refreshList();p.innerHTML=paneHtml();const r=document.querySelector('.row.act');if(r)r.scrollIntoView({block:'nearest'});if(p.getBoundingClientRect().top<110)p.scrollIntoView()}
 else{V=wide()?'lib':'read';render()}}

function vProg(){const t=today(),ids=Object.keys(S.cards).filter(i=>byId[i]);
 const cnt=f=>ids.filter(i=>f(S.cards[i].box)).length;
 let streak=0;for(let d=t;S.log[d];d--)streak++;if(!S.log[t]&&streak==0)for(let d=t-1;S.log[d];d--)streak++;
 const days=[...Array(14)].map((_,k)=>S.log[t-13+k]||0),mx=Math.max(1,...days);
 let h=`<div class="stats"><div><strong>${bn(all.length-ids.length)}</strong>নতুন</div><div><strong>${bn(cnt(b=>b<=2))}</strong>শিখছি</div><div><strong>${bn(cnt(b=>b==3||b==4))}</strong>শক্ত</div><div><strong>${bn(cnt(b=>b>=5))}</strong>আয়ত্ত</div></div>
 <h3>টানা ${bn(streak)} দিন পড়েছ। শেষ ১৪ দিন:</h3><div class="days">${days.map(n=>`<i style="height:${n/mx*100}%" title="${bn(n)}"></i>`).join('')}</div>
 <h3>নোটের মানচিত্র</h3><div class="legend">নতুন<i class="dot"></i><i class="dot l2"></i><i class="dot l4"></i><i class="dot l7"></i>আয়ত্ত</div>`;
 ln=0;D.forEach(tp=>{h+=gh(tp);const m=tp.chunks.filter(c=>S.cards[c.id]&&S.cards[c.id].box>=5).length;
  h+=`<p style="margin:14px 0 0"><b>${esc(tp.title)}</b> <span class="mu">${bn(m)}/${bn(tp.chunks.length)}</span></p><div class="tiles">${tp.chunks.map(c=>`<button class="tl l${lv(c.id)}" data-a="open" data-id="${c.id}" title="${esc(c.t)}" aria-label="${esc(c.t)}"></button>`).join('')}</div>`});
 h+=`<h3>প্রতিদিন নতুন অংশ</h3><div class="sel">${[5,10,15,20,30].map(n=>`<button class="b${S.newPerDay==n?' on':''}" data-a="setn" data-n="${n}">${bn(n)}টি</button>`).join('')}</div>
 <h3>অগ্রগতি মুছতে চাও?</h3><button class="b" data-a="reset">${rst?'নিশ্চিত করতে আবার চাপো':'সব অগ্রগতি মুছে ফেলো'}</button>`;
 return h}

function render(top=true){
 if(V=='read'&&wide())V='lib';if(V=='lib'&&wide()&&!rid)rid=all[0].id;app.className=V=='lib'?'lib':'';
 document.getElementById('n-today').innerHTML='আজকের রিভিশন'+(dueCount()?`<b>${bn(dueCount())}</b>`:'');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(V=='read'?'lib':V)));
 app.innerHTML=V=='today'?vToday():V=='lib'?vLib():V=='read'?vRead():vProg();
 if(V=='lib'&&wide()){const r=document.querySelector('.row.act');if(r)r.scrollIntoView({block:'nearest'})}
 if(top)window.scrollTo(0,0)}
function rate(r){const id=Q[qi],cd=S.cards[id],t=today(),s=step(cd,r);
 if(!cd)S.intro[t]=(S.intro[t]||0)+1;
 const o=S.cards[id]=Object.assign(cd||{reads:0},{box:s.b,due:t+s.g});o.reads=(o.reads||0)+1;
 S.log[t]=(S.log[t]||0)+1;save();if(r==0)Q.push(id);qi++;show=false;render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a],[data-v]');if(!el)return;const d=el.dataset;
 if(d.v){V=d.v;msg='';rst=false;if(V=='today')Q=null;return render()}
 if(d.a=='show'){show=true;render(false)}
 else if(d.a=='rate')rate(+d.r);
 else if(d.a=='more'){Q=Q.concat(all.filter(c=>!S.cards[c.id]).slice(0,5).map(c=>c.id));render()}
 else if(d.a=='open'){prev=V=='prog'?'prog':'lib';pick(d.id)}
 else if(d.a=='back'){V=prev;render()}
 else if(d.a=='next')pick(all[all.indexOf(byId[rid])+1].id);
 else if(d.a=='prev')pick(all[all.indexOf(byId[rid])-1].id);
 else if(d.a=='readdone'){const c=S.cards[rid];if(c)c.reads=(c.reads||0)+1;else S.cards[rid]={box:1,due:today()+1,reads:1};
  save();msg='রিভিশন তালিকায় আছে';if(V=='lib'&&wide()){refreshList();document.getElementById('pane').innerHTML=paneHtml()}else render(false)}
 else if(d.a=='fs'){S.fs=((S.fs||0)+1)%3;save();applyLook()}
 else if(d.a=='th'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme||'auto'];save();applyLook()}
 else if(d.a=='setn'){S.newPerDay=+d.n;save();render(false)}
 else if(d.a=='reset'){if(rst){S={cards:{},newPerDay:S.newPerDay,log:{},intro:{},theme:S.theme,fs:S.fs};save();rst=false}else rst=true;render(false)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){filt=e.target.value;document.getElementById('list').innerHTML=listHtml()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.t!=null)d.open?O.add(d.dataset.t):O.delete(d.dataset.t)},true);
document.addEventListener('keydown',e=>{
 if(rid&&(V=='read'||(V=='lib'&&wide()))&&e.target.tagName!='INPUT'){const i=all.indexOf(byId[rid]);
  if(e.key=='ArrowRight'&&all[i+1])pick(all[i+1].id);else if(e.key=='ArrowLeft'&&i>0)pick(all[i-1].id);return}
if(V!='today'||!Q||qi>=Q.length||e.target.id=='q')return;
 if(!show&&(e.key==' '||e.key=='Enter')){e.preventDefault();show=true;render(false)}
 else if(show&&'1234'.includes(e.key)&&e.key){rate(+e.key-1)}});
function applyLook(){const r=document.documentElement,m=S.theme||'auto';r.style.setProperty('--fs',['1rem','1.14rem','1.3rem'][S.fs||0]);
 if(m=='auto')r.removeAttribute('data-theme');else r.dataset.theme=m;document.getElementById('th').textContent={auto:'স্বয়ংক্রিয়',light:'হালকা',dark:'গাঢ়'}[m]}
applyLook();render();
</script></body></html>
