<!doctype html><html lang="bn"><head><meta charset="utf-8">

<title>রিভিশন খাতা</title>

<style>
:root{--bg:#EEF2F1;--sf:#fff;--ink:#17262B;--mu:#5B6B70;--ln:#D5DEDC;--ac:#0E6B66;--ai:#fff;--wn:#B4690E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A1C;--sf:#172427;--ink:#E4EEEC;--mu:#93A5A6;--ln:#263538;--ac:#4FC3B8;--ai:#08201e;--wn:#E0A44E}}
:root[data-theme="dark"]{--bg:#101A1C;--sf:#172427;--ink:#E4EEEC;--mu:#93A5A6;--ln:#263538;--ac:#4FC3B8;--ai:#08201e;--wn:#E0A44E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hind Siliguri","Noto Sans Bengali",Kalpurush,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:5}
nav{display:flex;gap:6px;max-width:720px;margin:auto;padding:8px 12px}
nav button{flex:1;padding:8px 4px;border:0;border-radius:10px;background:transparent;color:var(--mu);font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--sf);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ac)}
nav b{background:var(--wn);color:#fff;border-radius:9px;padding:0 7px;font-size:13px;margin-left:4px}
.top{max-width:720px;margin:auto;padding:8px 14px 0;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:600;font-size:1.1rem}
.ic{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:9px;padding:1px 10px;font:inherit;font-size:.9rem;cursor:pointer;margin-left:6px}.ic:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grp{margin:20px 0 4px;font-weight:600;color:var(--ac);font-size:.95rem}
main{max-width:720px;margin:auto;padding:16px 14px 56px}
h2{font-size:1.45rem;line-height:1.35;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:1.6em 0 .6em}
.mu{color:var(--mu);font-size:.9rem;margin:.2em 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 18px 8px;margin:10px 0}
.body{margin:12px 0;max-width:68ch;font-size:var(--fs,1rem)}.body p{margin:.45em 0}.body .li{padding-left:1.1em;text-indent:-1.1em}.body .li:before{content:"–";margin-right:.5em;color:var(--ac)}
.serif{font-family:"Noto Serif Bengali",serif;line-height:1.95}
.b{font:inherit;font-weight:500;padding:11px 16px;border-radius:11px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.b.pri{background:var(--ac);color:var(--ai);border-color:var(--ac);width:100%;margin:6px 0 14px}
.b:focus-visible,nav button:focus-visible,.row:focus-visible,.tl:focus-visible,summary:focus-visible,#q:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
.rate .b{padding:9px 2px;text-align:center;line-height:1.3}.rate small{display:block;color:var(--mu);font-weight:400}
.bar{height:5px;background:var(--ln);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn);border-radius:6px;padding:0 7px;font-size:.8rem;margin-left:6px}
#q{width:100%;font:inherit;padding:10px 12px;border-radius:11px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);margin-bottom:10px}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin:8px 0;padding:0 6px}
summary{padding:11px 8px;cursor:pointer;font-weight:500}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:0;border-top:1px solid var(--ln);padding:9px 8px;color:var(--ink);cursor:pointer}
.dot{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--ln);flex:none}
.tl{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ln);background:transparent;padding:0;cursor:pointer}
.l1,.l2,.l3,.l4,.l5,.l6,.l7{border-color:transparent!important}
.l1{background:color-mix(in srgb,var(--ac) 16%,transparent)}.l2{background:color-mix(in srgb,var(--ac) 30%,transparent)}.l3{background:color-mix(in srgb,var(--ac) 44%,transparent)}.l4{background:color-mix(in srgb,var(--ac) 58%,transparent)}.l5{background:color-mix(in srgb,var(--ac) 72%,transparent)}.l6{background:color-mix(in srgb,var(--ac) 86%,transparent)}.l7{background:var(--ac)}
.tiles{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center}.stats strong{display:block;font-size:1.5rem}
.days{display:flex;align-items:flex-end;gap:4px;height:60px}.days i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:3px}
.legend{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mu)}
.sel{display:flex;gap:8px;flex-wrap:wrap}.sel .b.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
main.lib{max-width:1100px}
.row.act{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px}
.nav2{display:flex;gap:8px;margin-bottom:8px}.nav2 .b{flex:1}
.pane{scroll-margin-top:108px}
@media(min-width:760px){.split{display:grid;grid-template-columns:minmax(250px,34%) 1fr;gap:18px;align-items:start}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);max-height:calc(100vh - 122px);overflow:auto;padding-right:4px}
.left #q{position:sticky;top:0;z-index:2}
.pane{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:6px 22px 14px;min-height:60vh}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

<script>

ি নেতিবাচক বা তুচ্ছার্থক শব্দ। এমন কোনো ছোট দেশকে 'ব্যানানা রিপাবলিক' বলা হয় যার:\n* অর্থনীতি: মূলত একটি মাত্র পণ্য রপ্তানির ওপর নির্ভরশীল (যেমন—কলা)।\n* রাজনীতি: চরম অস্থিতিশীল, দুর্নীতিগ্রস্ত এবং সেখানে প্রায়ই সামরিক অভ্যুত্থান ঘটে।\n* বৈদেশিক প্রভাব: দেশের অভ্যন্তরীণ রাজনীতি ও অর্থনীতি মূলত কোনো বিদেশি বড় কোম্পানি বা শক্তিশালী রাষ্ট্র দ্বারা নিয়ন্ত্রিত হয়।\n\nশব্দটির ইতিহাস\n* উদ্ভাবক: মার্কিন লেখক ও. হেনরি (O. Henry) ১৯০৪ সালে তাঁর 'Cabbages and Kings' বইতে প্রথম এই শব্দটি ব্যবহার করেন।\n* প্রেক্ষাপট: ২০তম শতাব্দীর শুরুতে মধ্য আমেরিকার দেশগুলোতে (যেমন—হন্ডুরাস, গুয়াতেমালা) আমেরিকার বড় বড় ফল উৎপাদনকারী কোম্পানি (যেমন—United Fruit Company) ব্যাপক প্রভাব বিস্তার করেছিল। তারা সেখানকার সরকারকে নিজেদের স্বার্থে পুতুলের মতো নাচাত। মূলত সেই পরিস্থিতি বোঝাতেই এই নামের উৎপত্তি।\n\nআপনার ছবিতে 'তিউনিসিয়া' প্রসঙ্গ\nআপনার ছবিতে 'ব্যানানা রিপাবলিক'-এর পাশে তিউনিসিয়া লেখা দেখা যাচ্ছে। এটি সম্ভবত বর্তমান ভূ-রাজনৈতিক প্রেক্ষাপটে বা নির্দিষ্ট কোনো লেখকের বিশ্লেষণে উদাহরণ হিসেবে আনা হয়েছে।\n* ঐতিহাসিক গুরুত্ব: তিউনিসিয়া থেকেই ২০১০ সালে 'আরব বসন্ত' (Arab Spring)-এর সূচনা হয়েছিল।\n* বর্তমান অবস্থা: সাম্প্রতিক বছরগুলোতে তিউনিসিয়ায় রাজনৈতিক অস্থিরতা এবং ক্ষমতার কেন্দ্রীকরণের ফলে অনেক বিশ্লেষক একে ভঙ্গুর গণতন্ত্র বা সংকটাপন্ন রাষ্ট্র হিসেবে উল্লেখ করছেন। তবে তিউনিসিয়া ঐতিহাসিকভাবে মূল 'ব্যানানা রিপাবলিক' (মধ্য আমেরিকার দেশগুলো) নয়।\n\nপরীক্ষার জন্য গুরুত্বপূর্ণ তথ্য:\n* ব্যানানা রিপাবলিকের প্রধান বৈশিষ্ট্য: একপণ্য নির্ভর অর্থনীতি ও রাজনৈতিক অস্থিতিশীলতা।\n* উৎপত্তি: ১৯০৪ সালে, ও. হেনরি-র মাধ্যমে।\n* মূল অঞ্চল: ল্যাটিন আমেরিকা ও মধ্য আমেরিকার দেশসমূহ।\nআপনার শেয়ার করা অন্য ছবিগুলোতে পিকাসো, ভ্যান গগ বা ত্রিশ বর্ষব্যাপী যুদ্ধের মতো গম্ভীর বিষয় ছিল, আর এটি হলো আধুনিক রাজনৈতিক বিজ্ঞানের একটি টার্ম। আন্তর্জাতিক রাজনীতির অন্য কোনো \"টার্মিনোলজি\" (যেমন: Sovereign state বা Buffer state) সম্পর্কে কি আপনার কোনো প্রশ্ন আছে?\n\n1.2.2 Ideologies \n        Use root analysis\nFeudalism\nSocialism\nAnarchism\nNazism\nRealism\nSalafism\nWahabism\n\nএই রাজনৈতিক এবং মতাদর্শিক শব্দগুলোর মূল (Root) এবং অর্থ নিচে ব্যাখ্যা করা হলো:", "id": "11-0"}, {"t": "১. Feudalism (সামন্তবাদ)", "b": "* Root: মধ্যযুগীয় ল্যাটিন শব্দ feodum থেকে এসেছে, যার অর্থ 'জমি' বা 'জায়গির'।\n* ব্যাখ্যা: এটি এমন একটি সামাজিক ও অর্থনৈতিক ব্যবস্থা যেখানে রাজা বা উচ্চপদস্থ ব্যক্তিরা যোদ্ধাদের বা সামন্তদের জমি প্রদান করতেন। বিনিময়ে তারা রাজাকে সামরিক সহায়তা ও আনুগত্য প্রদান করত। সাধারণ কৃষকরা এই জমিতে কাজ করত এবং উৎপাদিত ফসলের বড় অংশ সামন্তদের দিতে বাধ্য থাকত।", "id": "11-1"}, {"t": "২. Socialism (সমাজতন্ত্র)", "b": "* Root: ল্যাটিন শব্দ socius থেকে এসেছে, যার অর্থ 'সাথী' বা 'অংশীদার'।\n* ব্যাখ্যা: এটি এমন একটি আদর্শ যেখানে সম্পদ এবং উৎপাদনের উপায়গুলো (যেমন কলকারখানা, জমি) সমাজের বা রাষ্ট্রের নিয়ন্ত্রণে থাকে। এর মূল উদ্দেশ্য হলো সম্পদে সবার সমান অধিকার নিশ্চিত করা এবং ধনী-দরিদ্রের বৈষম্য কমিয়ে একটি সুষম সমাজ গঠন করা।", "id": "11-2"}, {"t": "৩. Anarchism (অরাজকতাবাদ/নৈরাজ্যবাদ)", "b": "* Root: গ্রিক শব্দ anarkhos থেকে এসেছে। An (ছাড়া) + arkhos (শাসক)। অর্থাৎ 'শাসকহীন অবস্থা'।\n* ব্যাখ্যা: এই মতবাদ বিশ্বাস করে যে রাষ্ট্র, সরকার বা যেকোনো বাধ্যতামূলক কর্তৃত্ব মানুষের স্বাধীনতার অন্তরায়। অরাজকতাবাদীরা মনে করেন মানুষ কোনো শাসন ছাড়াই স্বেচ্ছামূলক সহযোগিতার মাধ্যমে শান্তিতে বসবাস করতে সক্ষম।", "id": "11-3"}, {"t": "৪. Nazism (নাৎসিবাদ)", "b": "* Root: জার্মান শব্দ Nationalsozialismus (National Socialism) এর সংক্ষিপ্ত রূপ।\n* ব্যাখ্যা: এটি বিংশ শতাব্দীতে অ্যাডলফ হিটলারের নেতৃত্বে জার্মানিতে প্রচলিত একটি উগ্র জাতীয়তাবাদী রাজনৈতিক আদর্শ। এটি আর্য জাতির শ্রেষ্ঠত্ব, একনায়কতন্ত্র এবং ইহুদিবিদ্বেষের ওপর ভিত্তি করে গড়ে উঠেছিল।", "id": "11-4"}, {"t": "৫. Realism (বাস্তববাদ)", "b": "* Root: ল্যাটিন শব্দ realis থেকে এসেছে, যার অর্থ 'প্রকৃত' বা 'বাস্তব'।\n* ব্যাখ্যা: রাজনীতি বা শিল্পের ক্ষেত্রে এটি এমন এক দৃষ্টিভঙ্গি যা কল্পনা বা আদর্শের চেয়ে কঠোর বাস্তবতাকে বেশি গুরুত্ব দেয়। আন্তর্জাতিক রাজনীতিতে রিয়ালিজম মানে হলো নৈতিকতার চেয়ে দেশের নিরাপত্তা এবং ক্ষমতার লড়াইকে প্রাধান্য দেওয়া।", "id": "11-5"}, {"t": "৬. Salafism (সালাফিবাদ)", "b": "* Root: আরবি শব্দ Salaf (সালাফ) থেকে এসেছে, যার অর্থ 'পূর্বসূরি' বা 'পূর্বপুরুষ'। nal for the Law of the Sea)-এ। এটি জার্মানির হামবুর্গে অবস্থিত।\n* কেন এখানে গেল: বাংলাদেশ এবং মিয়ানমার উভয় দেশই রাজি হয়েছিল যে তারা একটি স্থায়ী এবং বিশেষজ্ঞ আদালতের মাধ্যমে এর দ্রুত সমাধান চায়। ITLOS মূলত সমুদ্র সংক্রান্ত আইনের জন্য একটি ডেডিকেটেড বা বিশেষায়িত আদালত। এটি তুলনামূলক দ্রুত রায় দেয়।", "id": "11-8"}, {"t": "২. বাংলাদেশ বনাম ভারত (PCA)", "b": "ভারতের সাথে মামলাটি নিষ্পত্তি হয়েছে PCA (Permanent Court of Arbitration)-এ। এটি নেদারল্যান্ডসের হেগে অবস্থিত।\n* কেন ভিন্ন প্রতিষ্ঠানে: ভারত ITLOS-এ যেতে রাজি ছিল না। আন্তর্জাতিক আইন অনুযায়ী, কোনো দেশ যদি বিশেষ কোনো ট্রাইব্যুনালে (যেমন ITLOS) যেতে রাজি না হয়, তখন মামলাটি স্বয়ংক্রিয়ভাবে একটি 'অ্যাড-হক আর্বিট্রাল ট্রাইব্যুনাল'-এ চলে যায়। ভারতের ক্ষেত্রেও তাই হয়েছিল। PCA এই ধরণের আর্বিট্রেশন বা সালিশি পরিচালনার জন্য লজিস্টিক সহায়তা প্রদান করে।", "id": "11-9"}, {"t": "৩. কেন ১৪টি মামলা একই প্রতিষ্ঠানে যায়নি?", "b": "আসলে \"১৪টি মামলা\" বলতে আপনি সম্ভবত আন্তর্জাতিক সমুদ্রসীমা বিরোধের বিভিন্ন টেকনিক্যাল পয়েন্ট বা অন্য কোনো সংখ্যা বোঝাচ্ছেন (সাধারণত বড় ধরণের সীমানা বিরোধ ১টি বড় মামলা হিসেবেই গণ্য হয়)। তবে এগুলো কেন একই জায়গায় যায়নি তার প্রধান কারণগুলো হলো:\n* দেশগুলোর পছন্দ (Choice of Forum): UNCLOS-এর ২৮৭ অনুচ্ছেদ অনুযায়ী, একটি দেশ চাইলে ITLOS, ICJ (International Court of Justice) অথবা কোনো আর্বিট্রাল ট্রাইব্যুনাল বেছে নিতে পারে। বাংলাদেশ ও মিয়ানমার ITLOS বেছে নিলেও ভারত আর্বিট্রেশন বেছে নিয়েছিল।\n* সার্বভৌমত্ব ও আইনি কৌশল: প্রতিটি দেশ তাদের নিজস্ব আইনি কৌশল অনুযায়ী আদালত বেছে নেয় যেখানে তারা মনে করে তাদের যুক্তিগুলো ভালোভাবে গৃহিত হবে।\n* ভিন্ন ভিন্ন সময় ও চুক্তি: মিয়ানমারের সাথে বিরোধের প্রকৃতি এবং ভারতের সাথে বিরোধের প্রকৃতি ভিন্ন ছিল। মিয়ানমারের ক্ষেত্রে 'ইকুইডিস্ট্যান্স' বনাম 'ইকুইটি'র লড়াই ছিল যা ITLOS-এ দ্রুত সমাধান সম্ভব ছিল। কিন্তু ভারতের সাথে ভূখণ্ডগত দাবি এবং 'কুতুবদিয়া' দ্বীপের অবস্থানসহ অনেক জটিল বিষয় ছিল যা দীর্ঘস্থায়ী আর্বিট্রেশনের দাবি রাখে।\nসারসংক্ষেপ\nবাংলাদেশ মূলত ভারতের সাথে আলোচনার মাধ্যমে সমাধান না পেয়ে বাধ্য হয়ে ২০০৯ সালে আর্বিট্রেশনে যায়। অন্যদিকে, মিয়ানমারের সাথে বিরোধ নিষ্পত্তিতে বাংলাদে ikistan): \"পারস্য ঐতিহ্যের ভূমি\"", "b": "* ব্যুৎপত্তি: 'তাজিক' শব্দের অর্থ নিয়ে ঐতিহাসিকদের মধ্যে মতভেদ আছে। তবে মধ্যযুগে তুর্কিরা অ-তুর্কি বা যারা ফারসি ভাষায় কথা বলত, তাদের 'তাজিক' বলে ডাকত।\n* প্রেক্ষাপট: মধ্য এশিয়ার অন্য চারটি দেশ যেখানে 'তুর্কি' বংশোদ্ভূত, তাজিকিস্তান সেখানে ব্যতিক্রম। তারা মূলত আর্য বা পারস্য বংশোদ্ভূত। তাদের ভাষাও ফারসি ঘরানার। তাই তাজিকিস্তান হলো সেই অঞ্চল যেখানে তাজিক বা ফারসিভাষী জনগোষ্ঠী তাদের স্বকীয়তা বজায় রেখেছে।", "id": "11-13"}, {"t": "৪. তুর্কমেনিস্তান (Turkmenistan): \"বিশুদ্ধ তুর্কিদের দেশ\"", "b": "* ব্যুৎপত্তি: 'তুর্কমেন' শব্দটি 'তুর্কি' এবং ফারসি প্রত্যয় 'Man' (সদৃশ বা মত) থেকে এসেছে। অনেকের মতে এর অর্থ \"আমি তুর্কি\" (Turk-man)।\n* প্রেক্ষাপট: ১০ম শতাব্দীর দিকে যারা নিজেদের খাঁটি তুর্কি পরিচয় ধরে রেখেছিল এবং ইসলাম ধর্ম গ্রহণ করেছিল, তাদের তুর্কমেন বলা হতো। এই দেশটি তাদের ঘোড়া (আখাল-তেকে) এবং কার্পেট শিল্পের জন্য বিশ্বজুড়ে বিখ্যাত, যা তাদের যাযাবর তুর্কি ঐতিহ্যের অংশ।", "id": "11-14"}, {"t": "৫. উজবেকিস্তান (Uzbekistan): \"প্রভুদের নিজস্ব ভূমি\"", "b": "* ব্যুৎপত্তি: এটি তিনটি অংশ নিয়ে গঠিত—'Uz' (নিজ), 'Bek' (প্রভু বা নেতা) এবং 'Stan' (ভূমি)।\n* প্রেক্ষাপট: ১৪শ শতাব্দীতে গোল্ডেন হোর্ড-এর শাসক উজবেগ খান-এর নাম থেকে এই জাতির নাম এসেছে বলে ধারণা করা হয়। এর আক্ষরিক অর্থ দাঁড়ায় \"যারা নিজেরাই নিজেদের নেতা বা মালিক\"। মধ্য এশিয়ার প্রধান ঐতিহাসিক শহর যেমন—সমরকন্দ, বুখারা এবং তাসখন্দ এই দেশেই অবস্থিত, যা একসময় জ্ঞান-বিজ্ঞানের কেন্দ্র ছিল।\n\nভৌগোলিক ও রাজনৈতিক গুরুত্ব\nএই দেশগুলোকে একত্রে \"Central Asian Five\" বলা হয়। এদের নামকরণে মিল থাকার প্রধান কারণ হলো:\n1. ভৌগোলিক অবস্থান: এরা সবাই স্থলবেষ্টিত (Landlocked) এবং রেশম পথের ওপর অবস্থিত।\n2. সাংস্কৃতিক সেতুবন্ধন: এদের নামের '-স্তান' অংশটি প্রমাণ করে যে এই অঞ্চলে একসময় ফারসি ভাষা ও সংস্কৃতির ব্যাপক প্রভাব ছিল, যা আধুনিক যুগেও নামের মাধ্যমে টিকে আছে।\nএই পাঁচটি দেশের মধ্যে কোনো নির্দিষ্ট দেশের সংস্কৃতি বা ঐতিহ্য নিয়ে কি আপনার আলাদা আগ্রহ আছে?\nকম্বোডিয়া, লাওস এবং ভিয়েতনাম\n\nদক্ষিণ-পূর্ব এশিয়ার এই তিনটি দেশ—কম্বোডিয়া, লাওস এবং ভিয়েতনাম—প্রত্যেকটির নামকরণের পেছনে রয়েছে সুদীর্ঘ ইতিহ এটি একটি ধর্মীয় প্রেক্ষাপট থেকে আসা নাম।\n* অর্থ: স্প্যানিশ ভাষায় এর পূর্ণ নাম ছিল \"Provincia De Nuestro Señor Jesus Cristo, El Salvador Del Mundo\" যার অর্থ \"বিশ্বের ত্রাণকর্তা প্রভু যিশু খ্রিস্টের প্রদেশ\"। সংক্ষেপে একে বলা হয় 'এল সালভাদর' বা \"ত্রাণকর্তা\" (The Savior)।", "id": "11-24"}, {"t": "৭. বেলিজ (Belize)", "b": "বেলিজ নামের উৎপত্তি নিয়ে দুটি প্রবল মত রয়েছে:\n* মায়া শব্দ: মায়া শব্দ 'Belix' থেকে এসেছে যার অর্থ \"কর্দমাক্ত পানি\", যা বেলিজ নদীকে নির্দেশ করে।\n* জলদস্যুর নাম: অনেকে মনে করেন, ১৬৩৮ সালে এই অঞ্চলে আসা ব্রিটিশ জলদস্যু 'পিটার ওয়ালেস' (Peter Wallace)-এর নাম থেকে এটি এসেছে। স্প্যানিশরা 'ওয়ালেস' উচ্চারণ করতে না পেরে 'বালিস' বা 'বেলিজ' বলত।\n\nমধ্য আমেরিকার এই দেশগুলোর নামের মধ্যেই তাদের প্রাকৃতিক সম্পদ ও স্প্যানিশ ঔপনিবেশিক ইতিহাসের ছাপ স্পষ্ট। আপনার প্রস্তুতির জন্য আর কোনো অঞ্চলের তথ্য লাগবে কি?\n\nপূর্ব ইউরোপ এবং ককেশাস অঞ্চলের ৭টি দেশের নাম \nআপনার শেয়ার করা তালিকায় পূর্ব ইউরোপ এবং ককেশাস অঞ্চলের ৭টি দেশের নাম রয়েছে। এই দেশগুলো এক সময় সোভিয়েত ইউনিয়নের অংশ ছিল। নিচে এই দেশগুলোর নামকরণের সংক্ষিপ্ত ইতিহাস দেওয়া হলো:", "id": "11-25"}, {"t": "১. মলদোভা (Moldova)", "b": "এই দেশটির নাম মূলত 'মলদোভা নদী' থেকে এসেছে।\n* কিংবদন্তি: একটি প্রচলিত লোককথা অনুযায়ী, হাঙ্গেরীয় রাজপুত্র ড্রাগোশ তাঁর প্রিয় কুকুর 'মলদা'র (Molda) নামে এই নদীর নামকরণ করেছিলেন। শিকার করতে গিয়ে তাঁর কুকুরটি এই নদীতে ডুবে মারা গিয়েছিল। নদী থেকেই পরবর্তীতে অঞ্চলের নাম হয় মলদোভা।", "id": "11-26"}, {"t": "২. জর্জিয়া (Georgia)", "b": "এই দেশের নামের পেছনে ধর্মীয় ও ঐতিহাসিক কারণ রয়েছে:\n* সেন্ট জর্জ: মনে করা হয়, মধ্যযুগে খ্রিস্টান ধর্মপ্রচারক ও ক্রুসেডাররা এই অঞ্চলের মানুষের সেন্ট জর্জ-এর প্রতি গভীর ভক্তি দেখে এর নাম দেন 'জর্জিয়া'।\n* স্থানীয় নাম: তারা নিজেদের দেশকে 'সাকার্তভেলো' (Sakartvelo) বলে ডাকে, যার অর্থ \"কার্তভেলীয়দের দেশ\" (কার্তভেলীয়রা জর্জিয়ার মূল জাতিগোষ্ঠী)।", "id": "11-27"}, {"t": "৩. আর্মেনিয়া (Armenia)", "b": "আর্মেনিয়ার নাম নিয়ে দুটি প্রধান মত রয়েছে:\n* হায়িক (Hayk): তাদের পৌরাণিক পুরুষ 'হায়িক'-এর নাম থেকে প্রাচীন নাম ছিল 'হায়াস্তান'।\n* আরাম (Aram): অন্যদিকে, ঐতিহাসিকদের মতে এই জাতির মহান নেতা 'আরাম' (যিনি হায়িকের বংশধর ছিলেন) এর নাম থেকেই বহির্বিশ্বে দেশটি 'আর্মেনিয়া' নামে পরিচিতি পায়।", "id": "11-28"}, {"t": "৪. লাটভিয়া (Latvia)", "b": "লাটভিয়া নামটি এসেছে প্রাচীন ইন্দো-ইউরোপীয় বাল্টিক উপজাতি 'লাটগ্যালিয়ান' (Latgalians) থেকে।\n* তারা এই অঞ্চলে বসতি স্থাপনকারী প্রধান চারটি বাল্টিক উপজাতির একটি ছিল। তাদের নাম থেকেই মধ্যযুগীয় লাতিন ভাষায় 'Lettonia' এবং পরবর্তীতে 'Latvia' শব্দটি আসে।", "id": "11-29"}, {"t": "৫. এস্তোনিয়া (Estonia)", "b": "এই নামের উৎস প্রাচীন রোমান ঐতিহাসিক ট্যাসিটাসের লেখা থেকে পাওয়া যায়।\n* তিনি উত্তর ইউরোপের এই অঞ্চলের মানুষকে 'এইস্টি' (Aestii) নামে অভিহিত করেছিলেন। এই 'এইস্টি' শব্দ থেকেই পরবর্তীতে 'এস্তোনিয়া' নামের উৎপত্তি হয়, যার অর্থ মূলত বাল্টিক সাগরের তীরে বসবাসকারী জনগণ।", "id": "11-30"}, {"t": "৬. আজারবাইজান (Azerbaijan)", "b": "আজারবাইজানকে বলা হয় \"আগুনের দেশ\" (Land of Fire)।\n* আত্রোপাতেস (Atropates): আলেকজান্ডারের সময়কার একজন পারস্য শাসক 'আত্রোপাতেস'-এর নাম থেকে এই অঞ্চলের নাম হয় 'আত্রোপাতেন'।\n* বিবর্তন: প্রাচীন পারসিক ভাষায় 'আজর' (Azaar) মানে আগুন এবং 'বাইজান' মানে রক্ষক। প্রাকৃতিকভাবে মাটির নিচ থেকে গ্যাস বের হয়ে আগুন জ্বলে ওঠার কারণে একে আগুনের দেশ বা আগুনের রক্ষকদের দেশ বলা হয়।", "id": "11-31"}, {"t": "৭. লিথুনিয়া (Lithuania)", "b": "লিথুনিয়া বা 'লিটুয়া' (Lietuva) নামের উৎপত্তি নিয়ে বিতর্ক থাকলেও সবচেয়ে গ্রহণযোগ্য ধারণা হলো:\n* লিটুভা নদী: দেশটির একটি ছোট নদী 'লিটুভা' (Lietuva) থেকে এই নামের উৎপত্তি। বাল্টিক ভাষায় 'lyti' শব্দের অর্থ বৃষ্টি হওয়া, তাই অনেকে মনে করেন 'বৃষ্টির দেশ' বা জলাভূমি অঞ্চল বোঝাতে এই নাম ব্যবহৃত হতো।\n\nএই দেশগুলোর নামের সাথে তাদের প্রাচীন উপজাতীয় পরিচয় এবং প্রাকৃতিক বৈশিষ্ট্যের গভীর সম্পর্ক রয়েছে। আশা করি, আপনার প্রস্তুতির জন্য এটি সহায়ক হবে।\n\nবলকান উপদ্বীপের এই দেশগুলোর নামকরণের\n\nআপনার শেয়ার করা ছবিতে বলকান অঞ্চলের ১২টি রাষ্ট্রের তালিকা দেওয়া হয়েছে। বলকান উপদ্বীপের এই দেশগুলোর নামকরণের ইতিহাস অত্যন্ত বৈচিত্র্যময়। নিচে দেশগুলোর নামকরণের সংক্ষিপ্ত ইতিহাস দেওয়া হলো:", "id": "11-32"}, {"t": "১. রুমানিয়া (Romania)", "b": "এই নামটি সরাসরি রোমান সাম্রাজ্য (Roman Empire) থেকে এসেছে। ল্যাটিন শব্দ 'Romanus' থেকে এর উৎপত্তি, যার অর্থ \"রোমের নাগরিক\"। রোমানদের দ্বারা এই অঞ্চল বিজিত হওয়ার পর এখানকার মানুষ ও ভাষার ওপর রোমান প্রভাব স্থায়ী হয়, যা থেকে দেশের নাম হয় রুমানিয়া।", "id": "11-33"}, {"t": "২. গ্রিস (Greece)", "b": "* গ্রিস: ল্যাটিন শব্দ 'Graecia' থেকে এসেছে, যা রোমানরা এই অঞ্চলের মানুষদের বোঝাতে ব্যবহার করত।\n* হেলাস: গ্রিকরা নিজেদের দেশকে 'হেলাস' (Hellas) বলে ডাকে। এটি তাদের পৌরাণিক পুরুষ 'হেলেন' (Hellen)-এর নাম থেকে এসেছে।", "id": "11-34"}, {"t": "৩. স্লোভেনিয়া (Slovenia)", "b": "এই নামের অর্থ \"স্লোভাকদের দেশ\" বা \"Slavic মানুষের দেশ\"। 'Slav' শব্দটি থেকে এর উৎপত্তি, যা দিয়ে একটি বিশাল নৃগোষ্ঠীকে বোঝানো হয়।", "id": "11-35"}, {"t": "৪. আলবেনিয়া (Albania)", "b": "এই নামটি মধ্যযুগীয় ল্যাটিন শব্দ 'Albania' থেকে এসেছে। সম্ভবত এটি ইন্দো-ইউরোপীয় মূল শব্দ 'Alb' (যার অর্থ পাহাড় বা সাদা পাহাড়) থেকে এসেছে। তবে স্থানীয়রা তাদের দেশকে 'শ্কিপারিয়া' (Shqipëria) বলে ডাকে, যার অর্থ \"ঈগলের দেশ\"।", "id": "11-36"}, {"t": "৫. বুলগেরিয়া (Bulgaria)", "b": "নামটি এসেছে 'বুলগার' (Bulgar) উপজাতি থেকে। তারা মধ্য এশিয়া থেকে এই অঞ্চলে এসে বসতি স্থাপন করেছিল। 'বুলগার' শব্দের অর্থ নিয়ে মতভেদ থাকলেও অনেকে মনে করেন এর অর্থ \"মিশ্রিত জাতি\"।", "id": "11-37"}, {"t": "৬. সার্বিয়া (Serbia)", "b": "সার্বিয়া নামটি এসেছে এই অঞ্চলের প্রধান জাতি 'সার্ব' (Serbs) থেকে। প্রাচীন স্লাভিক ভাষায় এই শব্দের উৎপত্তি নিয়ে বিভিন্ন মত থাকলেও ধারণা করা হয় এটি কোনো বিশেষ আত্মীয়তা বা গোষ্ঠীর নাম ছিল।", "id": "11-38"}, {"t": "৭. বসনিয়া-হার্জেগোভিনা (Bosnia and Herzegovina)", "b": "এটি দুটি অঞ্চলের নাম নিয়ে গঠিত:\n* বসনিয়া: দেশটির মধ্য দিয়ে প্রবাহিত 'বসনা নদী' (Bosna River) থেকে এসেছে।\n* হার্জেগোভিনা: এটি জার্মান শব্দ 'Herzog' (ডিউক বা রাজা) থেকে এসেছে। যার অর্থ \"ডিউকের শাসিত অঞ্চল\"।", "id": "11-39"}, {"t": "৮. ক্রোয়েশিয়া (Croatia)", "b": "এটি মধ্যযুগীয় ল্যাটিন শব্দ 'Croatia' থেকে এসেছে, যা স্থানীয়ভাবে 'হ্রভাটস্কা' (Hrvatska) নামে পরিচিত। এই নামের মূল অর্থ খুব একটা পরিষ্কার নয়, তবে প্রাচীন কোনো জাতিগত নাম থেকে এটি এসেছে বলে ধরা হয়।", "id": "11-40"}, {"t": "৯. মেসিডোনিয়া (Macedonia) - বর্তমানে উত্তর মেসিডোনিয়া", "b": "প্রাচীন গ্রিক শব্দ 'Makednos' থেকে এর উৎপত্তি। এর অর্থ হলো \"লম্বা মানুষ\" বা \"উঁচু ভূমির মানুষ\"। এই অঞ্চলের মানুষরা লম্বা ছিল বলে প্রাচীনকালে এমন নাম দেওয়া হয়েছিল।", "id": "11-41"}, {"t": "১০. মন্টিনিগ্রো (Montenegro)", "b": "এটি ভেনিসীয় ইতালীয় শব্দ।\n* Monte: পাহাড়\n* Negro: কালো\nঅর্থাৎ দেশটির নাম হচ্ছে \"কালো পাহাড়ের দেশ\"। স্থানীয় ভাষায় একে বলা হয় 'Crna Gora', যার অর্থও একই।", "id": "11-42"}, {"t": "১১. কসোভো (Kosovo)", "b": "সার্বিয়ান শব্দ 'Kos' থেকে এই নামের উৎপত্তি। 'Kos' শব্দের অর্থ হলো \"ব্ল্যাকবার্ড\" বা এক ধরনের কালো পাখি। এই অঞ্চলে এই পাখির আধিক্য ছিল বলে নাম দেওয়া হয়েছিল 'কসোভো পোলজে' বা \"কালো পাখির ক্ষেত্র\"।", "id": "11-43"}, {"t": "১২. তুরস্ক (Turkey)", "b": "নামটি এসেছে 'তুর্ক' (Turk) জাতি থেকে। ওল্ড তুর্কিশ ভাষায় 'Turk' শব্দের অর্থ হলো \"শক্তিশালী\" বা \"পরাক্রমশালী\"। 'Turkey' অর্থ হলো \"তুর্কদের আবাসভূমি\"।\n\nবলকান অঞ্চলের দেশগুলোর নামের মধ্যেই লুকিয়ে আছে তাদের লড়াই এবং জাতিগত বিবর্তনের গল্প। আপনার BCS বা ব্যাংক পরীক্ষার প্রস্তুতির জন্য এই তথ্যগুলো বেশ কার্যকর হতে পারে। আরও কোনো প্রশ্ন থাকলে জানাতে পারেন!", "id": "11-44"}], "n": 1}, {"id": 12, "title": "1.3. ভূ-রাজনীতি\" (Geo-Politics)", "chunks": [{"t": "মূল নোট", "b": "As it is, use map & short story , naming story , location\n\n1.3.1 Geopolitical lines \n        Use proper story & naming \n\nপ্রাচীন রোমের 'বার বিধি' \nপ্রাচীন রোমের 'বার বিধি' বা The Twelve Tables-এর ১২টি পাতে মূলত নাগরিক জীবন, সামাজিক এবং বিচারিক নিয়মগুলো বিস্তারিত লেখা ছিল। প্রতিটি টেবিলের মূল বিষয়গুলো নিচে সংক্ষেপে দেওয়া হলো:\n   1. টেবিল ১ (Table I): দেওয়ানি মামলার তলব (যাকে মামলার জন্য ডাকা হয়েছে তাকে অবশ্যই উপস্থিত হতে হতো)।\n   2. টেবিল ২ (Table II): বিচার কাজ এবং চুরির বিচার সংক্রান্ত নিয়ম।\n   3. টেবিল ৩ (Table III): ঋণ বা পাওনা পরিশোধের বিধান (ঋণ পরিশোধে ব্যর্থ হলে কী শাস্তি হবে)।\n   4. টেবিল ৪ (Table IV): পরিবারের কর্তার ক্ষমতা এবং শিশুদের অধিকার।\n   5. টেবিল ৫ (Table V): উত্তরাধিকার এবং সম্পত্তি বণ্টন।\n   6. টেবিল ৬ (Table VI): সম্পত্তি অর্জন এবং অধিকার সংক্রান্ত চলগুলোর নাম ও তাদের উপনিবেশ মনে রাখার জন্য আপনি নিচের টেকনিকগুলো ব্যবহার করতে পারেন। এখানে ছন্দের মাধ্যমে তথ্যগুলো সাজানো হয়েছে:", "id": "12-25"}, {"t": "১. পলিনেশিয়ার দেশগুলো মনে রাখার ছন্দ:", "b": "\"টঙের ওপর সামু আর টুনি কুক করেছে ইস্টার ও তাহিতি।\"\nপলি টঙের উপর সামোচা খায়, টুভা কুক করছে, তাহের ইষ্টে গেছে \n   * টঙের: টোঙ্গা\n   * সামু: সামোয়া\n   * টুনি: টুভালু\n   * কুক: কুক দ্বীপপুঞ্জ\n   * ইস্টার: ইস্টার আইল্যান্ড\n   * তাহিতি: তাহিতি", "id": "12-26"}, {"t": "২. দেশ ও তাদের উপনিবেশ মনে রাখার টেকনিক:", "b": "দেশ/অঞ্চল\n\tউপনিবেশ (কার অধীনে ছিল/আছে)\n\tমনে রাখার সহজ উপায়\n\tটোঙ্গা\n\tছিল না (স্বাধীন ছিল)\n\tটোঙ্গা অনেকটা 'তঙ্গ' (জেদ) এর মতো। তাদের জেদ ছিল তারা কারো অধীনে থাকবে না।\n\tসামোয়া\n\tনিউজিল্যান্ড\n\tসামু এবং নিউজিল্যান্ডের কিউইরা বন্ধু।\n\tটুভালু\n\tএলিস দ্বীপপুঞ্জ ও ব্রিটিশ গিলবার্ট\n\tটু-ভালু (২টি নাম)। এর উপনিবেশও দুইটি নামের সংমিশ্রণ— এলিস ও গিলবার্ট।\n\tকুক দ্বীপপুঞ্জ\n\tনিউজিল্যান্ড\n\tক্যাপ্টেন কুক নতুন জমি বা নিউজিল্যান্ড খুঁজতেন।\n\tইস্টার আইল্যান্ড\n\tচিলি\n\tইস্টার ডিম খেতে বেশ চিলি (ঝাল) লাগে।\n\tতাহিতি\n\tফ্রান্স\n\tতাহিতি নামের শেষে 'তি' আর ফ্রান্স-এর শুরুতে 'ফ'। (টিফিন বা তিতি-ফরাসি ছন্দ)।\n\nকিছু বিশেষ টিপস:\n   * নিউজিল্যান্ডের জোড়া: মনে রাখুন সামোয়া এবং কুক দ্বীপপুঞ্জ—উভয়ই নিউজিল্যান্ডের সাথে যুক্ত।\n   * ব্যতিক্রম: টোঙ্গা একমাত্র দেশ এই তালিকায় যার কোনো উপনিবেশ ছিল না, এটি সরাসরি মনে রাখা সহজ।\n   * মানচিত্র কল্পনা: প্রশান্ত মহাসাগরের মানচিত্রে এই দ্বীপগুলো ছোট ছোট বিন্দুর মতো। কল্পনা করুন ফ্রান্স অনেক দূর থেকে এসে তাহিতিতে শাসন করছে।\nমাইক্রোনেশিয়ার \nমাইক্রোনেশিয়ার এই দেশগুলোর অবস্থান এবং নামগুলো মনে রাখার জন্য আপনি ম্যাপ এবং ছন্দের একটি চমৎকার সমন্বয় করতে পারেন। আপনার দেওয়া নতুন ছবিটিতে 'ফেডারেটেড স্টেটস অব মাইক্রোনেশিয়া' এবং 'পালাউ' নামে আরও দুটি নাম যুক্ত হয়েছে।\nনিচে এগুলো আয়ত্ত করার টেকনিক দেওয়া হলো:", "id": "12-27"}, {"t": "১. মাইক্রোনেশিয়ার সব দেশ মনে রাখার টেকনিক (Story Method):", "b": "\"পালাউ-এর মার্শাল গুয়াম থেকে মাইক্রো বাসে করে নাউরু ও কিরিবাতি গেল।\"\nমাইক্রো বাসে করে, পালাউ-এর মার্শাল,  গুয়াম থেকে নারুই ও কিরিবাতি গেল।\n   * পালাউ: পালাউ\n   * মার্শাল: মার্শাল দ্বীপপুঞ্জ\n   * গুয়াম: গুয়াম\n   * মাইক্রো: ফেডারেটেড স্টেটস অব মাইক্রোনেশিয়া\n   * নাউরু: নাউরু\n   * কিরিবাতি: কিরিবাতি", "id": "12-28"}, {"t": "২. ম্যাপ দেখে মনে রাখার কৌশল:", "b": "ম্যাপের দিকে তাকালে দেখবেন এগুলো একটি নির্দিষ্ট ক্রমে আছে:\n   * বামে (West): পালাউ (সবার শুরুতে)।\n   * মাঝে (Central): গুয়াম এবং ফেডারেটেড স্টেটস অব মাইক্রোনেশিয়া।\n   * ডানে (East): মার্শাল দ্বীপপুঞ্জ এবং কিরিবাতি।", "id": "12-29"}, {"t": "৩. উপনিবেশগুলো ঝটপট মনে রাখার ট্রিক:", "b": "দেশ/অঞ্চল\n\tউপনিবেশ (এক নজরে)\n\tমনে রাখার কি-ওয়ার্ড\n\tমার্শাল\n\tমার্কিন যুক্তরাষ্ট্র\n\tমা-মা (মার্শাল-মার্কিন)\n\tগুয়াম\n\tমার্কিন যুক্তরাষ্ট্র\n\tমার্কিনীদের বিখ্যাত সামরিক ঘাঁটি।\n\tনাউরু\n\tজাপান\n\tনা-পা-নি (নাউরু-জাপান)\n\tকিরিবাতি\n\tব্রিটিশ\n\tব্রিটিশদের জ্বালানো 'কিরি' বাতি।\n\tক্যারোলিন\n\tজাপান\n\tক্যারাম-জাপান ছন্দ।\n\nপ্রস্তুতির জন্য বাড়তি টিপস:\nছবিতে দেখুন 'নিরক্ষরেখার নিকটবর্তী ৫টি দ্বীপ' এর কথা বলা হয়েছে। আপনি পড়ার সময় গোলার্ধ খেয়াল রাখতে পারেন—এগুলো মূলত উত্তর গোলার্ধে কিন্তু নিরক্ষরেখার খুব কাছে অবস্থিত।\nএই মাইক্রোনেশিয়ার দেশগুলো সাধারণত ওশেনিয়া অঞ্চলের মধ্যে আকারে সবচেয়ে ছোট (Micro মানেই ক্ষুদ্র), এই সহজ তথ্যটি মাথায় রাখলে পরীক্ষার হলে কনফিউশন হবে না। আপনার কি মেলানেশিয়া অঞ্চলেরও এমন কোনো টেকনিক লাগবে?\nমেলানেশিয়া \n\nমেলানেশিয়া অঞ্চলের দেশ এবং তাদের উপনিবেশগুলো মনে রাখার জন্য নিচে সহজ টেকনিক ও ছন্দ দেওয়া হলো। এই তথ্যগুলো ওশেনিয়ার অন্যান্য অঞ্চলের তুলনায় কিছুটা বৈচিত্র্যময়, তাই ছন্দের সাহায্য নেওয়া বেশি কার্যকর।", "id": "12-30"}, {"t": "১. মেলানেশিয়ার দেশগুলো মনে রাখার ছন্দ:", "b": "\"ফিজ ও পাপুয়া সলোমনকে নিয়ে সান্তাক্রুজ ও বিসমার্ক হয়ে ভানুয়াতু ও নিউ ক্যালেডোনিয়া গেল।\"\n\nফিজ ও পাপুয়া  ; বিসমার্ক ও সলোমনকে নিয়ে সান্তাক্রুজ করে ভানুয়াতু ও নিউ ক্যালেডোনিয়া গেল।”\n\n   * ফিজ : ফিজি\n   * পাপুয়া: পাপুয়া নিউগিনি\n   * সলোমন: সলোমন দ্বীপপুঞ্জ\n   * সান্তাক্রুজ: সান্তাক্রুজ\n   * বিসমার্ক: বিসমার্ক\n   * ভানুয়াতু: ভানুয়াতু\n   * নিউ ক্যালেডোনিয়া: নিউ ক্যালেডোনিয়া", "id": "12-31"}, {"t": "২. দেশ ও তাদের উপনিবেশ মনে রাখার টেকনিক:", "b": "দেশ/অঞ্চল\n\tউপনিবেশ (কার অধীনে ছিল/আছে)\n\tমনে রাখার সহজ উপায় (Mnemonics)\n\tফিজি\n\tব্রিটিশ\n\tফিজিতে অনেক ভারতীয় বংশোদ্ভূত আছে, যারা ব্রিটিশ আমলে সেখানে গিয়েছিল।\n\tপাপুয়া নিউগিনি\n\tঅস্ট্রেলিয়া\n\tপাপুয়া নিউগিনি অস্ট্রেলিয়ার একেবারে কাছে। তাই অস্ট্রেলিয়া একে শাসন করত।\n\tসলোমন দ্বীপপুঞ্জ\n\tব্রিটিশ\n\tসলোমন রাজা ছিলেন খুব প্রভাবশালী, আর এক সময় সারা বিশ্বে প্রভাবশালী ছিল ব্রিটিশরা।\n\tবিসমার্ক\n\tজার্মান\n\tঅটো ফন বিসমার্ক ছিলেন জার্মানির চ্যান্সেলর। এটি মেলালে আর ভুল হবে না।\n\tভানুয়াতু\n\tফরাসি ও ব্রিটিশ\n\tভানুয়াতু নামের মধ্যে 'ভ' আছে। ফরাসি ও ব্রিটিশ (যুগ্ম শাসন)। এটি একটি ব্যতিক্রমী তথ্য।\n\tনিউ ক্যালেডোনিয়া\n\tফ্রান্স\n\tনামের শুরুতে 'নিউ' আর 'ক্যা'। ফ্রান্সের ক্যাফে সংস্কৃতি দিয়ে মনে রাখতে পারেন। এটি এখনো ফ্রান্সের অধীনে।\n\nদ্রুত মনে রাখার টিপস:\n   * ব্রিটিশ ব্লক: ফিজি এবং সলোমন দ্বীপপুঞ্জ—উভয়ই সরাসরি ব্রিটিশ উপনিবেশ ছিল।\n   * জার্মান সংযোগ: বিসমার্ক নামটি দেখা মাত্রই জার্মানির কথা মাথায় আনবেন।\n   * ভৌগোলিক সান্নিধ্য: পাপুয়া নিউগিনি যেহেতু অস্ট্রেলিয়ার ঠিক উপরে, তাই এর সাথে অস্ট্রেলিয়ার সম্পর্ক মনে রাখা সহজ।\n   * ভানুয়াতু স্পেশাল: এটি ব্রিটিশ এবং ফরাসিদের যৌথ শাসনে (Condominium) ছিল, যা মেলানেশিয়ার জন্য বেশ অনন্য।\nআপনার ওশেনিয়ার তিনটি প্রধান অঞ্চলই (পলিনেশিয়া, মাইক্রোনেশিয়া এবং মেলানেশিয়া) কভার করা হলো। এই ছন্দগুলো কয়েকবার পড়লে পরীক্ষার অপশন দেখে আপনি সহজেই সঠিক উত্তরটি চিহ্নিত করতে পারবেন। ওশেনিয়া নিয়ে আর কোনো প্রশ্ন আছে?\n\nEnclave\n\nইংরেজি \"Enclave\" শব্দটি মূলত লাতিন মূল থেকে এসেছে। এর বিস্তারিত উৎস এবং অর্থ নিচে দেওয়া হলো:", "id": "12-32"}, {"t": "১. মূল বা Root (Etymology)", "b": "\"Enclave\" শব্দটি ফরাসি শব্দ \"enclaver\" থেকে এসেছে, যা আবার লাতিন শব্দ \"inclavare\" থেকে উদ্ভূত।\n   * In- (Prefix): এর অর্থ হলো \"মধ্যে\" (Inside/In)।\n   * Clavis (Root): এর অর্থ হলো \"চাবি\" (Key)।\nঅর্থাৎ, আক্ষরিক অর্থে এর মূল অর্থ দাঁড়ায় \"চাবি দিয়ে ভেতরে আটকে রাখা\" (To lock in with a key)।", "id": "12-33"}, {"t": "২. বাংলা অর্থ (Meaning)", "b": "এর প্রধানত দুটি অর্থ হয়:\n   * ভৌগোলিক অর্থ (ছিটমহল): কোনো এ শেষ করে ফ্রান্স) যেন ভবিষ্যতে এককভাবে এত শক্তিশালী না হয়ে ওঠে যে অন্য দেশগুলোকে দখল করতে পারে, তা নিশ্চিত করা।\n* বৈধতাবাদ নীতি (Legitimacy): নেপোলিয়ন যেসব রাজবংশকে ক্ষমতাচ্যুত করেছিলেন, তাদের পুনরায় সিংহাসনে ফিরিয়ে আনা (যেমন ফ্রান্সে বোরবন রাজবংশকে ফিরিয়ে আনা)।\n* ক্ষতিপূরণ নীতি (Compensation): নেপোলিয়নের বিরুদ্ধে যুদ্ধে যেসব দেশ ক্ষতিগ্রস্ত হয়েছিল, তাদের আঞ্চলিক বা অর্থনৈতিক ক্ষতিপূরণ প্রদান করা।\n* বিপ্লবী আদর্শ দমন: ফরাসি বিপ্লবের মাধ্যমে ছড়িয়ে পড়া 'জাতীয়তাবাদ' এবং 'উদারতন্ত্রের' মতো প্রগতিশীল চেতনাকে দমন করে পুরনো রক্ষণশীল সমাজব্যবস্থা টিকিয়ে রাখা।\n৩. ফলাফল ও গুরুত্ব\n* কনসার্ট অফ ইউরোপ: বড় শক্তিগুলো (ব্রিটেন, রাশিয়া, প্রুশিয়া, অস্ট্রিয়া) মিলে একটি ব্যবস্থা তৈরি করে, যাতে ভবিষ্যতে যেকোনো বিবাদ যুদ্ধের বদলে আলোচনার মাধ্যমে সমাধান করা যায়।\n* শান্তির দীর্ঘ স্থায়িত্ব: এই সম্মেলনের ফলে ইউরোপে বড় কোনো যুদ্ধ ছাড়া প্রায় ৪০ বছর শান্তি বজায় ছিল (ক্রিমিয়ার যুদ্ধ পর্যন্ত), আর সামগ্রিকভাবে বড় ধরনের সংঘাত এড়ানো গিয়েছিল প্রায় ১০০ বছর (প্রথম বিশ্বযুদ্ধ পর্যন্ত)।\nসারসংক্ষেপে: নেপোলিয়ন-পরবর্তী ইউরোপকে একটি স্থিতিশীল কাঠামো দেওয়া এবং যুদ্ধের ক্ষত মুছে পুরনো রাজতন্ত্রকে সুরক্ষিত রাখাই ছিল এই সম্মেলনের মূল উদ্দেশ্য।\n\n*** প্রুশিয়া (Prussia) ছিল মধ্য ইউরোপের একটি অত্যন্ত শক্তিশালী ও প্রভাবশালী ঐতিহাসিক রাজ্য, যা ১৬২৫ থেকে ১৯৪৭ সাল পর্যন্ত অস্তিত্বশীল ছিল [১, ৭]। এটি বর্তমান জার্মানি, পোল্যান্ড এবং লিথুয়ানিয়ার বিশাল অঞ্চল নিয়ে গঠিত ছিল এবং বার্লিন ছিল এর রাজধানী [১, ৪]। ১৮৭১ সালে প্রুশিয়ার নেতৃত্বেই জার্মানি একীভূত হয় এবং জার্মান সাম্রাজ্য গঠিত হয় [৪, ৬]। ফ্রেডেরিক দ্য গ্রেট এবং অটো ভন বিসমার্কের মতো নেতার নেতৃত্বে এটি ইউরোপের অন্যতম প্রধান সামরিক শক্তিতে পরিণত হয়েছিল [৩, ১৪]।", "id": "n2-0-5"}, {"t": "Arms_Trade_Treaty", "b": "Arms Trade Treaty - Wikipedia\nArms Trade Treaty (ATT) বা অস্ত্র বাণিজ্য চুক্তি কোনো একটি নির্দিষ্ট একক ঘটনার ফল নয়, বরং কয়েক দশকের রক্তক্ষয়ী গৃহযুদ্ধ, গণহত্যা এবং অনিয়ন্ত্রিত অস্ত্র বাণিজ্যের ফলে সৃষ্ট মানবিক বিপর্যয়ের প্রতিক্রিয়ায় তৈরি হয়েছে।\nএর পেছনের মূল প্রেক্ষাপট ও কারণগুলো নিচে দেওয়া হলো:\n১. ঐতিহাসিক প্রেক্ষাপট ও রক্তক্ষয়ী সংঘাত (The \"Blood Diamond\" Era)\nনব্বইয়ের দশক এবং ২০০০ সালের শুরুর দিকে আফ্রিকা ও মধ্যপ্রাচ্যের বেশ কিছু দেশে ভয়াবহ গৃহযুদ্ধ চলছিল। বিশেষ করে:\n* রুয়ান্ডা গণহত্যা (১৯৯৪): মাত্র ১০০ দিনে ৮ লাখ মানুষ\n* +কে হত্যা করা হয়। এই গণহত্যায় ব্যবহৃত অস্ত্রের বড় অংশই এসেছিল অনিয়ন্ত্রিত আন্তর্জাতিক বাজার থেকে।\n* সিয়েরা লিওন ও লাইবেরিয়া গৃহযুদ্ধ: সেখানে \"Blood Diamonds\"-এর বিনিময়ে অবৈধভাবে আসা ছোট ও হালকা অস্ত্র (Small Arms) দিয়ে শিশু সৈনিকদের যুদ্ধে ব্যবহার করা হতো।\nএই ঘটনাগুলো বিশ্ববিবেবককে নাড়া দেয় যে, কলার ব্যবসা বা ড্রাগসের ব্যবসার চেয়েও অস্ত্রের আন্তর্জাতিক বাজার অনেক বেশি অনিয়ন্ত্রিত।\n২. নিয়ন্ত্রণহীন \"ছোট ও হালকা অস্ত্র\" (Small Arms & Light Weapons)\nপারমাণবিক বোমা বা বড় মিসাইল নিয়ন্ত্রণের জন্য অনেক আন্তর্জাতিক চুক্তি থাকলেও, রাইফেল, গ্রেনেড বা পিস্তলের মতো ছোট অস্ত্রের বাণিজ্যে কোনো বৈশ্বিক নিয়ম ছিল না। অথচ পরিসংখ্যানে দেখা গেছে, বড় যুদ্ধের চেয়ে এই ছোট অস্ত্রের আঘাতেই পৃথিবীতে সবচেয়ে বেশি মানুষ মারা যায়। এই \"Weapon of Mass Destruction in slow motion\" নিয়ন্ত্রণ করাই ছিল চুক্তির অন্যতম লক্ষ্য।\n৩. মানবাধিকার লঙ্ঘনের হাতিয়ার\nঅনেক সময় দেখা যেত, একটি গণতান্ত্রিক দেশ এমন কোনো স্বৈরাচারী শাসকের কাছে অস্ত্র বিক্রি করছে, যারা সেই অস্ত্র নিজ দেশের সাধারণ মানুষের ওপর ব্যবহার করছে। এই অনৈতিক বাণিজ্য বন্ধ করার জন্য একটি \"মানবাধিকার ভিত্তিক\" মানদণ্ড তৈরি করা প্রয়োজন ছিল।\n৪. নোবেল বিজয়ীদের উদ্যোগ (The 1997 Initiative)\n১৯৯৭ সালে অস্কার আরিয়াস সানচেজসহ (কোস্টারিকার প্রাক্তন প্রেসিডেন্ট ও নোবেল বিজয়ী) একদল নোবেল লরিয়েট প্রথম একটি আন্তর্জাতিক অস্ত্র বাণিজ্য কোড অফ কন্ডাক্ট তৈরির দাবি তোলেন। পরবর্তীতে আন্তর্জাতিক এনজিও যেমন Amnesty International এবং Oxfam \"Control Arms\" ক্যাম্পেইনের মাধ্যমে জনমত গড়ে তোলে।\n৫. ২০০৩ সালের \"Control Arms\" ক্যাম্পেইন\n২০০৩ সালে আনুষ্ঠানিকভাবে এই চুক্তির দাবি বিশ্বব্যাপী জোরালো হয়। এর প্রেক্ষাপটে জাতিসংঘ বুঝতে পারে যে, আন্তর্জাতিক শান্তি ও নিরাপত্তা বজায় রাখতে অস্ত্রের প্রবাহে স্বচ্ছতা আনা জরুরি। এরই ধারাবাহিকতায় ২০০৬ সালে জাতিসংঘের সাধারণ পরিষদে রেজোলিউশন পাস হয় এবং দীর্ঘ আলোচনার পর ২০১৩ সালে চুক্তিটি চূড়ান্ত হয়।", "id": "n2-0-6"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে)", "b": "* স্বচ্ছতা (Transparency): কে কার কাছে অস্ত্র বিক্রি করছে তার হিসাব যেন আন্তর্জাতিক সম্প্রদায়ের কাছে থাকে।\n   * জবাবদিহিতা (Accountability): রপ্তানিকৃত অস্ত্র দিয়ে যুদ্ধাপরাধ বা গণহত্যা হলে রপ্তানিকারক দেশকে দায়ী করা।\n   * অবৈধ পাচার রোধ (Preventing Diversion): বৈধ পথে কেনা অস্ত্র যেন হাতবদল হয়ে কালোবাজারে বা সন্ত্রাসী গোষ্ঠীর কাছে না পৌঁছায়।\nসহজ কথায়, অস্ত্রের বাজারকে ডাল-চালের বাজারের মতো উন্মুক্ত না রেখে একে একটি কঠোর আইনি কাঠামোর মধ্যে আনাই ছিল এই চুক্তির মূল প্রেক্ষাপট।\n\nArms Trade Treaty (ATT) বা অস্ত্র বাণিজ্য চুক্তি হলো আন্তর্জাতিকভাবে প্রচলিত অস্ত্রের (Conventional Weapons) বাণিজ্য নিয়ন্ত্রণ করার জন্য প্রথম এবং একমাত্র বৈশ্বিক চুক্তি। এটি ২০১৪ সালের ২৪ ডিসেম্বর থেকে কার্যকর হয়।\nনিচে এই চুক্তির গুরুত্বপূর্ণ দিকগুলো আলোচনা করা হলো:", "id": "n2-0-7"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে) (১. পটভূমি ও উদ্দেশ্য)", "b": "১. পটভূমি ও উদ্দেশ্য\nবিশ্বজুড়ে অবৈধ অস্ত্রের প্রবাহ কমানো এবং মানবাধিকার লঙ্ঘন ঠেকাতে একটি শক্তিশালী চুক্তির প্রয়োজনীয়তা দীর্ঘকাল ধরে অনুভূত হচ্ছিল।\n   * গৃহীত: ২ এপ্রিল ২০১৩ (জাতিসংঘ সাধারণ পরিষদে)।\n   * কার্যকর: ২৪ ডিসেম্বর ২০১৪।\n   * মূল উদ্দেশ্য: প্রচলিত অস্ত্রের আন্তর্জাতিক বাণিজ্যে স্বচ্ছতা আনা এবং অস্ত্রের অবৈধ পাচার রোধ করা যাতে কোনো দেশে অস্থিতিশীলতা বা গণহত্যা না ঘটে।", "id": "n2-0-8"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে) (২. চুক্তির আওতাভুক্ত অস্ত্রসমূহ (Scope))", "b": "২. চুক্তির আওতাভুক্ত অস্ত্রসমূহ (Scope)\nATT মূলত ৮ ধরনের প্রচলিত অস্ত্র নিয়ে কাজ করে, যা \"7+1\" নামেও পরিচিত:\n   1. Battle Tanks (যুদ্ধ ট্যাংক)\n   2. Armoured Combat Vehicles (সাঁজোয়া যান)\n   3. Large-calibre Artillery Systems (বড় কামানের গোলা)\n   4. Combat Aircraft (যুদ্ধবিমান)\n   5. Attack Helicopters (আক্রমণকারী হেলিকপ্টার)\n   6. Warships (যুদ্ধজাহাজ)\n   7. Missiles and Missile Launchers (মিসাইল ও লাঞ্চার)\n   8. Small Arms and Light Weapons (SALW) (ছোট ও হালকা অস্ত্র যেমন—এসল্ট রাইফেল, পিস্তল)।", "id": "n2-0-9"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে) (৩. প্রধান শর্তাবলি ও নিয়ম)", "b": "৩. প্রধান শর্তাবলি ও নিয়ম\nচুক্তি অনুযায়ী, রপ্তানিকারক দেশগুলোকে নিশ্চিত করতে হয় যে তাদের পাঠানো অস্ত্র:\n   * মানবাধিকার লঙ্ঘন: গণহত্যা, মানবতাবিরোধী অপরাধ বা যুদ্ধাপরাধে ব্যবহৃত হবে না।\n   * সন্ত্রাসবাদ: আন্তর্জাতিক সন্ত্রাসী গোষ্ঠীগুলোর হাতে পড়বে না।\n   * লিঙ্গভিত্তিক সহিংসতা: নারী বা শিশুদের ওপর নিপীড়নের জন্য ব্যবহার করা হবে না।\nযদি কোনো রাষ্ট্র মনে করে যে বিক্রয়কৃত অস্ত্রটি উপরে উল্লেখিত কোনো কাজে ব্যবহার হতে পারে, তবে চুক্তি অনুযায়ী তারা সেই রপ্তানি বাতিল করতে বাধ্য।", "id": "n2-0-10"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে) (৪. গুরুত্বপূর্ণ দেশগুলোর অবস্থান)", "b": "৪. গুরুত্বপূর্ণ দেশগুলোর অবস্থান\n   * বাংলাদেশ: বাংলাদেশ এই চুক্তিতে স্বাক্ষর করেছে এবং ৩১ মার্চ ২০১৪ তারিখে এটি অনুসমর্থন (Ratify) করেছে।\n   * যুক্তরাষ্ট্র: ওবামা প্রশাসন চুক্তিতে স্বাক্ষর করলেও ট্রাম্প প্রশাসন পরবর্তীতে এটি থেকে সরে আসার ঘোষণা দেয়। তবে বাইডেন প্রশাসন পুনরায় এর প্রতি আগ্রহ দেখিয়েছে।\n   * রাশিয়া ও চীন: চীন ২০২০ সালে এই চুক্তিতে যোগ দিলেও রাশিয়া এখনো এর বাইরে রয়েছে।", "id": "n2-0-11"}, {"t": "Arms_Trade_Treaty: কেন এই চুক্তিটি করা হয়েছিল? (একনজরে) (৫. BCS বা প্রতিযোগিতামূলক পরীক্ষার জন্য )", "b": "৫. BCS বা প্রতিযোগিতামূলক পরীক্ষার জন্য টিপস\nপরীক্ষার জন্য নিচের ৩টি পয়েন্ট বিশেষভাবে মনে রাখতে পারেন:\n   * মুখ্যালয় (Secretariat): সুইজারল্যান্ডের জেনেভা।\n   * আইনি মর্যাদা: এটি একটি Legally Binding (আইনগতভাবে বাধ্যতামূলক) চুক্তি, অর্থাৎ সদস্য দেশগুলো এটি মানতে বাধ্য।\n   * ব্যতিক্রম: এই চুক্তি কোনো দেশের 'অভ্যন্তরীণ' অস্ত্র ব্যবহার বা নাগরিকদের অস্ত্র রাখার অধিকার (Self-defense) নিয়ে কোনো হস্তক্ষেপ করে না; এটি কেবল আন্তর্জাতিক বাণিজ্যের ক্ষেত্রে প্রযোজ্য।\nএই চুক্তির কোনো নির্দিষ্ট ধারা বা ছোট ও হালকা অস্ত্রের (SALW) শ্রেণিবিভাগ সম্পর্কে আপনার কি আরও বিস্তারিত জানার প্রয়োজন আছে?", "id": "n2-0-12"}, {"t": "TPNW", "b": "Treaty on the Prohibition of Nuclear Weapons - Wikipedia\n\nTPNW (Treaty on the Prohibition of Nuclear Weapons) বা পারমাণবিক অস্ত্র নিষিদ্ধকরণ চুক্তি আন্তর্জাতিক আইনের ইতিহাসে একটি বৈপ্লবিক পদক্ষেপ। এটি ২০১৭ সালে গৃহীত এবং ২০২১ সালে কার্যকর হয়। কেন এবং কোন প্রেক্ষাপটে এই চুক্তিটি করা হয়েছিল, তা নিচে বিস্তারিত আলোচনা করা হলো:\n১. মানবিক প্রেক্ষাপট (The Humanitarian Perspective)\nTPNW-এর মূল ভিত্তি হলো পারমাণবিক অস্ত্রের ভয়াবহ মানবিক বিপর্যয়। ১৯৪৫ সালে হিরোশিমা ও নাগাসাকি-তে পারমাণবিক হামলার পর থেকে বিশ্ববাসী এর দীর্ঘমেয়াদী প্রভাব দেখেছে। অনেক বছর ধরে পারমাণবিক অস্ত্রকে কেবল 'নিরাপত্তার হাতিয়ার' হিসেবে দেখা হতো। কিন্তু ২০০০ সালের পর থেকে আন্তর্জাতিক সম্প্রদায় (বিশেষ করে আইসিআরসি এবং বিভিন্ন এনজিও) এই যুক্তি সামনে আনে যে, পারমাণবিক অস্ত্রের ব্যবহার মানেই হলো গণহত্যা এবং পরিবেশের স্থায়ী ধ্বংস, যার কোনো চিকিৎসা বা প্রতিকার সম্ভব নয়। এই \"Humanitarian Impact\" ধারণা থেকেই চুক্তির জন্ম।\n২. NPT-এর ব্যর্থতা ও স্থবিরতা\n১৯৬৮ সালের NPT (Non-Proliferation Treaty) বা পারমাণবিক অস্ত্র অ-বিস্তার চুক্তির মূল লক্ষ্য ছিল পারমাণবিক অস্ত্রধারী দেশগুলো (যুক্তরাষ্ট্র, রাশিয়া, চীন, ব্রিটেন, ফ্রান্স) ধীরে ধীরে তাদের অস্ত্র কমিয়ে ফেলবে এবং পুরোপুরি নিরস্ত্রীকরণ করবে। কিন্তু দীর্ঘ ৫০ বছরেও এই দেশগুলো তাদের অস্ত্র ধ্বংস না করে বরং আরও আধুনিকায়ন করছিল। এই স্থবিরতার কারণে পরমাণুহীন দেশগুলো (Non-nuclear states) মনে করল, NPT দিয়ে আসলে নিরস্ত্রীকরণ সম্ভব নয়, তাই একটি নতুন এবং কঠোর চুক্তির প্রয়োজন।\n৩. \"Legal Gap\" বা আইনি শূন্যতা পূরণ\nআন্তর্জাতিক আইনে রাসায়নিক অস্ত্র (Chemical Weapons) এবং জৈবিক অস্ত্র (Biological Weapons) অনেক আগেই নিষিদ্ধ করা হয়েছিল। কিন্তু অদ্ভুতভাবে, সবচেয়ে শক্তিশালী ও ধ্বংসাত্মক অস্ত্র—পারমাণবিক অস্ত্র—নিষিদ্ধ করার কোনো সরাসরি আন্তর্জাতিক আইন ছিল না। এই 'আইনি শূন্যতা' পূরণ করার জন্যই TPNW তৈরি করা হয়, যাতে পারমাণবিক অস্ত্র রাখা বা তৈরি করাকে আন্তর্জাতিকভাবে 'বেআইনি' ঘোষণা করা যায়।\n৪. আইক্যান (ICAN)-এর আন্দোলন\nInternational Campaign to Abolish Nuclear Weapons (ICAN) নামক একটি গ্লোবাল ক্যাম্পেইন এই চুক্তির পেছনে সবচেয়ে বড় শক্তি হিসেবে কাজ করেছে। তারা বিশ্বের বিভিন্ন দেশের সরকারকে বোঝাতে সক্ষম হয় যে, পারমাণবিক অস্ত্র থাকা মানেই পৃথিবী ঝুঁকির মুখে থাকা। এই অবদানের জন্যই ২০১৭ সালে ICAN-কে নোবেল শান্তি পুরস্কার দেওয়া হয়।\n৫. মার্শাল আইল্যান্ডস ও প্রশান্ত মহাসাগরীয় দেশগুলোর প্রভাব\nস্নায়ুযুদ্ধ চলাকালীন যুক্তরাষ্ট্র এবং ব্রিটেন মার্শাল আইল্যান্ডস ও প্রশান্ত মহাসাগরীয় অঞ্চলে শত শত পারমাণবিক পরীক্ষা চালিয়েছিল। এর ফলে সেখানকার মানুষ রেডিয়েশন ও ক্যানসারে আক্রান্ত হয়। এই ক্ষতিগ্রস্ত দেশগুলো আন্তর্জাতিক পরিমণ্ডলে জোরালো দাবি তোলে যে, পারমাণবিক অস্ত্র কেবল যুদ্ধের নয়, এটি পরীক্ষার মাধ্যমেও মানুষের ক্ষতি করে। এই প্রেক্ষাপট চুক্তির দাবিকে আরও জোরালো করে।", "id": "n2-0-13"}, {"t": "TPNW: চুক্তির মূল বৈশিষ্ট্য (একনজরে)", "b": "* সম্পূর্ণ নিষেধাজ্ঞা: এই চুক্তি অনুযায়ী পারমাণবিক অস্ত্র তৈরি, পরীক্ষা, উৎপাদন, মজুত বা ব্যবহারের হুমকি দেওয়া—সবই পুরোপুরি নিষিদ্ধ।\n   * প্রথম ব্যাপক চুক্তি: এটিই প্রথম চুক্তি যা পারমাণবিক অস্ত্রকে সরাসরি 'বেআইনি' ঘোষণা করেছে।\n   * স্বাক্ষর ও কার্যকারিতা: ৭ জুলাই ২০১৭ সালে জাতিসংঘে এটি গৃহীত হয় এবং ৫০টি দেশ অনুসমর্থন করার পর ২২ জানুয়ারি ২০২১ থেকে এটি কার্যকর হয়। বাংলাদেশ এই চুক্তির অন্যতম স্বাক্ষরকারী ও অনুসমর্থনকারী দেশ।\nএকটি গুরুত্বপূর্ণ তথ্য:\nপারমাণবিক অস্ত্রধারী দেশগুলো (যেমন- যুক্তরাষ্ট্র, রাশিয়া, ভারত, পাকিস্তান) এখনো এই চুক্তিতে স্বাক্ষর করেনি। তারা মনে করে, এই চুক্তি তাদের জাতীয় নিরাপত্তার জন্য ঝুঁকিপূর্ণ। তবে TPNW-এর সমর্থকরা মনে করেন, এই চুক্তির মাধ্যমে পারমাণবিক অস্ত্রের ওপর একটি 'Global Stigma' বা সামাজিক কলঙ্ক তৈরি হবে, যা ভবিষ্যতে দেশগুলোকে অস্ত্র ত্যাগে বাধ্য করবে।\nআপনার যদি এই চুক্তির সুনির্দিষ্ট ধারা বা এনপিটি (NPT) এর সাথে এর পার্থক্য সম্পর্কে জানার থাকে, তবে বলতে পারেন।", "id": "n2-0-14"}, {"t": "Ottawa treaty", "b": "আদিবাসী অ্যালগনকুইন শব্দ 'আদাউয়ে' (ব্যবসা করা) থেকে নদীর নাম এবং সেই নদীর নাম থেকেই শেষ পর্যন্ত কানাডার এই শৈল্পিক রাজধানীর নাম হয়েছে 'অটোয়া'। \n\nOttawa Treaty - Wikipedia\n\nঅটোয়া কনভেনশন (Ottawa Convention), যার আনুষ্ঠানিক নাম 'Convention on the Prohibition of the Use, Stockpiling, Production and Transfer of Anti-Personnel Mines and on their Destruction'। এটি ১৯৯৭ সালে স্বাক্ষরিত হয় এবং ১৯৯৯ সালে কার্যকর হয়।\nকেন এবং কোন প্রেক্ষাপটে এই চুক্তিটি করা হয়েছিল, তার মূল কারণগুলো নিচে তুলে ধরা হলো:\n১. 'ল্যান্ডমাইন'—যুদ্ধের নিরব ঘাতক (The Silent Killer)\nল্যান্ডমাইন বা স্থলমাইন এমন একটি অস্ত্র যা যুদ্ধের সময় শত্রু সৈন্য মারার জন্য পোঁতা হলেও, যুদ্ধ শেষ হওয়ার কয়েক দশক পরেও মাটির নিচে সক্রিয় থাকে। এর ফলে যুদ্ধ শেষ হওয়ার পর যখন সাধারণ মানুষ বা শিশুরা সেই জমিতে চলাচল করে, তখন তারা পঙ্গু হয় অথবা মারা যায়। নব্বইয়ের দশকে দেখা যায়, বিশ্বজুড়ে ল্যান্ডমাইনের কারণে প্রতি মাসে প্রায় ২,০০০ মানুষ (যাদের বেশির ভাগই বেসামরিক) হতাহত হচ্ছিল। এই মানবিক বিপর্যয় রোধ করাই ছিল চুক্তির প্রধান লক্ষ্য।\n২. কম্বোডিয়া ও অ্যাঙ্গোলার ভয়াবহ অভিজ্ঞতা\nএই চুক্তির পেছনে সবচেয়ে বড় প্রভাব ফেলেছিল কম্বোডিয়া, অ্যাঙ্গোলা এবং আফগানিস্তানের মতো দেশগুলোর পরিস্থিতি। এসব দেশে যুদ্ধের পর লাখ লাখ মাইন মাটির নিচে রয়ে গিয়েছিল। কৃষি কাজ করতে গিয়ে বা স্কুলে যাওয়ার পথে সাধারণ মানুষ প্রতিনিয়ত অঙ্গ হারাচ্ছিল। এই দেশগুলোর পঙ্গু মানুষের সংখ্যা এত বেড়ে গিয়েছিল যে এটি একটি বৈশ্বিক সংকটে রূপ নেয়।\n৩. এনজিও এবং নাগরিক সমাজের আন্দোলন (ICBL)\n১৯৯২ সালে ৬টি আন্তর্জাতিক সংস্থা মিলে International Campaign to Ban Landmines (ICBL) গঠন করে। তারা বিশ্বজুড়ে ল্যান্ডমাইনের ভয়াবহতার ছবি ও তথ্য প্রচার করতে থাকে। তাদের এই আন্দোলনের ফলে সাধারণ মানুষের মধ্যে তীব্র সচেতনতা তৈরি হয়।\n৪. প্রিন্সেস ডায়ানার ভূমিকা\n১৯৯৭ সালে ব্রিটেনের প্রিন্সেস ডায়ানা অ্যাঙ্গোলার ল্যান্ডমাইন ফিল্ড পরিদর্শন করেন এবং মাইন বিস্ফোরণে অঙ্গ হারানো শিশুদের সাথে সময় কাটান। তার এই সফরের ছবি সারা বিশ্বে আলোড়ন সৃষ্টি করে এবং ল্যান্ডমাইন নিষিদ্ধ করার পক্ষে ব্যাপক জনমত গঠন করে। তার এই সফরের মাত্র কয়েক মাস পরেই অটোয়া চুক্তি স্বাক্ষরিত হয়।", "id": "n2-0-15"}, {"t": "Ottawa treaty: চুক্তির মূল উদ্দেশ্য ও প্রেক্ষাপট (একনজরে)", "b": "* অ্যান্টি-পারসোনেল মাইন নিষিদ্ধকরণ: এই চুক্তি শুধুমাত্র সেই সব মাইন নিষিদ্ধ করে যা মানুষের স্পর্শে বা চাপে বিস্ফোরিত হয় (ট্যাংক বিধ্বংসী মাইন এর অন্তর্ভুক্ত নয়)।\n   * মজুত ধ্বংস: দেশগুলোকে তাদের কাছে থাকা মাইন ৪ বছরের মধ্যে ধ্বংস করতে হবে।\n   * মাইন অপসারণ: মাটির নিচে পোঁতা মাইনগুলো ১০ বছরের মধ্যে পরিষ্কার করতে হবে।\n   * ভিকটিম অ্যাসিস্ট্যান্স: মাইন বিস্ফোরণে যারা অঙ্গ হারিয়েছেন, তাদের চিকিৎসা ও পুনর্বাসনের ব্যবস্থা করা।\nবিসিএস ও প্রতিযোগিতামূলক পরীক্ষার জন্য গুরুত্বপূর্ণ তথ্য:\n   * স্বাক্ষর: ১৯৯৭ (অটোয়া, কানাডা)।\n   * কার্যকর: ১৯৯৯।\n   * নোবেল বিজয়: এই আন্দোলনের স্বীকৃতিস্বরূপ ICBL এবং এর সমন্বয়ক জোডি উইলিয়ামস ১৯৯৭ সালে শান্তিতে নোবেল পুরস্কার পান।\n   * বাংলাদেশ: বাংলাদেশ এই চুক্তিতে স্বাক্ষরকারী এবং দক্ষিণ এশিয়ার প্রথম দেশ হিসেবে এটি অনুসমর্থন (Ratify) করেছে (১৯৯৮ সালে)।\nএই চুক্তির মাধ্যমে ল্যান্ডমাইনকে একটি \"অমানবিক অস্ত্র\" হিসেবে চিহ্নিত করা হয়েছে, যা যুদ্ধের পরেও শান্তি নষ্ট করে। আপনার কি এই চুক্তির কোনো নির্দিষ্ট ধারা বা এর সীমাবদ্ধতা সম্পর্কে জানার আগ্রহ আছে?", "id": "n2-0-16"}, {"t": "Antarctic treaty", "b": "Antarctic Treaty System - Wikipedia\n\nঅ্যান্টার্কটিক চুক্তি (Antarctic Treaty) আন্তর্জাতিক সম্পর্কের ক্ষেত্রে একটি অনন্য দলিল। ১৯৫৯ সালে স্বাক্ষরিত এবং ১৯৬১ সালে কার্যকর হওয়া এই চুক্তির মাধ্যমে পৃথিবীর একটি সম্পূর্ণ মহাদেশকে যুদ্ধ ও রাজনীতির ঊর্ধ্বে রাখা হয়েছে।\nনিচে এর পেছনের প্রেক্ষাপট ও কারণগুলো আলোচনা করা হলো:\n১. ভূ-রাজনৈতিক উত্তেজনা ও মালিকানা দাবি (Territorial Claims)\nবিশ শতকের মাঝামাঝি সময়ে ৭টি দেশ (আর্জেন্টিনা, অস্ট্রেলিয়া, চিলি, ফ্রান্স, নিউজিল্যান্ড, নরওয়ে এবং যুক্তরাজ্য) অ্যান্টার্কটিকার বিভিন্ন অংশের মালিকানা দাবি করে। মজার ব্যাপার হলো, চিলি, আর্জেন্টিনা এবং যুক্তরাজ্যের দাবি করা এলাকাগুলো একে অপরের ওপর ওভারল্যাপ (Overlap) করছিল। এর ফলে এই দেশগুলোর মধ্যে যেকোনো সময় যুদ্ধ লেগে যাওয়ার সম্ভাবনা তৈরি হয়েছিল। এই বিরোধ মেটানোই ছিল চুক্তির অন্যতম প্রধান কারণ।\n২. স্নায়ুযুদ্ধ (The Cold War) ও সামরিকায়ন রোধ\n১৯৫০-এর দশকে যুক্তরাষ্ট্র এবং তৎকালীন সোভিয়েত ইউনিয়নের (USSR) মধ্যে চরম উত্তেজনা চলছিল। অ্যান্টার্কটিকা মহাদেশটি কৌশলগতভাবে গুরুত্বপূর্ণ হওয়ায় ভয় ছিল যে, সুপারপাওয়ারগুলো এখানে সামরিক ঘাঁটি তৈরি করবে বা পারমাণবিক অস্ত্রের পরীক্ষা চালাবে। অ্যান্টার্কটিকাকে যেন কেউ \"Cold War Battleground\" হিসেবে ব্যবহার করতে না পারে, তা নিশ্চিত করা জরুরি ছিল।\n৩. আন্তর্জাতিক ভূ-ভৌতিক বছর (IGY: 1957-58)\n১৯৫৭-৫৮ সালকে 'International Geophysical Year' হিসেবে পালন করা হয়। এই সময়ে ১২টি দেশের বিজ্ঞানীরা অ্যান্টার্কটিকায় গিয়ে ৬৬টি রিসার্চ স্টেশন স্থাপন করেন। বিজ্ঞানের খাতিরে বিভিন্ন দেশের এই যে একাত্মতা, তা প্রমাণ করেছিল যে রাজনীতি সরিয়ে রেখেও এ
