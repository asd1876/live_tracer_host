রা হলো:\n১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nএই চুক্তির মূল দর্শন ছিল \"Trust but Verify\" (বিশ্বাস করো, তবে যাচাই করে নাও)। এর প্রধান কারণগুলো হলো:\n   * সামরিক স্বচ্ছতা: সদস্য দেশগুলো একে অপরের আকাশসীমায় নিরস্ত্র পর্যবেক্ষণ বিমান (Unarmed Observation Aircraft) পরিচালনার সুযোগ পায়। এতে কোনো দেশ গোপনে বড় কোনো যুদ্ধের প্রস্তুতি নিচ্ছে কি না, তা সহজে ধরা পড়ে।\n   * পারস্পরিক আস্থা বৃদ্ধি: স্নায়ুযুদ্ধের পরবর্তী সময়ে দেশগুলোর মধ্যে যে সন্দেহের দেয়াল ছিল, তা দূর করে একে অপরের গতিবিধি সম্পর্কে নিশ্চিত হওয়া ছিল এর লক্ষ্য।\n   * অস্ত্র নিয়ন্ত্রণ: এই চুক্তির ফলে দেশগুলো নিশ্চিত হতে পারে যে অন্য দেশগুলো অস্ত্র নিয়ন্ত্রণ সংক্রান্ত বিভিন্ন আন্তর্জাতিক চুক্তি মেনে চলছে।\n   * উত্তেজনা প্রশমন: কোনো সীমানায় হুট করে সেনা সমাবেশ ঘটলে তা যেন ভুল বুঝাবুঝির কারণে যুদ্ধে রূপ না নেয়, তা পর্যবেক্ষণ করা।\n\n২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nএই চুক্তির আইডিয়াটি বেশ পুরনো হলেও এটি কার্যকর হতে অনেক সময় লেগেছিল:\n   * আইজেনহাওয়ারের প্রস্তাব (১৯৫৫): স্নায়ুযুদ্ধ চলাকালীন মার্কিন প্রেসিডেন্ট ডুইট ডি. আইজেনহাওয়ার প্রথম এই প্রস্তাব দেন। তখন সোভিয়েত ইউনিয়ন এটি প্রত্যাখ্যান করেছিল, কারণ তারা মনে করেছিল এটি স্রেফ একটি গুপ্তচরবৃত্তির ফন্দি।\n   * স্নায়ুযুদ্ধের সমাপ্তি (১৯৮৯): ১৯৮৯ সালে বার্লিন দেয়ালের পতন এবং স্নায়ুযুদ্ধের উত্তাপ কমতে শুরু করলে মার্কিন প্রেসিডেন্ট জর্জ এইচ. ডব্লিউ. বুশ পুনরায় এই প্রস্তাবটি উত্থাপন করেন।\n   * সোভিয়েত ইউনিয়নের পতন ও ন্যাটোর উদ্যোগ: সোভিয়েত ইউনিয়ন ভেঙে যাওয়ার পর ইউরোপে নতুন এক ভূ-রাজনৈতিক পরিবেশ তৈরি হয়। তখন ন্যাটো এবং সাবেক ওয়ারশ প্যাক্টের সদস্য দেশগুলোর মধ্যে সামরিক সংঘাত এড়ানোর জন্য একটি স্থায়ী কাঠামোর প্রয়োজন ছিল।", "id": "n2-0-20"}, {"t": "Treaties on open skies: গুরুত্বপূর্ণ কিছু তথ্য", "b": "* স্বাক্ষর: এটি ১৯৯২ সালের ২৪ মার্চ ফিনল্যান্ডের হেলসিংকি শহরে স্বাক্ষরিত হয়।\n   * কার্যকর: চুক্তিটি পূর্ণাঙ্গভাবে কার্যকর হয় ১ জানুয়ারি ২০০২ সালে।\n   * সদস্য: শুরুতে ৩৪টি দেশ এর অন্তর্ভুক্ত ছিল।\n   * বর্তমান অবস্থা: ২০২০ সালে ডোনাল্ড ট্রাম্পের আমল থেকে যুক্তরাষ্ট্র এই চুক্তি থেকে বের হয়ে যাওয়ার প্রক্রিয়া শুরু করে এবং পরবর্তীতে ২০২১ সালে রাশিয়াও এই চুক্তি থেকে নিজেকে প্রত্যাহার করে নেয়। বর্তমানে এই চুক্তির কার্যকারিতা অনেকটাই কমে এসেছে।\nসহজ কথায়, আকাশ থেকে ছবি তোলার মাধ্যমে একে অপরের সামরিক কার্যক্রমের ওপর নজরদারি করার আইনি সুযোগ তৈরি করে যুদ্ধ পরিস্থিতি এড়িয়ে চলাই ছিল এর প্রধান উদ্দেশ্য।\n\n*** ফিনল্যান্ডের রাজধানী হেলসিংকি (Helsinki) শহরের নামকরণের ইতিহাস বেশ দীর্ঘ এবং কিছুটা বিবর্তনমূলক। এর মূলে রয়েছে সুইডিশ প্রভাব এবং ভৌগোলিক বৈশিষ্ট্য।\nনিচে হেলসিংকি নামটির উৎপত্তির প্রধান ধাপগুলো আলোচনা করা হলো:\n\n১. সুইডিশ মূল ‘হেলসিং’ (Helsing)\nহেলসিংকি শহরের গোড়াপত্তন হয়েছিল ১৫৫০ সালে সুইডেনের রাজা গুস্তাভ ভাসার নির্দেশে। তখন এই অঞ্চলের নাম রাখা হয়েছিল সুইডিশ ভাষায় ‘Helsinge fors’।\n   * Helsing: ধারণা করা হয়, মধ্যযুগে সুইডেনের ‘হেলসিংল্যান্ড’ (Hälsingland) নামক অঞ্চল থেকে আসা অভিবাসীরা এই এলাকায় বসতি স্থাপন করেছিলেন। তাদের নাম অনুসারেই এই জায়গার নাম হয় ‘হেলসিং’।\n   * Fors: সুইডিশ ভাষায় এর অর্থ ‘জলপ্রপাত’ (Waterfalls)।\nমূলত শহরটি ভান্টা নদীর একটি জলপ্রপাতের কাছে স্থাপিত হয়েছিল বলে এর নাম ছিল হেলসিংফোরস (Helsingfors)। আজও সুইডিশ ভাষায় শহরটি এই নামেই পরিচিত।\n২. ফিনিশ রূপান্তর: ‘হেলসিংকি’ (Helsinki)\nফিনিশ ভাষাভাষী মানুষের কাছে ‘Helsinge’ শব্দটি বিবর্তিত হয়ে ‘Helsinki’-তে রূপান্তরিত হয়। ফিনিশ ব্যাকরণ ও উচ্চারণ রীতি অনুযায়ী নামের শেষে ‘ki’ বা ‘gi’ যুক্ত হওয়া একটি সাধারণ বৈশিষ্ট্য।\nসপ্তদশ শতাব্দী থেকেই ফিনিশ দলিলে এই নামটি ব্যবহার হতে শুরু করে, যদিও দাপ্তরিকভাবে তখন ‘হেলসিংফোরস’ নামটিই বেশি প্রচলিত ছিল।\n৩. রাজধানীর মর্যাদা ও নামের প্রতিষ্ঠা\n১৮১২ সালে যখন ফিনল্যান্ড রাশিয়ার অধীনে একটি স্বায়ত্তশাসিত গ্র্যান্ড ডাচিতে পরিণত হয়, তখন হেলসিংকিকে রাজধানী করা হয়। ১৯১৭ সালে ফিনল্যান্ড স্বাধীন হওয়ার পর, ফিনিশ নাম ‘Helsinki’ দাপ্তরিকভাবে সুইডিশ নামের পাশাপাশি সমান গুরুত্ব পায়।", "id": "n2-0-21"}, {"t": "Treaties on open skies: সংক্ষেপে নামটির বিবর্তন", "b": "সময়কাল\n\tনাম\n\tভাষার প্রভাব\n\t১৫৫০ (প্রতিষ্ঠা)\n\tHelsingfors\n\tসুইডিশ (Helsing + Fors)\n\t১৮শ-১৯শ শতক\n\tHelsinki\n\tফিনিশ (জনমুখে প্রচলিত রূপ)\n\t১৯১৭-বর্তমান\n\tHelsinki / Helsingfors\n\tফিনল্যান্ডের দাপ্তরিক দ্বৈত নাম\n\tমজার তথ্য: স্থানীয়রা ভালোবেসে শহরটিকে প্রায়ই ‘স্টাডি’ (Stadi) বলে ডাকেন (যা সুইডিশ শব্দ 'Stad' বা শহর থেকে এসেছে), অথবা সাধারণ ফিনিশরা একে সংক্ষেপে ‘হেসা’ (Hesa) বলেও সম্বোধন করেন।\n\nবিশ্বের সবচেয়ে শক্তিশালী নিউক্লিয়ার বোমা এখন কার হাতে ?| আদ্যোপান্ত | History of Tsar Bomba \nNPT\n\nTreaty on the Non-Proliferation of Nuclear Weapons - Wikipedia\n\nNPT (Non-Proliferation Treaty) বা পারমাণবিক অস্ত্র অবিস্তার চুক্তি হলো বিশ্বের পারমাণবিক অস্ত্রের ব্যবহার ও বিস্তার রোধে সবচেয়ে শক্তিশালী এবং গুরুত্বপূর্ণ আন্তর্জাতিক চুক্তি। ১৯৬৮ সালে এটি স্বাক্ষরের জন্য উন্মুক্ত করা হয় এবং ১৯৭০ সালে এটি কার্যকর হয়।\nনিচে এটি করার কারণ এবং প্রেক্ষাপট আলোচনা করা হলো:\n১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nNPT-এর মূল ভিত্তি তিনটি স্তম্ভের (Three Pillars) ওপর দাঁড়িয়ে:\n   * অবিস্তার (Non-proliferation): পারমাণবিক অস্ত্র নেই এমন দেশগুলো যাতে নতুন করে এই অস্ত্র তৈরি বা অর্জন করতে না পারে, তা নিশ্চিত করা।\n   * নিরস্ত্রীকরণ (Disarmament): যাদের কাছে ইতিমধ্যে পারমাণবিক অস্ত্র আছে (যেমন: যুক্তরাষ্ট্র, রাশিয়া, চীন, যুক্তরাজ্য ও ফ্রান্স), তারা ধীরে ধীরে তাদের অস্ত্রের মজুদ কমিয়ে আনবে এবং এক সময় সম্পূর্ণ ধ্বংস করবে।\n   * পারমাণবিক শক্তির শান্তিপূর্ণ ব্যবহার: পারমাণবিক প্রযুক্তি যেন কেবল বিদ্যুৎ উৎপাদন বা চিকিৎসার মতো কল্যাণকর কাজে ব্যবহৃত হয়, সে বিষয়ে সদস্য দেশগুলোকে সহযোগিতা করা।\n\n২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nNPT হুট করে হয়নি; এর পেছনে স্নায়ুযুদ্ধের সময়ের তীব্র আতঙ্ক এবং কিছু সুনির্দিষ্ট ঘটনা কাজ করেছিল:\n   * পারমাণবিক অস্ত্রের প্রতিযোগিতা (Arms Race): ১৯৪৫ সালে যুক্তরাষ্ট্র এবং ১৯৪৯ সালে সোভিয়েত ইউনিয়ন সফল পারমাণবিক পরীক্ষা চালায়। এরপর যুক্তরাজ্য (১৯৫২), ফ্রান্স (১৯৬০) এবং চীন (১৯৬৪) এই ক্লাবে যোগ দেয়। বিশ্বনেতারা ভয় পাচ্ছিলেন যে, এভাবে চলতে থাকলে খুব দ্রুত ২০-৩০টি দেশের হাতে পারমাণবিক বোমা চলে আসবে, যা পৃথিবীকে ধ্বংসের দ্বারপ্রান্তে নিয়ে যাবে।\n   * কিউবান মিসাইল ক্রাইসিস (১৯৬২): এটি ছিল ইতিহাসের সবচেয়ে ভয়াবহ মুহূর্ত। যুক্তরাষ্ট্র এবং সোভিয়েত ইউনিয়ন পারমাণবিক যুদ্ধের খুব কাছাকাছি চলে এসেছিল। এই ঘটনাটি বিশ্বকে চোখে আঙুল দিয়ে দেখিয়ে দেয় যে, পারমাণবিক অস্ত্র নিয়ন্ত্রণ করা কতটা জরুরি।\n   * আয়ারল্যান্ডের উদ্যোগ: ১৯৫৮ সালে আয়ারল্যান্ড প্রথম জাতিসংঘে পারমাণবিক অস্ত্র বিস্তার রোধে একটি প্রস্তাব আনে। এরপর কয়েক বছর আলোচনার পর এটি চুক্তির রূপ পায়।\n   * চীন-ভারত যুদ্ধ ও আঞ্চলিক উত্তেজনা: ১৯৬৪ সালে চীনের পারমাণবিক পরীক্ষা এশীয় অঞ্চলে নতুন করে অস্থিরতা তৈরি করে। এটি বড় শক্তিগুলোকে বাধ্য করে একটি আইনি কাঠামো তৈরি করতে যাতে নতুন কেউ আর এই ক্ষমতার অধিকারী হতে না পারে।", "id": "n2-0-22"}, {"t": "Treaties on open skies: NPT-এর একটি \"অসম\" দিক (ভিন্নমত)", "b": "এই চুক্তিতে পৃথিবীকে দুই ভাগে ভাগ করা হয়েছে:\n১. NWS (Nuclear Weapon States): যারা ১৯৬৭ সালের ১ জানুয়ারির আগে পারমাণবিক পরীক্ষা চালিয়েছে (যুক্তরাষ্ট্র, রাশিয়া, চীন, যুক্তরাজ্য, ফ্রান্স)। তারা বৈধভাবে অস্ত্র রাখতে পারে।\n২. NNWS (Non-Nuclear Weapon States): বাকি সব দেশ, যারা কখনোই এই অস্ত্র তৈরি করতে পারবে না।\nভারত, পাকিস্তান, ইসরায়েল এবং উত্তর কোরিয়া এই চুক্তিতে স্বাক্ষর করেনি (বা বের হয়ে গেছে), কারণ তারা মনে করে এই চুক্তিটি বৈষম্যমূলক এবং এটি বড় দেশগুলোর আধিপত্য টিকিয়ে রাখার একটি হাতিয়ার।\nসহজ কথায়, পৃথিবীকে পারমাণবিক যুদ্ধের ভয়াবহতা থেকে বাঁচাতে এবং এই মারণাস্ত্রের সংখ্যা সীমিত রাখতেই NPT করা হয়েছিল।", "id": "n2-0-23"}, {"t": "CTBT", "b": "Comprehensive Nuclear-Test-Ban Treaty - Wikipedia\n\nCTBT (Comprehensive Nuclear-Test-Ban Treaty) বা ব্যাপক পারমাণবিক পরীক্ষা নিষিদ্ধকরণ চুক্তি হলো পারমাণবিক নিরস্ত্রীকরণের পথে একটি চূড়ান্ত ধাপ। ১৯৯৬ সালে এটি স্বাক্ষরের জন্য উন্মুক্ত করা হয়।\nNPT যেখানে অস্ত্র বিস্তার রোধের কথা বলে, CTBT সেখানে যেকোনো ধরনের (সামরিক বা বেসামরিক) এবং যেকোনো পরিবেশে (মাটির নিচে, পানির নিচে বা বায়ুমণ্ডলে) পারমাণবিক পরীক্ষা চালানোকে সম্পূর্ণ নিষিদ্ধ করে।\nনিচে এর কারণ ও প্রেক্ষাপট আলোচনা করা হলো:", "id": "n2-0-24"}, {"t": "CTBT (১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য))", "b": "১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\n   * নতুন প্রযুক্তির উন্নয়ন থামানো: পারমাণবিক অস্ত্রের উন্নয়ন করার জন্য পরীক্ষার প্রয়োজন হয়। পরীক্ষা বন্ধ করে দিলে দেশগুলো আর নতুন বা উন্নত মানের (যেমন: থার্মোনিউক্লিয়ার বোমা) অস্ত্র তৈরি করতে পারবে না।\n   * পরিবেশ রক্ষা: পারমাণবিক পরীক্ষার ফলে বায়ুমণ্ডলে তেজস্ক্রিয়তা ছড়িয়ে পড়ে, যা পরিবেশ এবং মানুষের স্বাস্থ্যের জন্য চরম ঝুঁকিপূর্ণ। এটি বন্ধ করা ছিল অন্যতম লক্ষ্য।\n   * নিরস্ত্রীকরণের চাপ: বড় শক্তিগুলো যেন তাদের পারমাণবিক ভাণ্ডার আর আধুনিকায়ন করতে না পারে, তার মাধ্যমে পরোক্ষভাবে নিরস্ত্রীকরণে বাধ্য করা।", "id": "n2-0-25"}, {"t": "CTBT (২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়)", "b": "২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nCTBT-এর পথ তৈরি হয়েছিল কয়েক দশকের আন্দোলনের ফলে:\n   * স্নায়ুযুদ্ধের সমাপ্তি (১৯৯০-এর দশক): সোভিয়েত ইউনিয়ন ভেঙে যাওয়ার পর আমেরিকা ও রাশিয়ার মধ্যে সরাসরি যুদ্ধের ভয় কমে যায়। এই সুযোগে বিশ্বজুড়ে \"শান্তি লভ্যাংশ\" (Peace Dividend) অর্জনের দাবি ওঠে এবং পারমাণবিক পরীক্ষা চিরতরে বন্ধের আলোচনা জোরদার হয়।\n   * ফরাসি ও চীনা পরীক্ষা নিয়ে বিশ্বব্যাপী ক্ষোভ (১৯৯৫-৯৬): যখন CTBT নিয়ে আলোচনা চলছিল, ঠিক তখনই ফ্রান্স এবং চীন কয়েক দফায় পারমাণবিক পরীক্ষা চালায়। এর ফলে সারা বিশ্বে তীব্র নিন্দা ও বিক্ষোভ শুরু হয়, যা এই চুক্তি দ্রুত সম্পন্ন করতে আন্তর্জাতিক চাপ তৈরি করে।\n   * পূর্ববর্তী চুক্তির সীমাবদ্ধতা (PTBT - ১৯৬৩): ১৯৬৩ সালে একটি চুক্তি হয়েছিল (Partial Test Ban Treaty), যা আকাশ ও পানির নিচে পরীক্ষা বন্ধ করলেও মাটির নিচে পরীক্ষা চালানোর অনুমতি দিত। দেশগুলো সেই সুযোগ নিয়ে মাটির নিচে হাজার হাজার পরীক্ষা চালিয়ে যাচ্ছিল। এই লুপহোল (Loophole) বন্ধ করার জন্যই \"Comprehensive\" বা ব্যাপক চুক্তির প্রয়োজন পড়ে।\n   * আন্তর্জাতিক মনিটরিং ব্যবস্থার উন্নতি: নব্বইয়ের দশকে সিসমোলজি (ভূকম্পনবিদ্যা) এত উন্নত হয় যে, বিশ্বের কোথাও মাটির নিচে পরীক্ষা চালানো হলে তা সহজেই শনাক্ত করা সম্ভব ছিল। এই প্রযুক্তিগত আত্মবিশ্বাসই দেশগুলোকে চুক্তিতে বসতে সাহায্য করে।", "id": "n2-0-26"}, {"t": "CTBT (৩. একটি গুরুত্বপূর্ণ তথ্য (যা আপনাকে মনে)", "b": "৩. একটি গুরুত্বপূর্ণ তথ্য (যা আপনাকে মনে রাখতে হবে):\nCTBT চুক্তির ইতিহাসে ভারত ও পাকিস্তানের ভূমিকা অত্যন্ত গুরুত্বপূর্ণ:\n   * ১৯৯৬ সালে যখন চুক্তিটি পাস হয়, তখন ভারত এর বিরোধিতা করে। ভারতের যুক্তি ছিল—এই চুক্তিটি বৈষম্যমূলক এবং এটি বড় দেশগুলোর কম্পিউটার সিমুলেশন (পরীক্ষা ছাড়াই ল্যাবে ডিজাইন করা) বন্ধ করে না।\n   * এর ঠিক দুই বছর পর, ১৯৯৮ সালে ভারত ও পাকিস্তান একের পর এক পারমাণবিক পরীক্ষা চালিয়ে বিশ্বকে চমকে দেয়।\n   * চুক্তিটি এখনো কার্যকর হয়নি: CTBT কার্যকর হওয়ার জন্য নির্দিষ্ট ৪৪টি দেশের (যাদের পারমাণবিক প্রযুক্তি আছে) অনুমোদন প্রয়োজন। কিন্তু ভারত, পাকিস্তান ও উত্তর কোরিয়া এটি স্বাক্ষর করেনি এবং যুক্তরাষ্ট্র ও চীনের মতো দেশগুলো স্বাক্ষর করলেও তাদের সংসদে এটি পাস (Ratify) করেনি। ফলে এটি এখনো আন্তর্জাতিকভাবে আইন হিসেবে পুরোপুরি বলবৎ নয়।\nসহজ কথায়, NPT যদি হয় \"অস্ত্র রাখা বা না রাখা\" নিয়ে চুক্তি, তবে CTBT হলো \"অস্ত্রের পরীক্ষা চালানো\" চিরতরে বন্ধ করার একটি আন্তর্জাতিক প্রচেষ্টা।", "id": "n2-0-27"}, {"t": "JCPoA", "b": "Iran nuclear deal - Wikipedia\nJCPOA (Joint Comprehensive Plan of Action), যা সাধারণ মানুষের কাছে \"ইরান পারমাণবিক চুক্তি\" নামে পরিচিত, এটি আন্তর্জাতিক কূটনীতির ইতিহাসে একটি অত্যন্ত জটিল এবং গুরুত্বপূর্ণ চুক্তি। ২০১৫ সালে ইরান এবং বিশ্বের শক্তিশালী ৬টি দেশ (P5+1: যুক্তরাষ্ট্র, যুক্তরাজ্য, ফ্রান্স, রাশিয়া, চীন এবং জার্মানি) ও ইউরোপীয় ইউনিয়নের মধ্যে এটি স্বাক্ষরিত হয়।\nনিচে আপনার প্রশ্নের উত্তরগুলো সহজভাবে সাজানো হলো:", "id": "n2-0-28"}, {"t": "JCPoA (১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য))", "b": "১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nএই চুক্তির মূল উদ্দেশ্য ছিল \"অস্ত্রের বদলে অর্থনীতি\"। অর্থাৎ:\n   * ইরানের পারমাণবিক কর্মসূচি সীমিত করা: ইরান যেন কখনোই পারমাণবিক বোমা তৈরি করতে না পারে, তা নিশ্চিত করা। এর জন্য তাদের ইউরেনিয়াম সমৃদ্ধকরণ এবং সেন্ট্রিফিউজের সংখ্যা নাটকীয়ভাবে কমিয়ে আনার শর্ত দেওয়া হয়।\n   * আন্তর্জাতিক পর্যবেক্ষণ: জাতিসংঘের পরমাণু শক্তি সংস্থা (IAEA) যেন ইরানের যেকোনো পরমাণু কেন্দ্রে নিয়মিত এবং কঠোর পরিদর্শন চালাতে পারে, সেই সুযোগ নিশ্চিত করা।\n   * অর্থনৈতিক নিষেধাজ্ঞা প্রত্যাহার: চুক্তির শর্ত মেনে চললে ইরানের ওপর থাকা আন্তর্জাতিক কঠোর অর্থনৈতিক, বাণিজ্যিক এবং আর্থিক নিষেধাজ্ঞাগুলো ধীরে ধীরে তুলে নেওয়া।\n   * আঞ্চলিক স্থিতিশীলতা: মধ্যপ্রাচ্যে একটি সম্ভাব্য পারমাণবিক প্রতিযোগিতার ঝুঁকি কমানো।", "id": "n2-0-29"}, {"t": "JCPoA (২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয)", "b": "২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nJCPOA-এর পেছনে দীর্ঘ প্রায় এক দশকের বেশি সময়ের উত্তেজনা এবং গোপনীয়তার ইতিহাস রয়েছে:\n   * গোপন পরমাণু কেন্দ্রের তথ্য ফাঁস (২০০২): ২০০২ সালে একটি ইরানি বিরোধী দল প্রকাশ করে দেয় যে, ইরান 'নাতানজ' (Natanz) এবং 'আরাক' (Arak)-এ গোপনে পারমাণবিক স্থাপনা তৈরি করছে। এখান থেকেই বিশ্ববাসীর সাথে ইরানের পরমাণু বিরোধের শুরু।\n   * কঠোর আন্তর্জাতিক নিষেধাজ্ঞা: ইরান দাবি করছিল তারা কেবল বিদ্যুৎ উৎপাদনের জন্য এই গবেষণা করছে, কিন্তু পশ্চিমারা তা বিশ্বাস করেনি। ফলে জাতিসংঘ, যুক্তরাষ্ট্র এবং ইউরোপীয় ইউনিয়ন ইরানের ওপর একের পর এক কঠোর নিষেধাজ্ঞা আরোপ করে, যার ফলে ইরানের অর্থনীতি (বিশেষ করে তেল রপ্তানি) ভেঙে পড়ার উপক্রম হয়।\n   * ইরানে নেতৃত্বের পরিবর্তন (২০১৩): ২০১৩ সালে ইরানে হাসান রুহানি প্রেসিডেন্ট হিসেবে নির্বাচিত হন। তিনি ছিলেন একজন মধ্যপন্থী নেতা এবং তিনি পশ্চিমা বিশ্বের সাথে আলোচনার মাধ্যমে নিষেধাজ্ঞা তুলে নেওয়ার প্রতিশ্রুতি দিয়েছিলেন। এটিই আলোচনার মূল দরজা খুলে দেয়।\n   * ওবামা প্রশাসনের কূটনীতি: তৎকালীন মার্কিন প্রেসিডেন্ট বারাক ওবামা মনে করেছিলেন, সামরিক শক্তি প্রয়োগের চেয়ে আলোচনার মাধ্যমে ইরানকে পারমাণবিক অস্ত্র থেকে দূরে রাখা বেশি কার্যকর হবে। ওমান এবং অন্যান্য দেশের মধ্যস্থতায় ওমানের মাস্কাটে গোপনে দুই দেশের মধ্যে আলোচনা শুরু হয়।", "id": "n2-0-30"}, {"t": "JCPoA (৩. চুক্তির বর্তমান অবস্থা (একটি গুরুত্বপ)", "b": "৩. চুক্তির বর্তমান অবস্থা (একটি গুরুত্বপূর্ণ টুইস্ট):\nএই চুক্তিটি একটি বড় ধাক্কা খায় ২০১৮ সালে:\n   * ট্রাম্পের প্রত্যাহার: মার্কিন প্রেসিডেন্ট ডোনাল্ড ট্রাম্প এই চুক্তিকে \"ইতিহাসের সবচেয়ে খারাপ চুক্তি\" বলে অভিহিত করেন এবং ২০১৮ সালে যুক্তরাষ্ট্রকে এই চুক্তি থেকে বের করে নেন। তিনি ইরানের ওপর পুনরায় নিষেধাজ্ঞা আরোপ করেন।\n   * ইরানের প্রতিক্রিয়া: এর জবাবে ইরানও চুক্তির শর্তগুলো মানা বন্ধ করে দেয় এবং ইউরেনিয়াম সমৃদ্ধকরণ আবার বাড়িয়ে দেয়।\nবর্তমানে জো বাইডেন প্রশাসন এটি পুনরুজ্জীবিত করার চেষ্টা করলেও নানা রাজনৈতিক জটিলতায় চুক্তিটি এখন একটি অনিশ্চিত অবস্থায় রয়েছে।\nসহজ কথায়: ইরানকে পারমাণবিক বোমা বানানো থেকে বিরত রাখা এবং বিনিময়ে ইরানের ওপর থেকে অর্থনৈতিক অবরোধ তুলে নিয়ে দেশটিকে বিশ্ব অর্থনীতির মূলধারায় ফিরিয়ে আনাই ছিল এই চুক্তির মূল প্রেক্ষাপট।", "id": "n2-0-31"}, {"t": "Steps of disarmmament", "b": "আপনার আপলোড করা ছবিতে নিরস্ত্রীকরণের যে ধাপগুলো রয়েছে, সেগুলো ইতিহাসের অত্যন্ত গুরুত্বপূর্ণ কিছু মোড়। এই পদক্ষেপগুলো কেন নেওয়া হয়েছিল এবং কোন পরিস্থিতির কারণে এগুলো জরুরি হয়ে পড়েছিল, তা নিচে বিস্তারিত আলোচনা করা হলো:\n\n১. প্রথম হেগ সম্মেলন (১৮৯৯)\nকেন করা হয়েছিল: উনবিংশ শতাব্দীর শেষভাগে ইউরোপীয় দেশগুলোর মধ্যে অত্যাধুনিক মারণাস্ত্র তৈরির এক বিশাল প্রতিযোগিতা (Arms Race) শুরু হয়েছিল। এটি বন্ধ করে আন্তর্জাতিক বিরোধগুলো যুদ্ধের বদলে আলোচনার মাধ্যমে সমাধান করার জন্য একটি আইনি কাঠামো তৈরি করাই ছিল এর লক্ষ্য।\nপ্রেক্ষাপট: রাশিয়ার জার দ্বিতীয় নিকোলাস এই সম্মেলনের প্রস্তাব করেন। তখন দেশগুলো বিস্ফোরক বুলেট এবং বিষাক্ত গ্যাসের মতো অমানবিক অস্ত্র তৈরিতে ব্যস্ত ছিল। এই যুদ্ধের ব্যয়ভার সামলাতে দেশগুলোর অর্থনীতি হিমশিম খাচ্ছিল, যা থেকে মুক্তি পেতেই এই সম্মেলন ডাকা হয়।\n\n২. ওয়াশিংটন চুক্তি (১৯২২)\nকেন করা হয়েছিল: প্রথম বিশ্বযুদ্ধের পর বিশ্বের শক্তিশালী দেশগুলোর (বিশেষ করে যুক্তরাষ্ট্র, যুক্তরাজ্য এবং জাপান) মধ্যে নৌ-বাহিনীর শক্তি বাড়ানোর তীব্র প্রতিযোগিতা শুরু হয়। এই নৌ-শক্তি বা রণতরীর সংখ্যা সীমাবদ্ধ করে সামুদ্রিক আধিপত্যের লড়াই থামানোই ছিল এই চুক্তির মূল উদ্দেশ্য।\nপ্রেক্ষাপট: প্রথম বিশ্বযুদ্ধ শেষ হওয়ার পর দেখা গেল, নৌ-বাহিনীর পেছনে অত্যাধিক খরচ বিশ্ব অর্থনীতিকে পঙ্গু করে দিচ্ছে। বিশেষ করে প্রশান্ত মহাসাগরীয় অঞ্চলে আধিপত্য নিয়ে যুক্তরাষ্ট্র ও জাপানের মধ্যে উত্তেজনার পারদ চড়ছিল। সেই সম্ভাব্য যুদ্ধ এড়াতে এবং সামরিক ব্যয় কমাতে এই চুক্তি করা হয়।\n\n৩. বারুচ পরিকল্পনা (১৯৪৬)\nকেন করা হয়েছিল: এটি ছিল পারমাণবিক অস্ত্র নিয়ন্ত্রণের প্রথম বৈশ্বিক উদ্যোগ। এর লক্ষ্য ছিল একটি আন্তর্জাতিক সংস্থা (International Atomic Development Authority) গঠন করা, যারা বিশ্বের সব পারমাণবিক কার্যক্রমের ওপর নিয়ন্ত্রণ রাখবে এবং কোনো দেশের কাছেই যেন পারমাণবিক বোমা না থাকে তা নিশ্চিত করবে।\nপ্রেক্ষাপট: ১৯৪৫ সালে হিরোশিমা ও নাগাসাকিতে পারমাণবিক বোমার ভয়াবহ ধ্বংসলীলা বিশ্বকে আতঙ্কিত করে তোলে। তখন কেবল যুক্তরাষ্ট্রের কাছেই এই প্রযুক্তি ছিল। এই মারণাস্ত্রের বিস্তার রোধ করতে এবং সোভিয়েত ইউনিয়ন যেন পারমাণবিক শক্তি অর্জন করতে না পারে, সেই কৌশল থেকেই যুক্তরাষ্ট্র এই পরিকল্পনা পেশ করে।\n\n৪. গ্র্যামিকো পরিকল্পনা (১৯৪৬)\nকেন করা হয়েছিল: এটি ছিল বারুচ পরিকল্পনার বিপরীতে সোভিয়েত ইউনিয়নের একটি পাল্টা প্রস্তাব। সোভিয়েত ইউনিয়ন চেয়েছিল, আগে দেশগুলোর কাছে থাকা বিদ্যমান সব পারমাণবিক অস্ত্র ধ্বংস করতে হবে এবং এই অস্ত্রের উৎপাদন ও ব্যবহার সম্পূর্ণ নিষিদ্ধ করতে হবে।\nপ্রেক্ষাপট: সোভিয়েত ইউনিয়ন মনে করেছিল যে বারুচ পরিকল্পনা আসলে যুক্তরাষ্ট্রের পারমাণবিক আধিপত্য বজায় রাখার একটি চাল। কারণ সেই সময় কেবল আমেরিকার কাছেই পারমাণবিক বোমা ছিল। নিজেদের নিরাপত্তা নিশ্চিত করতে এবং আমেরিকার একচ্ছত্র ক্ষমতা চ্যালেঞ্জ করতেই আন্দ্রে গ্র্যামিকো এই বিকল্প প্রস্তাবটি দিয়েছিলেন।", "id": "n2-0-32"}, {"t": "Steps of disarmmament: সারসংক্ষেপ", "b": "পদক্ষেপ\n\tমূল কারণ\n\tমূল প্রেক্ষাপট\n\tপ্রথম হেগ সম্মেলন\n\tঅমানবিক অস্ত্র ও বাজেট নিয়ন্ত্রণ\n\tইউরোপীয় দেশগুলোর মারণাস্ত্র প্রতিযোগিতা\n\tওয়াশিংটন চুক্তি\n\tনৌ-শক্তির সীমানা নির্ধারণ\n\tপ্রশান্ত মহাসাগরে আধিপত্য নিয়ে উত্তেজনা\n\tবারুচ পরিকল্পনা\n\tপারমাণবিক প্রযুক্তির আন্তর্জাতিক নিয়ন্ত্রণ\n\tহিরোশিমা-নাগাসাকির ধ্বংসযজ্ঞ ও মার্কিন ভয়\n\tগ্র্যামিকো পরিকল্পনা\n\tপারমাণবিক অস্ত্র সম্পূর্ণ নিষিদ্ধকরণ\n\tমার্কিন পারমাণবিক একাধিপত্যের বিরোধিতা\n\tআপনার পড়াশোনায় এই বিষয়গুলো থেকে প্রশ্ন আসার সম্ভাবনা অনেক বেশি, বিশেষ করে BCS বা প্রতিযোগিতামূলক পরীক্ষায় এই সাল এবং প্রেক্ষাপটগুলো সরাসরি জানতে চাওয়া হয়।", "id": "n2-0-33"}], "id": "n2-0", "n": 2}, {"title": "যুক্তরাষ্ট্র–সোভিয়েত চুক্তি ও পারমাণবিক বিরোধী উদ্যোগ", "chunks": [{"t": "INF Treaty", "b": "Intermediate-Range Nuclear Forces Treaty - Wikipedia\n\nINF (Intermediate-Range Nuclear Forces) Treaty বা মধ্যম পাল্লার পারমাণবিক শক্তি চুক্তি ছিল স্নায়ুযুদ্ধের মোড় ঘুরিয়ে দেওয়া অন্যতম একটি চুক্তি। এটি ১৯৮৭ সালে মার্কিন প্রেসিডেন্ট রোনাল্ড রিগ্যান এবং সোভিয়েত নেতা মিখাইল গর্বাচেভ স্বাক্ষর করেন।\nনিচে আপনার প্রশ্নের উত্তরগুলো বিস্তারিত আলোচনা করা হলো:\n১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nএই চুক্তির প্রধান উদ্দেশ্য ছিল একটি নির্দিষ্ট শ্রেণীর মিসাইল পুরোপুরি বিলুপ্ত করা। এর কারণগুলো হলো:\n   * নির্দিষ্ট পাল্লার মিসাইল ধ্বংস করা: ৫০০ থেকে ৫,৫০০ কিলোমিটার পাল্লার ভূমি থেকে উৎক্ষেপণযোগ্য সব ধরনের ব্যালিস্টিক ও ক্রুজ মিসাইল নিষিদ্ধ এবং ধ্বংস করা।\n   * আকস্মিক যুদ্ধের ঝুঁকি কমানো: এই মাঝারি পাল্লার মিসাইলগুলো খুব দ্রুত (কয়েক মিনিটের মধ্যে) লক্ষ্যবস্তুতে আঘাত হানতে পারত। ফলে কোনো পক্ষই পাল্টা ব্যবস্থা নেওয়ার পর্যাপ্ত সময় পেত না, যা যুদ্ধের ঝুঁকি বাড়িয়ে দিত।\n   * ইউরোপের নিরাপত্তা: এই মিসাইলগুলোর প্রধান লক্ষ্য ছিল ইউরোপের বিভিন্ন শহর। ইউরোপকে পারমাণবিক যুদ্ধের রণক্ষেত্র হওয়া থেকে বাঁচানো ছিল এর বড় লক্ষ্য।\n\n২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nএই চুক্তির মূলে ছিল আশির দশকের তীব্র উত্তেজনা এবং 'মিসাইল সংকট':\n   * সোভিয়েত SS-20 মিসাইল মোতায়েন (১৯৭৫): সত্তরের দশকের মাঝামাঝি সোভিয়েত ইউনিয়ন পূর্ব ইউরোপে অত্যাধুনিক এবং শক্তিশালী SS-20 মিসাইল মোতায়েন করে। এটি ইউরোপের বড় শহরগুলোকে সরাসরি হুমকির মুখে ফেলে দেয়।\n   * ন্যাটোর \"Double-Track\" সিদ্ধান্ত (১৯৭৯): সোভিয়েত হুমকির জবাবে ন্যাটো সিদ্ধান্ত নেয় যে, একদিকে তারা আলোচনার চেষ্টা করবে, অন্যদিকে জার্মানি ও যুক্তরাজ্যসহ ইউরোপের দেশগুলোতে আমেরিকার 'পারশিং-২' (Pershing II) এবং ক্রুজ মিসাইল মোতায়েন করবে। এর ফলে ইউরোপে এক ভয়াবহ অস্ত্র প্রতিযোগিতা শুরু হয়।\n   * ইউরোপ জুড়ে গণবিক্ষোভ: আশির দশকে ইউরোপের সাধারণ মানুষ নিজেদের দেশে পারমাণবিক মিসাইল রাখার বিরুদ্ধে বিশাল বিশাল মিছিল ও আন্দোলন শুরু করে। এই জনমত সরকারগুলোর ওপর প্রচণ্ড চাপ তৈরি করে।\n   * গর্বাচেভের সংস্কার নীতি: ১৯৮৫ সালে মিখাইল গর্বাচেভ ক্ষমতায় আসার পর তিনি বুঝতে পারেন যে, বিশাল সামরিক ব্যয় সোভিয়েত অর্থনীতিকে ধ্বংস করে দিচ্ছে। তিনি 'গ্লাসনস্ত' ও 'পেরেস্ত্রোইকা' নীতির মাধ্যমে পশ্চিমাদের সাথে সম্পর্ক উন্নয়নের উদ্যোগ নেন।\n\n৩. এই চুক্তির বিশেষত্ব ও বর্তমান অবস্থা:\n   * ঐতিহাসিক অর্জন: এই চুক্তির ফলে প্রায় ২,৬৯২টি মিসাইল ধ্বংস করা হয়েছিল। এটিই ছিল প্রথম চুক্তি যেখানে কোনো অস্ত্রের সংখ্যা কেবল কমানো হয়নি, বরং একটি আস্ত ক্যাটাগরি পুরোপুরি নিষিদ্ধ করা হয়েছিল।\n   * চুক্তির অবসান: ২০১৯ সালে ডোনাল্ড ট্রাম্পের আমল থেকে যুক্তরাষ্ট্র এই চুক্তি থেকে বের হয়ে যায়। আমেরিকার অভিযোগ ছিল রাশিয়া '9M729' নামক মিসাইল তৈরির মাধ্যমে এই চুক্তি লঙ্ঘন করছে। পাল্টা হিসেবে রাশিয়াও চুক্তিটি স্থগিত করে, ফলে বর্তমানে এই ঐতিহাসিক চুক্তিটি আর কার্যকর নেই।\nসহজ কথায়, ইউরোপে মাঝারি পাল্লার মিসাইলের যে ভয়াবহ পাহাড় তৈরি হয়েছিল, তা সরিয়ে বিশ্বকে একটি বড় ধরনের পারমাণবিক সংঘাত থেকে রক্ষার জন্যই INF Treaty করা হয়েছিল।", "id": "n2-1-0"}, {"t": "ABM treaty", "b": "Anti-Ballistic Missile Treaty - Wikipedia\n\nABM (Anti-Ballistic Missile) Treaty বা ব্যালিস্টিক ক্ষেপণাস্ত্র বিধ্বোধী চুক্তি ছিল স্নায়ুযুদ্ধের সময়ে পরমাণু যুদ্ধের ঝুঁকি কমানোর জন্য নেওয়া অন্যতম একটি যুগান্তকারী পদক্ষেপ। ১৯৭২ সালে যুক্তরাষ্ট্র এবং সোভিয়েত ইউনিয়নের মধ্যে এই চুক্তিটি স্বাক্ষরিত হয়।\nনিচে আপনার প্রশ্নের উত্তরগুলো সহজভাবে দেওয়া হলো:\n১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nএই চুক্তির উদ্দেশ্য ছিল দেশগুলোর মিসাইল ডিফেন্স সিস্টেম বা ক্ষেপণাস্ত্র প্রতিরক্ষা ব্যবস্থাকে সীমিত করা। শুনতে অদ্ভুত মনে হতে পারে—প্রতিরক্ষা ব্যবস্থা কেন সীমিত করা হবে? এর কারণগুলো হলো:\n   * পারস্পরিক ধ্বংসের নিশ্চয়তা (MAD - Mutually Assured Destruction): স্নায়ুযুদ্ধের সময় মূল দর্শন ছিল যে, যদি উভয় পক্ষ জানে যে তারা আক্রান্ত হলে পাল্টা আক্রমণে অপর পক্ষকেও ধ্বংস করে দেবে, তবে কেউই আগে আক্রমণ করবে না। কিন্তু যদি কোনো দেশ একটি শক্তিশালী ডিফেন্স সিস্টেম বানিয়ে ফেলে, তবে তারা ভাববে—\"আমি আগে আক্রমণ করলেও ওদের পাল্টা হামলা আমি ঠেকিয়ে দেব।\" এই ভাবনা থেকেই যুদ্ধের ঝুঁকি বেড়ে যেত।\n   * অস্ত্র প্রতিযোগিতা থামানো: যদি এক দেশ ডিফেন্স সিস্টেম বানাত, তবে অন্য দেশ তা ভাঙার জন্য আরও হাজার হাজার নতুন মিসাইল তৈরি করত। এই চক্র থামাতেই এই চুক্তি করা হয়।\n   * খরচ নিয়ন্ত্রণ: ডিফেন্স সিস্টেম বানানো অত্যন্ত ব্যয়বহুল। এটি সীমিত করে উভয় দেশ তাদের অর্থনীতিতে চাপ কমাতে চেয়েছিল।\n\n২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\n   * সুপারপাওয়ারদের সাম্য অবস্থা (Nuclear Parity): ১৯৬০-এর দশকের শেষ দিকে সোভিয়েত ইউনিয়ন পারমাণবিক অস্ত্রের সংখ্যায় যুক্তরাষ্ট্রের কাছাকাছি চলে আসে। তখন উভয় দেশ বুঝতে পারে যে, কেউ কাউকে পুরোপুরি হারিয়ে দিতে পারবে না।\n   * SALT-I আলোচনা: ১৯৬৯ সালে 'কৌশলগত অস্ত্র সীমাবদ্ধতা আলোচনা' (SALT-I) শুরু হয়। ABM চুক্তি ছিল এই আলোচনারই একটি প্রধান অংশ।\n   * প্রযুক্তিগত উদ্বেগ: তখন সোভিয়েত ইউনিয়ন মস্কোর চারপাশে একটি প্রাথমিক ডিফেন্স সিস্টেম (Galosh) তৈরি শুরু করেছিল। অন্যদিকে যুক্তরাষ্ট্রও 'Safeguard' নামে একটি সিস্টেম নিয়ে কাজ করছিল। এই দুই সিস্টেমের বিস্তার সারা বিশ্বে অস্থিরতা তৈরি করার আশঙ্কা তৈরি করেছিল।\n   * ডেতঁত (Détente) বা উত্তেজনা প্রশমন: সত্তরের দশকের শুরুতে দুই পরাশক্তির মধ্যে সম্পর্কের বরফ গলতে শুরু করে। একে অপরের সাথে যুদ্ধে না জড়িয়ে স্থিতিশীলতা বজায় রাখার মানসিকতা থেকেই এই চুক্তি সম্ভব হয়।\n\n৩. বর্তমান অবস্থা (একটি গুরুত্বপূর্ণ মোড়):\n   * যুক্তরাষ্ট্রের প্রত্যাহার (২০০২): ২০০১ সালের ১১ সেপ্টেম্বরের হামলার পর এবং উত্তর কোরিয়া বা ইরানের মতো দেশগুলোর হুমকি মোকাবিলা করার অজুহাতে, ২০০২ সালে প্রেসিডেন্ট জর্জ ডব্লিউ বুশ এই চুক্তি থেকে একতরফাভাবে বের হয়ে যান।\n   * রাশিয়ার প্রতিক্রিয়া: রাশিয়ার মতে, যুক্তরাষ্ট্র এই চুক্তি থেকে বের হয়ে যাওয়ায় বৈশ্বিক পারমাণবিক স্থিতিশীলতা নষ্ট হয়েছে। এটি বর্তমান সময়ের আমেরিকা-রাশিয়া উত্তেজনার অন্যতম একটি বড় কারণ।\nসহজ কথায়: কেউ যেন নিজেকে খুব বেশি \"সুরক্ষিত\" মনে করে অন্য দেশের ওপর হামলা করার সাহস না পায়, সেই ভারসাম্য বজায় রাখতেই ABM Treaty করা হয়েছিল।", "id": "n2-1-1"}, {"t": "START", "b": "START I - Wikipedia\n\nSTART (Strategic Arms Reduction Treaty) বা কৌশলগত অস্ত্র হ্রাস চুক্তি হলো ইতিহাসের সবচেয়ে সফল নিরস্ত্রীকরণ চুক্তিগুলোর একটি। এটি মূলত আমেরিকা ও রাশিয়ার (তৎকালীন সোভিয়েত ইউনিয়ন) পারমাণবিক বোমার বিশাল পাহাড় ধাপে ধাপে কমিয়ে আনার একটি আইনি প্রক্রিয়া।\nনিচে আপনার প্রশ্নের উত্তরগুলো বিস্তারিত দেওয়া হলো:\n১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nএর আগে যে চুক্তিগুলো হয়েছিল (যেমন SALT), সেগুলো কেবল অস্ত্র বাড়ার গতি কমিয়েছিল। কিন্তু START ছিল প্রথম চুক্তি যা সরাসরি বিদ্যমান অস্ত্র ধ্বংস করার নির্দেশ দিয়েছিল। এর উদ্দেশ্যগুলো হলো:\n   * বিপুল পরিমাণ অস্ত্র ধ্বংস: উভয় দেশের পারমাণবিক ওয়ারহেড এবং সেগুলো বহনকারী ক্ষেপণাস্ত্রের সংখ্যা উল্লেখযোগ্যভাবে কমিয়ে আনা।\n   * স্বচ্ছতা ও পরিদর্শন: এক দেশ অন্য দেশের পারমাণবিক ঘাঁটি সরাসরি পরিদর্শন (On-site inspection) করতে পারবে, যাতে কেউ গোপনে অস্ত্র লুকিয়ে না রাখে।\n   * স্থিতিশীলতা: কোনো দেশ যেন হুট করে এত বেশি শক্তিশালী না হয়ে ওঠে যে তারা অন্য দেশকে আক্রমণ করার সাহস পায়।\n\n২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nSTART-১ চুক্তির পেছনে দীর্ঘ সময়ের কূটনৈতিক লড়াই এবং কিছু বৈশ্বিক পরিবর্তন কাজ করেছে:\n   * স্নায়ুযুদ্ধের শেষ পর্যায় (১৯৮০-এর দশক): আশির দশকের মাঝামাঝি সময়ে এসে দুই পরাশক্তিই বুঝতে পারে যে, হাজার হাজার পারমাণবিক বোমা রাখা কেবল ব্যয়বহুলই নয়, বরং বিপজ্জনক।\n   * রিগ্যান ও গর্বাচেভ রসায়ন: মার্কিন প্রেসিডেন্ট রোনাল্ড রিগ্যান এবং সোভিয়েত নেতা মিখাইল গর্বাচেভ কয়েক দফা শীর্ষ বৈঠকে মিলিত হন (যেমন: জেনেভা ও রেইকাভিক সম্মেলন)। তাদের মধ্যে একটি ব্যক্তিগত সমঝোতা তৈরি হয় যে, \"একটি পারমাণবিক যুদ্ধ জেতা সম্ভব নয় এবং এটি কখনোই লড়া উচিত নয়।\"\n   * সোভিয়েত ইউনিয়নের অর্থনৈতিক সংকট: সোভিয়েত ইউনিয়নের অর্থনীতি সামরিক খাতের ভার আর বইতে পারছিল না। ফলে মিখাইল গর্বাচেভ অভ্যন্তরীণ সংস্কারের জন্য সামরিক ব্যয় কমানোকে অগ্রাধিকার দেন।\n   * প্রযুক্তিগত উৎকর্ষ: তৎকালীন সময়ে স্যাটেলাইট প্রযুক্তির উন্নতির ফলে দেশগুলো একে অপরের ওপর নজরদারি করতে সক্ষম ছিল, যা চুক্তির শর্ত পালনে বিশ্বাসযোগ্যতা বাড়ায়।\n\n৩. START-এর বিভিন্ন সংস্করণ ও বর্তমান অবস্থা:\nএটি কেবল একটি চুক্তি নয়, বরং সময়ের সাথে এর কয়েকটি রূপ এসেছে:\nসংস্করণ\n\tস্বাক্ষর\n\tমূল বিষয়\n\tSTART I\n\t১৯৯১\n\tএটি ছিল সবচেয়ে বড় চুক্তি। এর মাধ্যমে প্রায় ৮০% পারমাণবিক অস্ত্র ধ্বংস করা হয়। এটি ১৯৯১ সালে বুশ ও গর্বাচেভ স্বাক্ষর করেন।\n\tSTART II\n\t১৯৯৩\n\tএমআইআরভি (MIRV) বা বহুমুখী ক্ষেপণাস্ত্র নিষিদ্ধ করার কথা ছিল, কিন্তু এটি পুরোপুরি কার্যকর হয়নি।\n\tNew START\n\t২০১০\n\tবর্তমান সময়ের সবচেয়ে গুরুত্বপূর্ণ চুক্তি। ওবামা ও মেদভেদেভ এটি স্বাক্ষর করেন। এর মাধ্যমে মোতায়েনকৃত ওয়ারহেডের সংখ্যা ১,৫৫০-এ নামিয়ে আনার লক্ষ্য নেওয়া হয়।", "id": "n2-1-2"}, {"t": "START: বর্তমান সংকট (২০২৬-এর প্রেক্ষিতে)", "b": "২০২১ সালে New START চুক্তির মেয়াদ ২০২৬ সাল পর্যন্ত বাড়ানো হয়েছিল। তবে সাম্প্রতিক রাশিয়া-ইউক্রেন যুদ্ধের প্রেক্ষিতে এবং আন্তর্জাতিক উত্তেজনার কারণে রাশিয়া এই চুক্তিতে তাদের অংশগ্রহণ স্থগিত ঘোষণা করেছে। বর্তমান সময়ে এই চুক্তির ভবিষ্যৎ নিয়ে পুরো বিশ্ব অত্যন্ত উদ্বিগ্ন, কারণ এটিই ছিল দুই পরাশক্তির মধ্যে টিকে থাকা সর্বশেষ বড় পারমাণবিক অস্ত্র নিয়ন্ত্রণ চুক্তি।\nসহজ কথায়: স্নায়ুযুদ্ধের শেষে পৃথিবী থেকে পারমাণবিক বোমার ভয়ংকর বোঝা কমিয়ে একটি নিরাপদ বিশ্ব গড়ার লক্ষ্যেই START চুক্তিগুলোর জন্ম হয়েছিল।", "id": "n2-1-3"}, {"t": "salt treaty", "b": "Strategic Arms Limitation Talks - Wikipedia\n\nSALT (Strategic Arms Limitation Talks) বা কৌশলগত অস্ত্র সীমাবদ্ধতা আলোচনা হলো স্নায়ুযুদ্ধের ইতিহাসে পারমাণবিক অস্ত্র নিয়ন্ত্রণের প্রথম বড় এবং সফল পদক্ষেপ। এটি মূলত কোনো একটি একক চুক্তি নয়, বরং দুই দফায় (SALT-I ও SALT-II) সম্পন্ন হওয়া একটি দীর্ঘ প্রক্রিয়া।\nনিচে এটি করার কারণ এবং প্রেক্ষাপট সহজভাবে আলোচনা করা হলো:", "id": "n2-1-4"}, {"t": "salt treaty (১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য))", "b": "১. কেন এই চুক্তি করা হয়েছিল? (উদ্দেশ্য)\nSALT-এর মূল উদ্দেশ্য ছিল পারমাণবিক অস্ত্রের সংখ্যার ওপর একটি \"সিলিং\" বা ঊর্ধ্বসীমা বেঁধে দেওয়া। এর কারণগুলো হলো:\n   * অস্ত্র প্রতিযোগিতার লাগাম টানা: ষাটের দশকে আমেরিকা ও সোভিয়েত ইউনিয়ন পাগলের মতো পারমাণবিক মিসাইল বানাচ্ছিল। এই সংখ্যাকে একটি নির্দিষ্ট গণ্ডির মধ্যে আটকে রাখা ছিল প্রধান লক্ষ্য।\n   * অর্থনৈতিক স্থিতিশীলতা: সামরিক খাতের এই আকাশচুম্বী ব্যয় উভয় দেশের অর্থনীতির ওপর প্রচণ্ড চাপ তৈরি করছিল। বিশেষ করে সোভিয়েত ইউনিয়ন তাদের ভঙ্গুর অর্থনীতি বাঁচাতে সামরিক বাজেট কমাতে চেয়েছিল।\n   * পারমাণবিক সাম্য বজায় রাখা: এক দেশ যেন অন্য দেশের চেয়ে অনেক বেশি শক্তিশালী না হয়ে ওঠে, তা নিশ্চিত করার মাধ্যমে যুদ্ধের ঝুঁকি কমানো।", "id": "n2-1-5"}, {"t": "salt treaty (২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়)", "b": "২. কোন ঘটনার প্রেক্ষিতে এই চুক্তি করা হয়েছিল? (প্রেক্ষাপট)\nSALT চুক্তির পেছনে কিছু গুরুত্বপূর্ণ ঐতিহাসিক মোড় কাজ করেছে:\n   * কিউবান মিসাইল ক্রাইসিস (১৯৬২): এই ঘটনার পর বিশ্ব বুঝতে পারে যে পারমাণবিক যুদ্ধ কতটা কাছে। এরপর থেকেই দুই পরাশক্তি সরাসরি যুদ্ধের বদলে আলোচনার পথ খুঁজতে থাকে।\n   * ডেতঁত (Détente) বা উত্তেজনার শিথিলতা: ১৯৬০-এর দশকের শেষ দিকে দুই দেশের সম্পর্কের বরফ গলতে শুরু করে। তৎকালীন মার্কিন প্রেসিডেন্ট রিচার্ড নিক্সন এবং সোভিয়েত নেতা লিওনিদ ব্রেজনেভ মনে করেছিলেন যে সংঘাতের চেয়ে সমঝোতা বেশি লাভজনক।\n   * প্রযুক্তিগত উৎকর্ষ ও খরচ: ১৯৬০-এর দশকের শেষে 'অ্যান্টি-ব্যালিস্টিক মিসাইল' (ABM) এবং 'মাল্টিপল ওয়ারহেড' (MIRV) প্রযুক্তির উদ্ভাবন শুরু হয়। এই নতুন প্রযুক্তিগুলো মোতায়েন করা ছিল অত্যন্ত ব্যয়বহুল, যা দেশগুলোকে চুক্তির টেবিলে বসতে বাধ্য করে।\n   * ভিয়েতনাম যুদ্ধের চাপ: আমেরিকা ভিয়েতনাম যুদ্ধে জড়িয়ে অর্থনৈতিকভাবে কিছুটা দুর্বল হয়ে পড়েছিল, যা তাদের সোভিয়েত ইউনিয়নের সাথে সমঝোতায় আসতে উৎসাহী করে।", "id": "n2-1-6"}, {"t": "salt treaty (৩. SALT-এর দুটি প্রধান ধাপ:)", "b": "৩. SALT-এর দুটি প্রধান ধাপ:\n   1. SALT-I (১৯৭২):\n   * স্বাক্ষর: রিচার্ড নিক্সন এবং লিওনিদ ব্রেজনেভ।\n   * মূল বিষয়: এটি ইন্টারকন্টিনেন্টাল ব্যালিস্টিক মিসাইল (ICBM) এবং সাবমেরিন থেকে উৎক্ষেপণযোগ্য মিসাইলের (SLBM) সংখ্যা তখনকার অবস্থায় স্থির করে দেয়। এরই অংশ হিসেবে ABM Treaty স্বাক্ষরিত হয়েছিল।\n   2. SALT-II (১৯৭৯):\n   * স্বাক্ষর: জিমি কার্টার এবং লিওনিদ ব্রেজনেভ।\n   * মূল বিষয়: এটি পারমাণবিক বোমার সংখ্যা আরও কমানোর কথা বলেছিল। তবে ১৯৭৯ সালে সোভিয়েত ইউনিয়ন আফগানিস্তান আক্রমণ করলে মার্কিন কংগ্রেস এই চুক্তিটি অনুমোদন (Ratify) করতে অস্বীকার করে। ফলে এটি পূর্ণাঙ্গভাবে কার্যকর হতে পারেনি।", "id": "n2-1-7"}, {"t": "salt treaty (৪. চুক্তির গুরুত্ব:)", "b": "৪. চুক্তির গুরুত্ব:\nSALT চুক্তিগুলো পারমাণবিক বোমার সংখ্যা পুরোপুরি ধ্বংস করেনি (যা পরবর্তীতে START চুক্তির মাধ্যমে করা হয়), কিন্তু এটি প্রথম প্রমাণ করেছিল যে দুই পরাশক্তি যুদ্ধের বদলে টেবিলের ওপর বসে অস্ত্রের নিয়ন্ত্রণ নিয়ে কথা বলতে পারে। এটি পরবর্তী কয়েক দশকের বিশ্বশান্তির ভিত্তি তৈরি করে দিয়েছিল।\nসহজ কথায়, স্নায়ুযুদ্ধের চরম উত্তেজনার সময় দুই পরাশক্তি যখন একে অপরকে ধ্বংস করার শেষ সীমায় পৌঁছে গিয়েছিল, তখন সেই পাগলামি থামানোর প্রথম ব্রেক বা লাগাম ছিল এই SALT Treaty।", "id": "n2-1-8"}, {"t": "নিহন হিদানকায়ো\" (Nihon Hidankyo)", "b": "Nihon Hidankyo - Wikipedia\nNaming : \n\"নিহন হিদানকায়ো\" (Nihon Hidankyo) হলো জাপানি একটি সংগঠনের নাম। এর পূর্ণ রূপ হলো \"নিহন গেনসুবাকু হিগাইশা দান্তাই কিওগি-কাই\" (Nihon Gensuibaku Higaisha Dantai Kyogi-kai)।\nবাংলায় এর আক্ষরিক অর্থ বা পরিচয় হলো: \"জাপানি আণবিক ও হাইড্রোজেন বোমা উত্তরজীবীদের সংগঠনসমূহের কনফেডারেশন\"।\nসহজভাবে এর অর্থ ও প্রেক্ষাপট নিচে দেওয়া হলো:\n   * নিহন (Nihon): জাপান।\n   * হিদানকায়ো (Hidankyo): এটি একটি সংক্ষিপ্ত রূপ। জাপানি ভাষায় 'হিবাকুশা' (Hibakusha) বলতে পারমাণবিক বোমার আঘাতে ক্ষতিগ্রস্তদের বোঝায়। এই হিবাকুশাদের বিভিন্ন ছোট ছোট সংগঠনের সমন্বয়ে গঠিত কেন্দ্রীয় কাউন্সিল বা সংস্থাকেই সংক্ষেপে 'হিদানকায়ো' বলা হয়।\nকেন এটি গুরুত্বপূর্ণ?\n১. হিবাকুশা: ১৯৪৫ সালে হিরোশিমা ও নাগাসাকিতে পারমাণবিক বোমা হামলার শিকার ব্যক্তিদের অধিকার রক্ষায় এবং পারমাণবিক অস্ত্র ও যুদ্ধের বিরুদ্ধে সচেতনতা তৈরিতে এই সংগঠনটি কাজ করে।\n২. নোবেল শান্তি পুরস্কার: ২০২৪ সালে পারমাণবিক অস্ত্রমুক্ত পৃথিবী গড়ার প্রচেষ্টায় অসামান্য অবদানের জন্য এই সংগঠনটি নোবেল শান্তি পুরস্কার লাভ করেছে।\nমূলত, এটি কেবল একটি নাম নয়, বরং পারমাণবিক যুদ্ধের ভয়াবহতার বিরুদ্ধে শান্তির এক দীর্ঘ সংগ্রামের প্রতীক।\n\n>>>>>>>>>>>>>> এটি কোনো নিরস্ত্রীকরণ চুক্তি নয়, বরং পারমাণবিক অস্ত্রবিরোধী একটি অত্যন্ত প্রভাবশালী জাপানি সংস্থা।\nনিচে এটি সম্পর্কে বিস্তারিত আলোচনা করা হলো:", "id": "n2-1-9"}, {"t": "নিহন হিদানকায়ো\" (Nihon Hidankyo) (২. কেন এটি গঠন করা হয়েছিল? (উদ্দেশ্য))", "b": "১. নিহন হিদানকায়ো কী?\nএর পূর্ণ নাম হলো জাপান কনফেডারেশন অফ এ-অ্যান্ড এইচ-বোম্ব সাফারার্স অর্গানাইজেশনস। ১৯৫৬ সালে জাপানে এটি প্রতিষ্ঠিত হয়। এর সদস্যরা মূলত হিরোশিমা ও নাগাসাকিতে পারমাণবিক বোমার আঘাত থেকে বেঁচে যাওয়া মানুষ, যাদের জাপানি ভাষায় 'হিবাকুশা' (Hibakusha) বলা হয়।\n২. কেন এটি গঠন করা হয়েছিল? (উদ্দেশ্য)\n   * পারমাণবিক অস্ত্র নির্মূল: বিশ্ব থেকে পারমাণবিক অস্ত্র সম্পূর্ণ নির্মূল করার জন্য বিশ্বজুড়ে জনমত গঠন করা।\n   * হিবাকুশাদের অধিকার রক্ষা: যারা বোমার আঘাতে পঙ্গু বা অসুস্থ হয়েছিলেন, তাদের জন্য জাপানি সরকারের কাছ থেকে চিকিৎসা ও আর্থিক সাহায্য নিশ্চিত করা।\n   * সতর্কতা ছড়িয়ে দেওয়া: পারমাণবিক যুদ্ধের ভয়াবহতা সম্পর্কে বিশ্ববাসীকে জানানো যাতে ভবিষ্যতে আর কখনোই এই মারণাস্ত্র ব্যবহৃত না হয়।", "id": "n2-1-10"}, {"t": "নিহন হিদানকায়ো\" (Nihon Hidankyo) (৩. কোন ঘটনার প্রেক্ষিতে এটি গঠিত হয়েছিল?)", "b": "৩. কোন ঘটনার প্রেক্ষিতে এটি গঠিত হয়েছিল? (প্রেক্ষাপট)\n   * হিরোশিমা ও নাগাসাকি (১৯৪৫): দ্বিতীয় বিশ্বযুদ্ধের শেষ দিকে পারমাণবিক বোমার ভয়াবহতা এই সংস্থার উৎপত্তির মূল কারণ। বেঁচে থাকা মানুষেরা আজীবন তেজস্ক্রিয়তা ও শারীরিক কষ্টের মধ্য দিয়ে যাচ্ছিলেন।\n   * লাকি ড্রাগন ৫ (Lucky Dragon No. 5) ঘটনা (১৯৫৪): ১৯৫৪ সালে প্রশান্ত মহাসাগরের 'বিকিনি অ্যাটল'-এ যুক্তরাষ্ট্র একটি হাইড্রোজেন বোমার (H-Bomb) পরীক্ষা চালায়। সেই তেজস্ক্রিয় ছাইয়ের কবলে পড়ে একটি জাপানি মাছ ধরার নৌকা 'লাকি ড্রাগন ৫'-এর জেলেরা মারাত্মক অসুস্থ হয়ে পড়েন। এই ঘটনা জাপানিদের মধ্যে নতুন করে পারমাণবিক ভীতি ও ক্ষোভের জন্ম দেয়, যার ফলে ১৯৫৬ সালে 'নিহন হিদানকায়ো' প্রতিষ্ঠিত হয়।", "id": "n2-1-11"}, {"t": "নিহন হিদানকায়ো\" (Nihon Hidankyo) (৪. গুরুত্বপূর্ণ সাম্প্রতিক তথ্য (নোবেল শ)", "b": "৪. গুরুত্বপূর্ণ সাম্প্রতিক তথ্য (নোবেল শান্তি পুরস্কার):\nআপনার পরীক্ষার জন্য এটি খুবই গুরুত্বপূর্ণ যে, এই সংস্থাটি তাদের দীর্ঘ কয়েক দশকের শান্তিবাদী আন্দোলনের স্বীকৃতিস্বরূপ ২০২৪ সালে নোবেল শান্তি পুরস্কার লাভ করেছে।\nসহজ কথায়: এটি হিরোশিমা-নাগাসাকির ক্ষতিগ্রস্তদের একটি কণ্ঠস্বর, যারা পৃথিবীকে পারমাণবিক অস্ত্রমুক্ত করার জন্য আমৃত্যু লড়াই করে যাচ্ছে।", "id": "n2-1-12"}, {"t": "ICAN (International Campaign to Abolish Nuclear Weapons)", "b": "International Campaign to Abolish Nuclear Weapons - Wikipedia\n\nআপনার আপলোড করা ছবিতে রয়েছে ICAN (International Campaign to Abolish Nuclear Weapons)। এটি নিহন হিদানকায়োর মতোই একটি বৈশ্বিক নাগরিক সমাজ জোট, যা পারমাণবিক অস্ত্র নিষিদ্ধ করার লড়াইয়ে অগ্রণী ভূমিকা পালন করছে।\nনিচে এর উদ্দেশ্য এবং প্রেক্ষাপট আলোচনা করা হলো:\n১. কেন এটি গঠন করা হয়েছিল? (উদ্দেশ্য)\n   * TPNW বাস্তবায়ন: পারমাণবিক অস্ত্র নিষিদ্ধকরণ চুক্তি (Treaty on the Prohibition of Nuclear Weapons - TPNW) স্বাক্ষর ও কার্যকর করার জন্য বিশ্বজুড়ে প্রচারণা চালানো।\n   * অস্ত্রের অমানবিকতা তুলে ধরা: পারমাণবিক অস্ত্রের ব্যবহারের ফলে যে ভয়াবহ মানবিক বিপর্যয় ঘটে, তার ওপর আলোকপাত করে দেশগুলোকে নিরস্ত্রীকরণে বাধ্য করা।\n   * আইনি চাপ তৈরি করা: পারমাণবিক অস্ত্রকে কেবল রাজনৈতিক বা সামরিক ইস্যু না ভেবে একে একটি 'অবৈধ' এবং 'অমানবিক' অস্ত্র হিসেবে আন্তর্জাতিক আইনে প্রতিষ্ঠিত করা।\n\n২. কোন ঘটনার প্রেক্ষিতে এটি গঠিত হয়েছিল? (প্রেক্ষাপট)\n   * প্রথাগত কূটনীতির ব্যর্থতা: অনেক দশক ধরে NPT (Non-Proliferation Treaty) থাকলেও পারমাণবিক শক্তিধর দেশগুলো তাদের অস্ত্র ধ্বংস করছিল না। এই স্থবিরতা ভাঙার জন্য ২০০৭ সালে অস্ট্রেলিয়ায় এবং পরে বিশ্বজুড়ে ICAN যাত্রা শুরু করে।\n   * মানবিক প্রভাবের ওপর জোর (Humanitarian Initiative): ২০১০ সালের পর থেকে নরওয়ে, মেক্সিকো এবং অস্ট্রিয়ায় অনুষ্ঠিত বেশ কিছু সম্মেলনে পারমাণবিক অস্ত্রের মানবিক প্রভাব নিয়ে নতুন করে আলোচনা শুরু হয়। এই আলোচনার জোয়ারকে একটি সাংগঠনিক রূপ দিতেই ICAN-এর প্রসার ঘটে।\n   * স্থলমাইন নিষিদ্ধকরণ চুক্তির অনুপ্রেরণা: যেভাবে সাধারণ মানুষের চাপে স্থলমাইন (Landmines) নিষিদ্ধ করা সম্ভব হয়েছিল, সেই একই মডেলে পারমাণবিক অস্ত্র নিষিদ্ধ করার স্বপ্ন নিয়ে এটি কাজ শুরু করে।\n\n৩. উল্লেখযোগ্য সাফল্য ও নোবেল পুরস্কার:\n   * ২০১৭ সালে নোবেল শান্তি পুরস্কার: পারমাণবিক অস্ত্রের ভয়াবহ মানবিক পরিণতির দিকে বিশ্ববাসীর দৃষ্টি আকর্ষণ করা এবং চুক্তির মাধ্যমে এই অস্ত্র নিষিদ্ধ করার প্রচেষ্টার জন্য ICAN ২০১৭ সালে নোবেল শান্তি পুরস্কার লাভ করে।\n   * TPNW চুক্তি (২০১৭): এটি ছিল ICAN-এর সবচেয়ে বড় বিজয়। জাতিসংঘের ১২২টি দেশ এই চুক্তিতে ভোট দেয় এবং ২০২১ সালে এটি আন্তর্জাতিক আইন হিসেবে কার্যকর হয়।\nনিহন হিদানকায়ো বনাম ICAN (একটি ছোট পার্থক্য):\n   * নিহন হিদানকায়ো: এটি জাপানিদের (হিবাকুশাদের) নিজস্ব সংগঠন যারা প্রত্যক্ষ অভিজ্ঞতার কথা বলে। (২০২৪ নোবেল বিজয়ী)\n   * ICAN: এটি প্রায় ১০০টি দেশের শত শত বেসরকারি সংস্থার একটি বৈশ্বিক জোট। (২০১৭ নোবেল বিজয়ী)\nসহজ কথায়: ICAN হলো একটি আধুনিক বৈশ্বিক নেটওয়ার্ক যা আইনি এবং কূটনৈতিক চাপের মাধ্যমে পৃথিবীকে পারমাণবিক অস্ত্রমুক্ত করার লক্ষ্যে কাজ করে। আপনার পরীক্ষার জন্য এই দুটি প্রতিষ্ঠানের নোবেল বিজয়ের সালটি মনে রাখা খুব জরুরি।", "id": "n2-1-13"}, {"t": "Global zero (১. কেন এই উদ্যোগ নেওয়া হয়েছিল? (উদ্দেশ্য)", "b": "Global Zero (campaign) - Wikipedia\n\nGlobal Zero হলো পারমাণবিক অস্ত্রমুক্ত বিশ্ব গড়ার লক্ষ্যে পরিচালিত একটি আন্তর্জাতিক অলাভজনক এবং অদলীয় (Non-partisan) উদ্যোগ। ২০০৮ সালের ডিসেম্বরে প্যারিসে এটি আনুষ্ঠানিকভাবে যাত্রা শুরু করে।\nনিচে এটি করার কারণ এবং প্রেক্ষাপট বিস্তারিত আলোচনা করা হলো:\n১. কেন এই উদ্যোগ নেওয়া হয়েছিল? (উদ্দেশ্য)\nগ্লোবাল জিরোর লক্ষ্য কেবল অস্ত্র কমানো নয়, বরং এটি একটি টাইম-বাউন্ড (Time-bound) বা সময়ভিত্তিক পরিকল্পনার মাধ্যমে পারমাণবিক অস্ত্রকে শূন্যে নামিয়ে আনতে চায়। এর মূল উদ্দেশ্যগুলো হলো:\n   * সম্পূর্ণ নির্মূল (Total Elimination): ধাপে ধাপে বিশ্বের সব দেশ থেকে পারমাণবিক অস্ত্র সরিয়ে ফেলা এবং সেগুলো ধ্বংস করা।\n   * অস্ত্রের আধুনিকায়ন বন্ধ: নতুন করে পারমাণবিক প্রযুক্তিতে অর্থ বিনিয়োগ এবং আধুনিকায়ন ঠেকানো।\n   * আন্তর্জাতিক তদারকি: একটি কঠোর আন্তর্জাতিক যাচাইকরণ ব্যবস্থার মাধ্যমে নিশ্চিত করা যে কোনো দেশ আর গোপনে পরমাণু বোমা বানাচ্ছে না।\n   * সন্ত্রাসবাদ রোধ: পারমাণবিক অস্ত্রের সংখ্যা যত কমবে, সন্ত্রাসী গোষ্ঠীগুলোর হাতে এই মারণাস্ত্র পড়ার ঝুঁকি তত কমবে।", "id": "n2-1-14"}, {"t": "Global zero (২. কোন ঘটনার প্রেক্ষিতে এটি করা হয়েছিল? )", "b": "২. কোন ঘটনার প্রেক্ষিতে এটি করা হয়েছিল? (প্রেক্ষাপট)\nএই উদ্যোগটি হুট করে আসেনি, বরং স্নায়ুযুদ্ধের পরবর্তী অস্থিরতা এবং আধুনিক কূটনীতির প্রেক্ষাপটে জন্ম নিয়েছে:\n   * অস্ত্র কমানোর মন্থর গতি: এনপিটি (NPT) বা অন্যান্য চুক্তি থাকলেও পারমাণবিক শক্তিধর দেশগুলো (যুক্তরাষ্ট্র, রাশিয়া) তাদের ভাণ্ডার পুরোপুরি খালি করছিল না। এই স্থবিরতা ভাঙতে একটি শক্তিশালী নাগরিক এবং কূটনৈতিক চাপের প্রয়োজন ছিল।\n   * বিখ্যাত চার ব্যক্তিত্বের নিবন্ধ (The Four Horsemen): ২০০৭ ও ২০০৮ সালে যুক্তরাষ্ট্রের চারজন প্রভাবশালী ব্যক্তিত্ব—হেনরি কিসিঞ্জার, জর্জ শুলজ, উইলিয়াম পেরি এবং স্যাম নুন—'ওয়াল স্ট্রিট জার্নাল'-এ কয়েকটি নিবন্ধ লেখেন। তারা সতর্ক করেন যে পারমাণবিক অস্ত্রের অস্তিত্ব এখন মানবতার জন্য সবচেয়ে বড় হুমকি। তাদের এই বক্তব্য বিশ্বজুড়ে সাড়া ফেলে এবং গ্লোবাল জিরোর ভিত্তি তৈরি করে।\n   * বারাক ওবামার 'প্রাগ ভাষণ' (২০০৯): গ্লোবাল জিরো শুরু হওয়ার ঠিক পরেই ২০০৯ সালে মার্কিন প্রেসিডেন্ট বারাক ওবামা চেক প্রজাতন্ত্রের প্রাগে এক ঐতিহাসিক ভাষণ দেন। সেখানে তিনি ঘোষণা করেন—\"America’s commitment to seek the peace and security of a world without nuclear weapons.\" এটি গ্লোবাল জিরো আন্দোলনকে আন্তর্জাতিকভাবে ব্যাপক বৈধতা দেয়।", "id": "n2-1-15"}, {"t": "Global zero (৩. গ্লোবাল জিরো অ্যাকশন প্ল্যান (ধাপসমূহ)", "b": "৩. গ্লোবাল জিরো অ্যাকশন প্ল্যান (ধাপসমূহ):\nগ্লোবাল জিরো একটি সুনির্দিষ্ট ৪-ধাপের পরিকল্পনা দিয়েছিল:\n   1. ধাপ ১ (২০১০-২০১৩): যুক্তরাষ্ট্র ও রাশিয়ার মধ্যে পারমাণবিক অস্ত্র কমানোর নতুন চুক্তি (যেমন New START)।\n   2. ধাপ ২ (২০১৪-২০১৮): অন্যান্য পারমাণবিক শক্তিধর দেশকে (চীন, ভারত, পাকিস্তান ইত্যাদি) আলোচনার টেবিলে আনা।\n   3. ধাপ ৩ (২০১৯-২০২৩): বৈশ্বিক চুক্তির মাধ্যমে সব পারমাণবিক অস্ত্র ধ্বংসের আইনি বাধ্যবাধকতা তৈরি করা।\n   4. ধাপ ৪ (২০২৪-২০৩০): বিশ্বজুড়ে পারমাণবিক অস্ত্রের সম্পূর্ণ বিলুপ্তি নিশ্চিত করা।", "id": "n2-1-16"}, {"t": "Global zero (৪. বর্তমান অবস্থা:)", "b": "৪. বর্তমান অবস্থা:\nযদিও তাদের লক্ষ্যমাত্রা অনুযায়ী ২০৩০ সালের মধ্যে পৃথিবী পারমাণবিক মুক্ত হওয়া বর্তমান ভূ-রাজনৈতিক প্রেক্ষাপটে (বিশেষ করে ইউক্রেন যুদ্ধ ও তাইওয়ান সংকট) কঠিন মনে হচ্ছে, তবুও গ্লোবাল জিরো এখনো বিশ্বের ৩০০-এর বেশি গুরুত্বপূর্ণ নেতা ও নীতিনির্ধারকদের সাথে নিয়ে কাজ করে যাচ্ছে।\nসহজ কথায়: পারমাণবিক অস্ত্রকে কেবল একটি দেশের ইস্যু না ভেবে পুরো পৃথিবীর জন্য একটি সাধারণ শত্রু হিসেবে চিহ্নিত করে তা শূন্যে নামিয়ে আনাই হলো Global Zero-এর মূল দর্শন। আপনার পরীক্ষার জন্য এটি মনে রাখা দরকার যে এটি কোনো দেশের সরকারি চুক্তি নয়, বরং একটি বিশ্বব্যাপী নাগরিক ও কূটনৈতিক প্রচারণা।", "id": "n2-1-17"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (১. আর্মেনিয়া গণহত্যা (১৯১৫-১৯২৩))", "b": "আপনার সরবরাহ করা তালিকায় থাকা ভয়াবহ গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা নিচে দেওয়া হলো। এই ঘটনাগুলো মানব ইতিহাসের অন্ধকারতম অধ্যায় হিসেবে পরিচিত:\n\n১. আর্মেনিয়া গণহত্যা (১৯১৫-১৯২৩)\n   * স্থান: অটোমান সাম্রাজ্য (বর্তমান তুরস্ক)\n   * বর্ণনা: প্রথম বিশ্বযুদ্ধ চলাকালীন অটোমান তুর্কি সরকার পরিকল্পিতভাবে তাদের সাম্রাজ্যে বসবাসরত সংখ্যালঘু খ্রিস্টান আর্মেনীয়দের নির্মূল করার প্রক্রিয়া শুরু করে। এটি আধুনিক ইতিহাসের প্রথম সুসংগঠিত গণহত্যা হিসেবে বিবেচিত। নির্বাসনের নামে সাধারণ মানুষকে সিরিয়ার মরুভূমির দিকে নিয়ে যাওয়া হতো, যেখানে ক্ষুধা, তৃষ্ণা এবং সরাসরি হত্যাকাণ্ডে প্রায় ১০ থেকে ১৫ লক্ষ আর্মেনীয় প্রাণ হারান।", "id": "n2-1-18"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (২. হলোকাস্ট (দ্বিতীয় বিশ্বযুদ্ধ))", "b": "২. হলোকাস্ট (দ্বিতীয় বিশ্বযুদ্ধ)\n   * স্থান: জার্মানি ও নাৎসি অধিকৃত ইউরোপ\n   * বর্ণনা: অ্যাডলফ হিটলারের নেতৃত্বাধীন নাৎসি বাহিনী ইহুদিদের সম্পূর্ণ নিশ্চিহ্ন করার লক্ষ্য নিয়ে এই নারকীয় হত্যাযজ্ঞ চালায়। গ্যাস চেম্বার, কনসেন্ট্রেশন ক্যাম্প এবং অনাহারে প্রায় ৬০ লক্ষ ইহুদি এবং আরও কয়েক লক্ষ জিপসি, সমকামী ও রাজনৈতিক বিরোধীদের হত্যা করা হয়। এটি মানব ইতিহাসের সবচেয়ে পরিকল্পিত ও যান্ত্রিক হত্যাকাণ্ড।", "id": "n2-1-19"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৩. গুয়ের্নিকা (১৯৩৭))", "b": "৩. গুয়ের্নিকা (১৯৩৭)\n   * স্থান: স্পেন (বাস্ক অঞ্চল)\n   * বর্ণনা: স্প্যানিশ গৃহযুদ্ধের সময় নাৎসি জার্মানি এবং ফ্যাসিবাদী ইতালির বিমান বাহিনী স্পেনের গুয়ের্নিকা শহরে ভয়াবহ বোমাবর্ষণ করে। এটি ছিল ইতিহাসে বেসামরিক জনগণের ওপর আকাশপথে হামলার প্রথম বড় ঘটনাগুলোর একটি। পাবলো পিকাসো তার বিখ্যাত চিত্রকর্ম 'গুয়ের্নিকা'-র মাধ্যমে এই ধ্বংসলীলার চিত্র ফুটিয়ে তুলেছিলেন।", "id": "n2-1-20"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৪. সেব্রেনিৎসা গণহত্যা (১৯৯৫))", "b": "৪. সেব্রেনিৎসা গণহত্যা (১৯৯৫)\n   * স্থান: বসনিয়া ও হার্জেগোভিনা\n   * বর্ণনা: বসনিয়া যুদ্ধের সময় সার্ব বাহিনী বসনিয়া ও হার্জেগোভিনার 'সেব্রেনিৎসা' নামক তথাকথিত নিরাপদ এলাকায় আশ্রয় নেওয়া প্রায় ৮,০০০-এর বেশি মুসলিম পুরুষ ও কিশোরকে মাত্র কয়েক দিনে নির্মমভাবে হত্যা করে। দ্বিতীয় বিশ্বযুদ্ধের পর ইউরোপে সংঘটিত এটিই সবচেয়ে বড় গণহত্যার ঘটনা।", "id": "n2-1-21"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৫. খেমার রুজ / পল পট গণহত্যা (১৯৭৫-১৯৭৯))", "b": "৫. খেমার রুজ / পল পট গণহত্যা (১৯৭৫-১৯৭৯)\n   * স্থান: কম্বোডিয়া\n   * বর্ণনা: পল পটের নেতৃত্বাধীন কমিউনিস্ট খেমার রুজ সরকার কম্বোডিয়াকে একটি কৃষিভিত্তিক সমাজ বানাতে চেয়েছিল। তারা শহরের মানুষকে গ্রামে পাঠিয়ে দেয় এবং বুদ্ধিজীবী, শিক্ষক ও সাধারণ মানুষদের ওপর অকথ্য নির্যাতন চালায়। চার বছরে প্রায় ১৫ থেকে ২০ লক্ষ মানুষ (মোট জনসংখ্যার প্রায় ২৫%) অনাহার, রোগ এবং 'কিলিং ফিল্ডস'-এ নির্যাতনে মারা যায়।", "id": "n2-1-22"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৬. দারফুর গণহত্যা (২০০৩))", "b": "৬. দারফুর গণহত্যা (২০০৩)\n   * স্থান: সুদান\n   * বর্ণনা: সুদানের দারফুর অঞ্চলে অ-আরব আদিবাসীদের বিরুদ্ধে সরকার সমর্থিত 'জানজাউইদ' মিলিশিয়ারা এই অভিযান চালায়। গ্রাম পুড়িয়ে দেওয়া, গণধর্ষণ এবং নির্বিচারে হত্যার ফলে প্রায় ৩ লক্ষ মানুষ নিহত হয় এবং লক্ষ লক্ষ মানুষ বাস্তুচ্যুত হয়ে শরণার্থী শিবিরে আশ্রয় নিতে বাধ্য হয়।", "id": "n2-1-23"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৭. রোহিঙ্গা গণহত্যা (২০১৬-২০১৭))", "b": "৭. রোহিঙ্গা গণহত্যা (২০১৬-২০১৭)\n   * স্থান: মিয়ানমার (রাখাইন রাজ্য)\n   * বর্ণনা: মিয়ানমার সেনাবাহিনী রাখাইন রাজ্যের মুসলিম রোহিঙ্গা জনগোষ্ঠীর ওপর 'ক্লিয়ারেন্স অপারেশন' বা শুদ্ধি অভিযান চালায়। এর ফলে হাজার হাজার রোহিঙ্গাকে হত্যা করা হয় এবং প্রায় ১০ লক্ষ রোহিঙ্গা জীবন বাঁচাতে বাংলাদেশে পালিয়ে আসে। জাতিসংঘ একে \"জাতিগত নিধনের পাঠ্যপুস্তকীয় উদাহরণ\" হিসেবে অভিহিত করেছে।", "id": "n2-1-24"}, {"t": "Global zero: গণহত্যাগুলোর সংক্ষিপ্ত ও বিস্তারিত বর্ণনা (৮. বুচা গণহত্যা (২০২২))", "b": "৮. বুচা গণহত্যা (২০২২)\n   * স্থান: ইউক্রেন\n   * বর্ণনা: ২০২২ সালে ইউক্রেনে রাশিয়ার আগ্রাসনের শুরুতে কিয়েভ অঞ্চলের 'বুচা' শহরটি রুশ বাহিনীর দখলে ছিল। তারা শহরটি ছেড়ে চলে যাওয়ার পর রাস্তাঘাটে হাত বাঁধা অবস্থায় অসংখ্য সাধারণ মানুষের মৃতদেহ পাওয়া যায়। বেসামরিক জনগণের ওপর এই নির্যাতন ও হত্যাকাণ্ড বিশ্বজুড়ে তীব্র নিন্দার ঝড় তোলে এবং যুদ্ধাপরাধ হিসেবে তদন্তাধীন রয়েছে।\n\nদ্রষ্টব্য: এই তালিকাটি বিভিন্ন সময়ের ট্র্যাজেডি তুলে ধরে যা আমাদের মনে করিয়ে দেয় যে শান্তি এবং মানবাধিকার রক্ষার গুরুত্ব কতটা অপরিসীম।", "id": "n2-1-25"}], "id": "n2-1", "n": 2}, {"title": "সংস্থা, জোট ও অন্যান্য চুক্তি", "chunks": [{"t": "মূল নোট", "b": "আন্তর্জাতিক মানবাধিকার ও মানবিক আইন সম্পর্কিত এই কনভেনশন ও সংস্থাগুলোর জন্ম কোনো হঠাৎ সিদ্ধান্ত নয়; বরং প্রতিটির পেছনে রয়েছে নির্দিষ্ট ঐতিহাসিক ট্র্যাজেডি, যুদ্ধ, নির্যাতন ও বৈশ্বিক সংকটের দীর্ঘ অভিজ্ঞতা।\nপ্রথমে আসে Genocide Convention, যা ৯ ডিসেম্বর ১৯৪৮ সালে গৃহীত হয়। এর পেছনের প্রধান প্রেক্ষাপট ছিল World War II এবং বিশেষভাবে Holocaust (১৯৪১–১৯৪৫)। এই সময়ে Adolf Hitler-এর নেতৃত্বে নাৎসি জার্মানি পরিকল্পিতভাবে প্রায় ৬০ লক্ষ ইহুদিকে হত্যা করে এবং আরও বহু গোষ্ঠীকে নিশ্চিহ্ন করার চেষ্টা চালায়। এই ভয়াবহ ঘটনার পর বিশ্ব উপলব্ধি করে যে “গণহত্যা” একটি আলাদা ও ভয়ঙ্কর আন্তর্জাতিক অপরাধ, যা প্রতিরোধ করা জরুরি। Raphael Lemkin এই ধারণাকে আইনি রূপ দেন এবং তার ফলেই এই কনভেনশন গৃহীত হয়, যার লক্ষ্য ছিল ভবিষ্যতে এমন অপরাধ প্রতিরোধ ও শাস্তি নিশ্চিত করা। Genocide Convention - Wikipedia\n\nএকই যুদ্ধের ভয়াবহ অভিজ্ঞতা থেকেই জন্ম নেয় Geneva Conventions, যা ১২ আগস্ট ১৯৪৯ সালে গৃহীত হয়। World War I এবং দ্বিতীয় বিশ্বযুদ্ধে আহত সৈনিক, যুদ্ধবন্দী ও সাধারণ মানুষের ওপর অমানবিক আচরণ বিশ্বকে নাড়িয়ে দেয়। যুদ্ধের সময় কোনো নিয়ম-কানুন না থাকায় ব্যাপক নির্যাতন ও হত্যাকাণ্ড ঘটে। তাই আন্তর্জাতিক সম্প্রদায় সিদ্ধান্ত নেয় যে যুদ্ধ হলেও কিছু মানবিক নীতি মানতেই হবে। এই কনভেনশন সেই নীতিমালা নির্ধারণ করে, যাতে আহত সৈনিক, যুদ্ধবন্দী ও বেসামরিক জনগণ সুরক্ষা পায়। Geneva Conventions - Wikipedia\nএকই বছর, ১০ ডিসেম্বর ১৯৪৮ সালে গৃহীত হয় Universal Declaration of Human Rights। দ্বিতীয় বিশ্বযুদ্ধের নিষ্ঠুরতা—বিশেষ করে গণহত্যা, নির্যাতন, জোরপূর্বক শ্রম—মানবতার প্রতি এক গভীর আঘাত ছিল। এই পরিস্থিতিতে বিশ্ব একটি সাধারণ মানদণ্ড তৈরি করতে চায়, যাতে প্রত্যেক মানুষের মৌলিক অধিকার স্বীকৃত হয়। Eleanor Roosevelt-এর নেতৃত্বে এই ঘোষণাপত্র তৈরি হয়, যা মানবাধিকারের ভিত্তি হিসেবে আজও ব্যবহৃত হচ্ছে। Universal Declaration of Human Rights - Wikipedia\nপরবর্তী সময়ে আন্তর্জাতিক সম্পর্ক ও কূটনীতির জটিলতা বাড়তে থাকলে ১৮ এপ্রিল ১৯৬১ সালে গৃহীত হয় Vienna Convention on Diplomatic Relations। দ্বিতীয় বিশ্বযুদ্ধের পর নতুন নতুন রাষ্ট্র গড়ে ওঠে এবং কূটনৈতিক সম্পর্ক বৃদ্ধি পায়। কিন্তু অনেক ক্ষেত্রে কূটনীতিকদের হয়রানি, গ্রেপ্তার বা দূতাবাসে হামলার ঘটনা ঘটে। এসব সমস্যা সমাধানের জন্য এই কনভেনশন কূটনীতিকদের নিরাপত্তা, ইমিউনিটি এবং দূতাবাসের অখণ্ডতা নিশ্চিত করে। Vienna Convention on Diplomatic Relations - Wikipedia\nএরপর ঠান্ডা যুদ্ধের উত্তেজনাপূর্ণ প্রেক্ষাপটে ১ আগস্ট ১৯৭৫ সালে স্বাক্ষরিত হয় Helsinki Final Act। Cold War চলাকালে ইউরোপ দুই ভাগে বিভক্ত ছিল এবং রাজনৈতিক উত্তেজনা তীব্র ছিল। পূর্ব ইউরোপে মানবাধিকার লঙ্ঘন এবং সীমান্ত সংক্রান্ত বিরোধ পরিস্থিতিকে আরও জটিল করে তোলে। এই প্রেক্ষাপটে হেলসিঙ্কি চুক্তি নিরাপত্তা, অর্থনৈতিক সহযোগিতা এবং মানবাধিকার—এই তিনটি মূল ক্ষেত্রে সমঝোতা তৈরি করে এবং পূর্ব-পশ্চিম সম্পর্ক কিছুটা স্থিতিশীল করে। Helsinki Accords - Wikipedia\nবিশ্বব্যাপী শিশুদের অবস্থা অত্যন্ত নাজুক হয়ে ওঠে ২০শ শতকের মাঝামাঝি সময়ে—শিশুশ্রম, পাচার, যুদ্ধের শিশু সৈনিক ইত্যাদি ব্যাপক আকার ধারণ করে। এই প্রেক্ষাপটে ২০ নভেম্বর ১৯৮৯ সালে গৃহীত হয় Convention on the Rights of the Child। এটি শিশুদের আলাদা সত্তা হিসেবে স্বীকৃতি দেয় এবং তাদের বেঁচে থাকা, সুরক্ষা, বিকাশ ও অংশগ্রহণের অধিকার নিশ্চিত করে।  Convention on the Rights of the Child - Wikipedia\nরাসায়নিক অস্ত্রের ভয়াবহতা প্রথম বড় আকারে দেখা যায় World War I-এ, বিশেষ করে ১৯১৫ সালের Second Battle of Ypres-এ, যেখানে বিষাক্ত গ্যাস ব্যবহার করে হাজার হাজার মানুষকে হত্যা করা হয়। এরপর বিভিন্ন দেশ এই ধরনের অস্ত্র মজুদ করতে থাকে। এই বিপজ্জনক প্রবণতা বন্ধ করতে ১৩ জানুয়ারি ১৯৯৩ সালে গৃহীত হয় Chemical Weapons Convention, যা ১৯৯৭ সালে কার্যকর হয়। এর লক্ষ্য ছিল রাসায়নিক অস্ত্র সম্পূর্ণ নিষিদ্ধ করা এবং বিদ্যমান অস্ত্র ধ্বংস করা। Chemical Weapons Convention - Wikipedia\nমানবাধিকার সুরক্ষাকে আরও শক্তিশালী করতে ১৯৯৩ সালে World Conference on Human Rights-এর মাধ্যমে প্রতিষ্ঠিত হয় Office of the High Commissioner for Human Rights। এই সম্মেলনে সিদ্ধান্ত নেওয়া হয় যে মানবাধিকার রক্ষায় একটি শক্তিশালী, কেন্দ্রীয় নেতৃত্ব প্রয়োজন, যা বিশ্বব্যাপী এই কাজকে সমন্বয় করবে।   World Conference on Human Rights - Wikipedia\nপরবর্তীতে ২০০৬ সালে গঠিত হয় United Nations Human Rights Council, কারণ আগের Commission on Human Rights কার্যকরভাবে কাজ করতে পারছিল না। নতুন এই সংস্থা মানবাধিকার পরিস্থিতি পর্যবেক্ষণ, তদন্ত এবং Universal Periodic Review-এর মাধ্যমে সব দেশকে জবাবদিহিতার আওতায় আনে। United Nations Human Rights Council - Wikipedia\nসবশেষে, ২০ ডিসেম্বর ২০০৬ সালে গৃহীত হয় ICPPED, যার পেছনে রয়েছে ১৯৭০–৮০ দশকের লাতিন আমেরিকার সামরিক শাসনের ভয়াবহ অভিজ্ঞতা, বিশেষ করে Argentine Dirty War। এই সময়ে হাজার হাজার মানুষকে গোপনে অপহরণ করে হত্যা করা হয়, এবং তাদের কোনো তথ্য পরিবারকে দেওয়া হয়নি। এই কনভেনশন সেই “গুম” প্রথাকে আন্তর্জাতিক অপরাধ হিসেবে স্বীকৃতি দেয় এবং ভুক্তভোগীদের অধিকার নিশ্চিত করে। International Convention for the Protection of All Persons from Enforced Disappearance - Wikipedia\nসব মিলিয়ে দেখা যায়, প্রতিটি কনভেনশন বা সংস্থা কোনো না কোনো গভীর মানবিক সংকট, যুদ্ধ বা নির্যাতনের অভিজ্ঞতা থেকে জন্ম নিয়েছে। এগুলো শুধু আইনি দলিল নয়, বরং মানবতার ইতিহাসে ঘটে যাওয়া ভুলগুলোকে আর পুনরাবৃত্তি না করার একটি বৈশ্বিক প্রতিশ্রুতি।", "id": "n2-2-0"}, {"t": "nato (১. ন্যাটো (NATO - North Atla , "b": "৪. ইউএনওডিএ (UNODA - UN Office for Disarmament Affairs)\n   * প্রেক্ষাপট: পারমাণবিক অস্ত্র, রাসায়নিক অস্ত্র এবং অত্যাধুনিক মারণাস্ত্রের প্রতিযোগিতার ফলে বিশ্ব যখন ধ্বংসের মুখে, তখন ১৯৯৮ সালে এই অফিসটি পূর্ণাঙ্গ রূপ পায়।\n   * কারণ: বিশ্বজুড়ে নিরস্ত্রীকরণ (Disarmament) ত্বরান্বিত করা। এর কাজ হলো পারমাণবিক অস্ত্রসহ অন্যান্য গণবিধ্বংসী অস্ত্র নির্মূলে বিভিন্ন দেশকে উৎসাহিত করা এবং ছোট অস্ত্রের অবৈধ পাচার রোধ করা।", "id": "n2-2-4"}, {"t": "nato (৫. ওপিসিডব্লিউ (OPCW - Organization for )", "b": "৫. ওপিসিডব্লিউ (OPCW - Organization for the Prohibition of Chemical Weapons)\n   * প্রেক্ষাপট: ১৯৯৭ সালে কার্যকর হওয়া 'রাসায়নিক অস্ত্র কনভেনশন' (CWC) বাস্তবায়নের জন্য একটি স্বাধীন সংস্থা প্রয়োজন ছিল।\n   * কারণ: সারা বিশ্বে রাসায়নিক অস্ত্রের উৎপাদন ও ব্যবহার স্থায়ীভাবে বন্ধ হয়েছে কি না তা তদারকি করা। এরা বিভিন্ন দেশের ল্যাবরেটরি পরিদর্শন করে এবং রাসায়নিক অস্ত্র ধ্বংস করার প্রক্রিয়ায় কারিগরি সহায়তা দেয়।", "id": "n2-2-5"}, {"t": "nato (৬. আনজুস (ANZUS - Australia, New Zealand)", "b": "৬. আনজুস (ANZUS - Australia, New Zealand, United States Security Treaty)\n   * প্রেক্ষাপট: ১৯৫১ সালে প্রশান্ত মহাসাগরীয় অঞ্চলে নিরাপত্তার অভাব বোধ করছিল অস্ট্রেলিয়া ও নিউজিল্যান্ড। বিশেষ করে জাপানের পুনরায় সামরিক শক্তিতে বলীয়ান হওয়া এবং সাম্যবাদের বিস্তার ছিল উদ্বেগের কারণ।\n   * কারণ: এটি একটি ত্রিপক্ষীয় নিরাপত্তা চুক্তি। প্রশান্ত মহাসাগরীয় অঞ্চলে কোনো সদস্য দেশ আক্রান্ত হলে বাকিরা এগিয়ে আসবে—এই প্রতিশ্রুতি থেকেই এটি তৈরি। (যদিও বর্তমানে নিউজিল্যান্ডের পারমাণবিক মুক্ত নীতির কারণে যুক্তরাষ্ট্রের সাথে তাদের সম্পর্ক এই চুক্তিতে কিছুটা সীমিত)।", "id": "n2-2-6"}, {"t": "nato (৭. ইউরোপীয় সামরিক (European Military / )", "b": "৭. ইউরোপীয় সামরিক (European Military / PESCO)\n   * প্রেক্ষাপট: ইউরোপীয় ইউনিয়ন (EU) দীর্ঘদিন ধরে নিরাপত্তার জন্য ন্যাটোর ওপর নির্ভরশীল ছিল। কিন্তু ব্রেক্সিট পরবর্তী সময়ে এবং যুক্তরাষ্ট্রের নীতির পরিবর্তনের আশঙ্কায় ইইউ নিজস্ব সামরিক সক্ষমতার কথা চিন্তা করে।\n   * কারণ: ইউরোপীয় দেশগুলোর মধ্যে প্রতিরক্ষা খাতে যৌথ বিনিয়োগ ও সামরিক সক্ষমতা বাড়ানো। এর মাধ্যমে ইইউ চায় নিজেদের সীমান্তে বড় কোনো সংকটে ন্যাটোর সাহায্য ছাড়াও স্বাধীনভাবে কাজ করতে।", "id": "n2-2-7"}, {"t": "nato (৮. এইউ পিস কিপিং ফোর্স (AU Peacekeeping )", "b": "৮. এইউ পিস কিপিং ফোর্স (AU Peacekeeping Force)\n   * প্রেক্ষাপট: আফ্রিকান ইউনিয়ন (AU) দেখেছে যে, জাতিসংঘের শান্তি মিশন অনেক সময় আফ্রিকার স্থানীয় সংকট সমাধানে ধীরগতিতে কাজ করে। সোমালিয়া, সুদান বা রুয়ান্ডার মতো গৃহযুদ্ধগুলো এর প্রেক্ষাপট।\n   * কারণ: আফ্রিকার সমস্যা আফ্রিকানদের দিয়েই সমাধান করা। এটি মহাদেশের শান্তি ও স্থিতিশীলতা বজায় রাখতে সশস্ত্র সংঘাতপূর্ণ এলাকায় সৈন্য মোতায়েন করে (যেমন—AMISOM সোমালিয়ায় কাজ করে)।", "id": "n2-2-8"}, {"t": "nato (৯. ওএসসিই (OSCE - Organization for Secur)", "b": "৯. ওএসসিই (OSCE - Organization for Security and Co-operation in Europe)\n   * প্রেক্ষাপট: এটি শীতল যুদ্ধের সময় পূর্ব ও পশ্চিম ব্লকের মধ্যে সংলাপের একটি ফোরাম হিসেবে শুরু হয়েছিল।\n   * কারণ: অস্ত্র নিয়ন্ত্রণ, মানবাধিকার এবং অবাধ নির্বাচন পর্যবেক্ষণের মাধ্যমে ইউরোপে যুদ্ধ এড়ানো। এটি বিশ্বের বৃহত্তম আঞ্চলিক নিরাপত্তা সংস্থা যা কেবল সামরিক নয়, বরং রাজনৈতিক ও পরিবেশগত নিরাপত্তা নিয়েও কাজ করে।", "id": "n2-2-9"}, {"t": "nato (১০. হেলসিংকি অ্যাকর্ড (Helsinki Accord),)", "b": "১০. হেলসিংকি অ্যাকর্ড (Helsinki Accord), ১৯৭৫\n   * প্রেক্ষাপট: শীতল যুদ্ধের চরম উত্তেজনা কমানোর জন্য (Détente) ইউরোপের দেশগুলো একটি সমঝোতায় পৌঁছাতে চেয়েছিল।\n   * কারণ: দ্বিতীয় বিশ্বযুদ্ধ পরবর্তী ইউরোপীয় সীমানা স্বীকার করে নেওয়া এবং দেশগুলোর মধ্যে অর্থনৈতিক ও বৈজ্ঞানিক সহযোগিতা বাড়ানো। এতে মানবাধিকার রক্ষার যে শর্ত ছিল, তা পরবর্তীতে সোভিয়েত ইউনিয়নের পতন এবং গণতন্ত্রের প্রসারে বড় ভূমিকা রাখে।", "id": "n2-2-10"}, {"t": "nato (১১. মালি-নাইজার-বুরকিনা ফাসো কনফেডারেশন )", "b": "১১. মালি-নাইজার-বুরকিনা ফাসো কনফেডারেশন (Alliance of Sahel States - AES)\n   * প্রেক্ষাপট: ২০২৩-২৪ সালে এই তিনটি দেশে সামরিক অভ্যুত্থান ঘটে এবং তারা সাবেক ঔপনিবেশিক শক্তি ফ্রান্স ও পশ্চিম আফ্রিকান জোট ECOWAS-এর দিক থেকে চাপের মুখে পড়ে।\n   * কারণ: যৌথ প্রতিরক্ষা নিশ্চিত করা এবং নিজেদের সার্বভৌমত্ব রক্ষা করা। তারা মূলত পশ্চিমা হস্তক্ষেপ ছাড়াই জিহাদি সন্ত্রাসবাদ মোকাবিলা এবং নিজেদের মধ্যে অর্থনৈতিক ও সামরিক জোট গড়ার জন্য এই কনফেডারেশন তৈরি করেছে।", "id": "n2-2-11"}, {"t": "nato (১২. ইএসএসআই (ESSI - European Sky Shield )", "b": "১২. ইএসএসআই (ESSI - European Sky Shield Initiative)\n   * প্রেক্ষাপট: ২০২২ সালে রাশিয়া-ইউক্রেন যুদ্ধ শুরু হওয়ার পর ইউরোপীয় আকাশসীমা অরক্ষিত মনে হতে থাকে। রাশিয়ার ক্ষেপণাস্ত্র হামলার ঝুঁকি মোকাবিলাই এর প্রধান কারণ।\n   * কারণ: জার্মানির নেতৃত্বে এই উদ্যোগটি নেওয়া হয়েছে ইউরোপের আকাশ প্রতিরক্ষা ব্যবস্থাকে (Air Defense) একীভূত করার জন্য। সদস্য দেশগুলো যৌথভাবে উন্নত প্রতিরক্ষা সরঞ্জাম (যেমন—Patriot বা Arrow 3) ক্রয় ও মোতায়েন করে যেন রাশিয়ার যেকোনো ড্রোন বা ক্ষেপণাস্ত্র হামলা প্রতিহত করা যায়।", "id": "n2-2-12"}, {"t": "Gpt", "b": "আন্তর্জাতিক নিরাপত্তা, সামরিক জোট ও নিরস্ত্রীকরণ নিয়ে যেসব সংস্থা ও উদ্যোগের নাম তুমি বলেছ, সেগুলোর পেছনেও নির্দিষ্ট ঐতিহাসিক পরিস্থিতি, যুদ্ধ, ভূ-রাজনৈতিক টানাপোড়েন এবং নিরাপত্তা সংকট কাজ করেছে। নিচে এগুলো ধারাবাহিকভাবে সুন্দরভাবে ব্যাখ্যা করা হলো।\nদ্বিতীয় বিশ্বযুদ্ধের পরপরই বিশ্ব রাজনীতি দ্রুত দুই ভাগে বিভক্ত হয়ে পড়ে—একদিকে যুক্তরাষ্ট্রের নেতৃত্বাধীন পুঁজিবাদী ব্লক, অন্যদিকে সোভিয়েত ইউনিয়নের নেতৃত্বাধীন সমাজতান্ত্রিক ব্লক। এই উত্তেজনাপূর্ণ প্রেক্ষাপটে ৪ এপ্রিল ১৯৪৯ সালে প্রতিষ্ঠিত হয় North Atlantic Treaty Organization। এর মূল উদ্দেশ্য ছিল সোভিয়েত সম্প্রসারণ ঠেকানো এবং সদস্য দেশগুলোর সম্মিলিত নিরাপত্তা নিশ্চিত করা। “একজনের ওপর আক্রমণ মানে সবার ওপর আক্রমণ”—এই নীতির মাধ্যমে NATO একটি শক্তিশালী সামরিক জোটে পরিণত হয়। পরবর্তীতে এই জোটকে ঘিরেই “NATO Plus” ধারণা তৈরি হয়, যা মূলত NATO সদস্যদের সঙ্গে ঘনিষ্ঠ মিত্র দেশগুলো (যেমন জাপান, অস্ট্রেলিয়া)কে কৌশলগতভাবে যুক্ত করার একটি আধুনিক ভূ-রাজনৈতিক ধারণা, বিশেষ করে চীনকে মোকাবিলা করার প্রেক্ষাপটে।\nমধ্যপ্রাচ্যে সন্ত্রাসবাদ ও সাম্প্রদায়িক সহিংসতার বিস্তার, বিশেষ করে আল-কায়েদা ও আইএসআইএসের উত্থানের পর ২০১৫ সালে সৌদি আরবের উদ্যোগে গঠিত হয় Islamic Military Counter Terrorism Coalition। এই জোটের লক্ষ্য ছিল মুসলিম দেশগুলোর মধ্যে সমন্বয় ঘটিয়ে সন্ত্রাসবাদ মোকাবিলা করা এবং ইসলামকে জঙ্গিবাদের সঙ্গে যুক্ত করার ধারণাকে প্রতিহত করা।\nবিশ্বব্যাপী অস্ত্র নিয়ন্ত্রণ ও নিরস্ত্রীকরণের প্রয়োজনীয়তা অনুভূত হয় বিশেষ করে দ্বিতীয় বিশ্বযুদ্ধ ও পারমাণবিক অস্ত্র ব্যবহারের পর। এই প্রেক্ষাপটে জাতিসংঘের অধীনে কাজ করে United Nations Office for Disarmament Affairs, যা আন্তর্জাতিক নিরাপত্তা নিশ্চিত করতে অস্ত্র কমানো, বিশেষ করে পারমাণবিক অস্ত্র নিয়ন্ত্রণে ভূমিকা রাখে।\nরাসায়নিক অস্ত্রের ভয়াবহতা প্রথম বিশ্বযুদ্ধ থেকেই স্পষ্ট হয়ে ওঠে, আর পরে বিভিন্ন রাষ্ট্র এগুলো মজুদ করতে থাকে। এই পরিস্থিতি মোকাবিলায় ১৯৯৭ সালে কার্যকর হওয়া Organisation for the Prohibition of Chemical Weapons গঠিত হয়, যা Chemical Weapons Convention বাস্তবায়ন করে। এর কাজ হলো রাসায়নিক অস্ত্র ধ্বংস করা এবং কোনো দেশ যেন গোপনে এসব অস্ত্র তৈরি করতে না পারে তা নিশ্চিত করা।\nশীতল যুদ্ধের সময় এশিয়া-প্রশান্ত মহাসাগরীয় অঞ্চলেও নিরাপত্তা উদ্বেগ বাড়তে থাকে। এই প্রেক্ষাপটে ১ সেপ্টেম্বর ১৯৫১ সালে গঠিত হয় ANZUS (Australia, New Zealand, USA)। এর উদ্দেশ্য ছিল এই অঞ্চলে কমিউনিজমের বিস্তার ঠেকানো এবং পারস্পরিক প্রতিরক্ষা নিশ্চিত করা।\nইউরোপে দীর্ঘদিনের যুদ্ধ ও সংঘাতের ইতিহাস, বিশেষ করে দুই বিশ্বযুদ্ধের অভিজ্ঞতা, ইউরোপীয় দেশগুলোকে সামরিক ও রাজনৈতিকভাবে একত্রিত হওয়ার দিকে ঠেলে দেয়। এর ফলে ধীরে ধীরে গড়ে ওঠে ইউরোপীয় নিরাপত্তা কাঠামো, যা আজকের European Union-এর Common Security and Defence Policy (CSDP) হিসেবে পরিচিত। এর লক্ষ্য হলো ইউরোপে শান্তি বজায় রাখা, সংকট ব্যবস্থাপনা করা এবং যৌথ সামরিক সক্ষমতা তৈরি করা।\nআফ্রিকার দেশগুলোও নিজেদের নিরাপত্তা নিশ্চিত করতে উদ্যোগ নেয়। ২০০২ সালে প্রতিষ্ঠিত African Union এর অধীনে একটি peacekeeping force গঠন করা হয়, যা সংঘাতপূর্ণ এলাকায় শান্তিরক্ষা মিশন পরিচালনা করে। রুয়ান্ডা গণহত্যা (১৯৯৪) এবং বিভিন্ন গৃহযুদ্ধ এই উদ্যোগের পেছনে বড় প্রভাব ফেলে।\nইউরোপ ও আশেপাশের অঞ্চলে নিরাপত্তা ও সহযোগিতা নিশ্চিত করতে শীতল যুদ্ধের সময় গড়ে ওঠে Organization for Security and Co-operation in Europe, যার ভিত্তি হলো Helsinki Final Act বা Helsinki Accord (১ আগস্ট ১৯৭৫)। এই চুক্তি পূর্ব ও পশ্চিম ব্লকের মধ্যে উত্তেজনা কমাতে, সীমান্ত সম্মান করতে এবং মানবাধিকার রক্ষা করতে গুরুত্বপূর্ণ ভূমিকা রাখে।\nসাম্প্রতিক সময়ের একটি উল্লেখযোগ্য আঞ্চলিক উন্নয়ন হলো Alliance of Sahel States, যা ২০২৩ সালে মালি, নাইজার ও বুরকিনা ফাসো গঠন করে।  "b": "নামকরণ\nযুক্তরাষ্ট্রের ওহাইও অঙ্গরাজ্যের এই শহরটির নামকরণ করা হয়েছে জোনাথন ডেটন (Jonathan Dayton)-এর নামানুসারে।\n   * কে ছিলেন তিনি? জোনাথন ডেটন ছিলেন একজন মার্কিন রাজনীতিবিদ এবং যুক্তরাষ্ট্রের সংবিধানের অন্যতম স্বাক্ষরকারী।\n   * কেন তার নাম? ১৭৯৬ সালে যখন শহরটি পত্তন করা হয়, তখন জোনাথন ডেটন সেই বিশাল ভূখণ্ডের মালিকদের একজন ছিলেন। যদিও তিনি ব্যক্তিগতভাবে কখনো ওই শহরে পা রাখেননি, তবুও মালিকানার সূত্রে তার নামেই শহরটির নাম রাখা হয়।\nঐতিহাসিক গুরুত্ব: ডেটন চুক্তি (Dayton Agreement)\nআপনার আগের প্রশ্নগুলোর (গণহত্যা বিষয়ক) প্রেক্ষাপটে 'ডেটন' শব্দটি অত্যন্ত গুরুত্বপূর্ণ। কারণ, এই শহরেই ১৯৯৫ সালে বিখ্যাত ডেটন চুক্তি স্বাক্ষরিত হয়েছিল।\n   * উদ্দেশ্য: বসনিয়া ও হার্জেগোভিনায় রক্তক্ষয়ী গৃহযুদ্ধ (যেখানে সেব্রেনিৎসা গণহত্যা ঘটেছিল) বন্ধ করার জন্য এই শান্তি চুক্তি করা হয়।\n   * স্থান: ওহাইওর ডেটনের কাছে 'রাইট-প্যাটারসন এয়ার ফোর্স বেস'-এ এই আলোচনার চুক্তি চূড়ান্ত হয়। এর মাধ্যমেই বলকান অঞ্চলে দীর্ঘদিনের যুদ্ধের অবসান ঘটে।\nঅন্যান্য পরিচিতি\n   * এভিয়েশন বা বিমান চালনা: ডেটনকে \"Birthplace of Aviation\" বলা হয়। কারণ, উড়োজাহাজের আবিষ্কারক রাইট ভ্রাতৃদ্বয় (Orville and Wilbur Wright) এই শহরেরই বাসিন্দা ছিলেন এবং এখানেই তাদের গবেষণাগার ছিল।\n   * উদ্ভাবন: ক্যাশ রেজিস্টার থেকে শুরু করে গাড়ির সেলফ-স্টার্টার—অনেক গুরুত্বপূর্ণ আবিষ্কারের কেন্দ্র ছিল এই শহর।\nসারসংক্ষেপ: শহরটির নাম একজন ভূস্বামীর নামে হলেও, বিশ্ব ইতিহাসে এটি শান্তি চুক্তি (বসনিয়া যুদ্ধ বিরতি) এবং উড়োজাহাজ আবিষ্কারের শহর হিসেবেই বেশি পরিচিত।", "id": "n2-2-15"}], "id": "n2-2", "n": 2}, {"title": "পরিবেশ সম্মেলন ও চুক্তি", "chunks": [{"t": "UNCHE", "b": "আপনি সম্ভবত UNCHR (যা মূলত UNHCR) অথবা UNCHE সম্পর্কে জানতে চেয়েছেন। প্রেক্ষাপট বিবেচনা করলে দুটিই গুরুত্বপূর্ণ। আমি দুটিরই বিস্তারিত নিচে দিচ্ছি:\n১. ইউএনসিএইচই (UNCHE - United Nations Conference on the Human Environment), ১৯৭২\nএটি ইতিহাসের অত্যন্ত গুরুত্বপূর্ণ একটি মোড়, কারণ এখান থেকেই আধুনিক পরিবেশ আন্দোলনের সূচনা হয়।\n* বিস্তারিত প্রেক্ষাপট: ১৯৫০ ও ৬০-এর দশকে শিল্পায়নের ফলে বিশ্বজুড়ে বায়ু ও পানি দূষণ চরম আকার ধারণ করে। অ্যাসিড বৃষ্টি এবং সমুদ্রের দূষণ নিয়ে উন্নত দেশগুলো উদ্বিগ্ন হয়ে পড়ে। সুইডেন প্রথম প্রস্তাব করে যে, পরিবেশ রক্ষায় একটি বিশ্ব সম্মেলন দরকার। এর ফলে ১৯৭২ সালে সুইডেনের স্টকহোমে এই সম্মেলন অনুষ্ঠিত হয় (যা স্টকহোম কনফারেন্স নামেও পরিচিত)।\n* মূল কারণ: * পরিবেশ রক্ষার জন্য প্রথমবারের মতো কিছু আন্তর্জাতিক নিয়ম (Stockholm Declaration) তৈরি করা।\n   * মানুষের পরিবেশগত অধিকার এবং উন্নয়নের মধ্যে ভারসাম্য বজায় রাখা।\n   * সবচেয়ে বড় অর্জন ছিল এই সম্মেলনের মাধ্যমেই UNEP (United Nations Environment Programme) প্রতিষ্ঠিত হয় এবং প্রতি বছর ৫ জুন 'বিশ্ব পরিবেশ দিবস' পালনের সিদ্ধান্ত নেওয়া হয়।\n\n২. ইউএনএইচসিআর (UNHCR - United Nations High Commissioner for Refugees), ১৯৫০\n(যদি আপনি রিফিউজি বা শরণার্থী বিষয়ক সংস্থাটি বুঝিয়ে থাকেন)\n* বিস্তারিত প্রেক্ষাপট: দ্বিতীয় বিশ্বযুদ্ধের ফলে ইউরোপের প্রায় ১২ লক্ষ মানুষ ঘরবাড়ি হারিয়ে উদ্বাস্তু হয়ে পড়েছিল। তাদের পুনর্বাসন এবং পরিচয়হীনতা দূর করার জন্য একটি সাময়িক সংস্থার প্রয়োজন ছিল। প্রথমে এটি মাত্র ৩ বছরের জন্য তৈরি করা হয়েছিল।\n* মূল কারণ: * শরণার্থীদের জীবন রক্ষা করা এবং তাদের অধিকার নিশ্চিত করা।\n   * কাউকে যেন জোরপূর্বক এমন দেশে ফেরত না পাঠানো হয় যেখানে তার জীবন বিপন্ন হতে পারে (Principle of Non-refoulement)।\n   * বর্তমানে এটি কেবল যুদ্ধ নয়, বরং জলবায়ু পরিবর্তন বা রাজনৈতিক কারণে উদ্বাস্তু হওয়া কোটি কোটি মানুষের জন্য স্থায়ীভাবে কাজ করছে।\n\n৩. ইউএনসিএইচইএ (UNCHR - UN Commission on Human Rights)\n(এটি মানবাধিকার বিষয়ক কমিশন, যা পরে ২০০৬ সালে UNHRC-তে রূপান্তরিত হয়, যা নিয়ে আমরা আগে আলোচনা করেছি।)\n* প্রেক্ষাপট: ১৯৪৬ সালে এটি গঠিত হয়েছিল মূলত মানবাধিকারের আন্তর্জাতিক মানদণ্ড (যেমন: UDHR) তৈরির জন্য।\n* কারণ: বিশ্বজুড়ে মানবাধিকার লঙ্ঘনের অভিযোগগুলো গ্রহণ করা এবং সদস্য দেশগুলোর ওপর নজরদারি করা। কিন্তু পরবর্তীতে এটি রাজনৈতিক পক্ষপাতদুষ্ট হয়ে পড়ায় একে বাতিল করে UNHRC গঠন করা হয়।\n\nআপনি যদি এর বাইরে অন্য কোনো সুনির্দিষ্ট \"UN\" সংস্থা বা টার্ম বুঝিয়ে থাকেন, তবে জানালে আমি সেটিরও ঐতিহাসিক প্রেক্ষাপট ও কারণ বলে দেব।", "id": "n3-0-0"}, {"t": "earth summit", "b": "আর্থ সামিট (Earth Summit) বা বসুন্ধরা সম্মেলন হলো পরিবেশ ও উন্নয়ন বিষয়ক পৃথিবীর ইতিহাসে সবচেয়ে প্রভাবশালী ও বড় সম্মেলন। এটি মূলত ১ সালে ব্রাজিলের রিও ডি জেনিরোতে অনুষ্ঠিত 'আর্থ সামিট'-এ জলবায়ু পরিবর্তন মোকাবিলায় দেশগুলো UNFCCC (United Nations Framework Convention on Climate Change) নামক একটি চুক্তিতে স্বাক্ষর করে। এই চুক্তিতে যারা স্বাক্ষর করেছে, তাদের প্রত্যেককে এক একটি 'Party' বা পক্ষ বলা হয়। এই পক্ষগুলো বা দেশগুলো প্রতি বছর জলবায়ু পরিস্থিতি পর্যালোচনা করতে যে বৈঠকে বসে, তাকেই বলা হয় COP।\nপ্রথম COP সম্মেলন (COP1) অনুষ্ঠিত হয়েছিল ১৯৯৫ সালে জার্মানির বার্লিনে। এরপর থেকে প্রতি বছর বিশ্বের বিভিন্ন শহরে এটি আয়োজিত হয়ে আসছে।", "id": "n3-0-17"}, {"t": "Conference of the Parties (COP): কেন এই সম্মেলন করা হয়? (মূল কারণসমূহ)", "b": "* জলবায়ু চুক্তির বাস্তবায়ন তদারকি: UNFCCC চুক্তির লক্ষ্যগুলো দেশগুলো কতটা মেনে চলছে এবং গ্রিনহাউস গ্যাস কমাতে কী পদক্ষেপ নিচ্ছে, তা পর্যবেক্ষণ করা।\n* কার্বন নির্গমন কমানোর লক্ষ্যমাত্রা নির্ধারণ: বিশ্ব উষ্ণায়ন বা গ্লোবাল ওয়ার্মিং রোধে বায়ুমণ্ডলে কার্বন-ডাই-অক্সাইডের পরিমাণ কমানোর জন্য বিভিন্ন দেশ সম্মিলিতভাবে লক্ষ্যমাত্রা নির্ধারণ করে (যেমন: প্যারিস চুক্তিতে তাপমাত্রা বৃদ্ধি ১.৫° সেলসিয়াসের মধ্যে রাখার লক্ষ্য নেওয়া হয়েছে)।\n* জলবায়ু তহবিল (Climate Finance): উন্নয়নশীল ও দরিদ্র দেশগুলো জলবায়ু পরিবর্তনের ফলে সবচেয়ে বেশি ক্ষতিগ্রস্ত হয়। তাদের সাহায্য করার জন্য উন্নত দেশগুলো কীভাবে অর্থায়ন করবে, তা এই সম্মেলনে নির্ধারিত হয়।\n* অভিযোজন ও প্রশমন (Adaptation and Mitigation): জলবায়ু পরিবর্তনের প্রভাবের সাথে খাপ খাইয়ে নেওয়া (অভিযোজন) এবং কার্বন নিঃসরণ কমিয়ে বিপদ কমানোর (প্রশমন) উপায় নিয়ে আলোচনা ও প্রযুক্তি আদান-প্রদান করা।", "id": "n3-0-18"}, {"t": "Conference of the Parties (COP): উল্লেখযোগ্য কিছু COP সম্মেলন", "b": "* COP3 (কিয়োটো, ১৯৯৭): এখান থেকেই ঐতিহাসিক 'কিয়োটো প্রোটোকল' গৃহীত হয়।\n* COP21 (প্যারিস, ২০১৫): বিখ্যাত 'প্যারিস জলবায়ু চুক্তি' এখানে স্বাক্ষরিত হয়, যা বর্তমানে জলবায়ু রক্ষার মূল ভিত্তি।\n* COP28 (দুবাই, ২০২৩): জীবাশ্ম জ্বালানি থেকে সরে আসার বা 'ট্রানজিশন' করার বিষয়ে দেশগুলো একমত হয়।\nসহজ কথায়, COP হলো বিশ্বকে ধ্বংসের হাত থেকে বাঁচাতে এবং ভবিষ্যৎ প্রজন্মের জন্য পৃথিবীকে বাসযোগ্য রাখতে বিশ্ব নেতাদের একটি বার্ষিক 'জবাবদিহিতার সভা'। এ বিষয়ে আরও কিছু জানতে চাইলে বলতে পারেন।", "id": "n3-0-19"}, {"t": "সবুজায়ন চুক্তির রূপরেখা\" (Green Deal)", "b": "আপনার আপলোড করা ছবিতে লেখা আছে \"সবুজায়ন চুক্তির রূপরেখা\" (Green Deal)। আন্তর্জাতিক রাজনীতি এবং পরিবেশের প্রেক্ষাপটে এটি বর্তমানে অত্যন্ত আলোচিত একটি বিষয়, যা মূলত European Green Deal বা ইউরোপীয় গ্রিন ডিল নামে পরিচিত।\nনিচে এর বিস্তারিত প্রেক্ষাপট ও কারণ আলোচনা করা হলো:", "id": "n3-0-20"}, {"t": "সবুজায়ন চুক্তির রূপরেখা\" (Green Deal): বিস্তারিত প্রেক্ষাপট (Background)", "b": "২০১৯ সালে ইউরোপীয় ইউনিয়ন (EU) এই পরিকল্পনাটি ঘোষণা করে। জলবায়ু পরিবর্তনের ফলে ইউরোপের অর্থনীতি এবং জীবনযাত্রার ওপর যে ঝুঁকি তৈরি হয়েছে, তা মোকাবিলা করার জন্য কেবল পরিবেশগত নীতি নয়, বরং পুরো অর্থনৈতিক ব্যবস্থাকে আমূল বদলে ফেলার একটি রূপরেখা হলো এই \"গ্রিন ডিল\"। এর মূল লক্ষ্য হলো ২০৫০ সালের মধ্যে ইউরোপকে বিশ্বের প্রথম 'কার্বন নিউট্রাল' (Carbon Neutral) মহাদেশ হিসেবে গড়ে তোলা।", "id": "n3-0-21"}, {"t": "সবুজায়ন চুক্তির রূপরেখা\" (Green Deal): কেন এই রূপরেখা তৈরি করা হয়েছে? (মূল কারণসমূহ)", "b": "* জলবায়ু পরিবর্তন মোকাবিলা: ২০৫০ সালের মধ্যে নিট গ্রিনহাউস গ্যাস নির্গমন শূন্যে নামিয়ে আনা। এটি প্যারিস চুক্তির লক্ষ্যমাত্রার সাথে সংগতিপূর্ণ।\n* অর্থনৈতিক রূপান্তর: জীবাশ্ম জ্বালানি (কয়লা, তেল) ভিত্তিক অর্থনীতি থেকে বেরিয়ে এসে নবায়নযোগ্য জ্বালানি (সৌরশক্তি, বায়ুশক্তি) ভিত্তিক একটি আধুনিক ও প্রতিযোগিতামূলক অর্থনীতি তৈরি করা।\n* সম্পদ ব্যবহারের দক্ষতা: এমন একটি চক্রাকার অর্থনীতি (Circular Economy) তৈরি করা যেখানে সম্পদের অপচয় সর্বনিম্ন হবে এবং পুনর্ব্যবহার (Recycling) সর্বোচ্চ হবে।\n* দূষণমুক্ত পরিবেশ: বাতাস, পানি এবং মাটির দূষণ কমিয়ে মানুষের স্বাস্থ্য ও জীববৈচিত্র্য রক্ষা করা।\n* কাউকে পেছনে ফেলে নয় (Just Transition): যেসব এলাকা বা শ্রমিক গোষ্ঠী কয়লা বা ভারী শিল্পের ওপর নির্ভরশীল, তারা যেন এই পরিবর্তনের ফলে বেকার বা ক্ষতিগ্রস্ত না হয়, সেজন্য বিশেষ তহবিল ও প্রশিক্ষণের ব্যবস্থা রাখা।", "id": "n3-0-22"}, {"t": "সবুজায়ন চুক্তির রূপরেখা\" (Green Deal): গ্রিন ডিল-এর প্রধান স্তম্ভসমূহ", "b": "১. পরিচ্ছন্ন জ্বালানি: বিদ্যুৎ উৎপাদনের জন্য কয়লা বর্জন করে সবুজ জ্বালানি ব্যবহার।\n২. টেকসই শিল্প: ইস্পাত ও সিমেন্টের মতো ভারী শিল্পগুলোকে পরিবেশবান্ধব প্রযুক্তিতে রূপান্তর।\n৩. টেকসই ভবন: ঘরবাড়ি ও দালানকোঠা এমনভাবে নির্মাণ বা সংস্কার করা যাতে বিদ্যুৎ খরচ কম হয়।\n৪. সবুজ পরিবহন: বৈদ্যুতিক গাড়ি এবং ট্রেন যোগাযোগ ব্যবস্থার ব্যাপক বিস্তার ঘটানো।\n৫. খামার থেকে থালা (Farm to Fork): কীটনাশক ব্যবহার কমিয়ে স্বাস্থ্যকর ও পরিবেশবান্ধব খাদ্য উৎপাদন ব্যবস্থা নিশ্চিত করা।", "id": "n3-0-23"}, {"t": "সবুজায়ন চুক্তির রূপরেখা\" (Green Deal): সারসংক্ষেপ", "b": "গ্রিন ডিল কেবল গাছ লাগানো বা দূষণ কমানোর পরিকল্পনা নয়; এটি হলো উন্নয়নের এমন একটি মডেল যেখানে প্রকৃতিকে ধ্বংস না করে প্রযুক্তি ও অর্থনৈতিক সমৃদ্ধিকে এগিয়ে নেওয়া হয়। ইউরোপের এই উদ্যোগ বর্তমানে বিশ্বজুড়ে (যেমন যুক্তরাষ্ট্রের \"Green New Deal\") একই ধরনের পরিকল্পনা গ্রহণে দেশগুলোকে অনুপ্রাণিত করছে।\nএ বিষয়ে কোনো সুনির্দিষ্ট পয়েন্ট বা প্রয়োগ নিয়ে জানতে চাইলে প্রশ্ন করতে পারেন।", "id": "n3-0-24"}, {"t": "COP-16", "b": "আপনার আপলোড করা ছবিতে \"বিশ্ব জীববৈচিত্র্য সম্মেলন (COP-15 ও COP-16)\" এবং \"CBD Treaty\" সম্পর্কে জানতে চাওয়া হয়েছে। এটি জলবায়ু পরিবর্তনের (UNFCCC) মতো আরেকটি ভিন্ন ধারা, যা মূলত পৃথিবীর পশুপাখি, উদ্ভিদ এবং বাস্তুসংস্থান রক্ষার কাজ করে।\nনিচে এর বিস্তারিত প্রেক্ষাপট ও কারণগুলো আলাদা করে আলোচনা করা হলো:\n\n১. সিবিডি চুক্তি (CBD Treaty - Convention on Biological Diversity)\n* বিস্তারিত প্রেক্ষাপট: বিংশ শতাব্দীর শেষ দিকে বিজ্ঞানীরা লক্ষ্য করেন যে, মানুষের নানাবিধ হস্তক্ষেপের ফলে পৃথিবীর জীববৈচিত্র্য বা প্রজাতির বিলুপ্তির হার স্বাভাবিকের চেয়ে প্রায় ১০০ থেকে ১০০০ গুণ বেড়ে গেছে। এই গভীর সংকট নিরসনে ১৯৯২ সালে ব্রাজিলের রিও ডি জেনিরোতে অনুষ্ঠিত 'আর্থ সামিট'-এ এই চুক্তিটি স্বাক্ষরের জন্য উন্মুক্ত করা হয়।\n* কেন এই চুক্তি করা হয়েছিল? (মূল কারণ):\n   * জীববৈচিত্র্য সংরক্ষণ: পৃথিবীর সমস্ত উদ্ভিদ, প্রাণী এবং অণুজীবের বৈচিত্র্য রক্ষা করা।\n   * প্রাকৃতিক সম্পদের টেকসই ব্যবহার: প্রকৃতির সম্পদ এমনভাবে ব্যবহার করা যেন তা ভবিষ্যতে ফুরিয়ে না যায়।\n   * ন্যায্য বণ্টন: কোনো দেশের প্রাকৃতিক সম্পদ বা জেনেটিক রিসোর্স ব্যবহার করে যদি কোনো ওষুধ বা পণ্য তৈরি হয়, তবে তার সুফল যেন সেই দেশ বা স্থানীয় জনগোষ্ঠীও পায়।\n\n২. বিশ্ব জীববৈচিত্র্য সম্মেলন: কপ-১৫ (COP-15), ২০২২\n* বিস্তারিত প্রেক্ষাপট: এটি কানাডার মন্ট্রিয়লে অনুষ্ঠিত হয়েছিল (চীনের সভাপতিত্বে)। ২০১৯ সালে জাতিসংঘের একটি রিপোর্টে বলা হয়েছিল যে, প্রায় ১০ লক্ষ প্রজাতি বিলুপ্তির পথে। এই জরুরি পরিস্থিতির প্রেক্ষাপটে বিশ্বকে ধ্বংসের হাত থেকে বাঁচাতে একটি শক্তিশালী পরিকল্পনা দরকার ছিল।\n* কেন এই সম্মেলন করা হয়েছিল? (মূল কারণ):\n   * কুমিং-মন্ট্রিয়ল গ্লোবাল বায়োডাইভারসিটি ফ্রেমওয়ার্ক: এই সম্মেলনে ২০৩০ সালের মধ্যে জীববৈচিত্র্য রক্ষার জন্য ২৩টি নির্দিষ্ট লক্ষ্যমাত্রা নির্ধারণ করা হয়।\n   * '৩০ বাই ৩০' লক্ষ্য: ২০৩০ সালের মধ্যে পৃথিবীর অন্তত ৩০% স্থলভাগ এবং ৩০% জলভাগকে সংরক্ষিত এলাকা হিসেবে ঘোষণা করার ঐতিহাসিক সিদ্ধান্ত নেওয়া হয়।\n   * আর্থিক সহায়তা: উন্নয়নশীল দেশগুলোকে জীববৈচিত্র্য রক্ষায় উন্নত দেশগুলো যেন প্রতি বছর ২০ বিলিয়ন ডলার সাহায্য দেয়, তা নিশ্চিত করা।\n\n৩. বিশ্ব জীববৈচিত্র্য সম্মেলন: কপ-১৬ (COP-16), ২০২৪/২০২৬\n(বিগত বা আসন্ন প্রেক্ষাপট অনুযায়ী এর গুরুত্ব নিচে দেওয়া হলো)\n* বিস্তারিত প্রেক্ষাপট: কলম্বিয়ায় অনুষ্ঠিত এই সম্মেলনের প্রেক্ষাপট হলো কপ-১৫-এ গৃহীত সিদ্ধান্তগুলো বাস্তবে কতটুকু কার্যকর হয়েছে তা পর্যালোচনা করা।\n* কেন এই সম্মেলন করা হয়েছে? (মূল কারণ):\n   * বাস্তবায়ন পর্যবেক্ষণ: দেশগুলো তাদের নিজ নিজ জাতীয় জীববৈচিত্র্য পরিকল্পনা (NBSAPs) জমা দিয়েছে কি না এবং কাজ শুরু করেছে কি না তা তদারকি করা।\n   * জেনেটিক রিসোর্স ও ডিজিটাল সিকোয়েন্সিং: আধুনিক প্রযুক্তিতে ডিএনএ বা জেনেটিক তথ্যের ডিজিটাল ব্যবহারের ফলে যে লভ্যাংশ তৈরি হয়, তার একটি অংশ যেন জীববৈচিত্র্য রক্ষায় খরচ করা হয়, সেই নিয়ম তৈরি করা।\n   * আদিবাসী জনগোষ্ঠীর অধিকার: জীববৈচিত্র্য রক্ষায় স্থানীয় আদিবাসীদের জ্ঞান ও ভূমির অধিকারকে আন্তর্জাতিক স্বীকৃতি দেওয়া।", "id": "n3-0-25"}, {"t": "COP-16: সারসংক্ষেপ", "b": "সহজ কথায়, CBD Treaty হলো একটি মূল সংবিধান, আর COP (Conference of the Parties) হলো সেই সংবিধান অনুযায়ী নিয়মিত সভা যেখানে বর্তমান সংকটগুলো নিয়ে আলোচনা করা হয়।\nএর উদ্দেশ্য একটাই—মানুষ ও প্রকৃতি যেন একে অপরের ক্ষতি না করে পৃথিবীতে একসাথে টিকে থাকতে পারে। আপনার কি এই কনভেনশনের অন্য কোনো প্রোটোকল (যেমন: নাগোয়া বা কার্টাগেনা) সম্পর্কে জানার প্রয়োজন আছে?", "id": "n3-0-26"}, {"t": "montreal protocol (১. মন্ট্রিল প্রোটোকল (Montreal Protocol,)", "b": "kyoto protocol \ncartagena protocol\nnagoya protocol\n\nপরিবেশ রক্ষায় এই প্রোটোকলগুলো অত্যন্ত গুরুত্বপূর্ণ মাইলফলক। প্রতিটি প্রোটোকলের পেছনে রয়েছে নির্দিষ্ট কিছু বৈজ্ঞানিক উদ্বেগ এবং ঐতিহাসিক প্রেক্ষাপট। নিচে এগুলোর বিস্তারিত আলাদাভাবে আলোচনা করা হলো:\n\n১. মন্ট্রিল প্রোটোকল (Montreal Protocol, ১৯৮৭)\n* বিস্তারিত প্রেক্ষাপট: ১৯৭০-এর দশকে বিজ্ঞানীরা প্রথম আবিষ্কার করেন যে, বায়ুমণ্ডলের ওজোন স্তর (Ozone Layer) পাতলা হয়ে যাচ্ছে। ওজোন স্তর আমাদের সূর্যের ক্ষতিকর অতিবেগুনি রশ্মি থেকে বাঁচায়। দেখা যায় যে, রেফ্রিজারেটর এবং এয়ার কন্ডিশনারে ব্যবহৃত CFC (Chlorofluorocarbons) গ্যাস এই ওজোন স্তর ধ্বংস করছে। ১৯৮৫ সালে অ্যান্টার্কটিকার ওজোন স্তরে একটি বিশাল 'গর্ত' আবিষ্কৃত হলে বিশ্বজুড়ে আতঙ্ক ছড়িয়ে পড়ে।\n* কেন এই চুক্তি করা হয়েছিল? (মূল কারণ): ওজোন স্তর ধ্বংসকারী রাসায়নিকগুলোর উৎপাদন এবং ব্যবহার পর্যায়ক্রমে কমিয়ে এনে ওজোন স্তরকে মেরামত করা। এটি বিশ্বের অন্যতম সফল পরিবেশ চুক্তি, কারণ বর্তমানে ওজোন স্তরটি ধীরে ধীরে আগের অবস্থায় ফিরে আসছে।", "id": "n3-0-27"}, {"t": "montreal protocol (২. কিয়োটো প্রোটোকল (Kyoto Protocol, ১৯৯)", "b": "২. কিয়োটো প্রোটোকল (Kyoto Protocol, ১৯৯৭)\n* বিস্তারিত প্রেক্ষাপট: ১৯৮০-র দশক থেকে বিজ্ঞানীরা সতর্ক করে আসছিলেন যে, গ্রিনহাউস গ্যাসের (যেমন—কার্বন-ডাই-অক্সাইড) পরিমাণ বাড়ার ফলে পৃথিবীর তাপমাত্রা বাড়ছে, যা জলবায়ু পরিবর্তনের কারণ। ১৯৯২ সালের 'আর্থ সামিট'-এ UNFCCC চুক্তি স্বাক্ষরিত হলেও গ্রিনহাউস গ্যাস কমানোর কোনো আইনি বাধ্যবাধকতা ছিল না।\n* কেন এই চুক্তি করা হয়েছিল? (মূল কারণ): এই প্রোটোকলের মাধ্যমে প্রথমবারের মতো বিশ্বের উন্নত দেশগুলোর জন্য গ্রিনহাউস গ্যাস নিঃসরণ কমানোর একটি আইনি বাধ্যবাধকতা (Legal Binding) দেওয়া হয়। এর লক্ষ্য ছিল বায়ুমণ্ডলে কার্বন নির্গমন নিয়ন্ত্রণের মাধ্যমে বৈশ্বিক উষ্ণায়ন বা গ্লোবাল ওয়ার্মিং রোধ করা।", "id": "n3-0-28"}, {"t": "montreal protocol (৩. কার্টাগেনা প্রোটোকল (Cartagena Protoc)", "b": "৩. কার্টাগেনা প্রোটোকল (Cartagena Protocol, ২০০০)\n* বিস্তারিত প্রেক্ষাপট: নব্বইয়ের দশকে জেনেটিক ইঞ্জিনিয়ারিং বা বায়োটেকনোলজির ব্যাপক উন্নতি ঘটে। বিজ্ঞানীরা ল্যাবরেটরিতে উদ্ভিদের জিন পরিবর্তন করে LMO (Living Modified Organisms) তৈরি করা শুরু করেন। তখন বিশ্বজুড়ে উদ্বেগ তৈরি হয় যে, এই কৃত্রিম জীবগুলো যদি প্রকৃতিতে ছড়িয়ে পড়ে, তবে তা প্রাকৃতিক জীববৈচিত্র্য ও মানুষের স্বাস্থ্যের জন্য হুমকি হতে পারে।\n* কেন এই চুক্তি করা হয়েছিল? (মূল কারণ): এটি একটি বায়ো-সেফটি (Biosafety) বা জৈব-নিরাপত্তা চুক্তি। এর মূল কারণ ছিল এক দেশ থেকে অন্য দেশে মডিফাইড অর্গানিজম বা বীজ স্থানান্তরের ক্ষেত্রে সর্বোচ্চ সতর্কতা অবলম্বন করা। এটি নিশ্চিত করে যেন আধুনিক প্রযুক্তি ব্যবহার করতে গিয়ে আমরা প্রাকৃতিক বাস্তুসংস্থানের ক্ষতি না করি।", "id": "n3-0-29"}, {"t": "montreal protocol (৪. নাগোয়া প্রোটোকল (Nagoya Protocol, ২০)", "b": "৪. নাগোয়া প্রোটোকল (Nagoya Protocol, ২০১০)\n* বিস্তারিত প্রেক্ষাপট: অনেক সময় দেখা যেত যে, উন্নত দেশ বা বড় কোম্পানিগুলো উন্নয়নশীল দেশের বিশেষ কোনো উদ্ভিদ বা প্রাণীর জেনেটিক তথ্য (Genetic Resources) ব্যবহার করে দামি ওষুধ বা পণ্য তৈরি করছে। কিন্তু যে এলাকা বা যে আদিবাসী গোষ্ঠীর কাছ থেকে এই তথ্য পাওয়া গেছে, তারা কোনো লভ্যাংশ পেত না। একে বলা হতো 'বায়োপাইরেসি' (Biopiracy)।\n* কেন এই চুক্তি করা হয়েছিল? (মূল কারণ): এই প্রোটোকলের মূল ভিত্তি হলো \"সুফল বণ্টন\" (Access and Benefit-sharing)। এর কারণ ছিল কোনো দেশের প্রাকৃতিক সম্পদ ব্যবহার করলে সেই দেশের সাথে লভ্যাংশ শেয়ার করা এবং স্থানীয় জনগোষ্ঠীর অধিকার ও ঐতিহ্যবাহী জ্ঞান রক্ষা করা। এটি জাপানের নাগোয়া শহরে সিবিডি (CBD)-এর দশম সম্মেলনে গৃহীত হয়।", "id": "n3-0-30"}, {"t": "montreal protocol: একনজরে পার্থক্য", "b": "প্রোটোকলের নাম\n\tমূল ফোকাস\n\tঐতিহাসিক প্রেক্ষাপট\n\tমন্ট্রিল\n\tওজোন স্তর রক্ষা\n\tওজোন স্তরে গর্তের আবিষ্কার (CFC গ্যাস)\n\tকিয়োটো\n\tজলবায়ু পরিবর্তন\n\tগ্লোবাল ওয়ার্মিং ও কার্বন নির্গমন\n\tকার্টাগেনা\n\tজৈব-নিরাপত্তা\n\tল্যাবে তৈরি পরিবর্তিত জীবের (LMO) ঝুঁকি\n\tনাগোয়া\n\tপ্রাকৃতিক সম্পদের লভ্যাংশ\n\tবায়োপাইরেসি রোধ ও স্থানীয় অধিকার রক্ষা\n\tএই প্রোটোকলগুলো নিয়ে কি আরও গভীরে জানার প্রয়োজন আছে? অথবা অন্য কোনো টার্ম বুঝতে অসুবিধা হচ্ছে?", "id": "n3-0-31"}], "id": "n3-0", "n": 3}, {"title": "জাতিসংঘ", "chunks": [{"t": "মূল নোট", "b": "United Nations System - Wikipedia\n\nএখানে আপনার আপলোড করা ছবি থেকে গুরুত্বপূর্ণ আন্তর্জাতিক সম্মেল
