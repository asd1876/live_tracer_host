<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --text:#2b2420; --muted:#7a6f63;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1815; --card:#262019; --text:#ede4d8; --muted:#a89a89;
    --line:#4a4038; --accent:#e18a6f; --accent2:#6fbfa8; --badge:#3a3128; --detail:#2f2820;

}

  --line:#4a4038; --accent:#e18a6f; --accent2:#6fbfa8; --badge:#3a3128; --detail:#2f2820;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans Bengali','Noto Serif Bengali',serif; line-height:1.7;}
header{padding:1.8rem 1.25rem 1rem; text-align:center; border-bottom:1px solid var(--line);}
header h1{font-family:'Noto Serif Bengali',serif; font-weight:700; font-size:1.4rem; margin:0 0 .4rem;}
header p{color:var(--muted); font-size:.88rem; margin:0; max-width:640px; margin:0 auto;}
header .hint{display:inline-block; margin-top:.6rem; font-size:.78rem; color:var(--accent2); background:var(--badge); padding:.25rem .7rem; border-radius:999px;}
main{max-width:760px; margin:0 auto; padding:1.5rem 1rem 3rem;}

.decade{margin-top:2.2rem;}
.decade-head{display:flex; align-items:baseline; gap:.6rem; margin-bottom:.9rem; position:sticky; top:env(safe-area-inset-top, 0px); background:var(--bg); padding:.4rem 0; z-index:2;}
.decade-head h2{font-family:'Noto Serif Bengali',serif; font-size:1.1rem; color:var(--accent); margin:0; font-weight:700;}
.decade-sub{color:var(--muted); font-size:.85rem; margin:0 0 .9rem; font-style:italic;}

.timeline{position:relative; padding-right:1.5rem; border-right:2px solid var(--line);}
.event{position:relative; padding:0 1.5rem 1rem 0;}
.event::before{content:''; position:absolute; right:-6px; top:.35rem; width:11px; height:11px; border-radius:50%; background:var(--accent2); border:2px solid var(--bg);}
.card{background:var(--card); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:box-shadow .15s ease;}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);}
.card-top{padding:.65rem .9rem; display:flex; align-items:center; gap:.55rem; flex-wrap:wrap;}
.yb{display:inline-block; background:var(--badge); font-size:.76rem; font-weight:600; padding:.1rem .5rem; border-radius:999px; flex-shrink:0;}
.name{font-size:.92rem; font-weight:600;}
.arrow{margin-right:auto; color:var(--muted); font-size:.75rem; transition:transform .2s ease;}
.card.open .arrow{transform:rotate(90deg);}
.detail{max-height:0; overflow:hidden; transition:max-height .25s ease; background:var(--detail); font-size:.87rem; color:var(--text);}
.card.open .detail{max-height:400px;}
.detail-in{padding:.7rem .9rem .9rem; border-top:1px dashed var(--line);}
.detail-in .full{color:var(--accent); font-weight:600; display:block; margin-bottom:.3rem; font-size:.85rem;}
@media (hover:hover){
  .card:not(.open):hover .detail{max-height:400px;}
  .card:not(.open):hover .arrow{transform:rotate(90deg);}
}

footer{max-width:760px; margin:2rem auto 3rem; padding:1.1rem 1.25rem; background:var(--card); border-radius:12px; box-shadow:var(--shadow); font-size:.85rem; color:var(--muted);}
</style>

const root = document.getElementById('root');
data.forEach(d=>{
  const sec = document.createElement('section');
  sec.className='decade';
  sec.innerHTML = `
    <div class="decade-head"><h2>${d.decade}</h2></div>
    <p class="decade-sub">${d.sub}</p>
    <div class="timeline">
      ${d.events.map(([y,n,det])=>`
        <div class="event">
          <div class="card">
            <div class="card-top">
              <span class="yb">${y}</span>
              <span class="name">${n}</span>
              <span class="arrow">▸</span>
            </div>
            <div class="detail"><div class="detail-in">${det}</div></div>
          </div>
        </div>`).join('')}
    </div>`;
  root.appendChild(sec);
});

root.addEventListener('click', (e)=>{
  const card = e.target.closest('.card');
  if(!card) return;
  card.classList.toggle('open');
});
