.no{background:var(--bad)}.yes{background:var(--ac)}.go{background:var(--ac);flex:none;width:100%}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.opt.r{border-color:var(--ac);background:var(--ac2)}.opt.w{border-color:var(--bad)}

.tl div{margin:0 0 12px;position:relative}.tl div:before{content:"";position:absolute;left:-21px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--ac)}
.tl b{color:var(--ac)}.mut{color:var(--mut);font-size:14px}

["সংস্থা",2018,"Fridays for Future","২০১৮ (সাধারণ জ্ঞান), সুইডেন|প্রতিষ্ঠাতা: গ্রেটা থুনবার্গ (১৬ বছর), সংসদের সামনে একা প্রতিবাদ|স্কুল শিক্ষার্থীদের জন্য সপ্তাহে ১ দিনের পরিবেশ কর্মসূচি","শুক্রবার, ১৬ বছর, সুইডেন, গ্রেটা"],
["জোট",1996,"Arctic Council","১৯৯১: আটটি আর্কটিক দেশের প্রথম Arctic Council Summit|১৯৯৬: আনুষ্ঠানিক প্রতিষ্ঠা|সদর দপ্তর: ট্রমসো, নরওয়ে|সদস্য ৮: আইসল্যান্ড, সুইডেন, ডেনমার্ক, ফিনল্যান্ড, নরওয়ে, রাশিয়া, যুক্তরাষ্ট্র, কানাডা","আর্কটিক ৯৬"],
["জোট",2009,"CVF","Climate Vulnerable Forum|গঠন: ২০০৯, উদ্যোগ মালদ্বীপের|শুরুতে ১১ দেশ (বাংলাদেশের নেতৃত্বে প্রথম গৃহীত, নোটের ভাষা)|এখন সদস্য প্রায় ৭০|সভাপতি (২০২৪–২৬): বার্বাডোসের প্রধানমন্ত্রী মিয়া আমর মোতলি","০৯, মালদ্বীপ"],
["জোট",2015,"V-20","Vulnerable 20, CVF-ভুক্ত দেশগুলোর অর্থমন্ত্রীদের জোট|গঠন: ২০১৫, লিমা, পেরু|উদ্যোগ: ফিলিপাইন|প্রতিষ্ঠাকালে ২০ সদস্য (তাই নাম), এখন প্রায় ৭০|সভাপতি (২০২৪–২৬): বার্বাডোসের অর্থমন্ত্রী","১৫, ফিলিপাইন, অর্থ"],
["জোট",2018,"GCA","Global Center on Adaptation (অভিযোজন)|যাত্রা: ২০১৮|সদর দপ্তর: হেগ, নেদারল্যান্ডস|চেয়ারম্যান: বান কি মুন|প্রথম আঞ্চলিক কেন্দ্র: বেইজিং, চীন|দক্ষিণ এশিয়ায় প্রথম (বিশ্বে দ্বিতীয়) কেন্দ্র: ঢাকা, আগারগাঁও, পরিবেশ অধিদপ্তর ভবন|২০১৯ ঢাকা সম্মেলনে বান কি মুন: অভিযোজনে বাংলাদেশ সবচেয়ে ভালো শিক্ষক","১৮, হেগ"],
["জোট",2021,"REAP","Risk-informed Early Action Partnership (আগাম সতর্কতা)|চালু: COP26, গ্লাসগো (২০২১, সাধারণ জ্ঞান)|উদ্যোক্তা: যুক্তরাজ্য, ফিনল্যান্ড, IFRC|সদর দপ্তর: জেনেভা|প্রতিষ্ঠাকালীন সদস্য: বাংলাদেশসহ ১৫টি দেশ|লক্ষ্য: ২০২৫ সালের মধ্যে ১০০ কোটি মানুষকে দুর্যোগ থেকে রক্ষা","আর্কটিক → CVF → V-20 → GCA → REAP"]
];
const G=["সব","কনভেনশন","সংস্থা","জোট","ছক"],DAY=[0,1,3,7,14];
let S={},tab="f",grp="সব",cur=null,flip=false,qs=null,qd=null;
try{S=JSON.parse(localStorage.getItem("rv")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("rv",JSON.stringify(S))}catch(e){}};
const today=()=>Math.floor(Date.now()/864e5);
const st=n=>S[n]||(S[n]={b:0,d:0});
const pool=()=>C.filter(c=>grp=="সব"||c[0]==grp);
const due=()=>pool().filter(c=>st(c[2]).d<=today());
const $=id=>document.getElementById(id),v=$("v");
function nav(){$("nav").innerHTML=[["f","ফ্ল্যাশকার্ড"],["q","কুইজ"],["t","টাইমলাইন"],["p","অগ্রগতি"]].map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';cur=null;qd=null;draw()">${n}</button>`).join("")}
function chips(){return `<div class="row">${G.map(g=>`<button class="chip ${grp==g?"on":""}" onclick="grp='${g}';cur=null;qd=null;draw()">${g}</button>`).join("")}</div>`}
function stats(){const p=pool(),b=[0,1,2,3,4].map(i=>p.filter(c=>st(c[2]).b==i).length);return `<div class="stat">${b.map((n,i)=>`<div><b>${n}</b>বক্স ${i+1}</div>`).join("")}</div>`}
function draw(){nav();({f:fc,q:qz,t:tlx,p:pg})[tab]()}
function fc(){
const d=due();
if(!cur||!d.includes(cur))cur=d.sort(()=>Math.random()-.5)[0];
let h=chips()+stats();
if(!cur){v.innerHTML=h+`<div class="card"><div class="q">আজকের রিভিশন শেষ ✅</div><p class="mut">সব কার্ড আজকের জন্য সম্পন্ন। কুইজ দিয়ে নিজেকে যাচাই করো, অথবা কাল আবার এসো।</p></div>`;return}
h+=`<p class="mut">আজ বাকি: ${d.length}টি</p><div class="card" onclick="flip=!flip;draw()"><small>${cur[0]} · ${cur[1]}</small><div class="q">${cur[2]}</div>`;
h+=flip?`<div class="a">${cur[3]}${cur[4]?`<div class="t">🧠 ${cur[4]}</div>`:""}</div>`:`<p class="mut">মনে করো, তারপর কার্ডে ট্যাপ করো</p>`;
h+=`</div>`;
if(flip)h+=`<div class="btns"><button class="no" onclick="rate(0)">মনে ছিল না</button><button class="yes" onclick="rate(1)">মনে ছিল</button></div>`;
v.innerHTML=h}
function rate(ok){const s=st(cur[2]);s.b=ok?Math.min(4,s.b+1):0;s.d=today()+DAY[s.b]+(ok?0:0);if(!ok)s.d=today();save();flip=false;cur=null;draw()}
function qz(){
let h=chips();
if(!qd){const p=pool();const c=p[Math.floor(Math.random()*p.length)];
const wr=C.filter(x=>x[0]==c[0]&&x[2]!=c[2]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[3]);
qd={c,o:[...wr,c[3]].sort(()=>Math.random()-.5),done:false}}
const c=qd.c;
h+=`<div class="card" style="cursor:default"><small>${qs||0}</small><div class="q" style="font-size:20px">"${c[2]}"-এর সঠিক তথ্য কোনটি?</div>`+qd.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${o}</button>`).join("")+`<div id="fb"></div></div>`;
v.innerHTML=h}
function pick(i){if(qd.done)return;qd.done=true;const ok=qd.o[i]==qd.c[3];
qd.o.forEach((o,j)=>{if(o==qd.c[3])$("o"+j).classList.add("r")});
if(!ok)$("o"+i).classList.add("w");
const s=st(qd.c[2]);if(ok){qs=(qs||0)+1}else{qs=0;s.b=0;s.d=today();save()}
$("fb").innerHTML=(ok?`<p><b>ঠিক!</b> স্ট্রিক ${qs}</p>`:`<p><b style="color:var(--bad)">ভুল।</b> ভুল কার্ড আজকের ফ্ল্যাশকার্ডে ফিরে গেছে।</p>`)+(qd.c[4]?`<div class="t">🧠 ${qd.c[4]}</div>`:"")+`<button class="go" style="margin-top:10px" onclick="qd=null;draw()">পরের প্রশ্ন</button>`}
function tlx(){
const p=pool().slice().sort((a,b)=>a[1]-b[1]);
v.innerHTML=chips()+`<p class="mut">সালের ক্রমে গল্প। নিজে ঢেকে সাল বলার চেষ্টা করো।</p><div class="tl">${p.map(c=>`<div><b>${c[1]}</b> · ${c[2]}<br><span class="mut">${c[3]}</span></div>`).join("")}</div>`}
function pg(){
const p=C,m=p.filter(c=>st(c[2]).b>=3).length,w=p.filter(c=>st(c[2]).b==0&&st(c[2]).d>0).length;
v.innerHTML=chips()+stats()+`<div class="card" style="cursor:default"><div class="q">${m}/${p.length} আয়ত্তে</div><p>বক্স ৪–৫-এ পৌঁছালে কার্ড আয়ত্তে ধরা হয়।</p><p class="mut">বক্স ১ = প্রতিদিন, বক্স ২ = ১ দিন পর, বক্স ৩ = ৩ দিন পর, বক্স ৪ = ৭ দিন পর, বক্স ৫ = ১৪ দিন পর।</p><p><b>দৈনিক নিয়ম:</b> ফ্ল্যাশকার্ডে আজকের সব কার্ড শেষ করো, তারপর ৫টি কুইজ দাও।</p><button class="go" onclick="if(confirm('সব অগ্রগতি মুছবে?')){S={};save();draw()}" style="background:var(--bad)">অগ্রগতি রিসেট</button></div>`}
const rl=a=>a.split("|");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fc(){
const d=due();
if(!cur||!d.includes(cur))cur=d.sort(()=>Math.random()-.5)[0];
let h=chips()+stats();
if(!cur){v.innerHTML=h+`<div class="card"><div class="q">আজকের রিভিশন শেষ ✅</div><p class="mut">সব কার্ড আজকের জন্য সম্পন্ন। কুইজ দাও, অথবা কাল আবার এসো।</p></div>`;return}
h+=`<p class="mut">আজ বাকি: ${d.length}টি</p><div class="card" onclick="flip=!flip;draw()"><small>${cur[0]}${cur[1]?" · "+cur[1]:""}</small><div class="q">${cur[2]}</div>`;
h+=flip?`<div class="a">${rl(cur[3]).map(x=>"• "+x).join("<br>")}${cur[4]?`<div class="t">🧠 ${cur[4]}</div>`:""}</div>`:`<p class="mut">যা যা মনে আছে বলো, তারপর ট্যাপ করো</p>`;
h+=`</div>`;
if(flip)h+=`<div class="btns"><button class="no" onclick="rate(0)">সব মনে ছিল না</button><button class="yes" onclick="rate(1)">সব মনে ছিল</button></div>`;
v.innerHTML=h}
function qz(){
let h=chips();
if(!qd){const p=pool();const c=rnd(p);const t=rnd(rl(c[3]));
const wr=C.filter(x=>x[0]==c[0]&&x[2]!=c[2]).sort(()=>Math.random()-.5).slice(0,3).map(x=>rnd(rl(x[3])));
qd={c,t,o:[...wr,t].sort(()=>Math.random()-.5),done:false}}
const c=qd.c;
h+=`<div class="card" style="cursor:default"><small>স্ট্রিক ${qs||0}</small><div class="q" style="font-size:20px">"${c[2]}"-এর সঙ্গে কোন তথ্যটি মেলে?</div>`+qd.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${o}</button>`).join("")+`<div id="fb"></div></div>`;
v.innerHTML=h}
function pick(i){if(qd.done)return;qd.done=true;const ok=qd.o[i]==qd.t;
qd.o.forEach((o,j)=>{if(o==qd.t)$("o"+j).classList.add("r")});
if(!ok)$("o"+i).classList.add("w");
const s=st(qd.c[2]);if(ok){qs=(qs||0)+1}else{qs=0;s.b=0;s.d=today();save()}
$("fb").innerHTML=(ok?`<p><b>ঠিক!</b></p>`:`<p><b style="color:var(--bad)">ভুল।</b> কার্ডটি আজকের ফ্ল্যাশকার্ডে ফিরেছে।</p>`)+`<div class="mut">${rl(qd.c[3]).map(x=>"• "+x).join("<br>")}</div>`+(qd.c[4]?`<div class="t">🧠 ${qd.c[4]}</div>`:"")+`<button class="go" style="margin-top:10px" onclick="qd=null;draw()">পরের প্রশ্ন</button>`}
function tlx(){
const p=pool().filter(c=>c[1]).sort((a,b)=>a[1]-b[1]);
v.innerHTML=chips()+`<p class="mut">সালের ক্রমে সব। সাল ঢেকে নিজে বলার চেষ্টা করো।</p><div class="tl">${p.map(c=>`<div><b>${c[1]}</b> · ${c[2]}<br><span class="mut">${rl(c[3]).join("; ")}</span></div>`).join("")}</div>`}
draw();
</script></body></html>
