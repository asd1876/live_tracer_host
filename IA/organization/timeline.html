html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{

}
header{

}

main{max-width:760px; margin:0 auto; padding:1.5rem 1rem 3rem;}

.decade{margin-top:2.4rem;}
.decade-head{
  display:flex; align-items:baseline; gap:.6rem; margin-bottom:1rem;
  position:sticky; top:env(safe-area-inset-top, 0px); background:var(--bg);
  padding:.4rem 0; z-index:2;
}
.decade-head h2{
  font-family:'Noto Serif Bengali',serif; font-size:1.15rem; color:var(--accent);
  margin:0; font-weight:700;
}
.decade-head .yr{font-size:.85rem; color:var(--muted); font-weight:500;}
.decade-sub{color:var(--muted); font-size:.88rem; margin:0 0 1rem; font-style:italic;}

.timeline{position:relative; padding-right:1.6rem; border-right:2px solid var(--line);}
.event{position:relative; padding:0 1.6rem 1.2rem 0; margin-right:-1px;}
.event::before{
  content:''; position:absolute; right:-6px; top:.35rem;
  width:11px; height:11px; border-radius:50%;
  background:var(--accent2); border:2px solid var(--bg);
}
.event .yb{
  display:inline-block; background:var(--badge); color:var(--text);
  font-size:.78rem; font-weight:600; padding:.12rem .55rem; border-radius:999px;
  margin-bottom:.35rem;
}
.event .body{
  background:var(--card); border-radius:10px; padding:.7rem .9rem;
  box-shadow:var(--shadow); font-size:.92rem;
}
.event .body b{color:var(--accent);}

footer{
  max-width:760px; margin:2rem auto 3rem; padding:1.25rem;
  background:var(--card); border-radius:12px; box-shadow:var(--shadow);
  font-size:.9rem;
}
footer h3{margin-top:0; font-family:'Noto Serif Bengali',serif; color:var(--accent2); font-size:1.05rem;}
footer ul{margin:.4rem 0 0; padding-right:1.2rem;}
footer li{margin-bottom:.3rem;}

@media (max-width:480px){
  .timeline{padding-right:1.1rem;}
  .event{padding-right:1.1rem;}
}
</style>

  "১৯৪০-এর দশক → দ্বিতীয় বিশ্বযুদ্ধ শেষ, জাতিসংঘ-পরিবার জন্ম নিল",
  "১৯৬০-এর দশক → উপনিবেশ ভেঙে নতুন রাষ্ট্র, তৃতীয় বিশ্বের কণ্ঠস্বর তৈরি হলো",
  "১৯৭০-এর দশক → তেল-খাদ্য সংকট আর পরিবেশ-সচেতনতা",
  "১৯৯০-এর দশক → সোভিয়েত পতন, বিশ্বায়ন, জলবায়ু কূটনীতির শুরু",
  "২০০০-১০-এর দশক → সন্ত্রাসবাদ, উদীয়মান অর্থনীতি, জলবায়ু অর্থায়ন",
];

const root = document.getElementById('root');
data.forEach(d=>{
  const sec = document.createElement('section');
  sec.className='decade';
  sec.innerHTML = `
    <div class="decade-head"><h2>${d.decade}</h2></div>
    <p class="decade-sub">${d.sub}</p>
    <div class="timeline">
      ${d.events.map(([y,t])=>`
        <div class="event">
          <span class="yb">${y}</span>
          <div class="body">${t}</div>
        </div>`).join('')}
    </div>`;
  root.appendChild(sec);
});

const pl = document.getElementById('pattern');
pattern.forEach(p=>{
  const li = document.createElement('li');
  li.textContent = p;
  pl.appendChild(li);
});
</script>
</body>
</html>
