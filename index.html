<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title> Live MCQ Tracker</title>


<style>

:root {

    --bg: #f4f6f9;

    --card: #ffffff;

    --text: #172033;

    --muted: #6b7280;

    --border: #e1e5eb;

    --red: #ef4444;
    --red-bg: #fee2e2;

    --yellow: #f59e0b;
    --yellow-bg: #fef3c7;

    --green: #22c55e;
    --green-bg: #dcfce7;

    --blue: #2563eb;
    --blue-bg: #dbeafe;

    --purple: #7c3aed;

    --shadow:
        0 4px 18px rgba(0,0,0,.07);
}


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Bengali",
        sans-serif;
}


button,
input,
textarea,
select {

    font: inherit;
}


button {

    cursor: pointer;
}


/* ============================================================
   HEADER
   ============================================================ */

.header {

    position: sticky;

    top: 0;

    z-index: 100;

    background:
        rgba(255,255,255,.96);

    backdrop-filter: blur(10px);

    border-bottom:
        1px solid var(--border);
}


.header-inner {

    max-width: 1500px;

    margin: auto;

    padding: 16px 22px;

    display: flex;

    gap: 20px;

    align-items: center;

    justify-content: space-between;
}


.title {

    font-size: 24px;

    font-weight: 800;
}


.subtitle {

    color: var(--muted);

    font-size: 13px;

    margin-top: 3px;
}


.header-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}


.btn {

    border:
        1px solid var(--border);

    background: white;

    border-radius: 9px;

    padding: 8px 13px;

    font-weight: 600;
}


.btn:hover {

    background: #f8fafc;
}


.btn.danger {

    color: #b91c1c;
}


/* ============================================================
   CONTAINER
   ============================================================ */

.container {

    max-width: 1500px;

    margin: auto;

    padding: 22px;
}


/* ============================================================
   DASHBOARD
   ============================================================ */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 12px;

    margin-bottom: 22px;
}


.stat {

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 17px;

    box-shadow: var(--shadow);
}


.stat-label {

    color: var(--muted);

    font-size: 13px;

    font-weight: 600;
}


.stat-number {

    font-size: 29px;

    font-weight: 800;

    margin-top: 4px;
}


.progress-wrap {

    height: 8px;

    background: #e5e7eb;

    border-radius: 99px;

    overflow: hidden;

    margin-top: 10px;
}


.progress {

    height: 100%;

    background: var(--green);

    border-radius: inherit;

    transition:
        width .25s ease;
}


/* ============================================================
   CONTROLS
   ============================================================ */

.controls {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 14px;

    margin-bottom: 20px;

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.search {

    flex: 1;

    min-width: 250px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    padding: 10px 12px;

    outline: none;
}


.search:focus {

    border-color:
        var(--blue);
}


.filter {

    border:
        1px solid var(--border);

    background: white;

    border-radius: 9px;

    padding: 10px 12px;
}


/* ============================================================
   LEGEND
   ============================================================ */

.legend {

    display: flex;

    gap: 15px;

    flex-wrap: wrap;

    margin:
        10px 0 20px;

    color: var(--muted);

    font-size: 12px;
}


.legend-item {

    display: flex;

    align-items: center;

    gap: 5px;
}


.dot {

    width: 11px;

    height: 11px;

    border-radius: 50%;
}


.dot.red {
    background: var(--red);
}


.dot.yellow {
    background: var(--yellow);
}


.dot.green {
    background: var(--green);
}


/* ============================================================
   SUBJECT
   ============================================================ */

.subject {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 15px;

    margin-bottom: 15px;

    overflow: hidden;

    box-shadow: var(--shadow);
}


.subject-header {

    padding: 16px 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    cursor: pointer;

    background: #fff;
}


.subject-header:hover {

    background: #fafafa;
}


.subject-title {

    font-size: 18px;

    font-weight: 800;
}


.subject-meta {

    color: var(--muted);

    font-size: 12px;

    margin-top: 3px;
}


.subject-right {

    display: flex;

    align-items: center;

    gap: 12px;
}


.subject-progress {

    width: 130px;

    height: 8px;

    background: #e5e7eb;

    border-radius: 99px;

    overflow: hidden;
}


.subject-progress > div {

    height: 100%;

    background: var(--green);

    transition:
        width .25s ease;
}


.arrow {

    transition:
        transform .2s;
}


.subject.closed .arrow {

    transform:
        rotate(-90deg);
}


.subject-body {

    padding:
        0 15px 15px;
}


.subject.closed .subject-body {

    display: none;
}


/* ============================================================
   SOURCE SECTION
   ============================================================ */

.source-section {

    margin-top: 12px;
}


.source-title {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        8px 5px;

    font-size: 14px;

    font-weight: 800;
}


.source-badge {

    border-radius: 7px;

    padding:
        3px 8px;

    font-size: 11px;
}


.source-badge.js {

    background:
        var(--blue-bg);

    color:
        #1d4ed8;
}


.source-badge.question {

    background:
        #ede9fe;

    color:
        #6d28d9;
}


/* ============================================================
   TOPICS
   ============================================================ */

.topics {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(290px, 1fr)
        );

    gap: 8px;
}


/*
IMPORTANT:

The border color changes according to
the topic status.

0 = red
1 = yellow
2 = green
*/

.topic {

    border:
        1px solid var(--border);

    border-left:
        5px solid var(--red);

    background: white;

    border-radius: 9px;

    padding:
        10px 11px;

    display: flex;

    align-items: center;

    gap: 9px;

    min-height: 57px;

    transition:
        background .2s,
        border-color .2s,
        box-shadow .15s,
        transform .15s;
}


/* Yellow state */

.topic.yellow {

    border-left-color:
        var(--yellow);

    background:
        #fffdf7;
}


/* Green state */

.topic.green {

    border-left-color:
        var(--green);

    background:
        #f7fff9;
}


.topic:hover {

    box-shadow:
        0 3px 10px rgba(0,0,0,.08);

    transform:
        translateY(-1px);
}


.topic-name {

    flex: 1;

    min-width: 0;
}


.topic-name a {

    color: inherit;

    text-decoration: none;

    font-weight: 600;

    line-height: 1.35;
}


.topic-name a:hover {

    color: var(--blue);

    text-decoration: underline;
}


.topic-folder {

    color: var(--muted);

    font-size: 11px;

    margin-top: 3px;
}


/*
STATUS BUTTON
*/

.status-button {

    width: 30px;

    height: 30px;

    flex:
        0 0 30px;

    border-radius: 50%;

    border:
        2px solid var(--red);

    background:
        var(--red-bg);

    position: relative;

    transition:
        all .2s ease;
}


.status-button:hover {

    transform:
        scale(1.08);
}


/* Yellow */

.topic.yellow .status-button {

    border-color:
        var(--yellow);

    background:
        var(--yellow-bg);
}


/* Green */

.topic.green .status-button {

    border-color:
        var(--green);

    background:
        var(--green-bg);
}


/*
CHECK MARK
*/

.status-button::after {

    content: "";

    position: absolute;

    left: 8px;

    top: 5px;

    width: 8px;

    height: 13px;

    border-right:
        3px solid transparent;

    border-bottom:
        3px solid transparent;

    transform:
        rotate(45deg);
}


.topic.yellow
.status-button::after {

    border-color:
        var(--yellow);
}


.topic.green
.status-button::after {

    border-color:
        var(--green);
}


.status-label {

    font-size: 10px;

    color: var(--muted);

    white-space: nowrap;
}


/* ============================================================
   NOTES
   ============================================================ */

.notes-area {

    margin-top: 30px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 18px;
}


.notes-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 15px;

    box-shadow: var(--shadow);

    overflow: hidden;
}


.notes-header {

    padding:
        15px 17px;

    font-weight: 800;

    border-bottom:
        1px solid var(--border);
}


.notes-header.strong {

    color: #15803d;

    background: #f0fdf4;
}


.notes-header.weak {

    color: #b91c1c;

    background: #fef2f2;
}


.notes-body {

    padding: 14px;
}


.note-input-row {

    display: flex;

    gap: 8px;

    margin-bottom: 12px;
}


.note-input {

    flex: 1;

    border:
        1px solid var(--border);

    border-radius: 8px;

    padding:
        9px 10px;

    outline: none;
}


.add-note {

    border: none;

    border-radius: 8px;

    padding:
        0 15px;

    color: white;

    font-weight: 700;

    background:
        var(--blue);
}


.note-list {

    display: flex;

    flex-direction: column;

    gap: 7px;

    min-height: 40px;
}


.note {

    display: flex;

    align-items: center;

    gap: 9px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    padding:
        9px 10px;

    background: #fff;

    cursor: grab;
}


.note:active {

    cursor: grabbing;
}


.drag {

    color: #9ca3af;

    font-size: 18px;
}


.note-text {

    flex: 1;

    line-height: 1.4;
}


.delete-note {

    border: none;

    background: transparent;

    color: #9ca3af;

    font-size: 17px;
}


.delete-note:hover {

    color: #dc2626;
}


.empty {

    color: var(--muted);

    padding: 30px;

    text-align: center;
}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 900px) {

    .dashboard {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .notes-area {

        grid-template-columns:
            1fr;
    }


    .subject-right
    .subject-progress {

        display: none;
    }
}


@media (max-width: 550px) {

    .container {

        padding: 12px;
    }


    .dashboard {

        grid-template-columns:
            1fr 1fr;
    }


    .header-inner {

        padding: 12px;
    }


    .title {

        font-size: 19px;
    }


    .topics {

        grid-template-columns:
            1fr;
    }


    .status-label {

        display: none;
    }
}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
     ========================================================== -->

<header class="header">

    <div class="header-inner">

        <div>

            <div class="title">
                📚 Study Progress Tracker
            </div>

            <div class="subtitle">
                Job Solution + Question Bank
            </div>

        </div>


        <div class="header-actions">

            <button
                class="btn"
                onclick="expandAll()"
            >
                Expand All
            </button>


            <button
                class="btn"
                onclick="collapseAll()"
            >
                Collapse All
            </button>


            <button
                class="btn danger"
                onclick="resetProgress()"
            >
                Reset Progress
            </button>

        </div>

    </div>

</header>


<main class="container">


<!-- ==========================================================
     DASHBOARD
     ========================================================== -->

<section class="dashboard">


    <div class="stat">

        <div class="stat-label">
            Total Topics
        </div>

        <div
            class="stat-number"
            id="totalCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Untouched
        </div>

        <div
            class="stat-number"
            id="untouchedCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            One-time Study
        </div>

        <div
            class="stat-number"
            id="studiedCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Mastered
        </div>

        <div
            class="stat-number"
            id="masteredCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Overall Progress
        </div>

        <div
            class="stat-number"
            id="progressPercent"
        >
            0%
        </div>

        <div class="progress-wrap">

            <div
                class="progress"
                id="overallProgress"
            ></div>

        </div>

    </div>

</section>


<!-- ==========================================================
     CONTROLS
     ========================================================== -->

<section class="controls">


    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search topics, subjects..."
        oninput="render()"
    >


    <select
        id="sourceFilter"
        class="filter"
        onchange="render()"
    >

        <option value="all">
            JS + Question
        </option>

        <option value="JS">
            JS only
        </option>

        <option value="Question">
            Question only
        </option>

    </select>


    <select
        id="statusFilter"
        class="filter"
        onchange="render()"
    >

        <option value="all">
            All status
        </option>

        <option value="0">
            Untouched
        </option>

        <option value="1">
            One-time study
        </option>

        <option value="2">
            Mastered
        </option>

    </select>

</section>


<!-- ==========================================================
     LEGEND
     ========================================================== -->

<div class="legend">


    <div class="legend-item">

        <span class="dot red"></span>

        Untouched

    </div>


    <div class="legend-item">

        <span class="dot yellow"></span>

        One-time study

    </div>


    <div class="legend-item">

        <span class="dot green"></span>

        Mastered

    </div>


    <span>
        Click the circle to cycle:
        🔴 → 🟡 → 🟢 → 🔴
    </span>

</div>


<!-- ==========================================================
     SUBJECTS
     ========================================================== -->

<section id="subjects"></section>


<!-- ==========================================================
     NOTES
     ========================================================== -->

<section class="notes-area">


    <!-- STRONG -->

    <div class="notes-card">

        <div class="notes-header strong">
            💪 Strong Topics
        </div>


        <div class="notes-body">


            <div class="note-input-row">

                <input
                    id="strongInput"
                    class="note-input"
                    placeholder="Add a strong topic..."
                    onkeydown="handleNoteEnter(event, 'strong')"
                >


                <button
                    class="add-note"
                    onclick="addNote('strong')"
                >
                    Add
                </button>

            </div>


            <div
                id="strongNotes"
                class="note-list"
                data-note-type="strong"
            ></div>

        </div>

    </div>


    <!-- WEAK -->

    <div class="notes-card">

        <div class="notes-header weak">
            ⚠️ Weak Topics
        </div>


        <div class="notes-body">


            <div class="note-input-row">

                <input
                    id="weakInput"
                    class="note-input"
                    placeholder="Add a weak topic..."
                    onkeydown="handleNoteEnter(event, 'weak')"
                >


                <button
                    class="add-note"
                    onclick="addNote('weak')"
                >
                    Add
                </button>

            </div>


            <div
                id="weakNotes"
                class="note-list"
                data-note-type="weak"
            ></div>

        </div>

    </div>

</section>


</main>

// ============================================================
// STORAGE
// ============================================================

const STORAGE_KEY =
    "study_tracker_v2";


let state =
    loadState();


function defaultState() {

    return {

        progress: {},

        notes: {

            strong: [],

            weak: []

        }

    };

}


function loadState() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {

            return defaultState();

        }


        const parsed =
            JSON.parse(raw);


        return {

            progress:
                parsed.progress || {},

            notes: {

                strong:
                    parsed.notes?.strong || [],

                weak:
                    parsed.notes?.weak || []

            }

        };

    }

    catch (error) {

        console.error(
            "Could not load tracker state:",
            error
        );

        return defaultState();

    }

}


function saveState() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(state)

    );

}


// ============================================================
// STATUS
// ============================================================
//
// 0 = untouched
// 1 = one-time study
// 2 = mastered
//
// Click:
// 0 -> 1 -> 2 -> 0
// ============================================================

function getStatus(id) {

    return Number(
        state.progress[id] || 0
    );

}


function cycleStatus(id) {

    const current =
        getStatus(id);


    const next =
        (current + 1) % 3;


    state.progress[id] =
        next;


    saveState();


    /*
     IMPORTANT:

     Re-render everything immediately.

     This updates:
       - topic color
       - status text
       - subject progress
       - dashboard
    */

    render();

}


// ============================================================
// DASHBOARD
// ============================================================

function updateDashboard() {

    const total =
        FILES.length;


    let untouched = 0;

    let studied = 0;

    let mastered = 0;


    FILES.forEach(file => {

        const status =
            getStatus(file.id);


        if (status === 0) {

            untouched++;

        }

        else if (status === 1) {

            studied++;

        }

        else if (status === 2) {

            mastered++;

        }

    });


    document
        .getElementById("totalCount")
        .textContent = total;


    document
        .getElementById("untouchedCount")
        .textContent = untouched;


    document
        .getElementById("studiedCount")
        .textContent = studied;


    document
        .getElementById("masteredCount")
        .textContent = mastered;


    /*
    Mastered percentage.

    Example:

    100 topics
    25 mastered

    = 25%
    */

    const percentage =
        total === 0
            ? 0
            : Math.round(
                (mastered / total) * 100
            );


    document
        .getElementById("progressPercent")
        .textContent =
            percentage + "%";


    document
        .getElementById("overallProgress")
        .style.width =
            percentage + "%";

}


// ============================================================
// FILTERING
// ============================================================

function getFilteredFiles() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const source =
        document
            .getElementById("sourceFilter")
            .value;


    const status =
        document
            .getElementById("statusFilter")
            .value;


    return FILES.filter(file => {


        if (
            source !== "all" &&
            file.type !== source
        ) {

            return false;

        }


        if (
            status !== "all" &&
            String(
                getStatus(file.id)
            ) !== status
        ) {

            return false;

        }


        if (search) {

            const haystack = [

                file.name,

                file.subject,

                file.folder,

                file.id

            ]
                .join(" ")
                .toLowerCase();


            if (
                !haystack.includes(search)
            ) {

                return false;

            }

        }


        return true;

    });

}


// ============================================================
// GROUP BY SUBJECT
// ============================================================

function groupBySubject(files) {

    const groups = {};


    files.forEach(file => {


        if (!groups[file.subject]) {

            groups[file.subject] = {

                name:
                    file.subject,

                files: []

            };

        }


        groups[file.subject]
            .files
            .push(file);

    });


    return groups;

}


// ============================================================
// MAIN RENDER
// ============================================================

function render() {


    updateDashboard();


    const container =
        document.getElementById(
            "subjects"
        );


    const files =
        getFilteredFiles();


    if (!files.length) {

        container.innerHTML = `

            <div class="empty">

                No topics found.

            </div>

        `;


        renderNotes();

        return;

    }


    const groups =
        groupBySubject(files);


    container.innerHTML = "";


    Object.values(groups)
        .forEach(group => {


        const subject =
            document.createElement(
                "div"
            );


        subject.className =
            "subject";


        const total =
            group.files.length;


        const mastered =
            group.files.filter(

                f =>
                    getStatus(f.id) === 2

            ).length;


        const studied =
            group.files.filter(

                f =>
                    getStatus(f.id) === 1

            ).length;


        const percent =
            total === 0
                ? 0
                : Math.round(
                    (mastered / total) * 100
                );


        subject.innerHTML = `

            <div
                class="subject-header"
            >

                <div>

                    <div
                        class="subject-title"
                    >
                        ${escapeHTML(
                            group.name
                        )}
                    </div>


                    <div
                        class="subject-meta"
                    >

                        ${total} topics ·

                        ${studied} studied ·

                        ${mastered} mastered

                    </div>

                </div>


                <div
                    class="subject-right"
                >

                    <div
                        class="subject-progress"
                    >

                        <div
                            style="
                                width:${percent}%
                            "
                        ></div>

                    </div>


                    <strong>
                        ${percent}%
                    </strong>


                    <span
                        class="arrow"
                    >
                        ▼
                    </span>

                </div>

            </div>


            <div
                class="subject-body"
            ></div>

        `;


        /*
        Subject header click.

        Use an event listener rather than
        inline onclick.
        */

        const subjectHeader =
            subject.querySelector(
                ".subject-header"
            );


        subjectHeader.addEventListener(
            "click",
            function() {

                toggleSubject(
                    subject
                );

            }
        );


        const body =
            subject.querySelector(
                ".subject-body"
            );


        /*
        Render JS and Question separately.
        */

        ["JS", "Question"]
            .forEach(type => {


            const typeFiles =
                group.files.filter(
                    f =>
                        f.type === type
                );


            if (!typeFiles.length) {

                return;

            }


            const section =
                document.createElement(
                    "div"
                );


            section.className =
                "source-section";


            const title =
                type === "JS"
                    ? "📘 Job Solution"
                    : "❓ Question Bank";


            const badgeClass =
                type.toLowerCase();


            section.innerHTML = `

                <div
                    class="source-title"
                >

                    <span
                        class="
                            source-badge
                            ${badgeClass}
                        "
                    >
                        ${title}
                    </span>


                    <span>
                        ${typeFiles.length}
                        topics
                    </span>

                </div>


                <div
                    class="topics"
                ></div>

            `;


            const topics =
                section.querySelector(
                    ".topics"
                );


            /*
            Render each topic.
            */

            typeFiles.forEach(file => {


                const status =
                    getStatus(file.id);


                /*
                IMPORTANT:

                status 0:
                    ""

                status 1:
                    "yellow"

                status 2:
                    "green"
                */

                let statusClass = "";


                if (status === 1) {

                    statusClass =
                        "yellow";

                }

                else if (status === 2) {

                    statusClass =
                        "green";

                }


                let statusText;


                if (status === 0) {

                    statusText =
                        "Untouched";

                }

                else if (status === 1) {

                    statusText =
                        "One-time";

                }

                else {

                    statusText =
                        "Mastered";

                }


                const topic =
                    document.createElement(
                        "div"
                    );


                topic.className =
                    "topic " +
                    statusClass;


                /*
                IMPORTANT FIX:

                Do NOT put file.id directly
                inside an inline onclick.

                Instead we attach an event
                listener below.
                */

                topic.innerHTML = `

                    <button
                        class="status-button"
                        title="
                            Status:
                            ${statusText}.
                            Click to change.
                        "
                    ></button>


                    <div
                        class="topic-name"
                    >

                        <a
                            href="${file.path}"
                            target="_blank"
                            rel="noopener"
                            title="Open topic"
                        >

                            ${escapeHTML(
                                file.name
                            )}

                        </a>


                        ${
                            file.folder

                            ? `

                                <div
                                    class="
                                        topic-folder
                                    "
                                >

                                    ${escapeHTML(
                                        file.folder
                                    )}

                                </div>

                            `

                            : ""
                        }

                    </div>


                    <div
                        class="status-label"
                    >
                        ${statusText}
                    </div>

                `;


                /*
                =================================================
                FIXED STATUS BUTTON
                =================================================

                The click event now directly
                receives file.id.

                This works correctly with:

                    JS/...
                    Question/...
                    Bengali filenames
                    spaces
                    quotes
                    parentheses
                    etc.
                */

                const statusButton =
                    topic.querySelector(
                        ".status-button"
                    );


                statusButton.addEventListener(
                    "click",
                    function(event) {

                        /*
                        Prevent the click from
                        bubbling anywhere else.
                        */

                        event.preventDefault();

                        event.stopPropagation();


                        /*
                        Change status.
                        */

                        cycleStatus(
                            file.id
                        );

                    }
                );


                topics.appendChild(
                    topic
                );

            });


            body.appendChild(
                section
            );

        });


        container.appendChild(
            subject
        );

    });


    renderNotes();

}


// ============================================================
// SUBJECT OPEN/CLOSE
// ============================================================

function toggleSubject(element) {

    element.classList.toggle(
        "closed"
    );

}


function expandAll() {

    document
        .querySelectorAll(
            ".subject"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "closed"
                )
        );

}


function collapseAll() {

    document
        .querySelectorAll(
            ".subject"
        )
        .forEach(
            element =>
                element.classList.add(
                    "closed"
                )
        );

}


// ============================================================
// NOTES
// ============================================================

function addNote(type) {


    const input =
        document.getElementById(

            type === "strong"
                ? "strongInput"
                : "weakInput"

        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    state.notes[type].push({

        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .slice(2),

        text

    });


    input.value = "";


    saveState();


    renderNotes();

}


function handleNoteEnter(
    event,
    type
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        addNote(type);

    }

}


function deleteNote(
    type,
    id
) {

    state.notes[type] =
        state.notes[type].filter(

            note =>
                note.id !== id

        );


    saveState();


    renderNotes();

}


// ============================================================
// NOTES RENDERING
// ============================================================

function renderNotes() {

    renderNoteList(
        "strong"
    );

    renderNoteList(
        "weak"
    );

}


function renderNoteList(type) {


    const container =
        document.getElementById(

            type === "strong"
                ? "strongNotes"
                : "weakNotes"

        );


    container.innerHTML = "";


    state.notes[type]
        .forEach(note => {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "note";


        element.draggable =
            true;


        element.dataset.id =
            note.id;


        element.innerHTML = `

            <span class="drag">
                ☷
            </span>


            <span class="note-text">

                ${escapeHTML(
                    note.text
                )}

            </span>


            <button
                class="delete-note"
                title="Delete"
            >
                ×
            </button>

        `;


        /*
        Delete button
        */

        const deleteButton =
            element.querySelector(
                ".delete-note"
            );


        deleteButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                deleteNote(
                    type,
                    note.id
                );

            }
        );


        /*
        Drag start
        */

        element.addEventListener(
            "dragstart",
            function(event) {


                event.dataTransfer
                    .setData(

                        "text/plain",

                        JSON.stringify({

                            type,

                            id: note.id

                        })

                    );


                element.style.opacity =
                    "0.4";

            }
        );


        /*
        Drag end
        */

        element.addEventListener(
            "dragend",
            function() {

                element.style.opacity =
                    "1";

            }
        );


        /*
        Drag over
        */

        element.addEventListener(
            "dragover",
            function(event) {

                event.preventDefault();

            }
        );


        /*
        Drop
        */

        element.addEventListener(
            "drop",
            function(event) {

                event.preventDefault();


                const raw =
                    event.dataTransfer
                        .getData(
                            "text/plain"
                        );


                if (!raw) {

                    return;

                }


                const data =
                    JSON.parse(raw);


                if (
                    data.type !== type
                ) {

                    return;

                }


                reorderNotes(

                    type,

                    data.id,

                    note.id

                );

            }
        );


        container.appendChild(
            element
        );

    });

}


// ============================================================
// REORDER NOTES
// ============================================================

function reorderNotes(
    type,
    draggedId,
    targetId
) {


    const notes =
        state.notes[type];


    const from =
        notes.findIndex(

            n =>
                n.id === draggedId

        );


    const to =
        notes.findIndex(

            n =>
                n.id === targetId

        );


    if (
        from === -1 ||
        to === -1 ||
        from === to
    ) {

        return;

    }


    const item =
        notes.splice(
            from,
            1
        )[0];


    notes.splice(
        to,
        0,
        item
    );


    saveState();


    renderNotes();

}


// ============================================================
// RESET PROGRESS
// ============================================================

function resetProgress() {


    const answer =
        confirm(

            "Reset all topic progress?\n\n" +

            "Your strong/weak notes " +
            "will NOT be deleted."

        );


    if (!answer) {

        return;

    }


    state.progress = {};


    saveState();


    render();

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ============================================================
// INITIALIZE
// ============================================================

render();

</script>
