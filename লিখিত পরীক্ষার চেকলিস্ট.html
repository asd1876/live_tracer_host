<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>লিখিত পরীক্ষার চেকলিস্ট</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column. Sticky progress header, then groups > topics > item cards.
   Each item card carries three tap targets (read / note / write) so progress is counted in steps. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #13212B;
  --muted: #5B6B77;
  --line: #D5DEE5;
  --accent: #0A7C5F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF1EA;
  --flag: #B26B00;
  --display: "Anek Bangla", "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418;
    --surface: #162027;
    --ink: #E7EEF2;
    --muted: #94A5B1;
    --line: #27353F;
    --accent: #38C79A;
    --accent-ink: #06261C;
    --accent-soft: #12372E;
    --flag: #E3B04B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418;
  --surface: #162027;
  --ink: #E7EEF2;
  --muted: #94A5B1;
  --line: #27353F;
  --accent: #38C79A;
  --accent-ink: #06261C;
  --accent-soft: #12372E;
  --flag: #E3B04B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 640px; margin: 0 auto; padding-bottom: 56px; }

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 9;
  background: var(--bg);
  padding: 14px 0 12px;
  border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.days {
  flex: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
}
.meter { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.25s ease; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 16px; }
.legend { font-size: 13px; color: var(--muted); margin: 0; }
.star { color: var(--flag); }
.toggle {
  font: inherit; font-size: 14px; font-weight: 500;
  min-height: 40px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.group { margin-top: 28px; }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ghead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.3; }
.gcount { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gsub { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

.topic { margin-top: 18px; }
.thead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.thead h3 { margin: 0; font-size: 15px; font-weight: 600; }
.tcount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.items { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.item.done { border-color: var(--accent); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
.name { flex: 1 1 200px; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.item.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.chip {
  font-size: 13px; color: var(--muted);
  background: var(--bg); border-radius: 6px; padding: 0 8px;
  font-variant-numeric: tabular-nums;
}
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pill {
  font: inherit; font-size: 15px; font-weight: 500;
  min-height: 44px; padding: 0 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--ink); cursor: pointer;
}
.pill::before {
  content: ""; width: 16px; height: 16px; flex: none;
  border: 1.5px solid currentColor; border-radius: 50%; opacity: 0.45;
}
.pill[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-checked="true"]::before {
  content: "✓"; border-color: transparent; opacity: 1;
  font-size: 15px; line-height: 16px; text-align: center;
}
.pill:focus-visible, .toggle:focus-visible, .reset:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.foot { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.note { margin: 0; font-size: 13px; color: var(--muted); flex: 1 1 220px; }
.reset {
  font: inherit; font-size: 14px; font-weight: 500;
  min-height: 44px; padding: 0 16px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--ink); cursor: pointer;
}
.reset.armed { border-color: var(--flag); color: var(--flag); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div>
        <p class="eyebrow">সিনিয়র অফিসার · লিখিত পরীক্ষা ২৭ নভেম্বর ২০২৬</p>
        <h1>লিখিত পরীক্ষার চেকলিস্ট</h1>
      </div>
      <span class="days" id="days">২৭ নভেম্বর</span>
    </div>
    <div class="meter">
      <div class="track" role="progressbar" aria-label="মোট অগ্রগতি" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
      <span class="count" id="total">০ / ০</span>
    </div>
  </header>

  <div class="controls">
    <p class="legend"><span class="star" aria-hidden="true">★</span> সাজেশনে বিশেষ গুরুত্বপূর্ণ</p>
    <button class="toggle" id="onlyTodo" type="button" aria-pressed="false">শুধু বাকি দেখান</button>
  </div>

  <main id="root"></main>

  <div class="foot">
    <p class="note">টিক এই ব্রাউজারে সংরক্ষিত থাকে। অন্য ফোন বা ব্রাউজারে আলাদা থাকবে।</p>
    <button class="reset" id="reset" type="button">সব টিক মুছুন</button>
  </div>
</div>

<script>
(function () {
  var BN = '০১২৩৪৫৬৭৮৯';
  function bn(s) { return String(s).replace(/[0-9]/g, function (d) { return BN.charAt(d); }); }
  var FOCUS = ['পড়া', 'নোট', 'লেখা'];
  var ARG = ['পড়া', 'যুক্তি', 'লেখা'];

  var groups = [
    {
      tag: 'ফোকাস', title: 'ফোকাস রাইটিং', sub: 'বাংলা + ইংরেজি · ৩০ + ৩০ নম্বর', steps: FOCUS,
      topics: [
        { name: '১। ব্যাংকিং', items: [
          { n: 'Bangla QR & Cashless Economy', pg: '287, 377', star: 1 },
          { n: 'Financial Inclusion', pg: '278, 285' },
          { n: 'NPL / Banking Sector Issues', pg: '268, 269, 273–277' },
          { n: 'বিভিন্ন উন্নয়নে ব্যাংকের ভূমিকা', pg: '290–293, 306, 310, 314' }
        ] },
        { name: '২। LDC Graduation', items: [
          { n: 'Opportunity and Challenges', pg: '197', star: 1 },
          { n: 'Export Diversification', pg: '343' }
        ] },
        { name: '৩। Recent Issues', items: [
          { n: 'COP 31 + জলবায়ু', pg: 'সাপ্লিমেন্ট + 415–418' },
          { n: 'বৈশ্বিক অস্থিরতার প্রভাব', pg: '253, 263' },
          { n: 'Energy / Fuel crisis + Security', pg: '246–252', star: 1 },
          { n: 'গণতন্ত্র ও সংস্কার', pg: 'সাপ্লিমেন্ট' }
        ] },
        { name: '৪। Human Resources', items: [
          { n: 'Skill and Vocational Education', pg: '352–355, 360–362' },
          { n: 'Remittance and Wage Earners', pg: '346–350' }
        ] },
        { name: '৫। Others', items: [
          { n: 'AI & Automation (4IR)', pg: '393–395' },
          { n: 'Renewable Energy (Solar / Wind / Nuclear)' },
          { n: 'Women Empowerment', pg: '426, 435', star: 1 },
          { n: 'Student Movement / Youth', pg: 'সাপ্লিমেন্ট' }
        ] }
      ]
    },
    {
      tag: 'আর্গুমেন্ট', title: 'Argument', sub: 'অ্যানালিটিক্যাল রিজনিং ও আর্গুমেন্টেটিভ রাইটিং · ৪০ নম্বর', steps: ARG,
      topics: [
        { name: 'পক্ষ-বিপক্ষের বিষয়', items: [
          { n: 'Central Bank Digital Currency vs Commercial Bank', pg: 'সাপ্লিমেন্ট' },
          { n: 'Strict NPL recovery vs tax-payers’ money', pg: '160' },
          { n: 'Foreign grant / FDI vs neocolonialism / Trade Liberalisation', pg: '150' },
          { n: 'Govt job salary increase vs declining corruption', pg: 'সাপ্লিমেন্ট' },
          { n: 'Environment vs Economic Growth', pg: 'সাপ্লিমেন্ট' },
          { n: 'Minimum wage in RMG Sector', pg: 'সাপ্লিমেন্ট' },
          { n: 'Mega Project vs Loan Burden', pg: '147' },
          { n: 'Artificial Intelligence', pg: '353' }
        ] }
      ]
    },
    {
      tag: 'বাড়তি', title: 'মডেল টেস্টের বাড়তি টপিক', sub: 'ফোকাস রাইটিংয়ের জন্য · সময় থাকলে', steps: FOCUS,
      topics: [
        { name: 'অর্থনীতি ও বিনিয়োগ', items: [
          { n: 'বিনিয়োগ ব্যবস্থার বিকাশে বাংলাদেশ', lang: 'বাংলা', star: 1 },
          { n: 'তরুণ উদ্যোক্তা তৈরিতে বাংলাদেশ ব্যাংকের নতুন দিগন্ত', lang: 'বাংলা' },
          { n: 'ক্ষুদ্র উদ্যোক্তাদের উন্নয়নে প্রযুক্তির ভূমিকা', lang: 'বাংলা' },
          { n: 'নবম জাতীয় পে স্কেল: সামষ্টিক প্রভাব ও বাস্তবায়ন চ্যালেঞ্জ', lang: 'বাংলা' },
          { n: 'LDC Graduation Deferred to 2029: Opportunities, Risks, Readiness', lang: 'English' }
        ] },
        { name: 'জ্বালানি ও বৈশ্বিক সংকট', items: [
          { n: 'মধ্যপ্রাচ্য সংকট ও বাংলাদেশের অর্থনীতি', lang: 'বাংলা / English', star: 1 },
          { n: 'বাংলাদেশের অর্থনীতিতে জ্বালানি তেলের মূল্য বৃদ্ধির প্রভাব', lang: 'বাংলা' }
        ] },
        { name: 'শাসন ও পুনর্গঠন', items: [
          { n: 'বাংলাদেশ পুনর্গঠন 3R কৌশল', lang: 'বাংলা' },
          { n: 'গণতান্ত্রিক উত্তরণে প্রাতিষ্ঠানিক সংস্কারের প্রয়োজনীয়তা', lang: 'বাংলা' }
        ] },
        { name: 'প্রযুক্তি ও ডিজিটাল', items: [
          { n: 'Digital Literacy in Expanding Cashless Transaction', lang: 'English' },
          { n: 'The Role of the Digital Economy in Economic Development', lang: 'English' },
          { n: 'পঞ্চম শিল্পবিপ্লব ও এর প্রস্তুতি', lang: 'বাংলা' }
        ] }
      ]
    }
  ];

  var KEY = 'senior-officer-checklist-v1';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function pgText(pg) { return (/^[0-9]/.test(pg) ? 'পৃ. ' : '') + bn(pg); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var html = '';
  groups.forEach(function (g, gi) {
    html += '<section class="group"><div class="ghead"><h2>' + esc(g.title) + '</h2><span class="gcount" id="gc' + gi + '"></span></div>';
    html += '<p class="gsub">' + esc(g.sub) + '</p>';
    g.topics.forEach(function (t, ti) {
      html += '<div class="topic" id="t' + gi + '-' + ti + '"><div class="thead"><h3>' + esc(t.name) + '</h3><span class="tcount" id="tc' + gi + '-' + ti + '"></span></div><ul class="items">';
      t.items.forEach(function (it, ii) {
        var id = gi + '-' + ti + '-' + ii;
        html += '<li class="item" id="i' + id + '"><div class="head"><span class="name">' + esc(it.n) + '</span>';
        if (it.star) html += '<span class="star" role="img" aria-label="বিশেষ গুরুত্বপূর্ণ">★</span>';
        if (it.pg) html += '<span class="chip">' + esc(pgText(it.pg)) + '</span>';
        if (it.lang) html += '<span class="chip">' + esc(it.lang) + '</span>';
        html += '</div><div class="steps">';
        g.steps.forEach(function (s, k) {
          var on = state[id + '|' + k] ? 'true' : 'false';
          html += '<button class="pill" type="button" role="checkbox" aria-checked="' + on + '" data-key="' + id + '|' + k + '" aria-label="' + esc(it.n) + ' — ' + s + '">' + s + '</button>';
        });
        html += '</div></li>';
      });
      html += '</ul></div>';
    });
    html += '</section>';
  });
  document.getElementById('root').innerHTML = html;

  var onlyTodo = false;
  function refresh() {
    var total = 0, done = 0;
    groups.forEach(function (g, gi) {
      var gt = 0, gd = 0, n = g.steps.length;
      g.topics.forEach(function (t, ti) {
        var tt = 0, td = 0, allDone = true;
        t.items.forEach(function (it, ii) {
          var id = gi + '-' + ti + '-' + ii, c = 0;
          for (var k = 0; k < n; k++) { if (state[id + '|' + k]) c++; }
          tt += n; td += c;
          var full = c === n;
          if (!full) allDone = false;
          document.getElementById('i' + id).classList.toggle('done', full);
        });
        document.getElementById('tc' + gi + '-' + ti).textContent = bn(td) + ' / ' + bn(tt);
        document.getElementById('t' + gi + '-' + ti).hidden = onlyTodo && allDone;
        gt += tt; gd += td;
      });
      document.getElementById('gc' + gi).textContent = bn(gd) + ' / ' + bn(gt);
      total += gt; done += gd;
    });
    var pct = total ? Math.round(done * 100 / total) : 0;
    document.getElementById('total').textContent = bn(done) + ' / ' + bn(total) + ' ধাপ';
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('bar').setAttribute('aria-valuenow', pct);
  }

  var rootEl = document.getElementById('root');
  rootEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.pill') : null;
    if (!b) return;
    var key = b.getAttribute('data-key');
    if (state[key]) { delete state[key]; } else { state[key] = 1; }
    b.setAttribute('aria-checked', state[key] ? 'true' : 'false');
    save();
    refresh();
  });

  var tog = document.getElementById('onlyTodo');
  tog.addEventListener('click', function () {
    onlyTodo = !onlyTodo;
    tog.setAttribute('aria-pressed', onlyTodo ? 'true' : 'false');
    refresh();
  });

  var rst = document.getElementById('reset'), rstTimer = null;
  rst.addEventListener('click', function () {
    if (!rst.classList.contains('armed')) {
      rst.classList.add('armed');
      rst.textContent = 'মুছে ফেলবেন? আবার চাপুন';
      rstTimer = setTimeout(function () { rst.classList.remove('armed'); rst.textContent = 'সব টিক মুছুন'; }, 4000);
      return;
    }
    clearTimeout(rstTimer);
    rst.classList.remove('armed');
    rst.textContent = 'সব টিক মুছুন';
    state = {};
    save();
    var pills = document.querySelectorAll('.pill');
    for (var i = 0; i < pills.length; i++) pills[i].setAttribute('aria-checked', 'false');
    refresh();
  });

  (function () {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var exam = new Date(2026, 10, 27);
    var d = Math.round((exam - today) / 86400000);
    var el = document.getElementById('days');
    el.textContent = d > 0 ? bn(d) + ' দিন বাকি' : (d === 0 ? 'আজ পরীক্ষা' : 'পরীক্ষা শেষ');
  })();

  refresh();
})();
</script>

</body></html>
